          fi

          if [ ! -f src/main/java/vn/venice/crashmod/Config.java ]; then
          cat > src/main/java/vn/venice/crashmod/Config.java <<'EOF'
          package vn.venice.crashmod;

          import net.fabricmc.loader.api.FabricLoader;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Properties;
          import java.util.Set;

          public final class Config {

              private Config() {}

              private static final Path FILE =
                      FabricLoader.getInstance().getConfigDir().resolve("crashmod.properties");

              public static int rateIndex = 6;
              public static final Set<String> enabled = new LinkedHashSet<>();
              public static int[] activeCodes = new int[0];

              public static int rate() { return CrashRegistry.RATES.get(rateIndex); }
              public static boolean isOn(String id) { return enabled.contains(id); }

              public static void toggle(String id) {
                  if (!enabled.remove(id)) enabled.add(id);
                  changed();
              }

              public static void setAll(boolean on) {
                  enabled.clear();
                  if (on) for (CrashRegistry.Mode m : CrashRegistry.MODES) enabled.add(m.id());
                  changed();
              }

              /** Preset KILL: sach 3MB + ep resync + chunk hop + tab dai, rate 100 */
              public static void killPreset() {
                  enabled.clear();
                  enabled.addAll(List.of(
                          "book_click", "resync", "click", "close_gui", "chunk_hop", "tab_long"));
                  rateIndex = CrashRegistry.RATES.indexOf(100);
                  changed();
              }

              public static void bumpRate(int d) {
                  rateIndex = Math.max(0, Math.min(CrashRegistry.RATES.size() - 1, rateIndex + d));
                  changed();
              }

              private static void changed() { rebuild(); save(); }

              private static void rebuild() {
                  activeCodes = enabled.stream()
                          .mapToInt(CrashRegistry::codeOf)
                          .filter(c -> c > 0)
                          .toArray();
              }

              public static void load() {
                  if (Files.isRegularFile(FILE)) {
                      Properties p = new Properties();
                      try (InputStream in = Files.newInputStream(FILE)) {
                          p.load(in);
                          rateIndex = Math.max(0, Math.min(CrashRegistry.RATES.size() - 1,
                                  Integer.parseInt(p.getProperty("rateIndex", "6"))));
                          enabled.clear();
                          for (String s : p.getProperty("enabled", "").split(",")) {
                              if (!s.isBlank()) enabled.add(s.trim());
                          }
                      } catch (Exception ignored) { }
                  }
                  rebuild();
              }

              public static void save() {
                  Properties p = new Properties();
                  p.setProperty("rateIndex", String.valueOf(rateIndex));
                  p.setProperty("enabled", String.join(",", enabled));
                  try {
                      Files.createDirectories(FILE.getParent());
                      try (OutputStream out = Files.newOutputStream(FILE)) {
                          p.store(out, "CrashMod - mode dang bat");
                      }
                  } catch (Exception ignored) { }
              }
          }
          EOF
