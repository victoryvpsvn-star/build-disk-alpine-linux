                  new Mode("chat",       G_BOMB,  "Chat",        7,
                          "Chat spam. Server tao message + broadcast + ghi log."),
                  new Mode("command",    G_BOMB,  "Cmd sai",     8,
                          "Gui lenh khong ton tai -> server parse Brigadier roi bao loi."),
                  new Mode("payload",    G_BOMB,  "Payload",     9,
                          "Payload 0 byte. Server khong co mod -> WARN moi packet = log bomb."),
                  new Mode("payload_big",G_BOMB,  "Payload32K", 10,
                          "Payload 32KB. Server decode 32KB roi WARN moi packet."),
                  new Mode("tab",        G_BOMB,  "Tab",        11,
                          "Xin goi y '/'. Server gui ve toan bo command tree."),
                  new Mode("tab_long",   G_BOMB,  "Tab dai",    12,
                          "Xin goi y voi chuoi 2000 ky tu -> nang CPU parse."),
                  new Mode("tab_many",   G_BOMB,  "Tab nhieu",  13,
