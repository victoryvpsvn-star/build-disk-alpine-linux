                  new Mode("sign",       G_BOMB,  "Sign bomb",  14,
                          "Update sign 384 ky tu CA 2 MAT. CAN DUNG TREN SIGN THAT."),
                  new Mode("book_s",     G_BOMB,  "Book 25KB",  15,
                          "Sach 100 trang x 255 ky tu. CAN CAM SACH VA BUT."),
                  new Mode("book_m",     G_BOMB,  "Book 100KB", 16,
