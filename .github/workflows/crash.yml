          package vn.venice.crashmod.net;

          import net.minecraft.network.RegistryByteBuf;
          import net.minecraft.network.codec.PacketCodec;
          import net.minecraft.network.packet.CustomPayload;
          import net.minecraft.util.Identifier;

          public record FloodPayload() implements CustomPayload {

              public static final FloodPayload INSTANCE = new FloodPayload();

              public static final CustomPayload.Id<FloodPayload> ID =
                      new CustomPayload.Id<>(Identifier.of("crashmod", "flood"));

              public static final PacketCodec<RegistryByteBuf, FloodPayload> CODEC =
                      PacketCodec.unit(INSTANCE);

              @Override
              public CustomPayload.Id<? extends CustomPayload> getId() { return ID; }
          }
          EOF
          fi

