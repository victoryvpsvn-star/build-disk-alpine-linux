# ============================================================================
#  CrashMod v2 - "BA VUONG"  |  client-only, khong can cai len server
#  Gradle 9.2.0 + loom 1.15.5 (khop plugin.api-version)
#
#  SMOKE TEST: mac dinh TAT. Bat bang Actions > Run workflow > smoke = co
#              hoac push tag v* (tag thi tu bat).
# ============================================================================
name: CrashMod CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Chay smoke test (boot dedicated server that, ton them 1-5 phut)?'
        type: choice
        options: [ khong, co ]
        default: khong
      release:
        description: 'Tao release?'
        type: choice
        options: [ khong, co ]
        default: co

permissions:
  contents: write

concurrency:
  group: crashmod-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.2.0'
  PRIMARY_MC: '1.21.11'

jobs:

  # ==========================================================================
  # JOB 0 - QUYET DINH
  # ==========================================================================
  decide:
    name: Quyet dinh (test / release)
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.decide.outputs.smoke }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Doc lua chon
        id: decide
        run: |
          set -euo pipefail
          S="khong"
          R="khong"

          case "${{ github.event_name }}" in
            workflow_dispatch)
              S="${{ github.event.inputs.smoke }}"
              R="${{ github.event.inputs.release }}"
              ;;
            push)
              R="co"
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then S="co"; fi
              ;;
            pull_request)
              S="khong"; R="khong"
              ;;
          esac

          [ "$S" = "co" ] || S="khong"
          [ "$R" = "co" ] || R="khong"

          echo "smoke=$S"   >> "$GITHUB_OUTPUT"
          echo "release=$R" >> "$GITHUB_OUTPUT"

          {
            echo "### CrashMod CI - ke hoach chay"
            echo ""
            echo "| Muc | Gia tri |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| Smoke test | **$S** |"
            echo "| Release | **$R** |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$S" = "co" ]; then
            echo "::notice title=Smoke test::SE CHAY - them khoang 1-5 phut de boot server"
          else
            echo "::notice title=Smoke test::BO QUA - build nhanh. Bat bang Actions > Run workflow > smoke = co"
          fi

  # ==========================================================================
  # JOB 1 - PREPARE
  # ==========================================================================
  prepare:
    name: Prepare - tu tao file
    needs: decide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Tao file
        run: |
          set -euo pipefail
          mkdir -p src/main/java/vn/venice/crashmod/net \
                   src/main/java/vn/venice/crashmod/client \
                   src/main/resources/assets/crashmod/lang run

          if [ ! -f gradle.properties ]; then
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.17.2
          fabric_version=0.141.6+1.21.11
          minecraft_range=~1.21
          mod_version=2.3.0
          maven_group=vn.venice.crashmod
          archives_base_name=crashmod
          EOF
          fi

          if [ ! -f settings.gradle ]; then
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'crashmod'
          EOF
          fi

          if [ ! -f build.gradle ]; then
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.15.5'
              id 'maven-publish'
          }

          def mcVersion     = (findProperty('minecraft_version') ?: '1.21.11').toString()
          def yarnVersion   = (findProperty('yarn_mappings')     ?: "${mcVersion}+build.4").toString()
          def loaderVersion = (findProperty('loader_version')    ?: '0.17.2').toString()
          def fabricVersion = (findProperty('fabric_version')    ?: "0.141.6+${mcVersion}").toString()
          def mcRange       = (findProperty('minecraft_range')   ?: '~1.21').toString()

          version = project.mod_version
          group   = project.maven_group
          base { archivesName = "${project.archives_base_name}-${mcVersion}" }

          repositories { maven { url = 'https://maven.fabricmc.net/' } }

          dependencies {
              minecraft "com.mojang:minecraft:${mcVersion}"
              mappings  "net.fabricmc:yarn:${yarnVersion}:v2"
              modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
          }

          processResources {
              inputs.property 'version', project.version
              inputs.property 'minecraft_range', mcRange
              filesMatching('fabric.mod.json') {
                  expand 'version': project.version, 'minecraft_range': mcRange
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
          EOF
          fi

          if [ ! -f src/main/resources/fabric.mod.json ]; then
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "crashmod",
            "version": "${version}",
            "name": "CrashMod",
            "description": "Phim M mo GUI tu BAT KY dau. 38 mode lam lag/sap server.",
            "authors": [ "Venice" ],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main":   [ "vn.venice.crashmod.CrashMod" ],
              "client": [ "vn.venice.crashmod.client.CrashModClient" ]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "fabric-api": "*",
              "minecraft": "${minecraft_range}",
              "java": ">=21"
            }
          }
          EOF
          fi

          [ -f src/main/resources/assets/crashmod/lang/vi_vn.json ] || \
            printf '{ "key.crashmod.open": "Mo GUI CrashMod", "key.crashmod.main": "CrashMod", "key.categories.crashmod.main": "CrashMod", "key.category.crashmod.main": "CrashMod", "key.crashmod.category.main": "CrashMod" }\n' \
              > src/main/resources/assets/crashmod/lang/vi_vn.json
          [ -f src/main/resources/assets/crashmod/lang/en_us.json ] || \
            printf '{ "key.crashmod.open": "Open CrashMod GUI", "key.crashmod.main": "CrashMod", "key.categories.crashmod.main": "CrashMod", "key.category.crashmod.main": "CrashMod", "key.crashmod.category.main": "CrashMod" }\n' \
              > src/main/resources/assets/crashmod/lang/en_us.json

          [ -f .gitignore ] || printf '.gradle/\nbuild/\nrun/\nout/\n.idea/\n*.iml\n.vscode/\n' > .gitignore
          [ -f LICENSE ]    || printf 'MIT License\n\nCopyright (c) 2026 Venice\n' > LICENSE

          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nmax-players=2\nview-distance=4\nlevel-type=flat\n' > run/server.properties

          # ======================= SOURCE CODE ======================= #

          if [ ! -f src/main/java/vn/venice/crashmod/CrashMod.java ]; then
          cat > src/main/java/vn/venice/crashmod/CrashMod.java <<'EOF'
          package vn.venice.crashmod;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import vn.venice.crashmod.net.BigPayload;
          import vn.venice.crashmod.net.FloodPayload;

          public class CrashMod implements ModInitializer {

              public static final Logger LOGGER = LoggerFactory.getLogger("CrashMod");

              @Override
              public void onInitialize() {
                  PayloadTypeRegistry.playC2S().register(FloodPayload.ID, FloodPayload.CODEC);
                  PayloadTypeRegistry.playC2S().register(BigPayload.ID, BigPayload.CODEC);
                  LOGGER.info("[CrashMod] da nap");
              }
          }
          EOF
          fi

          if [ ! -f src/main/java/vn/venice/crashmod/CrashRegistry.java ]; then
          cat > src/main/java/vn/venice/crashmod/CrashRegistry.java <<'EOF'
