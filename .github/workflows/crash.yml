                  new Mode("interact",   G_CHUNK, "Right block",31,
                          "Chuot phai block duoi chan. Aim vao crafting table = mo GUI lien tuc."),
                  new Mode("use_item",   G_CHUNK, "Right item", 32,
                          "Chuot phai item tren khong (an / nem / ban)."),
                  new Mode("pick",       G_CHUNK, "Pick block", 33,
