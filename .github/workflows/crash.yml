                  // ---- FLOOD: re tien, spam so luong lon, de bi limiter KICK ----
                  new Mode("swing",      G_FLOOD, "Swing",      1,
                          "Flood re nhat. Server chi phat animation. Dung de test ket noi."),
                  new Mode("look",       G_FLOOD, "Look",       2,
                          "Gui goc nhin moi packet. Re."),
                  new Mode("move",       G_FLOOD, "Move",       3,
                          "Gui full pos + yaw + pitch. Server chay movement check moi packet."),
                  new Mode("abilities",  G_FLOOD, "Abilities",  4,
                          "Gui UpdatePlayerAbilities. Re nhat trong nhom."),
                  new Mode("input",      G_FLOOD, "Input",      5,
