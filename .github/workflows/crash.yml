                  new Mode("book_x",     G_BOMB,  "Book 3MB",   17,
                          "Sach 100 trang x 32767 ky tu. Nen ~1000:1 nen tren day chi ~30KB."),
                  new Mode("book_title", G_BOMB,  "Book+title", 18,
                          "Book 3MB + title 512 ky tu."),

                  // ---- GUI/INV: ep server resync inventory ----
                  new Mode("close_gui",  G_INV,   "Dong GUI",   19,
                          "5 byte -> server syncState() gui lai TOAN BO inventory. ONCE."),
                  new Mode("slot",       G_INV,   "Doi slot",   20,
