# Đặt file này tại: .github/workflows/build.yml
# Build ISO Alpine Linux tối ưu cho amd64 (x86_64) + ảnh đĩa Hyper-V (Gen1 BIOS / Gen2 UEFI).
# Mọi thứ nằm trong 1 file.
name: Build Alpine ISO (amd64)

on:
  workflow_dispatch:
    inputs:
      alpine_tag:
        description: "Tag container Alpine (latest | edge | 3.22 ...)"
        default: "latest"
      kernel_flavor:
        description: "Kernel: lts (ổn định) | edge (mới hơn, nhiều driver hơn)"
        type: choice
        options: [lts, edge]
        default: lts
      extra_cmdline:
        description: "Tham số kernel thêm (vd: pcie_aspm=off pci=noaer)"
        default: ""
      hyperv:
        description: "Tạo VHD (Gen1/BIOS) + VHDX (Gen2/UEFI) cho Hyper-V Manager"
        type: boolean
        default: true
      smoke_test:
        description: "Boot thử ISO + VHD/VHDX bằng QEMU (kèm test nặng: apk update + apk add nodejs...)"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

concurrency:
  group: alpine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      ALPINE_TAG: ${{ inputs.alpine_tag || 'latest' }}
      KERNEL_FLAVOR: ${{ inputs.kernel_flavor || 'lts' }}
      EXTRA_CMDLINE: ${{ inputs.extra_cmdline || '' }}

    steps:
      - uses: actions/checkout@v4

      # ======================================================================
      # 1) Sinh toàn bộ file build ra thư mục build/
      # ======================================================================
      - name: Tạo danh sách package
        run: |
          mkdir -p build out
          cat > build/pkgs.txt <<'__EOF__'
          alpine-base
          alpine-conf
          linux-firmware
          wireless-regdb
          iwd
          iw
          rfkill
          openresolv
          chrony
          zram-init
          earlyoom
          irqbalance
          acpid
          nvme-cli
          smartmontools
          hdparm
          memtester
          e2fsprogs
          xfsprogs
          btrfs-progs
          f2fs-tools
          exfatprogs
          lvm2
          cryptsetup
          mdadm
          dosfstools
          ntfs-3g
          ntfs-3g-progs
          parted
          util-linux
          lsblk
          pciutils
          usbutils
          lm-sensors
          dmidecode
          ethtool
          iproute2
          tzdata
          curl
          htop
          nano
          __EOF__

      - name: Tạo mkimg.custom.sh (profile)
        run: |
          cat > build/mkimg.custom.sh <<'__EOF__'
          # Profile mkimage "custom" - amd64
          profile_custom() {
            profile_standard

            title="Alpine Custom"
            desc="Alpine tối ưu amd64: firmware/driver đầy đủ, zram, BBR, auto-DHCP, tune I/O, Hyper-V"
            profile_abbrev="custom"
            image_ext="iso"
            arch="x86_64"
            output_format="iso"

            # lts = ổn định | edge = kernel mới, nhiều driver phần cứng mới
            kernel_flavors="${KERNEL_FLAVOR:-lts}"
            kernel_addons=""

            # Microcode CPU: vá lỗi treo/crash ngẫu nhiên do bug CPU
            boot_addons="amd-ucode intel-ucode"

            # Driver đĩa nạp sớm trong initramfs (kms = màn hình hiển thị sớm)
            # scsi = gồm hv_storvsc (đĩa ảo của Hyper-V), virtio = KVM/QEMU
            initfs_features="ata base cdrom ext4 xfs btrfs lvm kms mmc nvme raid scsi squashfs usb virtio"

            # nvme_core...=0     : tắt NVMe deep power state (SSD biến mất/treo)
            # usbcore.autosuspend=-1 : USB không tự ngủ (chuột/phím/USB rớt)
            # zswap.enabled=0    : đã dùng zram
            # loglevel=4         : hiện cảnh báo/lỗi trên màn hình để dễ bắt lỗi
            kernel_cmdline="console=tty0 loglevel=4 nvme_core.default_ps_max_latency_us=0 usbcore.autosuspend=-1 zswap.enabled=0 ${EXTRA_CMDLINE:-}"
            syslinux_serial=""

            apks="$apks $(tr '\n' ' ' < "${PKG_FILE:?PKG_FILE chua dat}")"
            apkovl="${OVL_SCRIPT:?OVL_SCRIPT chua dat}"
          }
          __EOF__

      - name: Tạo genapkovl-custom.sh (cấu hình hệ thống + fix)
        run: |
          cat > build/genapkovl-custom.sh <<'__EOF__'
          #!/bin/sh -e
          # mkimage gọi: genapkovl-custom.sh <hostname> -> <hostname>.apkovl.tar.gz
          HOSTNAME="$1"
          [ -n "$HOSTNAME" ] || { echo "usage: $0 hostname" >&2; exit 1; }

          cleanup() { rm -rf "$tmp"; }
          tmp="$(mktemp -d)"
          trap cleanup EXIT

          makefile() {
            OWNER="$1"; PERMS="$2"; FILENAME="$3"
            mkdir -p "$(dirname "$FILENAME")"
            cat > "$FILENAME"
            chown "$OWNER" "$FILENAME"
            chmod "$PERMS" "$FILENAME"
          }
          rc_add() {
            mkdir -p "$tmp/etc/runlevels/$2"
            ln -sf "/etc/init.d/$1" "$tmp/etc/runlevels/$2/$1"
          }

          # ------------------------------------------------------------ cơ bản
          makefile root:root 0644 "$tmp/etc/hostname" <<EOF
          $HOSTNAME
          EOF

          makefile root:root 0644 "$tmp/etc/network/interfaces" <<'EOF'
          auto lo
          iface lo inet loopback
          EOF

          mkdir -p "$tmp/etc/apk"
          { echo alpine-base; cat "${PKG_FILE:?}"; } | sort -u > "$tmp/etc/apk/world"
          echo "/media/cdrom/apks" > "$tmp/etc/apk/repositories"

          makefile root:root 0644 "$tmp/etc/motd" <<'EOF'
          Alpine Custom (amd64). Lệnh hữu ích:
            diag          thu thập log chẩn đoán  -> /root/diag-*.txt
            diag-usb      chạy diag rồi chép ra USB
            iwctl         kết nối Wi-Fi
            memtester     kiểm tra RAM lỗi
            setup-alpine  cài ra ổ cứng
          Hyper-V: tự nhận diện, tự chạy daemon tích hợp (KVP/VSS/fcopy) nếu có.
          EOF

          # Ghi log boot của OpenRC -> /var/log/rc.log (để biết service nào lỗi)
          cp /etc/rc.conf "$tmp/etc/rc.conf" 2>/dev/null || : > "$tmp/etc/rc.conf"
          sed -i '/^#\?rc_logger=/d;/^#\?rc_log_path=/d' "$tmp/etc/rc.conf"
          cat >> "$tmp/etc/rc.conf" <<'EOF'
          rc_logger="YES"
          rc_log_path="/var/log/rc.log"
          EOF
          chmod 0644 "$tmp/etc/rc.conf"

          # ---------------------------------------------------- RAM: zram + OOM
          makefile root:root 0644 "$tmp/etc/conf.d/zram-init" <<'EOF'
          load_on_start=yes
          unload_on_stop=yes
          num_devices=1
          type0=swap
          size0=$(awk '/MemTotal/ {printf "%d", $2/1024/2}' /proc/meminfo)
          algo0=zstd
          labl0=zram_swap
          EOF

          makefile root:root 0644 "$tmp/etc/conf.d/earlyoom" <<'EOF'
          EARLYOOM_ARGS="-m 5 -s 10 -r 0"
          EOF

          makefile root:root 0644 "$tmp/etc/sysctl.d/99-custom.conf" <<'EOF'
          # ---- RAM / disk ----
          vm.swappiness = 100
          vm.page-cluster = 0
          vm.vfs_cache_pressure = 50
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 15
          vm.max_map_count = 262144
          fs.file-max = 2097152
          fs.inotify.max_user_watches = 524288
          # ---- Ổn định / gỡ lỗi ----
          kernel.nmi_watchdog = 0
          kernel.panic = 10
          kernel.sysrq = 1
          # ---- Mạng ----
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_mtu_probing = 1
          net.core.somaxconn = 4096
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 131072 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          EOF

          makefile root:root 0644 "$tmp/etc/modules" <<'EOF'
          tcp_bbr
          EOF

          # --------------------------------------------------------- driver fix
          makefile root:root 0644 "$tmp/etc/modprobe.d/custom.conf" <<'EOF'
          # Intel Wi-Fi: tắt power save (rớt mạng, ping cao)
          options iwlwifi power_save=0
          options iwlmvm power_scheme=1
          # Realtek Wi-Fi: tắt ASPM (treo/mất sóng ngẫu nhiên)
          options rtw88_pci disable_aspm=y
          options rtw89pci disable_clkreq=y disable_aspm_l1=y disable_aspm_l1ss=y
          # Bluetooth USB không autosuspend
          options btusb enable_autosuspend=0
          blacklist pcspkr
          EOF

          makefile root:root 0644 "$tmp/etc/iwd/main.conf" <<'EOF'
          [General]
          EnableNetworkConfiguration=true

          [Network]
          NameResolvingService=resolvconf
          EOF

          # ----------------------------------------- Mạng có dây: tự DHCP + giám sát
          makefile root:root 0755 "$tmp/usr/local/sbin/autonet-loop" <<'EOF'
          #!/bin/sh
          # Vòng giám sát: cắm dây lại / card nạp trễ vẫn tự có mạng.
          REPO_VER="@REPO@"
          MIRROR="https://dl-cdn.alpinelinux.org/alpine"
          post_done=0
          while :; do
            for p in /sys/class/net/*; do
              i="${p##*/}"
              [ "$i" = lo ] && continue
              [ -e "$p/device" ] || continue

              if [ -d "$p/wireless" ]; then
                # Wi-Fi: bỏ rfkill + tắt power save (iwd lo phần kết nối/IP)
                if [ ! -e "/run/autonet.w.$i" ]; then
                  rfkill unblock all 2>/dev/null
                  iw dev "$i" set power_save off 2>/dev/null && : > "/run/autonet.w.$i"
                fi
                continue
              fi

              ip link set "$i" up 2>/dev/null
              [ "$(cat "$p/carrier" 2>/dev/null)" = 1 ] || continue

              if [ ! -e "/run/autonet.e.$i" ]; then
                drv="$(basename "$(readlink -f "$p/device/driver" 2>/dev/null)")"
                ethtool --set-eee "$i" eee off >/dev/null 2>&1   # EEE gây rớt link
                case "$drv" in
                  e1000e) ethtool -K "$i" tso off gso off >/dev/null 2>&1 ;;  # "Hardware Unit Hang"
                esac
                : > "/run/autonet.e.$i"
              fi

              pf="/run/udhcpc.$i.pid"
              if [ -f "$pf" ] && kill -0 "$(cat "$pf")" 2>/dev/null; then continue; fi
              udhcpc -b -i "$i" -p "$pf" -x "hostname:$(hostname)" >/dev/null 2>&1
            done

            if [ "$post_done" = 0 ] && ip route 2>/dev/null | grep -q '^default'; then
              # DHCP không cấp DNS -> dùng DNS dự phòng
              grep -q '^nameserver' /etc/resolv.conf 2>/dev/null || \
                printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' >> /etc/resolv.conf
              # Boot từ VHD/VHDX (không có CD-ROM): bỏ repo cdrom không tồn tại,
              # nếu không "apk update" sẽ báo lỗi
              [ -d /media/cdrom/apks ] || sed -i '\|/media/cdrom/apks|d' /etc/apk/repositories 2>/dev/null
              # Thêm repo online để apk add dùng được sau khi boot
              grep -q "$MIRROR" /etc/apk/repositories 2>/dev/null || \
                printf '%s/%s/main\n%s/%s/community\n' "$MIRROR" "$REPO_VER" "$MIRROR" "$REPO_VER" >> /etc/apk/repositories
              post_done=1
            fi
            sleep 5
          done
          EOF
          sed -i "s|@REPO@|${ALPINE_REPO_VER:-edge}|" "$tmp/usr/local/sbin/autonet-loop"

          makefile root:root 0755 "$tmp/etc/init.d/autonet" <<'EOF'
          #!/sbin/openrc-run
          description="Tự bật mạng có dây (DHCP) + tối ưu Wi-Fi"
          command="/usr/local/sbin/autonet-loop"
          command_background=true
          pidfile="/run/autonet.pid"

          depend() {
            after hwdrivers modules
            use logger
          }

          stop_post() {
            for f in /run/udhcpc.*.pid; do
              [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null
            done
            return 0
          }
          EOF

          # ------------------------------------------- Disk / CPU / nguồn tuning
          makefile root:root 0755 "$tmp/etc/init.d/sys-tune" <<'EOF'
          #!/sbin/openrc-run
          description="Tune I/O scheduler, USB/SATA/PCIe power, CPU governor"

          depend() {
            after hwdrivers modules
          }

          apply() {
            # I/O scheduler + readahead theo loại ổ
            for q in /sys/block/*/queue; do
              dev="${q%/queue}"; dev="${dev##*/}"
              case "$dev" in loop*|ram*|zram*|sr*|fd*|dm-*) continue ;; esac
              rot="$(cat "$q/rotational" 2>/dev/null || echo 1)"
              case "$dev" in
                nvme*) want=none ;;
                *) if [ "$rot" = 0 ]; then want=mq-deadline; else want=bfq; fi ;;
              esac
              avail="$(tr -d '[]' < "$q/scheduler" 2>/dev/null)"
              case " $avail " in
                *" $want "*) echo "$want" > "$q/scheduler" 2>/dev/null ;;
              esac
              if [ "$rot" = 1 ]; then
                echo 1024 > "$q/read_ahead_kb" 2>/dev/null
                # HDD laptop: tránh đỗ đầu từ liên tục (click, chậm, hỏng ổ)
                case "$dev" in sd*) hdparm -B 254 "/dev/$dev" >/dev/null 2>&1 ;; esac
              else
                echo 128 > "$q/read_ahead_kb" 2>/dev/null
              fi
            done

            # USB: không tự ngủ
            for d in /sys/bus/usb/devices/*/power/control; do
              [ -w "$d" ] && echo on > "$d" 2>/dev/null
            done
            # SATA: không bật tiết kiệm điện link (SSD/HDD biến mất, timeout)
            for h in /sys/class/scsi_host/host*/link_power_management_policy; do
              [ -w "$h" ] && echo max_performance > "$h" 2>/dev/null
            done
            # PCIe ASPM: ưu tiên ổn định
            [ -w /sys/module/pcie_aspm/parameters/policy ] && \
              echo performance > /sys/module/pcie_aspm/parameters/policy 2>/dev/null

            # CPU governor
            for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              [ -w "$g" ] || continue
              if grep -qw schedutil "${g%/*}/scaling_available_governors" 2>/dev/null; then
                echo schedutil > "$g"
              fi
            done
            return 0
          }

          start() {
            ebegin "Tune I/O, nguồn, CPU"
            modprobe -q bfq 2>/dev/null
            modprobe -q mq-deadline 2>/dev/null
            apply
            # Thiết bị nạp trễ (NVMe/USB) -> áp lại sau ít giây
            ( sleep 15; apply; sleep 45; apply ) >/dev/null 2>&1 &
            eend 0
          }
          EOF

          makefile root:root 0755 "$tmp/etc/periodic/weekly/fstrim" <<'EOF'
          #!/bin/sh
          awk '$3 ~ /^(ext4|xfs|btrfs|vfat|f2fs)$/ {print $2}' /proc/mounts | while read -r m; do
            fstrim "$m" 2>/dev/null
          done
          EOF

          # -------------------------- Hyper-V guest (chỉ hoạt động khi chạy trên Hyper-V)
          makefile root:root 0755 "$tmp/etc/init.d/hv-guest" <<'EOF'
          #!/sbin/openrc-run
          description="Hyper-V guest: nạp module tích hợp + chạy daemon KVP/VSS/fcopy"

          depend() {
            after modules hwdrivers
          }

          start() {
            # Không phải Hyper-V (không có vmbus) -> bỏ qua, không làm gì
            [ -d /sys/bus/vmbus ] || return 0
            ebegin "Hyper-V guest services"
            for m in hv_utils hv_balloon hv_netvsc hv_storvsc hyperv_keyboard hid_hyperv hyperv_drm; do
              modprobe -q "$m" 2>/dev/null
            done
            for d in hv_kvp_daemon hv_vss_daemon hv_fcopy_daemon; do
              bin="$(command -v "$d" 2>/dev/null)" || continue
              start-stop-daemon --start --background --make-pidfile \
                --pidfile "/run/$d.pid" --exec "$bin" -- -n
            done
            eend 0
          }

          stop() {
            for d in hv_kvp_daemon hv_vss_daemon hv_fcopy_daemon; do
              [ -f "/run/$d.pid" ] && start-stop-daemon --stop --pidfile "/run/$d.pid" 2>/dev/null
            done
            return 0
          }
          EOF

          # ---------------------------------------------------- Công cụ chẩn đoán
          makefile root:root 0755 "$tmp/usr/local/bin/diag" <<'EOF'
          #!/bin/sh
          # Thu thập toàn bộ thông tin phần cứng + log lỗi vào 1 file.
          f="${1:-/root/diag-$(date +%F-%H%M%S).txt}"
          s() { echo; echo "======== $1 ========"; }
          {
            s "uname";    uname -a
            s "cmdline";  cat /proc/cmdline
            s "boot mode"; if [ -d /sys/firmware/efi ]; then echo UEFI; else echo BIOS; fi
            s "máy";      dmidecode -t system -t bios 2>/dev/null | grep -E 'Manufacturer|Product|Version|Release Date'
            s "cpu";      grep -m1 'model name' /proc/cpuinfo; grep -m1 microcode /proc/cpuinfo
            s "nhiệt độ"; sensors 2>&1
            s "ram";      free -m; cat /proc/swaps
            s "lspci";    lspci -nnk
            s "lsusb";    lsusb
            s "đĩa";      lsblk -o NAME,SIZE,TYPE,ROTA,SCHED,FSTYPE,MODEL 2>&1
            for d in /dev/sd? /dev/nvme?n1; do
              [ -e "$d" ] || continue
              s "SMART $d"; smartctl -H -A "$d" 2>&1 | head -50
            done
            s "mạng";     ip -br a; ip r; cat /etc/resolv.conf
            for p in /sys/class/net/*; do
              i="${p##*/}"; [ "$i" = lo ] && continue
              s "ethtool $i"; ethtool -i "$i" 2>&1; ethtool "$i" 2>&1 | grep -E 'Speed|Duplex|Link detected'
            done
            s "rfkill";   rfkill list 2>&1
            s "module";   lsmod
            s "lỗi trong dmesg"
            dmesg | grep -iE 'firmware|fail|error|timeout|reset|hung|oom|mce|machine check|ata[0-9]|nvme|i/o error|aer|taint|call trace|bug:'
            s "rc.log (lỗi service)"; grep -iE 'error|fail|warn' /var/log/rc.log 2>/dev/null | tail -50
            s "dmesg đầy đủ"; dmesg
          } > "$f" 2>&1
          echo "Đã lưu: $f"
          EOF

          makefile root:root 0755 "$tmp/usr/local/bin/diag-usb" <<'EOF'
          #!/bin/sh
          # Chạy diag rồi chép file ra USB (partition vfat/exfat/ext4/ntfs đầu tiên).
          f="/tmp/diag-$(date +%F-%H%M%S).txt"
          diag "$f" >/dev/null
          mkdir -p /mnt/usb
          lsblk -rno NAME,FSTYPE,RM | while read -r n t rm; do
            case "$t" in vfat|exfat|ext4|ext3|ntfs) ;; *) continue ;; esac
            [ "$rm" = 1 ] || continue
            if mount "/dev/$n" /mnt/usb 2>/dev/null; then
              cp "$f" /mnt/usb/ && sync && echo "Đã chép $f -> /dev/$n"
              umount /mnt/usb
              exit 0
            fi
          done
          echo "Không thấy USB phù hợp. File vẫn ở: $f"
          EOF

          # --------------------------------- Smoke test (chỉ chạy khi ở trong QEMU)
          # Gồm: kiểm tra cơ bản + TEST NẶNG (apk update, apk add nodejs/npm/git/python3/build-base,
          # chạy thử node/npm). Mọi thay đổi chỉ nằm trong RAM của VM thử -> ISO/VHD/VHDX gốc
          # vẫn nguyên bản "trắng tinh", không dính nodejs.
          makefile root:root 0755 "$tmp/etc/init.d/smoke" <<'EOF'
          #!/sbin/openrc-run
          description="Smoke test CI: in kết quả ra serial khi chạy trong QEMU"

          depend() {
            after autonet sys-tune zram-init
          }

          start() {
            grep -qi qemu /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null || return 0
            [ -c /dev/ttyS0 ] || return 0
            (
              o() { echo "$1" > /dev/ttyS0; }
              # đẩy nội dung 1 file log ra serial (tối đa N dòng cuối), mỗi dòng có tiền tố
              ol() { tail -n "${2:-25}" "$1" 2>/dev/null | sed 's/^/SMOKE_LOG: /' > /dev/ttyS0; }

              o "SMOKE_KERNEL=$(uname -r)"
              if [ -d /sys/firmware/efi ]; then o SMOKE_BOOT_UEFI; else o SMOKE_BOOT_BIOS; fi
              n=0
              while [ $n -lt 60 ]; do
                ip route | grep -q '^default' && break
                n=$((n+1)); sleep 2
              done
              if ip route | grep -q '^default'; then o SMOKE_NET_OK; else o SMOKE_NET_FAIL; fi
              if ping -c1 -W5 1.1.1.1 >/dev/null 2>&1; then o SMOKE_INET_OK; else o SMOKE_INET_FAIL; fi
              if grep -q zram /proc/swaps; then o SMOKE_ZRAM_OK; else o SMOKE_ZRAM_FAIL; fi
              if [ "$(cat /proc/sys/net/ipv4/tcp_congestion_control)" = bbr ]; then o SMOKE_BBR_OK; else o SMOKE_BBR_FAIL; fi
              n=0
              while [ $n -lt 45 ]; do
                grep -q '\[none\]' /sys/block/nvme0n1/queue/scheduler 2>/dev/null && break
                n=$((n+1)); sleep 2
              done
              if grep -q '\[none\]' /sys/block/nvme0n1/queue/scheduler 2>/dev/null; then o SMOKE_NVME_OK; else o SMOKE_NVME_FAIL; fi

              # ------------------------- TEST NẶNG: tải + cài gói qua mạng -------------------------
              o SMOKE_HEAVY_START
              o "SMOKE_INFO: repos=$(tr '\n' ' ' < /etc/apk/repositories)"
              o "SMOKE_INFO: RAM=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)MB root=$(df -m / | awk 'NR==2{print $4"MB free / "$2"MB"}')"
              o "SMOKE_INFO: dns=$(grep -m1 nameserver /etc/resolv.conf)"

              if timeout 300 apk update > /tmp/apk-update.log 2>&1; then
                o SMOKE_APK_UPDATE_OK
              else
                o SMOKE_APK_UPDATE_FAIL; ol /tmp/apk-update.log 25
              fi

              if timeout 1200 apk add --no-progress nodejs npm git python3 build-base > /tmp/apk-add.log 2>&1; then
                o SMOKE_APK_ADD_OK
              else
                o SMOKE_APK_ADD_FAIL; ol /tmp/apk-add.log 30
              fi
              o "SMOKE_INFO: sau khi cài root=$(df -m / | awk 'NR==2{print $3"MB used / "$4"MB free"}')"

              # chạy thử thật sự: node + npm + hash + build C
              if node -e 'const c=require("crypto");console.log(process.version,c.createHash("sha256").update("x").digest("hex").slice(0,8))' > /tmp/node.log 2>&1 \
                 && npm -v >> /tmp/node.log 2>&1; then
                o "SMOKE_INFO: $(tr '\n' ' ' < /tmp/node.log)"; o SMOKE_NODE_OK
              else
                o SMOKE_NODE_FAIL; ol /tmp/node.log 15
              fi
              echo 'int main(){return 0;}' > /tmp/t.c
              if gcc /tmp/t.c -o /tmp/t > /tmp/gcc.log 2>&1 && /tmp/t; then o SMOKE_GCC_OK; else o SMOKE_GCC_FAIL; ol /tmp/gcc.log 15; fi

              # còn lỗi gì trong dmesg / rc.log sau khi tải nặng (OOM, I/O error, mất mạng...)
              dmesg | grep -iE 'oom|out of memory|i/o error|call trace|bug:|hung task|link is down' | tail -n 10 | sed 's/^/SMOKE_DMESG: /' > /dev/ttyS0
              grep -iE 'error|fail' /var/log/rc.log 2>/dev/null | tail -n 10 | sed 's/^/SMOKE_RC: /' > /dev/ttyS0
              o SMOKE_DONE
            ) >/dev/null 2>&1 &
            return 0
          }
          EOF

          # ------------------------------------------------------------ services
          rc_add devfs sysinit
          rc_add dmesg sysinit
          rc_add mdev sysinit
          rc_add hwdrivers sysinit
          rc_add modloop sysinit

          rc_add hwclock boot
          rc_add modules boot
          rc_add sysctl boot
          rc_add hostname boot
          rc_add bootmisc boot
          rc_add syslog boot
          rc_add seedrng boot
          rc_add zram-init boot

          rc_add autonet default
          rc_add sys-tune default
          rc_add hv-guest default
          rc_add iwd default
          rc_add chronyd default
          rc_add crond default
          rc_add acpid default
          rc_add irqbalance default
          rc_add earlyoom default
          rc_add smoke default

          rc_add mount-ro shutdown
          rc_add killprocs shutdown
          rc_add savecache shutdown

          tar -c -C "$tmp" etc usr | gzip -9n > "$HOSTNAME.apkovl.tar.gz"
          __EOF__

      - name: Tạo build.sh (chạy trong container Alpine)
        run: |
          cat > build/build.sh <<'__EOF__'
          #!/bin/sh
          set -eu

          SRC="$(cd "$(dirname "$0")" && pwd)"
          KERNEL_FLAVOR="${KERNEL_FLAVOR:-lts}"
          EXTRA_CMDLINE="${EXTRA_CMDLINE:-}"
          OUT="${OUT:-$SRC/out}"
          IN=/tmp/in

          # Thử lại tối đa 3 lần (mạng/mirror chập chờn)
          retry() {
            n=0
            until "$@"; do
              n=$((n+1))
              [ "$n" -ge 3 ] && return 1
              echo "!! lỗi, thử lại lần $n ..."; sleep 10
            done
          }

          # ============================ GIAI ĐOẠN 1: ROOT ============================
          if [ "$(id -u)" = 0 ] && [ "${1:-}" != "--user" ]; then
            echo ">> [root] cài công cụ build"
            retry apk add --no-cache alpine-sdk alpine-conf syslinux xorriso \
              squashfs-tools grub grub-efi doas mtools dosfstools git wget

            mkdir -p "$IN" /tmp/iso /tmp/work "$OUT"
            cp "$SRC/build.sh" "$SRC/mkimg.custom.sh" "$SRC/genapkovl-custom.sh" "$SRC/pkgs.txt" "$IN/"

            # Gói tích hợp Hyper-V (KVP/VSS/fcopy): tự dò tên gói có trong repo, không có thì bỏ qua
            for p in hvtools hyperv-daemons; do
              if apk search --no-cache -e "$p" | grep -q .; then
                echo "$p" >> "$IN/pkgs.txt"
                echo ">> thêm gói Hyper-V: $p"
                break
              fi
            done

            chmod -R a+rX "$IN"

            adduser -D build 2>/dev/null || true
            addgroup build abuild 2>/dev/null || true
            mkdir -p /etc/doas.d
            echo "permit nopass :abuild" > /etc/doas.d/abuild.conf
            chown -R build:build /tmp/iso /tmp/work

            su build -c "KERNEL_FLAVOR='$KERNEL_FLAVOR' EXTRA_CMDLINE='$EXTRA_CMDLINE' sh $IN/build.sh --user"

            cp /tmp/iso/* "$OUT"/
            echo ">> Xong:"; ls -lh "$OUT"
            exit 0
          fi

          # ========================== GIAI ĐOẠN 2: USER build =========================
          if grep -q '/edge/' /etc/apk/repositories; then
            BRANCH=master; REPO=edge; TAG=edge
          else
            v="$(cut -d. -f1,2 /etc/alpine-release)"
            BRANCH="${v}-stable"; REPO="v${v}"; TAG="v${v}"
          fi

          # Chọn mirror còn sống
          MIRROR=""
          for m in https://dl-cdn.alpinelinux.org/alpine \
                   https://mirror.leaseweb.com/alpine \
                   https://uk.alpinelinux.org/alpine; do
            if wget -q -T 15 --spider "$m/$REPO/main/x86_64/APKINDEX.tar.gz"; then MIRROR="$m"; break; fi
          done
          [ -n "$MIRROR" ] || MIRROR=https://dl-cdn.alpinelinux.org/alpine
          echo ">> branch=$BRANCH repo=$REPO mirror=$MIRROR kernel=$KERNEL_FLAVOR"

          mkdir -p "$HOME/.abuild"
          ls "$HOME"/.abuild/*.rsa >/dev/null 2>&1 || abuild-keygen -i -a -n

          cd /tmp/work
          clone_aports() {
            for url in https://gitlab.alpinelinux.org/alpine/aports.git \
                       https://github.com/alpinelinux/aports.git; do
              rm -rf aports
              git clone --depth=1 -b "$BRANCH" "$url" aports && return 0
            done
            return 1
          }
          retry clone_aports

          cp "$SRC/mkimg.custom.sh" "$SRC/genapkovl-custom.sh" aports/scripts/
          chmod +x aports/scripts/genapkovl-custom.sh

          export OVL_SCRIPT="$PWD/aports/scripts/genapkovl-custom.sh"
          export PKG_FILE="$SRC/pkgs.txt"
          export ALPINE_REPO_VER="$REPO"
          export KERNEL_FLAVOR EXTRA_CMDLINE

          run_mkimage() {
            rm -rf /tmp/work/img
            sh mkimage.sh \
              --tag "$TAG" \
              --outdir /tmp/iso \
              --workdir /tmp/work/img \
              --arch x86_64 \
              --hostname alpine \
              --repository "$MIRROR/$REPO/main" \
              --repository "$MIRROR/$REPO/community" \
              --profile custom
          }
          cd aports/scripts
          retry run_mkimage
          __EOF__

      # ======================================================================
      # 2) Build
      # ======================================================================
      - name: Build ISO trong container Alpine
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -v "$PWD/build":/src \
            -v "$PWD/out":/out \
            -e OUT=/out \
            -e KERNEL_FLAVOR -e EXTRA_CMDLINE \
            "alpine:${ALPINE_TAG}" sh /src/build.sh 2>&1 | tee build.log

      - name: Kiểm tra ISO
        run: |
          ISO="$(ls out/*.iso | head -1)"
          SIZE=$(stat -c %s "$ISO")
          echo "ISO: $ISO ($((SIZE/1024/1024)) MB)"
          [ "$SIZE" -gt $((50*1024*1024)) ] || { echo "::error::ISO quá nhỏ, build lỗi"; exit 1; }

      # ======================================================================
      # 3) Ảnh đĩa Hyper-V: Gen1 (BIOS) + Gen2 (UEFI)
      #    ISO Alpine là hybrid: MBR/isolinux cho BIOS + phân vùng ESP/GRUB cho UEFI,
      #    nên chuyển thẳng sang VHD/VHDX là boot được cả 2 kiểu.
      # ======================================================================
      - name: Tạo ảnh đĩa Hyper-V (Gen1 VHD + Gen2 VHDX)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.hyperv }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils

          ISO="$(ls out/*.iso | head -1)"
          BASE="${ISO%.iso}"

          # Gen1 (BIOS/legacy): VHD
          qemu-img convert -f raw -O vpc  -o subformat=dynamic "$ISO" "${BASE}-gen1-bios.vhd"
          # Gen2 (UEFI): VHDX
          qemu-img convert -f raw -O vhdx -o subformat=dynamic "$ISO" "${BASE}-gen2-uefi.vhdx"

          cat > out/HYPERV-README.txt <<'EOF'
          HƯỚNG DẪN DÙNG TRÊN HYPER-V MANAGER
          ====================================
          File:
            *-gen1-bios.vhd   -> VM Generation 1 (BIOS/legacy)
            *-gen2-uefi.vhdx  -> VM Generation 2 (UEFI)
            *.iso             -> dùng được cho cả Gen1 lẫn Gen2 (gắn vào DVD Drive)

          Gen 1 (BIOS):
            1. New > Virtual Machine > chọn "Generation 1"
            2. Ở bước Connect Virtual Hard Disk: "Use an existing virtual hard disk" -> chọn file .vhd
               (hoặc bỏ qua rồi gắn ISO vào DVD Drive)
            3. Start.

          Gen 2 (UEFI):
            1. New > Virtual Machine > chọn "Generation 2"
            2. Dùng file .vhdx làm đĩa có sẵn (hoặc gắn ISO vào SCSI DVD Drive)
            3. QUAN TRỌNG: Settings > Security > BỎ TICK "Enable Secure Boot"
               (bootloader Alpine không được Microsoft ký nên Secure Boot sẽ chặn boot)
            4. Settings > Firmware: đưa ổ đĩa/DVD lên đầu danh sách boot, rồi Start.

          PowerShell (chạy bằng quyền Admin):
            # Gen2
            New-VM -Name Alpine -Generation 2 -MemoryStartupBytes 2GB -VHDPath C:\VM\alpine.vhdx -SwitchName "Default Switch"
            Set-VMFirmware -VMName Alpine -EnableSecureBoot Off
            Set-VMProcessor -VMName Alpine -Count 2
            Start-VM Alpine

            # Gen1
            New-VM -Name Alpine1 -Generation 1 -MemoryStartupBytes 2GB -VHDPath C:\VM\alpine.vhd -SwitchName "Default Switch"
            Start-VM Alpine1

          Lưu ý:
            - Alpine chạy ở chế độ diskless (nạp vào RAM), nội dung đĩa VHD/VHDX là chỉ-đọc,
              khởi động lại sẽ mất thay đổi. Muốn cài cố định: thêm 1 đĩa ảo trống thứ 2 rồi chạy
              setup-alpine để cài vào đó.
            - Nên cấp từ 1GB RAM trở lên (Alpine chạy trong RAM). Muốn apk add gói nặng (nodejs,
              build-base...) nên cấp 3GB trở lên.
            - Trong VM đã có sẵn daemon tích hợp Hyper-V (KVP/VSS/fcopy) nếu repo có gói hvtools;
              bật "Guest services" trong Integration Services để copy file từ host.
          EOF

          ls -lh out/
          {
            echo "### Ảnh đĩa Hyper-V"
            echo "- Gen1 (BIOS): \`$(basename "${BASE}")-gen1-bios.vhd\`"
            echo "- Gen2 (UEFI): \`$(basename "${BASE}")-gen2-uefi.vhdx\` (nhớ tắt Secure Boot)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Checksum + upload làm TRƯỚC smoke test: file phát hành là bản gốc sạch,
      # smoke test chỉ chạy trên bản sao tạm (QEMU -snapshot) nên không thể làm bẩn chúng.
      - name: Checksum
        run: |
          cd out
          sha256sum *.iso *.vhd *.vhdx 2>/dev/null > SHA256SUMS || sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: alpine-custom-amd64-${{ env.KERNEL_FLAVOR }}
          path: out/*
          retention-days: 14

      # ======================================================================
      # 4) Boot thử bằng QEMU: ISO (BIOS) + VHD (Gen1/BIOS) + VHDX (Gen2/UEFI qua OVMF)
      #    Có NVMe ảo + card mạng ảo, kiểm tra các fix.
      #    + TEST NẶNG trong VM: apk update, apk add nodejs npm git python3 build-base,
      #      chạy node/npm/gcc, rồi in toàn bộ lỗi (nếu có) ra báo cáo.
      #    QEMU chạy với -snapshot: mọi ghi đĩa bị vứt đi -> ảnh gốc không đổi.
      # ======================================================================
      - name: Smoke test (QEMU)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoke_test }}
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ACCEL=tcg; [ -w /dev/kvm ] && ACCEL=kvm
          echo "accel=$ACCEL"

          ISO="$(ls out/*.iso | head -1)"
          VHD="$(ls out/*.vhd 2>/dev/null | head -1 || true)"
          VHDX="$(ls out/*.vhdx 2>/dev/null | head -1 || true)"
          OVMF="$(ls /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1 || true)"
          echo "vhd=$VHD vhdx=$VHDX ovmf=$OVMF"

          # Băm trước để chứng minh ảnh gốc không bị đổi sau test
          ( cd out && sha256sum *.iso *.vhd *.vhdx 2>/dev/null ) > before.sha

          # run_vm <tên> <tham số boot QEMU...>
          # RAM 3GB vì Alpine diskless cài gói vào RAM (nodejs + build-base khá nặng)
          run_vm() {
            name="$1"; shift
            log="serial-$name.log"; : > "$log"
            qemu-img create -f raw "nvme-$name.img" 1G >/dev/null
            timeout 1800 qemu-system-x86_64 -accel "$ACCEL" -cpu max -m 3072 -smp 2 \
              -snapshot -display none -serial "file:$log" "$@" \
              -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
              -drive "file=nvme-$name.img,if=none,id=nv,format=raw" -device nvme,drive=nv,serial=ci0 &
            qpid=$!
            # chờ tối đa ~25 phút (tải nặng qua mạng + TCG chậm)
            for _ in $(seq 1 300); do
              grep -q SMOKE_DONE "$log" && break
              kill -0 "$qpid" 2>/dev/null || break
              sleep 5
            done
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            echo "----- $log -----"; cat "$log"; echo "----------------------"
          }

          fail=0
          : > report.md
          # check <tên> <BIOS|UEFI>
          check() {
            name="$1"; mode="$2"; log="serial-$name.log"
            echo "#### $name" >> report.md
            for k in SMOKE_DONE "SMOKE_BOOT_$mode" SMOKE_NET_OK SMOKE_ZRAM_OK SMOKE_BBR_OK \
                     SMOKE_APK_UPDATE_OK SMOKE_APK_ADD_OK SMOKE_NODE_OK; do
              if grep -q "$k" "$log"; then echo "- ✅ $k" >> report.md; else echo "- ❌ $k" >> report.md; fail=1; fi
            done
            for k in SMOKE_INET_OK SMOKE_NVME_OK SMOKE_GCC_OK; do
              if grep -q "$k" "$log"; then echo "- ✅ $k" >> report.md; else echo "- ⚠️ $k" >> report.md; fi
            done
            # In chi tiết lỗi/thông tin để xem "lỗi gì"
            if grep -qE 'SMOKE_(LOG|INFO|DMESG|RC):' "$log"; then
              { echo; echo '<details><summary>Chi tiết (info + lỗi)</summary>'; echo; echo '```'
                grep -E 'SMOKE_(INFO|LOG|DMESG|RC):' "$log" | tr -d '\r' | head -n 120
                echo '```'; echo '</details>'; echo; } >> report.md
            fi
          }
          echo "### Kết quả smoke test (gồm test nặng apk/nodejs)" >> report.md

          # 1) ISO boot BIOS (CD-ROM)
          run_vm iso-bios -cdrom "$ISO" -boot d
          check iso-bios BIOS

          # 2) Hyper-V Gen1: VHD boot BIOS qua IDE
          if [ -n "$VHD" ]; then
            run_vm vhd-gen1-bios -drive "file=$VHD,format=vpc,media=disk,if=ide" -boot c
            check vhd-gen1-bios BIOS
          fi

          # 3) Hyper-V Gen2: VHDX boot UEFI (OVMF) qua SATA
          if [ -n "$VHDX" ] && [ -n "$OVMF" ]; then
            run_vm vhdx-gen2-uefi -machine q35 -bios "$OVMF" -drive "file=$VHDX,format=vhdx,media=disk"
            check vhdx-gen2-uefi UEFI
          fi

          # Xác nhận ảnh phát hành vẫn nguyên bản (không có nodejs/gói test nào lọt vào)
          ( cd out && sha256sum *.iso *.vhd *.vhdx 2>/dev/null ) > after.sha
          if cmp -s before.sha after.sha; then
            echo "- ✅ Ảnh ISO/VHD/VHDX phát hành giữ nguyên bản gốc (checksum không đổi)" >> report.md
          else
            echo "- ❌ Ảnh gốc bị thay đổi sau test!" >> report.md; fail=1
          fi

          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            serial-*.log
            report.md
          if-no-files-found: ignore

      - name: Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
