name: Probe Hyper-V on Windows runner

# Chạy thử để biết runner Windows của GitHub có chạy được VM Hyper-V thật hay không.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kiểm tra Hyper-V
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions | Format-List
          Get-WindowsOptionalFeature -Online | Where-Object { $_.FeatureName -like 'Microsoft-Hyper-V*' } | Format-Table FeatureName, State
          Get-Service vmms, vmcompute -ErrorAction SilentlyContinue | Format-Table Name, Status
          Get-Command New-VM -ErrorAction SilentlyContinue | Format-List Name, Source
          systeminfo | Select-String -Pattern 'Hyper-V'

      - name: Thử tạo và bật một VM Gen2 rỗng
        shell: pwsh
        continue-on-error: true
        run: |
          New-VHD -Path "$PWD\t.vhdx" -SizeBytes 1GB -Dynamic
          New-VM -Name probe -Generation 2 -MemoryStartupBytes 512MB -VHDPath "$PWD\t.vhdx" -NoVHD:$false
          Set-VMFirmware -VMName probe -EnableSecureBoot Off
          Start-VM -Name probe
          Start-Sleep 15
          Get-VM -Name probe | Format-List Name, State, Status, Uptime
          Stop-VM -Name probe -TurnOff -Force
          Remove-VM -Name probe -Force
