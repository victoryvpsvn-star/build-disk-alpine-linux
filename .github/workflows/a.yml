name: Build Debian Minimal (Hyper-V VHDX / QEMU qcow2)

on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: "Bản Debian (trixie = Debian 13, bookworm = Debian 12)"
        default: "trixie"
      image_size:
        description: "Dung lượng ổ đĩa (vd: 10G, 20G, 30G)"
        default: "30G"
      root_password:
        description: "Mật khẩu root"
        default: "root"
      hostname:
        description: "Hostname"
        default: "debian"
      extra_packages:
        description: "Gói cài thêm (cách nhau bằng dấu cách)"
        default: "wget nano htop bind9-dnsutils"
      run_tests:
        description: "Chạy thử bản sao bằng QEMU (apt update, cài nhiều gói, ghi nặng...) trước khi xuất file"
        type: boolean
        default: true
      test_packages:
        description: "Gói dùng để thử nghiệm tải nặng (cách nhau bằng dấu cách)"
        default: "nodejs npm git python3 build-essential nginx"
      output_format:
        description: "Định dạng ổ đĩa: vhdx (Hyper-V), qcow2 (QEMU), both (cả hai)"
        type: choice
        options:
          - vhdx
          - qcow2
          - both
        default: vhdx
      make_release:
        description: "Đẩy lên GitHub Release (file .zip)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Cài công cụ trên runner
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-utils parted dosfstools e2fsprogs util-linux grub-efi-amd64-bin grub-common zip wget qemu-system-x86 ovmf sshpass

      - name: Lấy keyring Debian mới nhất
        run: |
          BASE=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring
          KR_DEB=$(wget -qO- "$BASE/" | grep -o 'debian-archive-keyring_[0-9.]*_all\.deb' | sort -uV | tail -1)
          test -n "$KR_DEB"
          wget -q "$BASE/$KR_DEB"
          dpkg -x "$KR_DEB" keyring
          echo "KEYRING=$PWD/keyring/usr/share/keyrings/debian-archive-keyring.gpg" >> "$GITHUB_ENV"

      - name: Build image Debian
        env:
          ROOT_PW: ${{ inputs.root_password }}
          HOST_NAME: ${{ inputs.hostname }}
          SIZE: ${{ inputs.image_size }}
          SUITE: ${{ inputs.debian_suite }}
          EXTRA: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          T=/mnt/target
          LOOP=""

          cleanup() {
            set +e
            sudo umount -R "$T" 2>/dev/null
            if [ -n "${LOOP:-}" ]; then sudo losetup -d "$LOOP" 2>/dev/null; fi
          }
          trap cleanup EXIT

          ch() { sudo chroot "$T" /usr/bin/env DEBIAN_FRONTEND=noninteractive LANG=C "$@"; }

          # ---------- Tạo ổ đĩa + phân vùng GPT (EFI 64MiB + root) ----------
          truncate -s "$SIZE" debian.img
          LOOP=$(sudo losetup -fP --show debian.img)
          sudo parted -s "$LOOP" mklabel gpt \
            mkpart ESP fat32 1MiB 65MiB set 1 esp on \
            mkpart root ext4 65MiB 100%
          sudo partprobe "$LOOP"
          sudo udevadm settle
          sudo mkfs.vfat -F32 -n EFI "${LOOP}p1"
          sudo mkfs.ext4 -F -m 1 -L root -E lazy_itable_init=1,lazy_journal_init=1 "${LOOP}p2"
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")
          ESP_UUID=$(sudo blkid -s UUID -o value "${LOOP}p1")
          echo "Root UUID: $ROOT_UUID | ESP UUID: $ESP_UUID"

          sudo mkdir -p "$T"
          sudo mount "${LOOP}p2" "$T"
          sudo mkdir -p "$T/boot/efi"
          sudo mount "${LOOP}p1" "$T/boot/efi"

          # ---------- Cài hệ thống tối giản (không GUI) ----------
          SCRIPT=""
          if [ ! -e "/usr/share/debootstrap/scripts/$SUITE" ]; then SCRIPT=/usr/share/debootstrap/scripts/sid; fi
          sudo debootstrap --arch=amd64 --variant=minbase --components=main \
            --keyring="$KEYRING" \
            --include=systemd-sysv,udev,dbus,libpam-systemd,debian-archive-keyring \
            "$SUITE" "$T" http://deb.debian.org/debian $SCRIPT

          sudo mount --bind /dev "$T/dev"
          sudo mount -t devpts devpts "$T/dev/pts"
          sudo mount -t proc proc "$T/proc"
          sudo mount -t sysfs sysfs "$T/sys"

          # Không tự chạy dịch vụ trong lúc cài
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$T/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod +x "$T/usr/sbin/policy-rc.d"

          # Nguồn gói (có cập nhật + bảo mật), bỏ sources.list cũ
          sudo rm -f "$T/etc/apt/sources.list"
          sudo tee "$T/etc/apt/sources.list.d/debian.sources" >/dev/null <<EOF
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: $SUITE ${SUITE}-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://deb.debian.org/debian-security
          Suites: ${SUITE}-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF

          # Nhẹ: không cài gói gợi ý, bỏ tài liệu/man/ngôn ngữ
          printf 'APT::Install-Recommends "false";\nAPT::Install-Suggests "false";\n' | sudo tee "$T/etc/apt/apt.conf.d/01lean" >/dev/null
          sudo tee "$T/etc/dpkg/dpkg.cfg.d/01_nodoc" >/dev/null <<'EOF'
          path-exclude=/usr/share/doc/*
          path-exclude=/usr/share/man/*
          path-exclude=/usr/share/info/*
          path-exclude=/usr/share/locale/*
          path-include=/usr/share/doc/*/copyright
          EOF

          # initramfs phải có driver Hyper-V (không dùng MODULES=dep vì sẽ dò máy runner)
          sudo mkdir -p "$T/etc/initramfs-tools/conf.d"
          printf 'MODULES=most\n' | sudo tee "$T/etc/initramfs-tools/conf.d/modules.conf" >/dev/null
          printf 'RESUME=none\n' | sudo tee "$T/etc/initramfs-tools/conf.d/resume.conf" >/dev/null
          printf '%s\n' hv_vmbus hv_storvsc hv_netvsc hv_utils hv_balloon | sudo tee -a "$T/etc/initramfs-tools/modules" >/dev/null

          ch apt-get update
          ch apt-get install -y linux-image-cloud-amd64 initramfs-tools kmod \
            systemd-timesyncd openssh-server iproute2 iputils-ping ca-certificates curl \
            cloud-guest-utils $EXTRA

          # ---------- Hostname, hosts, DNS ----------
          printf '%s\n' "$HOST_NAME" | sudo tee "$T/etc/hostname" >/dev/null
          sudo tee "$T/etc/hosts" >/dev/null <<EOF
          127.0.0.1 localhost
          127.0.1.1 $HOST_NAME
          ::1 localhost ip6-localhost ip6-loopback
          EOF
          sudo rm -f "$T/etc/resolv.conf"
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee "$T/etc/resolv.conf" >/dev/null

          # ---------- fstab ----------
          sudo tee "$T/etc/fstab" >/dev/null <<EOF
          UUID=$ROOT_UUID / ext4 errors=remount-ro,noatime 0 1
          UUID=$ESP_UUID /boot/efi vfat umask=0077,nofail 0 2
          EOF

          # ---------- Mạng: DHCP bằng systemd-networkd (có gửi hostname) ----------
          sudo mkdir -p "$T/etc/systemd/network"
          sudo tee "$T/etc/systemd/network/10-dhcp.network" >/dev/null <<'EOF'
          [Match]
          Name=en* eth*

          [Network]
          DHCP=yes

          [DHCPv4]
          SendHostname=true
          EOF

          # ---------- Root + SSH ----------
          printf 'root:%s\n' "$ROOT_PW" | sudo chroot "$T" chpasswd
          sudo mkdir -p "$T/etc/ssh/sshd_config.d" "$T/etc/ssh/ssh_config.d"
          sudo tee "$T/etc/ssh/sshd_config.d/10-root.conf" >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          PermitEmptyPasswords no
          EOF

          # Mỗi VM sinh host key riêng ở lần boot đầu (không dùng chung key trong image)
          sudo rm -f "$T"/etc/ssh/ssh_host_*
          sudo tee "$T/etc/systemd/system/ssh-hostkeys.service" >/dev/null <<'EOF'
          [Unit]
          Description=Generate SSH host keys
          Before=ssh.service
          ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ssh-keygen -A

          [Install]
          WantedBy=multi-user.target
          EOF

          # ---------- Tự nhận IPv4 / IPv6 mỗi lần boot ----------
          sudo tee "$T/usr/local/sbin/netdetect" >/dev/null <<'EOF'
          #!/bin/sh
          v4=0; v6=0; i=0
          while [ "$i" -lt 30 ]; do
            curl -q -4 -sk -o /dev/null --connect-timeout 3 https://1.1.1.1 && v4=1
            curl -q -6 -sk -o /dev/null --connect-timeout 3 "https://[2606:4700:4700::1111]" && v6=1
            if [ "$v4" = 1 ] || [ "$v6" = 1 ]; then break; fi
            i=$((i+1)); sleep 2
          done

          # Có IPv4 (kể cả khi có cả IPv6) -> ưu tiên IPv4. Chỉ có IPv6 -> dùng IPv6.
          if [ "$v4" = 1 ]; then
            CURL=ipv4; WGET="inet4_only = on"; SSHFAM=inet
          elif [ "$v6" = 1 ]; then
            CURL=ipv6; WGET="inet6_only = on"; SSHFAM=inet6
          else
            echo "netdetect: chua co mang" > /run/netdetect.status
            exit 0
          fi

          echo "$CURL" > /root/.curlrc
          echo "$CURL" > /etc/skel/.curlrc
          touch /etc/wgetrc
          sed -i '/^inet[46]_only/d' /etc/wgetrc
          echo "$WGET" >> /etc/wgetrc

          mkdir -p /etc/ssh/ssh_config.d
          echo "AddressFamily $SSHFAM" > /etc/ssh/ssh_config.d/20-family.conf

          if [ "$v4" = 1 ] && [ "$v6" = 1 ]; then SRV=any
          elif [ "$v4" = 1 ]; then SRV=inet
          else SRV=inet6; fi
          echo "AddressFamily $SRV" > /tmp/sshd-family.new
          if ! cmp -s /tmp/sshd-family.new /etc/ssh/sshd_config.d/20-family.conf 2>/dev/null; then
            cp /tmp/sshd-family.new /etc/ssh/sshd_config.d/20-family.conf
            systemctl --no-block restart ssh
          fi

          echo "netdetect: v4=$v4 v6=$v6 curl=$CURL ssh=$SSHFAM sshd=$SRV" > /run/netdetect.status
          EOF
          sudo chmod +x "$T/usr/local/sbin/netdetect"
          sudo tee "$T/etc/systemd/system/netdetect.service" >/dev/null <<'EOF'
          [Unit]
          Description=Detect IPv4/IPv6 and tune curl/wget/ssh
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/netdetect

          [Install]
          WantedBy=multi-user.target
          EOF

          # ---------- Lệnh updisk: tự nhận ổ đĩa to hơn rồi mở rộng phân vùng + hệ thống file ----------
          sudo tee "$T/usr/local/bin/updisk" >/dev/null <<'EOF'
          #!/bin/sh
          # updisk: sau khi tăng dung lượng ổ ảo (Hyper-V: Edit Disk -> Expand), chạy lệnh này.
          set -u
          [ "$(id -u)" = 0 ] || { echo "Cần chạy bằng root"; exit 1; }

          ROOT=$(findmnt -n -o SOURCE /)
          [ -n "$ROOT" ] || { echo "Không xác định được phân vùng gốc"; exit 1; }
          ROOT=$(readlink -f "$ROOT")
          NAME=${ROOT##*/}
          PARTNUM=$(cat /sys/class/block/$NAME/partition 2>/dev/null)
          [ -n "$PARTNUM" ] || { echo "$ROOT không phải là phân vùng"; exit 1; }
          DISKNAME=$(basename "$(readlink -f /sys/class/block/$NAME/..)")
          DISK=/dev/$DISKNAME

          mb() { echo $(( $(cat /sys/class/block/$1/size) * 512 / 1048576 )); }

          echo "Ổ đĩa: $DISK | Phân vùng gốc: $ROOT (số $PARTNUM)"
          echo 1 > /sys/class/block/$DISKNAME/device/rescan 2>/dev/null
          echo "Dung lượng ổ ảo  : $(mb $DISKNAME) MB"
          echo "Phân vùng gốc    : $(mb $NAME) MB"
          df -h / | tail -1

          out=$(growpart "$DISK" "$PARTNUM" 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -q NOCHANGE; then
            echo "Mở rộng phân vùng thất bại. Nếu báo hết chỗ, hãy xóa bớt file rồi chạy lại."
            exit 1
          fi
          partx -u "$DISK" 2>/dev/null

          FSTYPE=$(findmnt -n -o FSTYPE /)
          case "$FSTYPE" in
            ext2|ext3|ext4) resize2fs "$ROOT" ;;
            *) echo "Hệ thống file '$FSTYPE' chưa được hỗ trợ"; exit 1 ;;
          esac

          echo "---- Kết quả ----"
          echo "Phân vùng gốc    : $(mb $NAME) MB"
          df -h / | tail -1
          EOF
          sudo chmod +x "$T/usr/local/bin/updisk"

          # ---------- Lệnh addswap: tạo / gỡ swapfile ----------
          sudo tee "$T/usr/local/bin/addswap" >/dev/null <<'EOF'
          #!/bin/sh
          # addswap [dung lượng]  : tạo swapfile (mặc định 512M), bật ngay và ghi vào /etc/fstab
          # addswap off           : tắt và xóa swapfile
          [ "$(id -u)" = 0 ] || { echo "Cần chạy bằng root"; exit 1; }
          FILE=/swapfile

          if [ "${1:-}" = "off" ]; then
            swapoff "$FILE" 2>/dev/null
            rm -f "$FILE"
            sed -i '\|^/swapfile |d' /etc/fstab
            echo "Đã gỡ swapfile."
            free -m
            exit 0
          fi

          SIZE=${1:-512M}
          if swapon --show=NAME --noheadings | grep -q .; then
            echo "Máy đã có swap:"
            swapon --show
            exit 0
          fi

          BYTES=$(numfmt --from=iec "$SIZE" 2>/dev/null) || { echo "Dung lượng không hợp lệ: $SIZE (ví dụ: 512M, 1G)"; exit 1; }
          NEED=$(( BYTES / 1048576 ))
          FREE=$(df -Pm / | awk 'NR==2{print $4}')
          if [ "$FREE" -lt $(( NEED + 256 )) ]; then
            echo "Không đủ chỗ: cần $NEED MB (+256 MB dự phòng), ổ chỉ còn $FREE MB trống."
            exit 1
          fi

          fallocate -l "$BYTES" "$FILE" || { echo "Không tạo được $FILE"; exit 1; }
          chmod 600 "$FILE"
          mkswap "$FILE" >/dev/null
          swapon "$FILE"
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          echo "Đã bật swap $SIZE:"
          free -m
          EOF
          sudo chmod +x "$T/usr/local/bin/addswap"

          # ---------- Lệnh slim: dọn máy để file VHDX thu nhỏ được ----------
          sudo tee "$T/usr/local/bin/slim" >/dev/null <<'EOF'
          #!/bin/sh
          # slim      : dọn cache, log, file tạm rồi chạy fstrim, hỏi có tắt máy không
          # slim -y   : dọn xong tắt máy luôn, không hỏi
          [ "$(id -u)" = 0 ] || { echo "Cần chạy bằng root"; exit 1; }

          echo "Trước khi dọn:"
          df -h / | tail -1

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /tmp/* /var/tmp/* /root/.cache /root/.npm/_cacache
          journalctl --vacuum-size=1M >/dev/null 2>&1
          rm -f /var/log/*.log /var/log/*.gz /var/log/*.[0-9] 2>/dev/null
          sync
          fstrim -av

          echo "Sau khi dọn:"
          df -h / | tail -1
          echo "Lưu ý: đã xóa danh sách gói apt, lần cài gói tới cần chạy 'apt update' trước."
          echo "Muốn file VHDX nhỏ lại thật: tắt VM rồi chạy Optimize-VHD -Mode Full trên Windows."

          if [ "${1:-}" = "-y" ]; then
            poweroff
          elif [ -t 0 ]; then
            printf 'Tắt máy ngay? [y/N] '
            read -r ans
            case "$ans" in y|Y) poweroff ;; esac
          fi
          EOF
          sudo chmod +x "$T/usr/local/bin/slim"

          # ---------- Lệnh ipcheck: kiểm tra mạng một lượt ----------
          sudo tee "$T/usr/local/bin/ipcheck" >/dev/null <<'EOF'
          #!/bin/sh
          # ipcheck: in IP, gateway, DNS, thử kết nối IPv4/IPv6 và IP công khai
          echo "== Giao diện mạng =="
          ip -brief addr
          echo
          echo "== Gateway =="
          echo "IPv4: $(ip -4 route show default | head -1)"
          echo "IPv6: $(ip -6 route show default | head -1)"
          echo
          echo "== DNS =="
          grep '^nameserver' /etc/resolv.conf
          if getent ahostsv4 example.com >/dev/null 2>&1; then
            echo "Phân giải tên miền: OK"
          else
            echo "Phân giải tên miền: LỖI"
          fi
          echo
          echo "== Kết nối internet =="
          if curl -q -4 -sk -o /dev/null --connect-timeout 4 https://1.1.1.1; then
            echo "IPv4: OK, IP công khai $(curl -q -4 -s --connect-timeout 4 https://api.ipify.org)"
          else
            echo "IPv4: KHÔNG kết nối được"
          fi
          if curl -q -6 -sk -o /dev/null --connect-timeout 4 "https://[2606:4700:4700::1111]"; then
            echo "IPv6: OK, IP công khai $(curl -q -6 -s --connect-timeout 4 https://api6.ipify.org)"
          else
            echo "IPv6: KHÔNG kết nối được"
          fi
          echo
          echo "== Cấu hình tự nhận (netdetect) =="
          cat /run/netdetect.status 2>/dev/null || echo "chưa có kết quả"
          EOF
          sudo chmod +x "$T/usr/local/bin/ipcheck"

          # ---------- Lệnh checkvm: kiểm tra nhanh sức khỏe máy ----------
          sudo tee "$T/usr/local/bin/checkvm" >/dev/null <<'EOF'
          #!/bin/sh
          # checkvm: tổng quan CPU, RAM, swap, ổ đĩa, dịch vụ, mạng và cảnh báo kèm gợi ý lệnh xử lý
          WARN=0
          ok()  { echo "  [OK] $*"; }
          bad() { echo "  [!!] $*"; WARN=$((WARN+1)); }

          . /etc/os-release 2>/dev/null
          echo "== Hệ thống =="
          echo "  OS       : ${PRETTY_NAME:-?}"
          echo "  Kernel   : $(uname -r)"
          echo "  Hostname : $(hostname)"
          echo "  Uptime   : $(uptime -p)"

          echo "== CPU =="
          CPUS=$(nproc)
          LOAD=$(cut -d' ' -f1 /proc/loadavg)
          echo "  $CPUS vCPU, tải 1/5/15 phút: $(cut -d' ' -f1-3 /proc/loadavg)"
          if awk -v l="$LOAD" -v c="$CPUS" 'BEGIN{exit !(l > c*1.5)}'; then
            bad "CPU đang quá tải (tải $LOAD trên $CPUS vCPU), xem tiến trình bằng: htop"
          else
            ok "CPU ổn"
          fi

          echo "== RAM / Swap =="
          MEM_T=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
          MEM_A=$(awk '/^MemAvailable/{print int($2/1024)}' /proc/meminfo)
          SWAP_T=$(awk '/^SwapTotal/{print int($2/1024)}' /proc/meminfo)
          SWAP_U=$(awk '/^SwapTotal/{t=$2} /^SwapFree/{f=$2} END{print int((t-f)/1024)}' /proc/meminfo)
          PCT=$(( MEM_A * 100 / MEM_T ))
          echo "  RAM      : còn trống $MEM_A / $MEM_T MB ($PCT%)"
          echo "  Swap     : dùng $SWAP_U / $SWAP_T MB"
          if [ "$PCT" -lt 15 ]; then bad "RAM sắp hết, xem tiến trình ăn RAM bên dưới"; else ok "RAM ổn"; fi
          if [ "$SWAP_T" -eq 0 ] && [ "$MEM_T" -le 1024 ]; then bad "Chưa có swap trên máy ít RAM, gợi ý chạy: addswap"; fi
          echo "  Top 5 tiến trình ăn RAM:"
          ps -eo rss=,comm= --sort=-rss | head -5 | awk '{printf "    %6.0f MB  %s\n", $1/1024, $2}'

          echo "== Ổ đĩa =="
          set -- $(df -Pm / | awk 'NR==2{print $2, $3, $4, $5}')
          D_SIZE=$1; D_USED=$2; D_FREE=$3; D_PCT=$(echo "$4" | tr -d '%')
          echo "  / : dùng $D_USED / $D_SIZE MB ($D_PCT%), còn trống $D_FREE MB"
          if [ "$D_PCT" -ge 85 ]; then bad "Ổ gần đầy, gợi ý chạy: slim"; else ok "Dung lượng ổ ổn"; fi
          ROOT=$(readlink -f "$(findmnt -n -o SOURCE /)")
          NAME=${ROOT##*/}
          DISKNAME=$(basename "$(readlink -f /sys/class/block/$NAME/.. 2>/dev/null)")
          PS=$(cat /sys/class/block/$NAME/size 2>/dev/null)
          PSTART=$(cat /sys/class/block/$NAME/start 2>/dev/null)
          DS=$(cat /sys/class/block/$DISKNAME/size 2>/dev/null)
          if [ -n "$PS" ] && [ -n "$PSTART" ] && [ -n "$DS" ]; then
            TAIL=$(( (DS - PSTART - PS) / 2048 ))
            if [ "$TAIL" -gt 100 ]; then
              bad "Ổ ảo còn dư khoảng $TAIL MB chưa dùng, gợi ý chạy: updisk"
            else
              ok "Phân vùng đã dùng hết ổ ảo"
            fi
          fi

          echo "== Dịch vụ =="
          FAILED=$(systemctl --failed --no-legend --plain 2>/dev/null)
          if [ -n "$FAILED" ]; then
            bad "Có dịch vụ lỗi:"
            echo "$FAILED" | awk '{print "       " $1}'
          else
            ok "Không có dịch vụ lỗi"
          fi

          echo "== Mạng =="
          echo "  IP       : $(ip -4 -brief addr show scope global | awk '{print $1" "$3}' | head -1)"
          if curl -q -4 -sk -o /dev/null --connect-timeout 3 https://1.1.1.1; then ok "IPv4 ra internet được"; else bad "IPv4 không ra internet, chạy: ipcheck"; fi
          if curl -q -6 -sk -o /dev/null --connect-timeout 3 "https://[2606:4700:4700::1111]"; then ok "IPv6 ra internet được"; else echo "  [--] IPv6 không có (bình thường nếu mạng chỉ có IPv4)"; fi

          echo
          if [ "$WARN" -eq 0 ]; then echo "Kết luận: máy ổn."; else echo "Kết luận: có $WARN cảnh báo [!!] ở trên."; fi
          EOF
          sudo chmod +x "$T/usr/local/bin/checkvm"

          # ---------- Nhẹ: log trong RAM, bỏ timer cập nhật, fstrim hàng ngày ----------
          sudo mkdir -p "$T/etc/systemd/journald.conf.d" "$T/etc/systemd/system/fstrim.timer.d"
          printf '[Journal]\nStorage=volatile\nRuntimeMaxUse=16M\n' | sudo tee "$T/etc/systemd/journald.conf.d/volatile.conf" >/dev/null
          printf '[Timer]\nOnCalendar=\nOnCalendar=daily\nPersistent=true\n' | sudo tee "$T/etc/systemd/system/fstrim.timer.d/daily.conf" >/dev/null

          ch systemctl enable systemd-networkd ssh ssh-hostkeys netdetect systemd-timesyncd
          ch systemctl enable fstrim.timer || echo "CẢNH BÁO: không bật được fstrim.timer"
          ch systemctl mask apt-daily.timer apt-daily-upgrade.timer || true

          # ---------- Kiểm tra kernel + initramfs ----------
          ls -l "$T/boot" "$T/vmlinuz" "$T/initrd.img"
          sudo test -e "$T/vmlinuz" && sudo test -e "$T/initrd.img"
          echo "---- Driver Hyper-V trong initramfs (nếu rỗng thì có thể đã build sẵn trong kernel) ----"
          sudo lsinitramfs "$T/initrd.img" | grep -E 'hv_|hyperv' || true

          # ---------- Dọn cho nhẹ ----------
          ch apt-get clean
          sudo rm -rf "$T"/var/lib/apt/lists/* "$T"/tmp/* "$T"/var/log/*.log "$T/usr/sbin/policy-rc.d"
          : | sudo tee "$T/etc/machine-id" >/dev/null

          # ---------- Bootloader UEFI: BOOTX64.EFI nhúng sẵn cấu hình, tìm root theo UUID ----------
          cat > grub-embed.cfg <<EOF
          set timeout=1
          search --no-floppy --fs-uuid --set=root $ROOT_UUID
          menuentry "Debian" {
            linux /vmlinuz root=UUID=$ROOT_UUID ro console=ttyS0,115200 console=tty0 net.ifnames=0
            initrd /initrd.img
          }
          EOF
          cat grub-embed.cfg
          grub-mkstandalone -O x86_64-efi -o BOOTX64.EFI \
            --modules="part_gpt part_msdos fat ext2 search search_fs_uuid search_fs_file normal linux configfile" \
            "boot/grub/grub.cfg=grub-embed.cfg"
          sudo mkdir -p "$T/boot/efi/EFI/BOOT"
          sudo cp BOOTX64.EFI "$T/boot/efi/EFI/BOOT/BOOTX64.EFI"
          echo "---- Phân vùng EFI ----"
          sudo find "$T/boot/efi"

          # ---------- Trả block trống để file ảnh thưa, rồi gỡ mount ----------
          sync
          sudo fstrim -v "$T" || true
          sudo umount -R "$T"
          sudo losetup -d "$LOOP"
          LOOP=""
          ls -lhs debian.img

      - name: Test thật bằng QEMU (chạy trên bản sao, bản gốc giữ sạch)
        if: ${{ inputs.run_tests }}
        timeout-minutes: 45
        env:
          ROOT_PW: ${{ inputs.root_password }}
          PKGS: ${{ inputs.test_packages }}
        run: |
          set -euo pipefail
          cp --sparse=always debian.img test.img
          : > serial.log

          # Bật KVM trên runner nếu có, không thì dùng giả lập (chậm hơn nhiều)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then
            ACCEL="-accel kvm -cpu host"; echo "Dùng KVM (nhanh)"
          else
            ACCEL="-accel tcg -cpu max"; echo "Không có KVM: chạy giả lập (chậm)"
          fi

          # Tìm firmware UEFI (không dùng "ls" vì nó trả mã lỗi 2 khi một file không tồn tại, làm set -e dừng script)
          CODE=""; VARS=""
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]; then CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ]; then CODE=/usr/share/OVMF/OVMF_CODE.fd; fi
          if [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then VARS=/usr/share/OVMF/OVMF_VARS.fd; fi
          if [ -z "$CODE" ] || [ -z "$VARS" ]; then
            echo "Không tìm thấy firmware OVMF. Nội dung /usr/share/OVMF:"
            ls -l /usr/share/OVMF || true
            exit 1
          fi
          echo "OVMF: $CODE | $VARS"
          cp "$VARS" vars.fd

          export SSHPASS="$ROOT_PW"
          SSH_OPTS="-p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=5 -o ServerAliveInterval=15"
          rsh() { sshpass -e ssh $SSH_OPTS root@127.0.0.1 "$@"; }

          start_vm() {
            qemu-system-x86_64 $ACCEL -M q35 -m 1024 -smp 2 \
              -drive if=pflash,format=raw,readonly=on,file="$CODE" \
              -drive if=pflash,format=raw,file=vars.fd \
              -drive file=test.img,if=virtio,format=raw \
              -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22 \
              -display none -serial file:serial.log -monitor none \
              -daemonize -pidfile qemu.pid
          }

          # Chờ VM lên SSH và khác boot_id cũ (để biết đã thật sự khởi động lại)
          BOOT_ID=""
          wait_ssh() {
            OLD="${1:-}"
            for i in $(seq 1 150); do
              NEW=$(rsh 'test -s /run/netdetect.status && cat /proc/sys/kernel/random/boot_id' 2>/dev/null) || NEW=""
              if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then BOOT_ID="$NEW"; return 0; fi
              sleep 5
            done
            echo "VM không lên SSH được sau 12 phút. 60 dòng cuối của serial.log:"
            tail -60 serial.log
            return 1
          }

          stop_vm() {
            rsh poweroff >/dev/null 2>&1 || true
            for i in $(seq 1 60); do
              kill -0 "$(cat qemu.pid)" 2>/dev/null || return 0
              sleep 2
            done
            kill "$(cat qemu.pid)" 2>/dev/null || true
          }

          # Giãn ổ thêm 2G để thử luôn lệnh updisk
          truncate -s +2G test.img

          echo "################ LẦN BOOT 1: kiểm tra đầy đủ ################"
          start_vm
          wait_ssh ""
          FIRST_BOOT="$BOOT_ID"

          {
            printf 'PKGS=%q\n' "$PKGS"
            cat <<'REMOTE'
          set -u
          FAIL=0
          pass() { echo "[PASS] $*"; }
          fail() { echo "[FAIL] $*"; FAIL=1; }
          export DEBIAN_FRONTEND=noninteractive

          echo "== Hệ thống =="
          uname -a
          cat /run/netdetect.status

          F=$(systemctl --failed --no-legend --plain)
          if [ -z "$F" ]; then pass "không có dịch vụ lỗi"; else fail "dịch vụ lỗi: $F"; fi
          if grep -q 'v4=1' /run/netdetect.status; then pass "mạng IPv4 hoạt động"; else fail "không có IPv4"; fi

          echo "== Kernel có driver Hyper-V không (kiểm tra tĩnh, QEMU không dùng driver này) =="
          CFG=/boot/config-$(uname -r)
          IR=/boot/initrd.img-$(uname -r)
          for k in CONFIG_HYPERV CONFIG_HYPERV_STORAGE CONFIG_HYPERV_NET; do
            if grep -qE "^$k=(y|m)" "$CFG"; then pass "kernel có $k"; else fail "kernel thiếu $k"; fi
          done
          for pair in CONFIG_HYPERV:hv_vmbus CONFIG_HYPERV_STORAGE:hv_storvsc CONFIG_HYPERV_NET:hv_netvsc; do
            k=${pair%%:*}; m=${pair##*:}
            if grep -q "^$k=m" "$CFG"; then
              if lsinitramfs "$IR" | grep -q "$m"; then pass "initramfs có $m"; else fail "initramfs thiếu $m"; fi
            fi
          done

          echo "== updisk (ổ vừa được giãn thêm 2G) =="
          SRC=$(findmnt -n -o SOURCE /)
          BEFORE=$(blockdev --getsize64 "$SRC")
          if updisk >/tmp/updisk.log 2>&1; then
            AFTER=$(blockdev --getsize64 "$SRC")
            if [ "$AFTER" -gt $((BEFORE + 1500000000)) ]; then
              pass "updisk mở rộng $((BEFORE/1048576)) -> $((AFTER/1048576)) MB"
            else
              cat /tmp/updisk.log; fail "updisk chạy xong nhưng dung lượng không tăng"
            fi
          else
            cat /tmp/updisk.log; fail "updisk báo lỗi"
          fi

          echo "== apt update + cài nhiều gói: $PKGS =="
          if apt-get update && apt-get install -y $PKGS; then pass "apt cài gói thành công"; else fail "apt cài gói lỗi"; fi
          if dpkg --audit | grep -q .; then fail "dpkg còn gói cài dở"; else pass "dpkg sạch"; fi

          echo "== Ghi nặng =="
          mkdir -p /root/stress
          ok=1
          for i in $(seq 1 1500); do
            dd if=/dev/zero of=/root/stress/f$i bs=64k count=1 conv=fsync status=none || { ok=0; echo "lỗi ở file $i"; break; }
          done
          sync
          rm -rf /root/stress
          if [ "$ok" = 1 ]; then pass "ghi 1500 file có fsync"; else fail "lỗi khi ghi nhiều file"; fi
          if dd if=/dev/zero of=/root/big bs=1M count=1024 oflag=direct status=none; then pass "ghi tuần tự 1 GB"; else fail "ghi 1 GB lỗi"; fi
          rm -f /root/big
          if fstrim -v / >/dev/null 2>&1; then pass "fstrim"; else fail "fstrim lỗi"; fi

          echo "== Các lệnh tự viết =="
          if checkvm >/dev/null 2>&1; then pass "checkvm"; else fail "checkvm lỗi"; fi
          if ipcheck >/dev/null 2>&1; then pass "ipcheck"; else fail "ipcheck lỗi"; fi
          if addswap 256M >/dev/null 2>&1 && swapon --show | grep -q swapfile; then pass "addswap"; else fail "addswap lỗi"; fi
          addswap off >/dev/null 2>&1

          echo "== Lỗi I/O trong kernel =="
          if dmesg | grep -iE 'I/O error|EXT4-fs error|Buffer I/O|blk_update_request|blocked for more than'; then
            fail "kernel báo lỗi I/O"
          else
            pass "dmesg không có lỗi I/O"
          fi

          echo "KET QUA LAN 1: $([ "$FAIL" = 0 ] && echo DAT || echo KHONG DAT)"
          exit $FAIL
          REMOTE
          } | rsh 'bash -s' | tee test.log

          echo "################ LẦN BOOT 2: khởi động lại, kiểm tra còn ổn ################"
          rsh 'systemctl reboot' >/dev/null 2>&1 || true
          sleep 15
          wait_ssh "$FIRST_BOOT"

          rsh 'bash -s' <<'REMOTE2' | tee -a test.log
          set -u
          FAIL=0
          pass() { echo "[PASS] $*"; }
          fail() { echo "[FAIL] $*"; FAIL=1; }
          F=$(systemctl --failed --no-legend --plain)
          if [ -z "$F" ]; then pass "sau reboot: không có dịch vụ lỗi"; else fail "sau reboot, dịch vụ lỗi: $F"; fi
          if findmnt -n -o OPTIONS / | grep -qE '(^|,)rw(,|$)'; then pass "/ vẫn mount rw"; else fail "/ bị chuyển sang chỉ-đọc"; fi
          if dmesg | grep -iE 'I/O error|EXT4-fs error|Buffer I/O|blk_update_request'; then fail "kernel báo lỗi I/O sau reboot"; else pass "dmesg sạch sau reboot"; fi
          df -h / | tail -1
          echo "KET QUA LAN 2: $([ "$FAIL" = 0 ] && echo DAT || echo KHONG DAT)"
          exit $FAIL
          REMOTE2

          stop_vm

          echo "################ Kiểm tra hệ thống file sau khi test ################"
          LOOP=$(sudo losetup -fP --show test.img)
          if sudo e2fsck -fn "${LOOP}p2" | tee -a test.log; then
            echo "[PASS] e2fsck: hệ thống file sạch" | tee -a test.log
          else
            echo "[FAIL] e2fsck báo lỗi" | tee -a test.log
            sudo losetup -d "$LOOP"
            exit 1
          fi
          sudo losetup -d "$LOOP"

          # Bản test đã cài nhiều thứ nên bỏ đi. File xuất ra ở bước sau vẫn là debian.img sạch.
          rm -f test.img vars.fd
          echo "TẤT CẢ BÀI TEST ĐẠT. Bản xuất ra là bản sạch, chưa cài thêm gì."

      - name: Upload log test
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: debian-test-logs
          path: |
            serial.log
            test.log
          if-no-files-found: ignore

      - name: Đóng gói ổ đĩa
        env:
          FORMAT: ${{ inputs.output_format }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$FORMAT" = "vhdx" ] || [ "$FORMAT" = "both" ]; then
            # block_size=1M là mức Microsoft khuyến nghị cho VM Linux (qemu mặc định dùng block lớn hơn nhiều)
            qemu-img convert -f raw -O vhdx -o subformat=dynamic,block_size=1M debian.img out/debian.vhdx
            ( cd out && zip -9 debian-hyperv-gen2-vhdx.zip debian.vhdx && rm debian.vhdx )
          fi
          if [ "$FORMAT" = "qcow2" ] || [ "$FORMAT" = "both" ]; then
            qemu-img convert -f raw -O qcow2 debian.img out/debian.qcow2
            ( cd out && zip -9 debian-qcow2.zip debian.qcow2 && rm debian.qcow2 )
          fi
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-${{ inputs.output_format }}
          path: out/*.zip
          compression-level: 0

      - name: Upload Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian-${{ inputs.debian_suite }}-${{ github.run_number }}
          name: "Debian ${{ inputs.debian_suite }} Hyper-V Gen2 #${{ github.run_number }}"
          body: |
            Đã qua bài test (apt update, cài nhiều gói, ghi nặng, reboot, fsck) trước khi xuất file.
            Debian **${{ inputs.debian_suite }}** tối giản (không GUI), boot UEFI (Hyper-V Gen2: tắt Secure Boot).
            Mạng: DHCP tự động, SSH root bật sẵn.
            Sau khi tăng ổ đĩa trong Hyper-V, chạy lệnh `updisk` trong VM.
          files: out/*.zip
