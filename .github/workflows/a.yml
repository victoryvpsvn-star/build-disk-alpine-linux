name: Build Alpine Linux IMG

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bản build: img (thường), hyperv-gen1 (BIOS), hyperv-gen2 (UEFI)"
        type: choice
        options:
          - img
          - hyperv-gen1
          - hyperv-gen2
        default: img
      alpine_branch:
        description: "Nhánh Alpine (vd: latest-stable, v3.22)"
        default: "latest-stable"
      image_size:
        description: "Dung lượng ổ đĩa (vd: 2G, 4G, 8G, 20G)"
        default: "4G"
      root_password:
        description: "Mật khẩu root"
        default: "root"
      hostname:
        description: "Hostname"
        default: "alpine"
      extra_packages:
        description: "Gói cài thêm (cách nhau bằng dấu cách)"
        default: "curl wget nano htop bash iproute2 bind-tools"
      make_release:
        description: "Đẩy lên GitHub Release (file .img.xz)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Cài công cụ trên runner
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils e2fsprogs dosfstools util-linux parted xz-utils zip wget
          sudo modprobe nbd max_part=8

      - name: Tải alpine-make-vm-image
        run: |
          wget -q https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/v0.13.4/alpine-make-vm-image
          chmod +x alpine-make-vm-image

      - name: Tạo file cấu hình + script setup (chạy trong chroot)
        env:
          ROOT_PW: ${{ inputs.root_password }}
          HOST_NAME: ${{ inputs.hostname }}
          TARGET: ${{ inputs.target }}
        run: |
          # Lưu biến vào file để script trong chroot đọc
          {
            printf 'ROOT_PW=%q\n' "$ROOT_PW"
            printf 'HOST_NAME=%q\n' "$HOST_NAME"
            case "$TARGET" in hyperv-*) echo 'HYPERV=1' ;; *) echo 'HYPERV=0' ;; esac
          } > config.env

          cat > setup.sh <<'EOF'
          #!/bin/sh
          set -eu
          cd /mnt
          . ./config.env

          # ---------- Root ----------
          echo "root:${ROOT_PW}" | chpasswd
          passwd -u root 2>/dev/null || true

          # ---------- Hostname ----------
          echo "${HOST_NAME}" > /etc/hostname

          # ---------- Mạng: DHCP sẵn ----------
          cat > /etc/network/interfaces <<'NET'
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet dhcp
          NET

          cat > /etc/resolv.conf <<'DNS'
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          DNS

          # Phòng trường hợp tên card mạng không phải eth0
          mkdir -p /etc/local.d
          cat > /etc/local.d/10-autonet.start <<'AUTO'
          #!/bin/sh
          sleep 2
          for dev in $(ls /sys/class/net | grep -v '^lo$'); do
            ip link set "$dev" up
            if ! ip -4 addr show "$dev" | grep -q 'inet '; then
              udhcpc -b -i "$dev" -q >/dev/null 2>&1 &
            fi
          done
          AUTO
          chmod +x /etc/local.d/10-autonet.start

          # ---------- SSH root bằng mật khẩu ----------
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/10-root.conf <<'SSH'
          PermitRootLogin yes
          PasswordAuthentication yes
          PermitEmptyPasswords no
          SSH

          # ---------- Tự nhận biết IPv4 / IPv6 mỗi lần boot ----------
          # Không tắt IPv6. Mỗi lần khởi động, script dưới đây thử kết nối thật
          # rồi chỉnh curl, wget, ssh cho khớp với mạng đang có.
          mkdir -p /etc/skel
          cat > /etc/local.d/20-netdetect.start <<'NETDETECT'
          #!/bin/sh
          (
            v4=0; v6=0; i=0
            while [ "$i" -lt 30 ]; do
              curl -q -4 -sk -o /dev/null --connect-timeout 3 https://1.1.1.1 && v4=1
              curl -q -6 -sk -o /dev/null --connect-timeout 3 "https://[2606:4700:4700::1111]" && v6=1
              if [ "$v4" = 1 ] || [ "$v6" = 1 ]; then break; fi
              i=$((i+1)); sleep 2
            done

            # Có IPv4 (kể cả khi có cả IPv6) -> ưu tiên IPv4. Chỉ có IPv6 -> dùng IPv6.
            if [ "$v4" = 1 ]; then
              CURL=ipv4; WGET="inet4_only = on"; SSHFAM=inet
            elif [ "$v6" = 1 ]; then
              CURL=ipv6; WGET="inet6_only = on"; SSHFAM=inet6
            else
              echo "netdetect: chua co mang" > /run/netdetect.status
              exit 0
            fi

            echo "$CURL" > /root/.curlrc
            echo "$CURL" > /etc/skel/.curlrc
            echo "$WGET" > /etc/wgetrc

            sed -i '/^AddressFamily/d' /etc/ssh/ssh_config
            echo "AddressFamily $SSHFAM" >> /etc/ssh/ssh_config

            # sshd (server): có cả hai thì nghe cả hai
            if [ "$v4" = 1 ] && [ "$v6" = 1 ]; then SRV=any
            elif [ "$v4" = 1 ]; then SRV=inet
            else SRV=inet6; fi
            echo "AddressFamily $SRV" > /tmp/sshd-family.new
            if ! cmp -s /tmp/sshd-family.new /etc/ssh/sshd_config.d/20-family.conf 2>/dev/null; then
              cp /tmp/sshd-family.new /etc/ssh/sshd_config.d/20-family.conf
              rc-service sshd restart >/dev/null 2>&1
            fi

            echo "netdetect: v4=$v4 v6=$v6 curl=$CURL ssh=$SSHFAM sshd=$SRV" > /run/netdetect.status
          ) &
          NETDETECT
          chmod +x /etc/local.d/20-netdetect.start

          # ---------- Tự tối ưu theo cấu hình máy (RAM / CPU) mỗi lần boot ----------
          cat > /etc/local.d/30-autotune.start <<'AUTOTUNE'
          #!/bin/sh
          MEM=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
          CPU=$(nproc 2>/dev/null || echo 1)

          # Phân loại máy: low (rất yếu) / mid (vừa) / high (khỏe)
          if [ "$MEM" -le 512 ] || { [ "$CPU" -le 1 ] && [ "$MEM" -le 1024 ]; }; then
            TIER=low
          elif [ "$MEM" -le 1536 ]; then
            TIER=mid
          else
            TIER=high
          fi

          # Giảm ghi đĩa: không cập nhật thời gian truy cập file
          mount -o remount,noatime / 2>/dev/null

          # Swap nén trong RAM (zram) cho máy ít RAM
          ZRAM=0
          if [ "$MEM" -le 2048 ] && [ -z "$(tail -n +2 /proc/swaps)" ]; then
            if modprobe zram 2>/dev/null && [ -e /sys/block/zram0/disksize ]; then
              echo zstd > /sys/block/zram0/comp_algorithm 2>/dev/null || echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null
              if [ "$TIER" = low ]; then SZ=$MEM; else SZ=$((MEM / 2)); fi
              echo "${SZ}M" > /sys/block/zram0/disksize
              if mkswap /dev/zram0 >/dev/null 2>&1 && swapon -p 100 /dev/zram0 2>/dev/null; then
                ZRAM=1
              fi
            fi
          fi

          # Thông số bộ nhớ theo từng loại máy
          case "$TIER" in
            low)  SWP=100; DR=10; DB=5  ;;
            mid)  SWP=60;  DR=15; DB=5  ;;
            *)    SWP=10;  DR=20; DB=10 ;;
          esac
          if [ "$ZRAM" = 0 ]; then SWP=10; fi
          sysctl -w vm.swappiness=$SWP vm.vfs_cache_pressure=50 \
                    vm.dirty_ratio=$DR vm.dirty_background_ratio=$DB >/dev/null 2>&1
          if [ "$ZRAM" = 1 ]; then sysctl -w vm.page-cluster=0 >/dev/null 2>&1; fi

          # Máy yếu: tắt transparent hugepage để đỡ tốn RAM
          if [ "$TIER" = low ] && [ -w /sys/kernel/mm/transparent_hugepage/enabled ]; then
            echo never > /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null
          fi

          # Ổ ảo: dùng bộ lập lịch I/O nhẹ nhất
          for q in /sys/block/sd*/queue/scheduler; do
            [ -w "$q" ] || continue
            echo none > "$q" 2>/dev/null || echo mq-deadline > "$q" 2>/dev/null
          done

          echo "autotune: tier=$TIER mem=${MEM}MB cpu=$CPU zram=$ZRAM swappiness=$SWP" > /run/autotune.status
          AUTOTUNE
          chmod +x /etc/local.d/30-autotune.start

          # Mỗi tuần trả lại block trống cho file VHDX (giúp file nhỏ lại khi tối ưu trên Windows)
          mkdir -p /etc/periodic/weekly
          cat > /etc/periodic/weekly/fstrim <<'FSTRIM'
          #!/bin/sh
          fstrim / >/dev/null 2>&1
          fstrim /boot >/dev/null 2>&1
          exit 0
          FSTRIM
          chmod +x /etc/periodic/weekly/fstrim

          # ---------- Lệnh updisk: tự nhận ổ đĩa to hơn rồi mở rộng phân vùng + hệ thống file ----------
          cat > /usr/local/bin/updisk <<'UPDISK'
          #!/bin/sh
          # updisk: sau khi tăng dung lượng ổ ảo (Hyper-V: Edit Disk -> Expand), chạy lệnh này.
          set -u
          [ "$(id -u)" = 0 ] || { echo "Cần chạy bằng root"; exit 1; }

          ROOT=$(awk '$2=="/" && $1 ~ /^\/dev\//{d=$1} END{print d}' /proc/mounts)
          [ -n "$ROOT" ] || { echo "Không xác định được phân vùng gốc"; exit 1; }
          ROOT=$(readlink -f "$ROOT")
          NAME=${ROOT##*/}
          PARTNUM=$(cat /sys/class/block/$NAME/partition 2>/dev/null)
          [ -n "$PARTNUM" ] || { echo "$ROOT không phải là phân vùng"; exit 1; }
          DISKNAME=$(basename "$(readlink -f /sys/class/block/$NAME/..)")
          DISK=/dev/$DISKNAME

          mb() { echo $(( $(cat /sys/class/block/$1/size) * 512 / 1048576 )); }

          echo "Ổ đĩa: $DISK | Phân vùng gốc: $ROOT (số $PARTNUM)"
          echo 1 > /sys/class/block/$DISKNAME/device/rescan 2>/dev/null
          echo "Dung lượng ổ ảo  : $(mb $DISKNAME) MB"
          echo "Phân vùng gốc    : $(mb $NAME) MB"
          df -h / | tail -1

          # 1) Mở rộng phân vùng cho hết ổ đĩa
          out=$(growpart "$DISK" "$PARTNUM" 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -q NOCHANGE; then
            echo "Mở rộng phân vùng thất bại. Nếu báo hết chỗ, hãy xóa bớt file rồi chạy lại."
            exit 1
          fi
          partprobe "$DISK" 2>/dev/null

          # 2) Mở rộng hệ thống file cho hết phân vùng (làm được khi đang chạy)
          FSTYPE=$(blkid -o value -s TYPE "$ROOT")
          case "$FSTYPE" in
            ext2|ext3|ext4) resize2fs "$ROOT" ;;
            *) echo "Hệ thống file '$FSTYPE' chưa được hỗ trợ"; exit 1 ;;
          esac

          echo "---- Kết quả ----"
          echo "Phân vùng gốc    : $(mb $NAME) MB"
          df -h / | tail -1
          UPDISK
          chmod +x /usr/local/bin/updisk

          # ---------- Hyper-V: driver disk + mạng vào initramfs ----------
          if [ "$HYPERV" = "1" ]; then
            mkdir -p /etc/mkinitfs/features.d
            printf '%s\n' hv_vmbus hv_storvsc hv_netvsc hv_utils hv_balloon > /etc/mkinitfs/features.d/hyperv.modules
            if ! grep -q hyperv /etc/mkinitfs/mkinitfs.conf; then
              sed -i 's/^features="/features="hyperv /' /etc/mkinitfs/mkinitfs.conf
            fi
            printf '%s\n' hv_vmbus hv_storvsc hv_netvsc hv_utils >> /etc/modules
            for k in $(ls /lib/modules); do mkinitfs "$k" || true; done
          fi

          # ---------- Bật dịch vụ ----------
          rc-update add networking boot   || true
          rc-update add sshd default      || true
          rc-update add local default     || true
          rc-update add crond default     || true
          rc-update add chronyd default   || true

          # ---------- Dọn cho nhẹ ----------
          rm -rf /var/cache/apk/* /tmp/* /mnt/config.env 2>/dev/null || true
          EOF
          # bỏ khoảng thụt dòng do heredoc trong YAML
          sed -i 's/^          //' setup.sh
          chmod +x setup.sh

      - name: Build image
        env:
          BRANCH: ${{ inputs.alpine_branch }}
          SIZE: ${{ inputs.image_size }}
          EXTRA: ${{ inputs.extra_packages }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "hyperv-gen2" ]; then BOOT=UEFI; else BOOT=BIOS; fi
          sudo ./alpine-make-vm-image \
            --boot-mode "$BOOT" \
            --image-format raw \
            --image-size "$SIZE" \
            --branch "$BRANCH" \
            --serial-console \
            --packages "alpine-base openssh chrony busybox-openrc e2fsprogs e2fsprogs-extra cloud-utils-growpart sfdisk parted curl $EXTRA" \
            --script-chroot \
            alpine.img \
            ./setup.sh

          sudo chown "$USER" alpine.img
          ls -lh alpine.img

      - name: Cài bootloader UEFI vào image (chỉ Gen2)
        if: ${{ inputs.target == 'hyperv-gen2' }}
        run: |
          set -eu
          sudo apt-get install -y grub-efi-amd64-bin

          LOOP=$(sudo losetup -fP --show alpine.img)
          sudo parted -s "$LOOP" print
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")
          echo "Root UUID: $ROOT_UUID"

          sudo mkdir -p /mnt/esp
          sudo mount "${LOOP}p1" /mnt/esp

          # grub.cfg nhúng thẳng vào BOOTX64.EFI: tự tìm phân vùng EFI chứa kernel
          printf '%s\n' \
            'set timeout=1' \
            'search --no-floppy --file /vmlinuz-virt --set=root' \
            'menuentry "Alpine Linux" {' \
            "  linux /vmlinuz-virt root=UUID=${ROOT_UUID} rootfstype=ext4 console=tty0" \
            '  initrd /initramfs-virt' \
            '}' > grub-embed.cfg
          cat grub-embed.cfg

          grub-mkstandalone -O x86_64-efi -o BOOTX64.EFI \
            --modules="part_gpt part_msdos fat ext2 search search_fs_file normal linux configfile" \
            "boot/grub/grub.cfg=grub-embed.cfg"

          sudo mkdir -p /mnt/esp/EFI/BOOT
          sudo cp BOOTX64.EFI /mnt/esp/EFI/BOOT/BOOTX64.EFI

          echo "---- Nội dung phân vùng EFI ----"
          sudo find /mnt/esp
          sync
          sudo umount /mnt/esp
          sudo losetup -d "$LOOP"

      - name: Đóng gói theo bản đã chọn
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p out
          if [ "$TARGET" = "img" ]; then
            xz -9 -T0 -k alpine.img
            mv alpine.img out/alpine.img
            mv alpine.img.xz out/alpine.img.xz
          else
            qemu-img convert -f raw -O vhdx -o subformat=dynamic alpine.img out/alpine.vhdx
            ( cd out && zip -9 "alpine-${TARGET}-vhdx.zip" alpine.vhdx )
          fi
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-${{ inputs.target }}
          path: |
            out/alpine.img
            out/alpine.vhdx
          compression-level: 6

      - name: Upload Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpine-${{ inputs.target }}-${{ github.run_number }}
          name: "Alpine ${{ inputs.target }} #${{ github.run_number }}"
          body: |
            Bản: **${{ inputs.target }}**
            Hyper-V gen1 = BIOS, gen2 = UEFI (tắt Secure Boot).
            Root password: `${{ inputs.root_password }}`
            Mạng: DHCP tự động, SSH root bật sẵn.
          files: |
            out/alpine.img.xz
            out/*.zip
