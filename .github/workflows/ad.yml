                      <span class="sp"></span>
                      <button id="run" type="submit">Chạy</button>
                      <button id="stop" type="button" hidden>Dừng</button>
                    </div>
                  </div>
                </form>
              </main>
            </div>
          </div>

          <script>
          (function(){
          var $=function(s,r){return (r||document).querySelector(s)};
          var stream=$('#stream'),inner=$('#inner'),q=$('#q'),runBtn=$('#run'),stopBtn=$('#stop');
          var sid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
          var ctrl=null,order=[];

          function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
          function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
          function fmt(n){n=n||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}
          function md(src){
            var parts=String(src).split('```'),out='';
            parts.forEach(function(p,i){
              if(i%2){
                var nl=p.indexOf('\n'),lang=nl>=0?p.slice(0,nl).trim():'',code=nl>=0?p.slice(nl+1):p;
                out+='<div class="code"><div class="codehead"><span>'+esc(lang||'code')+'</span><button type="button" class="copy">Sao chép</button></div><pre>'+esc(code.replace(/\n$/,''))+'</pre></div>';
              }else if(p.trim()){
                out+='<div class="p">'+esc(p.trim()).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')+'</div>';
              }
            });
            return out;
          }
          function colorOf(role){
            if(role==='W1')return 'var(--c-w1)';
            if(role==='W2')return 'var(--c-w2)';
            if(role==='W3')return 'var(--c-w3)';
            if(role==='Planner')return 'var(--c-plan)';
            if(role==='Tích hợp')return 'var(--c-int)';
            return 'var(--c-main)';
          }
          function keepScroll(){var nearEnd=stream.scrollHeight-stream.scrollTop-stream.clientHeight<160;if(nearEnd)stream.scrollTop=stream.scrollHeight}

          /* theme */
          (function(){
            var t=null;try{t=localStorage.getItem('xa-theme')}catch(e){}
            if(t)document.documentElement.setAttribute('data-theme',t);
            $('#theme').onclick=function(){
              var cur=document.documentElement.getAttribute('data-theme');
              if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
              var nx=cur==='dark'?'light':'dark';
              document.documentElement.setAttribute('data-theme',nx);
              try{localStorage.setItem('xa-theme',nx)}catch(e){}
            };
          })();

          /* side panel */
          var panel=$('#panel');
          $('#menu').onclick=function(){panel.classList.toggle('open')};
          document.querySelectorAll('.tabs button').forEach(function(b){
            b.onclick=function(){
              document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});
              ['models','keys','files'].forEach(function(n){$('#pane-'+n).hidden=(n!==b.dataset.tab)});
              if(b.dataset.tab==='files')loadFiles();
            };
          });
          function loadFiles(){
            fetch('/api/files').then(function(r){return r.json()}).then(function(r){$('#fileList').textContent=r.files||'(trống)'});
          }
          $('#loadFiles').onclick=loadFiles;
          var allModels=[];
          $('#loadModels').onclick=function(){
            var box=$('#modelList');box.innerHTML='<div class="empty">Đang tải…</div>';
            fetch('/api/models').then(function(r){return r.json()}).then(function(r){
              if(r.error){box.innerHTML='<div class="note">'+esc(r.error)+'</div>';return}
              allModels=r.data||r.models||(Array.isArray(r)?r:[]);
              $('#filter').hidden=false;renderModels('');
            }).catch(function(e){box.innerHTML='<div class="note">'+esc(e)+'</div>'});
          };
          $('#filter').oninput=function(e){renderModels(e.target.value)};
          function priceOf(m){
            var p=m.pricing;
            if(p&&typeof p==='object'){var k=Object.keys(p);if(k.length)return k.map(function(x){return x+': '+p[x]}).join(', ')}
            var ks=['input_price','output_price','prompt_price','completion_price','price'];
            return ks.filter(function(k){return m[k]!=null}).map(function(k){return k+': '+m[k]}).join(', ');
          }
          function renderModels(f){
            f=(f||'').toLowerCase();
            var list=allModels.filter(function(m){return String(m.id||m.name).toLowerCase().indexOf(f)>=0});
            $('#modelList').innerHTML='<div class="empty">'+list.length+'/'+allModels.length+' model</div>'+list.map(function(m){
              var id=m.id||m.name,pos=order.indexOf(id),pr=priceOf(m);
              return '<div class="row"><span class="id">'+esc(id)+'</span>'+(pos>=0?'<span class="badge" title="Thứ tự ưu tiên">#'+(pos+1)+'</span>':'')+'<span class="meta">'+esc(pr||'')+'</span></div>';
            }).join('');
          }

          /* stats */
          function refresh(){
            return fetch('/api/stats').then(function(r){return r.json()}).then(function(r){
              var s=r.stats;order=Array.isArray(r.model)?r.model:[r.model];
              $('#ws').textContent=r.workspace;$('#ws').title=r.workspace;
              $('#chips').innerHTML=
                '<span class="chip"><b>'+s.requests+'</b>request</span>'+
                (s.prompt?'<span class="chip" title="Phần token vào được API cache lại"><b>'+Math.round(100*(s.cached_prompt||0)/s.prompt)+'%</b>cache API</span>':'')+
                (s.saved_chars?'<span class="chip" title="Ước tính từ ký tự đã nén khỏi lịch sử"><b>~'+fmt(Math.round(s.saved_chars/3.5))+'</b>token đã nén</span>':'')+
                '<span class="chip opt"><b>'+fmt(s.prompt)+'</b>vào</span>'+
                '<span class="chip opt"><b>'+fmt(s.completion)+'</b>ra</span>';
              $('#dots').innerHTML=r.keys.map(function(k){return '<i class="'+(k.state==='ok'?'':(k.state.indexOf('tạm')===0?'wait':'bad'))+'" title="'+esc(k.key+' – '+k.state)+'"></i>'}).join('');
              $('#keyList').innerHTML=(r.keys.length?r.keys.map(function(k){return '<div class="row"><span class="id">'+esc(k.key)+'</span><span class="meta">'+esc(k.state)+'</span></div>'}).join(''):'<div class="empty">Chưa có key.</div>');
              $('#order').innerHTML=order.map(function(m,i){return '<div class="row"><span class="badge">#'+(i+1)+'</span><span class="id">'+esc(m)+'</span></div>'}).join('');
            }).catch(function(){});
          }

          /* agent stream */
          var ctx=null;
          function addMsg(target,role,model,text,cached){
            var m=el('div','msg');m.style.setProperty('--c',colorOf(role));
            var inLane=!!target.closest('.lane');
            m.innerHTML=(inLane?'':'<div class="who"><b>'+esc(role)+'</b>'+(model?'<span>'+esc(model)+'</span>':'')+(cached?'<span class="cache">cache</span>':'')+'</div>')+md(text);
            target.appendChild(m);return m;
          }
          function laneFor(n){
            if(!ctx.lanes){ctx.lanes=el('div','lanes');ctx.flow.appendChild(ctx.lanes);ctx.laneEls={}}
            if(!ctx.laneEls[n]){
              var role='W'+n,l=el('div','lane');l.style.setProperty('--c',colorOf(role));
              l.innerHTML='<div class="lh"><b>'+role+'</b><span class="m"></span><span class="st">đang chạy</span></div><div class="lb"></div>';
              ctx.lanes.appendChild(l);ctx.laneEls[n]=l;
            }
            return ctx.laneEls[n];
          }
          function finishLanes(){
            if(!ctx||!ctx.laneEls)return;
            Object.keys(ctx.laneEls).forEach(function(k){var l=ctx.laneEls[k];if(!l.classList.contains('done')){l.classList.add('done');$('.st',l).textContent='xong'}});
          }
          function targetFor(role){
            var m=/^W(\d)$/.exec(role);
            if(m){var l=laneFor(m[1]);return {box:$('.lb',l),lane:l}}
            finishLanes();return {box:ctx.flow,lane:null};
          }
          function handle(o){
            var parts=String(o.who||'Main').split('·'),role=parts[0],model=parts[1]||'';
            if(o.type==='text'){
              var t=targetFor(role);
              if(t.lane&&model)$('.m',t.lane).textContent=model;
              addMsg(t.box,role,model,o.text,o.cached);
            }else if(o.type==='tool'){
              var t2=targetFor(role),d=el('details','tool run');d.style.setProperty('--c',colorOf(role));
              d.innerHTML='<summary><span class="tn">'+esc(o.name)+'</span><span class="ta">'+esc(o.args)+'</span></summary><pre>Đang chạy…</pre>';
              t2.box.appendChild(d);ctx.tools[role]=d;
            }else if(o.type==='result'){
              var d2=ctx.tools[role];
              if(d2){d2.classList.remove('run');$('pre',d2).textContent=o.text}
            }else if(o.type==='error'){
              finishLanes();ctx.flow.appendChild(el('div','note','<b>Lỗi:</b> '+esc(o.text)));
            }else if(o.type==='done'){
              finishLanes();
            }
            keepScroll();
          }
          function setBusy(b){runBtn.hidden=b;stopBtn.hidden=!b;q.disabled=b;if(!b)q.focus()}

          function send(text){
            text=(text||'').trim();if(!text||ctrl)return;
            var hello=$('#hello');if(hello)hello.remove();
            var turn=el('div','turn');turn.appendChild(el('div','user',esc(text)));
            var flow=el('div','flow');turn.appendChild(flow);inner.appendChild(turn);
            ctx={flow:flow,lanes:null,laneEls:null,tools:{}};
            stream.scrollTop=stream.scrollHeight;
            q.value='';autosize();setBusy(true);
            ctrl=new AbortController();
            var mode=$('input[name=mode]:checked').value;
            fetch('/api/chat',{method:'POST',signal:ctrl.signal,body:JSON.stringify({sid:sid,message:text,mode:mode})}).then(function(r){
              var rd=r.body.getReader(),dc=new TextDecoder(),buf='';
              function pump(){
                return rd.read().then(function(x){
                  if(x.done)return;
                  buf+=dc.decode(x.value,{stream:true});var i;
                  while((i=buf.indexOf('\n'))>=0){
                    var line=buf.slice(0,i);buf=buf.slice(i+1);
                    if(line){try{handle(JSON.parse(line))}catch(e){}}
                  }
                  return pump();
                });
              }
              return pump();
            }).catch(function(e){
              if(e&&e.name==='AbortError')flow.appendChild(el('div','note','Đã dừng xem kết quả. Server có thể còn chạy nốt bước hiện tại.'));
              else flow.appendChild(el('div','note','<b>Mất kết nối:</b> '+esc(e)));
            }).then(function(){finishLanes();ctrl=null;setBusy(false);refresh()});
          }
          $('#composer').onsubmit=function(e){e.preventDefault();send(q.value)};
          stopBtn.onclick=function(){if(ctrl)ctrl.abort()};
          q.addEventListener('keydown',function(e){
            if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(q.value)}
          });
          function autosize(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,200)+'px'}
          q.addEventListener('input',autosize);
          document.querySelectorAll('.starts button').forEach(function(b){b.onclick=function(){q.value=b.textContent;autosize();q.focus()}});
          $('#new').onclick=function(){
            if(ctrl)return;
            fetch('/api/reset',{method:'POST',body:JSON.stringify({sid:sid})}).then(function(){location.reload()});
          };
          document.addEventListener('click',function(e){
            var b=e.target.closest&&e.target.closest('.copy');
            if(!b)return;
            var pre=b.closest('.code').querySelector('pre');
            navigator.clipboard.writeText(pre.textContent).then(function(){b.textContent='Đã chép';setTimeout(function(){b.textContent='Sao chép'},1200)});
          });
          document.addEventListener('click',function(e){if(panel.classList.contains('open')&&!panel.contains(e.target)&&e.target.id!=='menu')panel.classList.remove('open')});

          refresh();
          })();
          </script>
          </body>
          </html>
          XAGENT_EOF_I
          cat > config.json <<'XAGENT_EOF_C'
          {
            "base_url": "https://api.xkiro.com/v1",
            "max_steps": 30,
            "temperature": 0,
            "allow_commands": true
          }
          XAGENT_EOF_C

      - name: Nhúng key vào exe
        shell: python
        run: |
          import os, re
          raw = os.environ.get("KEYS_SECRET", "").strip() or os.environ["KEYS_DEFAULT"]
          keys = [k for k in re.split(r"[\s,]+", raw) if k]
          open("embedded_keys.py", "w").write("KEYS = " + repr(keys) + "\n")
          print(f"Nhúng {len(keys)} key")

      - name: Smoke test
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          import server as s
          assert len(s.POOL.keys) > 0, "không có key"
          try:
              s.t_read_file("../x"); raise SystemExit("sandbox FAIL")
          except s.Denied:
              print("sandbox OK,", len(s.POOL.keys), "key")

      - name: Build exe
        run: pyinstaller --onefile --name XAgent --hidden-import embedded_keys --add-data "index.html;." server.py

      - name: Package
        shell: bash
        run: |
          mkdir -p out/XAgent/workspace
          cp dist/XAgent.exe config.json out/XAgent/
          cd out && 7z a ../XAgent-windows.zip XAgent

      - uses: actions/upload-artifact@v4
        with:
          name: XAgent-windows
          path: XAgent-windows.zip

      - name: Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XAgent-windows.zip
          draft: true
