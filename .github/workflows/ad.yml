name: Build XAgent exe

# Toàn bộ code (server, giao diện, config, key) nằm trong file này.
# Chỉ cần 1 file duy nhất: .github/workflows/build.yml

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Ưu tiên secret XKIRO_KEYS nếu có, không thì dùng KEYS_DEFAULT bên dưới.
  KEYS_SECRET: ${{ secrets.XKIRO_KEYS }}
  KEYS_DEFAULT: >-
    sk-xt-e697f2849b0a5c243153328bf4aec7f94dab928140e37a21
    sk-xt-dd51a0616e5ac92119e494c0b4357925e1f3922fba4a018a
    sk-xt-d9f597a39e064fc7b0f66b7ffbfca04d521bb94f7abe260e
    sk-xt-9852d8127da6dc8caaff94c9845fc1354bed6f68b299b01d
    sk-xt-e3c24b1b7b563839f1aebd30467270b543c85bac33a43991
    sk-xt-730f5daa0cd5964613d3a154b98b52202b7a4604ed1046f0
  # GLM (z.ai) và Agnes: ưu tiên secret ZAI_KEYS / AGNES_KEYS nếu có.
  ZAI_SECRET: ${{ secrets.ZAI_KEYS }}
  AGNES_SECRET: ${{ secrets.AGNES_KEYS }}
  ZAI_DEFAULT: >-
    380f36297e7343fd86fa7cba3094df43.Q1ExqNUrFEkke2aM
    f57903d148aa45128665377bb290de18.5cw13jsXfR0Jlm71
    135cf879fca84ff5873a196544136ab7.0oHIJJaN1xw7PdAW
    776a4f5866854425ac96e2bfff1bb269.gvAjHbYnevnjJjrz
    94d9d4b7579c435f8ac6e615c5761737.LaypNeT9pVPkZwfl
  AGNES_DEFAULT: >-
    sk-wO4ZfAmRQCKu1PE9byo6DpF0u3vRSrRpoQAUZ0B4UdD2FSUB
    sk-LysTVviWtaO4KVUFxERGPJpCkof9d5ehDDe0W5dwgJPstey1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - name: Tạo source (server.py, index.html, config.json)
        shell: bash
        run: |
          cat > server.py <<'XAGENT_EOF_S'
          #!/usr/bin/env python3
          """XAgent - auto build workflow agent.
          Chạy tại http://127.0.0.1:3000, chỉ thao tác trong thư mục ./workspace
          Không cần cài thêm thư viện (chỉ stdlib) nên đóng gói exe rất gọn.
          """
          import hashlib, json, os, re, subprocess, sys, threading, time, uuid
          import urllib.request, urllib.error
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          # ---------- đường dẫn ----------
          FROZEN = getattr(sys, "frozen", False)
          BASE = os.path.dirname(sys.executable) if FROZEN else os.path.dirname(os.path.abspath(__file__))
          RES = getattr(sys, "_MEIPASS", BASE)
          WS = os.path.realpath(os.path.join(BASE, "workspace"))
          CACHE_DIR = os.path.join(BASE, ".cache")
          os.makedirs(WS, exist_ok=True)
          os.makedirs(CACHE_DIR, exist_ok=True)

          # ---------- cấu hình ----------
          CFG = {
              "base_url": "https://api.xkiro.com/v1",
              # Danh sách model, thứ tự ưu tiên. Model đầu = planner + tích hợp. Lỗi thì tự chuyển model kế tiếp.
              # glm-4.5-flash (z.ai) và agnes-2.5-flash / agnes-2.0-flash (Agnes, free) chạy qua provider riêng (xem EXTRA).
              "models": ["qwen/qwen3.8-max:free", "qwen/qwen3.7-max:free", "qwen/qwen3-coder-plus:free",
                         "mistralai/devstral-medium", "mistralai/codestral-2508", "qwen/qwen3.6-plus:free",
                         "moonshotai/kimi-k3-agent", "glm-4.5-flash", "agnes-2.5-flash", "agnes-2.0-flash"],
              # 3 worker chạy song song khi việc khó
              "workers": ["qwen/qwen3.8-max:free", "qwen/qwen3.7-max:free", "mistralai/devstral-medium"],
              "worker_steps": 0,           # 0 = không giới hạn số bước; chỉ giới hạn thời gian mỗi tool (tool_timeout)
              "max_steps": 0,              # 0 = không giới hạn số bước
              "temperature": 0,
              "allow_commands": True,
              "command_timeout": 180,      # tối đa 3 phút mỗi lệnh; quá giờ thì kill + bỏ qua + báo AI
              "tool_timeout": 180,         # tối đa 3 phút mỗi lần gọi tool (chốt chặn chung)
              "max_tool_output": 4000,     # cắt output tool để tiết kiệm token
              "max_read": 8000,            # tối đa ký tự mỗi lần read_file (đọc tiếp bằng start/end)
              "compact_chars": 20000,      # lịch sử vượt ngưỡng này thì nén phần cũ (1 lần/đợt để giữ cache API)
              "plan_min_chars": 160,       # chế độ Tự động: yêu cầu ngắn hơn thì bỏ bước planner
              "host": "127.0.0.1",
              "port": 3000,
          }
          cfg_path = os.path.join(BASE, "config.json")
          if os.path.exists(cfg_path):
              with open(cfg_path, encoding="utf-8") as f:
                  CFG.update(json.load(f))


          def load_keys():
              p = os.path.join(BASE, "keys.txt")
              keys = []
              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f:
                      for line in f:
                          line = line.split("#")[0].strip()
                          keys += line.split()
              keys += [k for k in os.environ.get("XKIRO_KEYS", "").split(",") if k.strip()]
              try:  # key được nhúng sẵn vào exe lúc build (do build.yml sinh ra)
                  import embedded_keys
                  keys += list(embedded_keys.KEYS)
              except ImportError:
                  pass
              return list(dict.fromkeys(keys))


          # ---------- pool key: dùng hết key này sang key khác ----------
          class KeyPool:
              def __init__(self, keys):
                  self.keys = keys
                  self.dead = {}      # key -> (until_ts | None=vĩnh viễn, lý do)
                  self.i = 0
                  self.lock = threading.Lock()

              def get(self):
                  with self.lock:
                      now = time.time()
                      for _ in range(len(self.keys)):
                          k = self.keys[self.i % len(self.keys)]
                          d = self.dead.get(k)
                          if d is None or (d[0] is not None and d[0] < now):
                              self.dead.pop(k, None)
                              self.i += 1  # xoay vòng để 3 worker dùng key khác nhau
                              return k
                          self.i += 1
                      return None

              def mark(self, key, permanent, reason, cooldown=60):
                  with self.lock:
                      self.dead[key] = (None if permanent else time.time() + cooldown, reason)
                      self.i += 1

              def status(self):
                  with self.lock:
                      out = []
                      for k in self.keys:
                          d = self.dead.get(k)
                          out.append({"key": k[:9] + "…" + k[-4:],
                                      "state": "ok" if not d else ("hết/lỗi: " + d[1] if d[0] is None else "tạm nghỉ: " + d[1])})
                      return out


          POOL = KeyPool(load_keys())


          def _emb(name):
              try:
                  import embedded_keys
                  return list(getattr(embedded_keys, name, []))
              except ImportError:
                  return []


          # GLM (z.ai) và Agnes: khác base_url + key với xkiro nên có pool key riêng
          EXTRA = {
              "glm-4.5-flash": {"base_url": "https://api.z.ai/api/paas/v4", "model": "glm-4.5-flash",
                                "extra": {"thinking": {"type": "disabled"}}, "pool": KeyPool(_emb("ZAI_KEYS"))},
              "agnes-2.5-flash": {"base_url": "https://apihub.agnes-ai.com/v1", "model": "agnes-2.5-flash",
                                  "extra": {}, "pool": KeyPool(_emb("AGNES_KEYS"))},
              "agnes-2.0-flash": {"base_url": "https://apihub.agnes-ai.com/v1", "model": "agnes-2.0-flash",
                                  "extra": {}, "pool": KeyPool(_emb("AGNES_KEYS"))},
          }
          STATS = {"requests": 0, "cache_hits": 0, "prompt": 0, "completion": 0, "cached_prompt": 0, "saved_chars": 0}
          STATS_LOCK = threading.Lock()


          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 XAgent/1.0"


          def api_request(path, payload=None, method="POST", prov=None):
              """Gọi API, tự đổi key khi 401/402/403/429/5xx."""
              pool = prov["pool"] if prov else POOL
              base = prov["base_url"] if prov else CFG["base_url"]
              if not pool.keys:
                  raise RuntimeError("Chưa có key. Điền key vào keys.txt (mỗi key 1 dòng).")
              last = "unknown"
              for _ in range(len(pool.keys) * 2 + 1):
                  key = pool.get()
                  if key is None:
                      why = "; ".join(f"{k['key']} {k['state']}" for k in pool.status())
                      raise RuntimeError("Tất cả key đều hết hạn mức/lỗi: " + (why if last == "unknown" else last))
                  data = json.dumps(payload).encode() if payload is not None else None
                  req = urllib.request.Request(base.rstrip("/") + path, data=data, method=method,
                                               headers={"Authorization": "Bearer " + key,
                                                        "Content-Type": "application/json",
                                                        "Accept": "application/json",
                                                        # Cloudflare chặn User-Agent mặc định của urllib (lỗi 1010)
                                                        "User-Agent": UA})
                  try:
                      with urllib.request.urlopen(req, timeout=300) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      body = e.read().decode(errors="replace")[:300]
                      last = f"HTTP {e.code} {body}"
                      if "1010" in body or "cloudflare" in body.lower():
                          raise RuntimeError("Cloudflare chặn request (error 1010), không phải lỗi key: " + body[:120])
                      if e.code in (401, 402, 403):
                          pool.mark(key, True, f"HTTP {e.code}")
                      elif e.code == 429 or e.code >= 500:
                          pool.mark(key, False, f"HTTP {e.code}", 45)
                      else:
                          raise RuntimeError(last)
                  except Exception as e:  # mạng
                      last = str(e)
                      time.sleep(1)
              raise RuntimeError("Hết lần thử: " + last)


          # ---------- cache phản hồi (request y hệt -> 0 token) ----------
          def cache_get(h):
              p = os.path.join(CACHE_DIR, h + ".json")
              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f:
                      return json.load(f)


          def cache_put(h, v):
              with open(os.path.join(CACHE_DIR, h + ".json"), "w", encoding="utf-8") as f:
                  json.dump(v, f, ensure_ascii=False)


          def chat_call(messages, model, tools=None):
              prov = EXTRA.get(model)
              payload = {"model": prov["model"] if prov else model, "messages": messages, "temperature": CFG["temperature"]}
              if prov:
                  payload.update(prov["extra"])
              if tools:
                  payload["tools"] = tools
              h = hashlib.sha256(json.dumps(payload, sort_keys=True).encode()).hexdigest()
              hit = cache_get(h) if CFG["temperature"] == 0 else None
              with STATS_LOCK:
                  STATS["requests"] += 1
                  if hit:
                      STATS["cache_hits"] += 1
              if hit:
                  return hit, True
              res = api_request("/chat/completions", payload, prov=prov)
              ch = res.get("choices") if isinstance(res, dict) else None
              if not ch or not isinstance(ch[0], dict) or not ch[0].get("message"):
                  raise RuntimeError("Phản hồi không hợp lệ từ " + model + ": " + str(res)[:200])
              u = res.get("usage") or {}
              cached = (u.get("prompt_tokens_details") or {}).get("cached_tokens") or u.get("cached_tokens") or 0
              with STATS_LOCK:
                  STATS["prompt"] += u.get("prompt_tokens", 0)
                  STATS["completion"] += u.get("completion_tokens", 0)
                  STATS["cached_prompt"] += cached
              if CFG["temperature"] == 0:
                  cache_put(h, res)
              return res, False


          # ---------- tools trong workspace ----------
          class Denied(Exception):
              pass


          def safe(p):
              full = os.path.realpath(os.path.join(WS, p))
              try:
                  if os.path.commonpath([full, WS]) != WS:
                      raise ValueError
              except ValueError:
                  raise Denied(f"Từ chối: '{p}' nằm ngoài workspace")
              return full


          def clip(s, n=None):
              n = n or CFG["max_tool_output"]
              return s if len(s) <= n else s[: n // 2] + f"\n…[cắt {len(s) - n} ký tự]…\n" + s[-n // 2:]


          def t_list_files(path="."):
              base = safe(path)
              out = []
              for root, dirs, files in os.walk(base):
                  dirs[:] = [d for d in dirs if d not in (".git", "node_modules", "__pycache__")]
                  for fn in files:
                      out.append(os.path.relpath(os.path.join(root, fn), WS).replace("\\", "/"))
                  if len(out) > 400:
                      break
              return "\n".join(sorted(out)) or "(trống)"


          def clip_tail(s, head=800, tail=2200):
              """Output lệnh: lỗi thường nằm cuối nên giữ nhiều phần đuôi."""
              return s if len(s) <= head + tail + 80 else s[:head] + f"\n…[cắt {len(s) - head - tail} ký tự]…\n" + s[-tail:]


          def t_read_file(path, start=None, end=None, _cache=None):
              f = safe(path)
              st = os.stat(f)
              s0 = int(start) if start else None
              e0 = int(end) if end else None
              sig = (st.st_mtime, st.st_size, s0, e0)
              c = _cache if _cache is not None else {}
              if c.get((f, s0, e0)) == sig:
                  return "[file không đổi từ lần đọc trước, xem lại nội dung ở trên]"
              with open(f, encoding="utf-8", errors="replace") as fh:
                  lines = fh.read().splitlines()
              c[(f, s0, e0)] = sig
              lo = (s0 or 1) - 1
              hi = e0 or len(lines)
              out, n = [], 0
              for i in range(lo, min(hi, len(lines))):
                  n += len(lines[i]) + 1
                  if n > CFG["max_read"]:
                      return "\n".join(out) + f"\n…[đã hiện dòng {lo + 1}-{i}/{len(lines)}; đọc tiếp bằng start={i + 1}]"
                  out.append(lines[i])
              tail = f"\n[dòng {lo + 1}-{min(hi, len(lines))}/{len(lines)}]" if (s0 or e0) else ""
              return "\n".join(out) + tail


          def t_search_files(pattern, path="."):
              try:
                  rx = re.compile(pattern, re.I)
              except re.error as e:
                  return f"regex lỗi: {e}"
              base = safe(path)
              hits = []
              for root, dirs, files in os.walk(base):
                  dirs[:] = [d for d in dirs if d not in (".git", "node_modules", "__pycache__")]
                  for fn in files:
                      fp = os.path.join(root, fn)
                      try:
                          if os.path.getsize(fp) > 1_000_000:
                              continue
                          with open(fp, encoding="utf-8") as fh:
                              for i, line in enumerate(fh, 1):
                                  if rx.search(line):
                                      hits.append(f"{os.path.relpath(fp, WS).replace(chr(92), '/')}:{i}: {line.strip()[:160]}")
                                      if len(hits) >= 40:
                                          return "\n".join(hits) + "\n…[đủ 40 kết quả, thu hẹp pattern]"
                      except (UnicodeDecodeError, OSError):
                          continue
              return "\n".join(hits) or "(không thấy)"


          def t_write_file(path, content):
              f = safe(path)
              os.makedirs(os.path.dirname(f), exist_ok=True)
              with open(f, "w", encoding="utf-8", newline="\n") as fh:
                  fh.write(content)
              return f"đã ghi {path} ({len(content)} ký tự)"


          def t_edit_file(path, old, new):
              f = safe(path)
              with open(f, encoding="utf-8") as fh:
                  s = fh.read()
              if s.count(old) != 1:
                  return f"lỗi: 'old' xuất hiện {s.count(old)} lần (cần đúng 1)"
              with open(f, "w", encoding="utf-8", newline="\n") as fh:
                  fh.write(s.replace(old, new))
              return "đã sửa " + path


          def t_delete_file(path):
              f = safe(path)
              if f == WS:
                  raise Denied("Không được xoá workspace")
              if os.path.isdir(f):
                  import shutil
                  shutil.rmtree(f)
              else:
                  os.remove(f)
              return "đã xoá " + path


          BAD_CMD = re.compile(r"\b(shutdown|reboot|format|diskpart|reg(\.exe)?\s|netsh|schtasks|sc\s+(stop|delete)|"
                               r"curl|wget|Invoke-WebRequest|Invoke-Expression|iex|powershell\s+-e|mklink|takeown|icacls)\b", re.I)


          def timeout_msg(what, secs):
              return (f"[HẾT THỜI GIAN] {what} chạy quá {secs} giây nên hệ thống đã dừng và BỎ QUA nó. "
                      "Đừng chạy lại y hệt. Nếu là server/vòng lặp vô hạn hoặc chờ nhập liệu thì đừng chạy trực tiếp; "
                      "hãy kiểm tra bằng cách khác (đọc code, chạy lệnh ngắn tự kết thúc) rồi làm bước tiếp theo.")


          def kill_tree(p):
              """Giết cả cây tiến trình (shell=True trên Windows chỉ kill cmd.exe, python con vẫn chạy và giữ pipe)."""
              try:
                  if os.name == "nt":
                      subprocess.run(["taskkill", "/F", "/T", "/PID", str(p.pid)], capture_output=True, timeout=10)
                  else:
                      p.kill()
              except Exception:
                  pass


          def run_limited(fn, name):
              """Chốt chặn chung: tool nào quá tool_timeout thì bỏ qua và báo lại cho AI."""
              box = {}

              def go():
                  try:
                      box["v"] = fn()
                  except BaseException as e:
                      box["e"] = e

              t = threading.Thread(target=go, daemon=True)
              t.start()
              t.join(CFG["tool_timeout"])
              if t.is_alive():
                  return timeout_msg(f"tool {name}", CFG["tool_timeout"])
              if "e" in box:
                  raise box["e"]
              return box["v"]


          def t_run_command(command):
              if not CFG["allow_commands"]:
                  raise Denied("run_command đang tắt trong config.json")
              if BAD_CMD.search(command):
                  raise Denied("Lệnh bị chặn bởi bộ lọc an toàn")
              for tok in re.split(r"[\s\"'=;&|<>]+", command):
                  if not tok:
                      continue
                  if ".." in tok.replace("\\", "/").split("/") or re.match(r"^([A-Za-z]:|[\\/]|~|%|\$)", tok):
                      if tok in ("/c", "/s", "/q", "/f"):
                          continue
                      safe(tok)  # đường dẫn tuyệt đối/.. phải nằm trong workspace
              env = {k: v for k, v in os.environ.items() if k.upper() in ("PATH", "SYSTEMROOT", "COMSPEC", "PATHEXT", "LANG")}
              env.update({"TEMP": WS, "TMP": WS, "HOME": WS, "USERPROFILE": WS})
              tmo = CFG["command_timeout"]
              p = subprocess.Popen(command, shell=True, cwd=WS, env=env, stdin=subprocess.DEVNULL,
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, errors="replace")
              try:
                  o, e = p.communicate(timeout=tmo)
                  return clip_tail(f"exit={p.returncode}\n{o}\n{e}")
              except subprocess.TimeoutExpired:
                  kill_tree(p)
                  try:
                      o, e = p.communicate(timeout=5)
                  except Exception:
                      o = e = ""
                  return timeout_msg(f"lệnh `{clip(command, 100)}`", tmo) + "\n" + clip_tail(f"{o}\n{e}", 300, 700)


          FUNCS = {"list_files": t_list_files, "read_file": t_read_file, "write_file": t_write_file,
                   "edit_file": t_edit_file, "search_files": t_search_files, "delete_file": t_delete_file, "run_command": t_run_command}


          def _tool(name, desc, props, req):
              return {"type": "function", "function": {"name": name, "description": desc,
                      "parameters": {"type": "object", "properties": {k: {"type": "string"} for k in props}, "required": req}}}


          # Tool + system prompt giữ CỐ ĐỊNH để provider cache được prefix
          TOOLS = [
              _tool("list_files", "Liệt kê file trong workspace", ["path"], []),
              _tool("read_file", "Đọc file (có thể chỉ đọc dòng start..end)", ["path", "start", "end"], ["path"]),
              _tool("search_files", "Tìm regex trong workspace, trả path:dòng:nội dung", ["pattern", "path"], ["pattern"]),
              _tool("write_file", "Tạo/ghi đè file", ["path", "content"], ["path", "content"]),
              _tool("edit_file", "Thay đúng 1 đoạn text trong file", ["path", "old", "new"], ["path", "old", "new"]),
              _tool("delete_file", "Xoá file/thư mục", ["path"], ["path"]),
              _tool("run_command", "Chạy lệnh shell (cwd = workspace) để build/test", ["command"], ["command"]),
              _tool("chat", "Nhắn cho worker khác khi chạy song song (to = W1/W2/W3 hoặc all) để phối hợp", ["to", "text"], ["to", "text"]),
          ]
          SYSTEM = ("Bạn là kỹ sư phần mềm tự động. Làm việc HOÀN TOÀN trong workspace bằng tool, đường dẫn tương đối. "
                    "Quy trình: kế hoạch ngắn -> code -> chạy build/test -> sửa lỗi -> lặp tới khi chạy được. "
                    "Ưu tiên search_files hoặc read_file với start/end thay vì đọc cả file; edit_file cho sửa nhỏ; không đọc lại file không đổi. "
                              "QUY TẮC CHẤT LƯỢNG: không bao giờ báo xong khi chưa CHẠY THỬ thật (build/test/chạy lệnh) và đọc kết quả; lỗi thì sửa rồi chạy lại, lặp tới khi chạy được. "
                    "Không bịa kết quả hay tên hàm/thư viện: không chắc thì đọc file hoặc chạy lệnh để kiểm tra. "
                    "Việc lớn thì chia bước nhỏ, xong bước nào kiểm tra bước đó. Một cách thất bại 2 lần thì ĐỔI cách khác, đừng lặp lại y hệt. "
                    "Code phải hoàn chỉnh, không để TODO/placeholder, có xử lý lỗi cơ bản. Khi quên hoặc lịch sử bị nén, đọc neuro.md. "
                    "Trả lời ngắn gọn bằng ngôn ngữ của người dùng. Khi xong, tóm tắt 3-5 dòng.")

          SESSIONS = {}

          # ---------- neuro.md: bộ nhớ riêng của từng chat (hệ thống tự ghi, agent mở ra đọc khi quên) ----------
          NEURO_LOCK = threading.Lock()
          NEURO_MAX = 40000


          def neuro_id(sid):
              return re.sub(r"[^A-Za-z0-9]", "", str(sid))[:12] or "chat"


          def neuro_rel(nid):
              return f"neuro/{nid}/neuro.md"


          def neuro_note(nid):
              return (f"\nBỘ NHỚ CHAT: file {neuro_rel(nid)} (trong workspace) ghi lại yêu cầu, file đã tạo/sửa, lệnh đã chạy và kết quả của chat này. "
                      "Hệ thống tự ghi, bạn chỉ cần đọc. Khi quên hoặc lịch sử bị nén, read_file file này trước khi làm tiếp.")


          def neuro_log(nid, who, text):
              if not nid:
                  return
              p = os.path.join(WS, "neuro", nid, "neuro.md")
              line = " ".join(str(text).split())
              with NEURO_LOCK:
                  try:
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      if not os.path.exists(p):
                          with open(p, "w", encoding="utf-8", newline="\n") as f:
                              f.write("# neuro.md - bộ nhớ chat\n\n")
                      with open(p, "a", encoding="utf-8", newline="\n") as f:
                          f.write(f"- [{time.strftime('%H:%M:%S')}] **{who}**: {line}\n")
                      if os.path.getsize(p) > NEURO_MAX:
                          with open(p, encoding="utf-8", errors="replace") as f:
                              body = f.read()
                          tail = body[-(NEURO_MAX * 3 // 4):]
                          tail = tail[tail.find("\n") + 1:]
                          with open(p, "w", encoding="utf-8", newline="\n") as f:
                              f.write("# neuro.md - bộ nhớ chat\n\n- …(đã lược bớt phần cũ)\n" + tail)
                  except OSError:
                      pass


          def neuro_tool(nid, who, name, raw, out):
              """Chỉ ghi thao tác làm thay đổi workspace; bỏ qua đọc/liệt kê cho đỡ nhiễu."""
              if name not in ("write_file", "edit_file", "delete_file", "run_command"):
                  return
              try:
                  a = json.loads(raw or "{}")
              except ValueError:
                  a = {}
              if name == "run_command":
                  first = (str(out).splitlines() or [""])[0]
                  neuro_log(nid, who, f"chạy `{clip(str(a.get('command', '')), 150)}` -> {first}")
              else:
                  neuro_log(nid, who, f"{name} {a.get('path', '')} -> {clip(str(out), 120)}")


          def short(m):
              return m.split("/")[-1].replace(":free", "")


          def call_with_fallback(messages, prefer, tools=None):
              """Thử model ưu tiên, lỗi thì lần lượt các model còn lại.
              Key xkiro hết -> bỏ qua các model xkiro nhưng vẫn thử GLM / Agnes."""
              order = [prefer] + [m for m in CFG["models"] if m != prefer]
              last = None
              main_dead = False
              for m in order:
                  if main_dead and m not in EXTRA:
                      continue
                  try:
                      res, hit = chat_call(messages, m, tools)
                      return res, hit, m
                  except RuntimeError as e:
                      last = e
                      if m not in EXTRA and ("Tất cả key" in str(e) or "Chưa có key" in str(e)):
                          main_dead = True
              raise last


          def _shrink_args(tc):
              """Nội dung file đã nằm trên đĩa, không cần giữ lại trong lịch sử."""
              fn = tc["function"]
              if fn["name"] not in ("write_file", "edit_file"):
                  return 0
              raw = fn.get("arguments") or "{}"
              try:
                  a = json.loads(raw)
              except ValueError:
                  return 0
              for key in ("content", "old", "new"):
                  v = a.get(key)
                  if isinstance(v, str) and len(v) > 200:
                      a[key] = f"[{len(v)} ký tự, xem lại bằng read_file]"
              new = json.dumps(a, ensure_ascii=False)
              fn["arguments"] = new
              return max(0, len(raw) - len(new))


          def compact(msgs, cache):
              """Khi lịch sử vượt ngưỡng, nén MỘT LẦN toàn bộ phần cũ (trừ 6 message cuối).
              Nén theo đợt để phần đầu prompt đứng yên giữa các lần nén -> cache của API vẫn trúng."""
              total = 0
              for m in msgs:
                  total += len(str(m.get("content") or ""))
                  for tc in m.get("tool_calls") or []:
                      total += len(tc["function"].get("arguments") or "")
              if total < CFG["compact_chars"]:
                  return
              saved = 0
              for m in msgs[1:-6]:
                  if m["role"] == "tool" and len(m["content"]) > 300:
                      saved += len(m["content"]) - 215
                      m["content"] = m["content"][:200] + "\n…[đã nén, xem neuro.md hoặc đọc lại bằng tool]"
                  elif m["role"] == "assistant":
                      for tc in m.get("tool_calls") or []:
                          saved += _shrink_args(tc)
              if saved:
                  cache.clear()
                  with STATS_LOCK:
                      STATS["saved_chars"] += saved


          class Board:
              """Bảng tin chung của các worker chạy song song: nhắn riêng (to=W2) hoặc cho tất cả (to=ALL)."""

              def __init__(self, names):
                  self.names = names
                  self.msgs = []
                  self.counts = {}
                  self.lock = threading.Lock()

              def post(self, frm, to, text):
                  with self.lock:
                      self.msgs.append({"from": frm, "to": to, "text": text})
                      self.counts[frm] = self.counts.get(frm, 0) + 1

              def fetch(self, who, seen):
                  """Tin mới từ lần đọc trước, của người khác gửi cho mình hoặc cho tất cả."""
                  with self.lock:
                      items = [m for m in self.msgs[seen:] if m["from"] != who and m["to"] in (who, "ALL")]
                      return items, len(self.msgs)

              def digest(self):
                  with self.lock:
                      if not self.msgs:
                          return ""
                      return "\n\nTrao đổi giữa các worker:\n" + clip("\n".join(
                          f"{m['from']} -> {m['to']}: {m['text']}" for m in self.msgs), 2000)


          def do_chat(board, who, args, emit, sid):
              if board is None:
                  return "Không có worker nào khác trong lượt này, không cần chat."
              to = str(args.get("to", "all")).strip().upper() or "ALL"
              text = str(args.get("text", "")).strip()
              if not text:
                  return "lỗi: thiếu nội dung"
              if to != "ALL" and to not in board.names:
                  return f"lỗi: 'to' phải là {', '.join(board.names)} hoặc all"
              if to == who:
                  return "lỗi: không nhắn cho chính mình"
              if board.counts.get(who, 0) >= CFG.get("chat_limit", 8):
                  return "Bạn đã dùng hết lượt chat. Chat không thay cho việc: hãy tập trung làm phần của mình."
              board.post(who, to, text)
              emit({"type": "chat", "who": who, "to": to, "text": text})
              neuro_log(sid, who, f"chat -> {to}: {clip(text, 200)}")
              return f"đã gửi cho {to}"


          STOP = {}  # nid -> True khi người dùng bấm Dừng; mọi agent kiểm tra ở đầu mỗi bước


          def chat_inbox(new):
              return ("[CHAT từ worker khác]\n" + "\n".join(
                  f"- {m['from']}{' (riêng cho bạn)' if m['to'] != 'ALL' else ''}: {m['text']}" for m in new) +
                  "\n(Nếu họ hỏi hoặc cần thống nhất thì TRẢ LỜI bằng chat(to=người gửi) ngắn gọn, rồi tiếp tục phần việc của bạn. Đừng chỉ chat.)")


          def agent_loop(msgs, model, emit, who, max_steps, sid=None, board=None):
              """Vòng lặp agent: gọi model -> chạy tool -> lặp. Trả về câu trả lời cuối."""
              cache = {}
              last = ""
              seen = 0
              last_key, streak = None, 0
              for _ in (range(max_steps) if max_steps else iter(int, 1)):  # max_steps=0 -> lặp tới khi AI tự kết thúc
                  if sid and STOP.get(sid):
                      emit({"type": "text", "who": who, "text": "(đã dừng theo yêu cầu)"})
                      return last
                  compact(msgs, cache)
                  if board:  # tin nhắn mới từ worker khác tự hiện vào hội thoại
                      new, seen = board.fetch(who, seen)
                      if new:
                          msgs.append({"role": "user", "content": chat_inbox(new)})
                  res, hit, used = call_with_fallback(msgs, model, TOOLS)
                  m = res["choices"][0]["message"]
                  tag = f"{who}·{short(used)}"
                  entry = {"role": "assistant", "content": m.get("content") or ""}
                  if m.get("tool_calls"):
                      entry["tool_calls"] = m["tool_calls"]
                  msgs.append(entry)
                  if m.get("content"):
                      last = m["content"]
                      emit({"type": "text", "who": tag, "text": m["content"], "cached": hit})
                  if not m.get("tool_calls"):
                      if board:
                          late, seen = board.fetch(who, seen)
                          if late:
                              msgs.append({"role": "user", "content": chat_inbox(late)})
                              continue
                      if last:
                          neuro_log(sid, who, "kết quả: " + clip(last, 600))
                      return last
                  stuck = False
                  for tc in m["tool_calls"]:
                      name = tc["function"]["name"]
                      key = name + "|" + (tc["function"].get("arguments") or "")
                      streak = streak + 1 if key == last_key else 1  # chỉ đếm khi gọi y hệt LIÊN TIẾP
                      last_key = key
                      try:
                          args = json.loads(tc["function"].get("arguments") or "{}")
                          emit({"type": "tool", "who": who, "name": name,
                                "args": clip(json.dumps(args, ensure_ascii=False), 400)})
                          if streak >= 6:
                              stuck = True
                              out = "[LẶP VÔ HẠN] Gọi y hệt 6 lần liền, hệ thống dừng bạn lại."
                          elif streak >= 3:
                              out = (f"[CẢNH BÁO LẶP] Bạn vừa gọi y hệt {streak} lần liền, không có tiến triển. "
                                     "Đã bỏ qua lần gọi này. Hãy ĐỔI cách: đọc lỗi kỹ, đọc lại file liên quan, sửa nguyên nhân gốc hoặc thử hướng khác.")
                          elif name == "chat":
                              out = do_chat(board, who, args, emit, sid)
                          elif name == "read_file":
                              out = run_limited(lambda: t_read_file(_cache=cache, **args), name)
                          else:
                              out = run_limited(lambda: FUNCS[name](**args), name)
                      except Denied as e:
                          out = str(e)
                      except Exception as e:
                          out = f"lỗi: {type(e).__name__}: {e}"
                      out = clip(str(out))
                      neuro_tool(sid, who, name, tc["function"].get("arguments"), out)
                      emit({"type": "result", "who": who, "text": clip(out, 600)})
                      msgs.append({"role": "tool", "tool_call_id": tc["id"], "content": out})
                  if stuck:
                      emit({"type": "text", "who": who, "text": "(dừng: AI lặp lại y hệt một thao tác quá nhiều lần)"})
                      return last
              emit({"type": "text", "who": who, "text": f"(dừng: đạt {max_steps} bước)"})
              return last


          PLAN_SYS = ("Bạn là kiến trúc sư phần mềm. Đánh giá yêu cầu và CHỈ trả về JSON, không giải thích. "
                      'Việc nhỏ/đơn giản: {"hard": false}. '
                      'Việc khó (nhiều module/file có thể làm độc lập): {"hard": true, "subtasks": '
                      '[{"title": "...", "goal": "mô tả chi tiết, nêu rõ file sẽ tạo/sửa"}]}. '
                      "Tối đa 3 subtask; mỗi subtask làm tập file KHÁC NHAU, không chồng chéo; "
                      "việc ghép nối để lại cho bước tích hợp.")
          WORKER_SYS = ("Bạn là 1 trong các worker song song trong cùng workspace. Chỉ làm đúng phần được giao, "
                        "chỉ tạo/sửa file của phần mình, không đụng file của worker khác. Có thể chạy lệnh để test phần mình. "
                        "Các worker nhắn nhau được bằng tool chat(to, text), to = W1/W2/W3 hoặc all. "
                        "Quy tắc: (1) việc đầu tiên là chat(to=all) báo ngắn file/hàm/endpoint API/định dạng dữ liệu/tên id,class bạn sẽ tạo; "
                        "(2) sau đó LÀM VIỆC của mình, chat không thay cho việc, tối đa 8 tin; "
                        "(3) tin của người khác tự hiện ra dưới dạng [CHAT từ worker khác]: đọc, điều chỉnh code cho khớp, và nếu họ hỏi hay cần thống nhất thì trả lời lại bằng chat; "
                        "(4) trước khi báo cáo xong, kiểm tra phần của mình đã khớp với những gì các worker khác đã báo. Mỗi tin ngắn gọn, đừng spam. "
                                  "Trước khi báo cáo phải chạy thử phần của mình (nếu chạy được) và sửa tới khi ổn; không để TODO/placeholder. "
                        "Xong thì báo cáo ngắn (<=8 dòng): file đã tạo/sửa, cách chạy, vấn đề còn tồn đọng.")


          REVIEW_SYS = ("Bạn là người kiểm tra độc lập (code review + QA), một cặp mắt thứ hai sau khi các worker và bước tích hợp đã xong. "
                        "Việc: đọc yêu cầu, xem workspace (neuro.md ghi lại lịch sử), CHẠY build/test thật, tìm lỗi, phần còn thiếu, chỗ các phần không khớp nhau "
                        "(tên hàm, endpoint, định dạng dữ liệu, đường dẫn file), rồi SỬA trực tiếp và chạy lại tới khi ổn. Không viết lại từ đầu, không đổi thứ đang chạy tốt. "
                        "Báo cáo 3-5 dòng: đã sửa gì, còn tồn đọng gì.")


          def make_plan(text, force):
              user = f"Yêu cầu:\n{text}\n\nFile hiện có trong workspace:\n{clip(t_list_files(), 800)}"
              if force:
                  user += "\n\nBẮT BUỘC chia thành 2-3 subtask."
              res, _, _ = call_with_fallback([{"role": "system", "content": PLAN_SYS},
                                              {"role": "user", "content": user}], CFG["models"][0])
              txt = res["choices"][0]["message"].get("content") or ""
              mm = re.search(r"\{.*\}", txt, re.S)
              if not mm:
                  return None
              try:
                  d = json.loads(mm.group(0))
              except ValueError:
                  return None
              subs = [x for x in (d.get("subtasks") or []) if isinstance(x, dict)]
              return subs[:3] if d.get("hard") and len(subs) >= 2 else None


          def run_swarm(text, subs, msgs, emit, workers=None, sid=None):
              titles = "\n".join(f"{i + 1}. {x.get('title', '')}" for i, x in enumerate(subs))
              emit({"type": "text", "who": "Planner", "text": f"Việc khó -> chia {len(subs)} phần chạy song song:\n{titles}"})
              results = [None] * len(subs)
              names = [f"W{k + 1}" for k in range(len(subs))]
              plan = "\n".join(f"{names[k]} - {x.get('title', '')}: {clip(str(x.get('goal', '')), 300)}" for k, x in enumerate(subs))
              board = Board(names)

              def others(i):
                  return ", ".join(n for n in names if n != names[i])

              def work(i, x):
                  model = (workers or CFG["workers"])[i % len(workers or CFG["workers"])]
                  wm = [{"role": "system", "content": WORKER_SYS},
                        {"role": "user", "content": f"Yêu cầu tổng: {text}\n\nKế hoạch chung (ai làm gì):\n{plan}\n\n"
                                                    f"Bạn là worker W{i + 1} (worker khác: {others(i)}). Nhiệm vụ: {x.get('title')}\n{x.get('goal')}\n\n"
                                                    "Chỉ tạo/sửa file thuộc phần của bạn. Việc đầu tiên: chat(to=all) báo ngắn "
                                                    "những gì bạn sẽ tạo, rồi LÀM VIỆC của mình (chat không thay cho việc)."}]
                  me = f"W{i + 1}"
                  for attempt in range(2):
                      try:
                          results[i] = agent_loop(wm, model, emit, me, CFG["worker_steps"], sid=sid, board=board) or "(không có báo cáo)"
                          break
                      except Exception as e:
                          err = f"{type(e).__name__}: {e}"
                          neuro_log(sid, me, "lỗi: " + clip(err, 200))
                          if attempt == 0:
                              model = next((m for m in CFG["models"] if m != model), model)
                              emit({"type": "text", "who": me, "text": f"({me} gặp lỗi: {err}) -> tự chạy lại bằng {short(model)}"})
                          else:
                              results[i] = f"LỖI: {err}"
                              emit({"type": "text", "who": me, "text": f"({me} dừng vì lỗi: {err})"})
                              board.post(me, "ALL", f"(tự động) {me} đã dừng vì lỗi, worker nào xong sớm thì đỡ phần của {me}")

              ths = [threading.Thread(target=work, args=(i, x), daemon=True) for i, x in enumerate(subs)]
              for t in ths:
                  t.start()
              for t in ths:
                  t.join()
              report = "\n\n".join(f"### Phần {i + 1}: {x.get('title')}\n{results[i]}" for i, x in enumerate(subs))
              msgs.append({"role": "user", "content":
                           "[HỆ THỐNG] Các worker đã xong. Báo cáo:\n" + report + board.digest() +
                           "\n\nHãy kiểm tra workspace, ghép nối các phần, chạy build/test, sửa lỗi, rồi tóm tắt."})
              agent_loop(msgs, CFG["models"][0], emit, "Tích hợp", CFG["max_steps"], sid=sid)
              if CFG.get("review", True) and not (sid and STOP.get(sid)):
                  rm = [{"role": "system", "content": REVIEW_SYS + (neuro_note(sid) if sid else "")},
                        {"role": "user", "content": f"Yêu cầu của người dùng:\n{text}\n\nHãy kiểm tra, chạy thử và sửa lỗi."}]
                  agent_loop(rm, CFG["models"][1] if len(CFG["models"]) > 1 else CFG["models"][0], emit, "Kiểm tra", CFG["max_steps"], sid=sid)


          def run_agent(sid, text, mode, emit, workers=None):
              workers = [w for w in (workers or []) if w in CFG["models"]] or None
              nid = neuro_id(sid)
              STOP.pop(nid, None)
              neuro_log(nid, "Người dùng", "Yêu cầu: " + clip(text, 800))
              msgs = SESSIONS.setdefault(sid, [{"role": "system", "content": SYSTEM + neuro_note(nid)}])
              msgs.append({"role": "user", "content": text})
              subs = None
              if mode == "swarm" or (mode == "auto" and len(text) >= CFG["plan_min_chars"]):
                  try:
                      subs = make_plan(text, mode == "swarm")
                  except Exception as e:
                      emit({"type": "text", "who": "Planner", "text": f"(bỏ qua chia việc: {e})"})
              if subs:
                  run_swarm(text, subs, msgs, emit, workers, nid)
              else:
                  agent_loop(msgs, CFG["models"][0], emit, "Main", CFG["max_steps"], sid=nid)
              emit({"type": "done", "stats": STATS})


          # ---------- HTTP ----------
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a):
                  pass

              def _json(self, obj, code=200):
                  b = json.dumps(obj, ensure_ascii=False).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)

              def do_GET(self):
                  if self.path in ("/", "/index.html"):
                      with open(os.path.join(RES, "index.html"), "rb") as f:
                          b = f.read()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Content-Length", str(len(b)))
                      self.end_headers()
                      self.wfile.write(b)
                  elif self.path == "/api/models":
                      try:
                          self._json(api_request("/models", method="GET"))
                      except Exception as e:
                          self._json({"error": str(e)}, 502)
                  elif self.path == "/api/stats":
                      self._json({"stats": STATS, "keys": POOL.status(), "model": CFG["models"], "workers": CFG["workers"], "workspace": WS})
                  elif self.path == "/api/files":
                      self._json({"files": t_list_files()})
                  else:
                      self._json({"error": "not found"}, 404)

              def do_POST(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  body = json.loads(self.rfile.read(n) or b"{}")
                  if self.path == "/api/stop":
                      STOP[neuro_id(body.get("sid", ""))] = True
                      return self._json({"ok": True})
                  if self.path == "/api/reset":
                      SESSIONS.pop(body.get("sid", ""), None)
                      return self._json({"ok": True})
                  if self.path != "/api/chat":
                      return self._json({"error": "not found"}, 404)
                  self.send_response(200)
                  self.send_header("Content-Type", "application/x-ndjson; charset=utf-8")
                  self.send_header("Cache-Control", "no-cache")
                  self.end_headers()

                  wl = threading.Lock()

                  def emit(o):
                      with wl:
                          self.wfile.write((json.dumps(o, ensure_ascii=False) + "\n").encode())
                          self.wfile.flush()
                  try:
                      run_agent(body.get("sid") or uuid.uuid4().hex, body.get("message", ""), body.get("mode", "auto"), emit, body.get("workers"))
                  except Exception as e:
                      try:
                          emit({"type": "error", "text": str(e)})
                      except Exception:
                          pass


          if __name__ == "__main__":
              srv = ThreadingHTTPServer((CFG["host"], CFG["port"]), H)
              print(f"XAgent: http://{CFG['host']}:{CFG['port']}  | workspace: {WS} | keys: {len(POOL.keys)} | model: {CFG['models'][0]}")
              try:
                  srv.serve_forever()
              except KeyboardInterrupt:
                  pass
          XAGENT_EOF_S
          cat > index.html <<'XAGENT_EOF_I'
          <!doctype html>
          <html lang="vi">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>XAgent</title>
          <style>
          :root{
            --bg:#f4f5f8;--panel:#ffffff;--ink:#1b2233;--mut:#667085;--line:#e1e5ec;--soft:#eef1fa;
            --accent:#2f5bea;--accent-ink:#ffffff;--danger:#c0362c;--ok:#1a8f5c;
            --c-plan:#0e7c86;--c-w1:#2f5bea;--c-w2:#b4690e;--c-w3:#8a3fe0;--c-int:#1a8f5c;--c-main:#4b5565;
            --code-bg:#f0f2f7;--shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px -12px rgba(20,30,60,.18);
            --mono:"Cascadia Code","JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
            --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
          }
          @media (prefers-color-scheme:dark){
            :root:not([data-theme="light"]){
              --bg:#0d1220;--panel:#141a2b;--ink:#e5e9f4;--mut:#8f9bb5;--line:#232b42;--soft:#1a2340;
              --accent:#7b9bff;--accent-ink:#0d1220;--danger:#ff7b6e;--ok:#4cd39a;
              --c-plan:#3ccad6;--c-w1:#7b9bff;--c-w2:#f0b25c;--c-w3:#c39bff;--c-int:#4cd39a;--c-main:#a7b1c6;
              --code-bg:#0f1526;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
            }
          }
          :root[data-theme="dark"]{
            --bg:#0d1220;--panel:#141a2b;--ink:#e5e9f4;--mut:#8f9bb5;--line:#232b42;--soft:#1a2340;
            --accent:#7b9bff;--accent-ink:#0d1220;--danger:#ff7b6e;--ok:#4cd39a;
            --c-plan:#3ccad6;--c-w1:#7b9bff;--c-w2:#f0b25c;--c-w3:#c39bff;--c-int:#4cd39a;--c-main:#a7b1c6;
            --code-bg:#0f1526;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
          }
          *{box-sizing:border-box}
          html,body{height:100%}
          body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
          button,input,textarea,select{font:inherit;color:inherit}
          button{cursor:pointer}
          :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
          [hidden]{display:none!important}

          .app{height:100%;display:flex;flex-direction:column}
          .top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
          .brand{font-weight:650;font-size:16px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;min-width:0}
          .brand small{font-weight:400;color:var(--mut);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
          .chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
          .chip{padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--mut);font-size:12px;white-space:nowrap}
          .chip b{color:var(--ink);font-weight:600;margin-right:3px}
          .dots{display:flex;gap:4px;padding-left:4px}
          .dots i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
          .dots i.bad{background:var(--danger)}.dots i.wait{background:#d9a21b}
          .icon{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}
          #menu{display:none}

          .body{flex:1;display:flex;min-height:0}
          aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
          .tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
          .tabs button{border:0;background:none;padding:8px 12px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
          .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
          .tabpane{padding:12px;overflow:auto;flex:1}
          .tabpane h4{margin:14px 0 6px;font-size:13px;font-weight:600}
          .tabpane h4:first-child{margin-top:0}
          .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
          .row .id{font-family:var(--mono);font-size:12px;word-break:break-all;flex:1}
          .row .meta{color:var(--mut);font-size:11.5px;text-align:right}
          .badge{background:var(--soft);color:var(--accent);border-radius:6px;padding:0 6px;font-size:11px;font-weight:600}
          .btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px}
          .btn:hover{background:var(--soft)}
          .field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;margin:8px 0}
          .empty{color:var(--mut);padding:8px 0}
          .mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all}

          main{flex:1;display:flex;flex-direction:column;min-width:0}
          #stream{flex:1;overflow:auto;padding:20px 20px 8px;scroll-behavior:smooth}
          .inner{max-width:1040px;margin:0 auto}
          .hello{max-width:560px;margin:9vh auto 0}
          .hello h1{font-size:26px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
          .hello p{color:var(--mut);margin:0 0 18px;max-width:46ch}
          .starts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
          .starts button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;text-align:left}
          .starts button:hover{border-color:var(--accent)}

          .turn{margin-bottom:26px}
          .user{margin-left:auto;max-width:78%;width:fit-content;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word}
          .flow{margin-top:14px;display:flex;flex-direction:column;gap:12px}
          .msg{--c:var(--c-main);border-left:3px solid var(--c);padding:1px 0 1px 12px}
          .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:2px}
          .who b{color:var(--c);font-weight:650}
          .who .cache{background:var(--soft);border-radius:6px;padding:0 6px}
          .p{white-space:pre-wrap;word-break:break-word}
          .p+.code,.code+.p,.code+.code{margin-top:8px}
          .p code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 5px;border-radius:5px}
          .code{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--code-bg)}
          .codehead{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;font-size:11.5px;color:var(--mut);border-bottom:1px solid var(--line)}
          .codehead button{border:0;background:none;color:var(--accent);padding:2px 4px}
          .code pre{margin:0;padding:10px 12px;overflow:auto;font:12.5px/1.5 var(--mono);max-height:420px}

          details.tool{--c:var(--c-main);margin:6px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12.5px}
          details.tool summary{cursor:pointer;padding:5px 10px;list-style:none;display:flex;gap:8px;align-items:baseline;min-width:0}
          details.tool summary::-webkit-details-marker{display:none}
          details.tool summary::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;align-self:center}
          details.tool.run summary::before{animation:pulse 1s ease-in-out infinite}
          details.tool .tn{font-weight:600;flex:none}
          details.tool .ta{font-family:var(--mono);font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          details.tool pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}

          .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
          .lane{--c:var(--c-w1);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;max-height:560px}
          .lane .lh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
          .lane .lh b{color:var(--c)}
          .lane .lh .m{color:var(--mut);font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
          .lane .lh .st{margin-left:auto;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap}
          .lane .lh .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);animation:pulse 1s ease-in-out infinite}
          .lane.done .lh .st::before{animation:none;background:var(--ok)}
          .lane .lb{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
          .lane .msg{border-left-width:0;padding:0}
          .note{border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 12px}

          form{padding:10px 16px 14px}
          .composer{max-width:1040px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 10px}
          .composer:focus-within{border-color:var(--accent)}
          textarea{width:100%;border:0;outline:0;resize:none;background:none;padding:6px 6px 2px;max-height:200px;min-height:28px}
          .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
          .seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:2px;border:1px solid var(--line)}
          .seg input{position:absolute;opacity:0;pointer-events:none}
          .seg label{padding:4px 11px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:13px}
          .seg input:checked+label{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,30,60,.15)}
          .seg input:focus-visible+label{outline:2px solid var(--accent)}
          .sp{flex:1}
          #run,#stop{border:0;border-radius:10px;padding:7px 18px;font-weight:600}
          #run{background:var(--accent);color:var(--accent-ink)}
          #stop{background:var(--danger);color:#fff}

          dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:16px;min-width:320px;max-width:92vw}
          dialog::backdrop{background:rgba(0,0,0,.4)}
          dialog label{display:block;margin-top:8px;color:var(--mut);font-size:12.5px}
          @keyframes pulse{50%{opacity:.25}}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
          @media (max-width:860px){
            #menu{display:grid}
            aside{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow)}
            aside.open{transform:none}
            .chips .opt{display:none}
            .brand small{display:none}
            .user{max-width:92%}
          }
          </style>
          </head>
          <body>
          <div class="app">
            <div class="top">
              <button class="icon" id="menu" aria-label="Mở bảng bên">☰</button>
              <div class="brand">XAgent <small id="ws"></small></div>
              <div class="chips" id="chips"></div>
              <div class="dots" id="dots" title="Trạng thái key"></div>
              <button class="icon" id="theme" aria-label="Đổi giao diện sáng/tối">◐</button>
            </div>
            <div class="body">
              <aside id="panel">
                <div class="tabs" role="tablist">
                  <button role="tab" aria-selected="true" data-tab="models">Model</button>
                  <button role="tab" aria-selected="false" data-tab="keys">Key</button>
                  <button role="tab" aria-selected="false" data-tab="files">File</button>
                </div>
                <div class="tabpane" id="pane-models">
                  <h4>Thứ tự ưu tiên</h4>
                  <div id="order"></div>
                  <h4>Model trên api.xkiro.com</h4>
                  <button class="btn" id="loadModels" type="button">Tải danh sách &amp; giá</button>
                  <input class="field" id="filter" placeholder="Lọc model…" hidden>
                  <div id="modelList"></div>
                </div>
                <div class="tabpane" id="pane-keys" hidden><div id="keyList"></div></div>
                <div class="tabpane" id="pane-files" hidden>
                  <button class="btn" id="loadFiles" type="button">Làm mới</button>
                  <div class="mono" id="fileList" style="margin-top:10px"></div>
                </div>
              </aside>
              <main>
                <div id="stream"><div class="inner" id="inner">
                  <div class="hello" id="hello">
                    <h1>Giao việc, XAgent tự build trong workspace.</h1>
                    <p>Việc khó sẽ được chia cho 3 model làm song song, rồi ghép lại và chạy thử. Mọi thao tác chỉ nằm trong thư mục workspace.</p>
                    <div class="starts">
                      <button type="button">Viết web todo bằng HTML/JS, có lưu và lọc việc</button>
                      <button type="button">Tạo REST API Python (Flask) có đăng nhập, kèm test</button>
                      <button type="button">Đọc workspace và sửa các lỗi build đang có</button>
                    </div>
                  </div>
                </div></div>
                <form id="composer" autocomplete="off">
                  <div class="composer">
                    <textarea id="q" rows="1" placeholder="Mô tả việc cần build…  (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
                    <div class="bar">
                      <div class="seg" role="radiogroup" aria-label="Chế độ chạy">
                        <input type="radio" name="mode" id="m1" value="auto" checked><label for="m1">Tự động</label>
                        <input type="radio" name="mode" id="m2" value="swarm"><label for="m2">3 model song song</label>
                        <input type="radio" name="mode" id="m3" value="single"><label for="m3">1 model</label>
                      </div>
                      <button class="btn" type="button" id="new">Phiên mới</button>
                      <span class="sp"></span>
                      <button id="run" type="submit">Chạy</button>
                      <button id="stop" type="button" hidden>Dừng</button>
                    </div>
                  </div>
                </form>
              </main>
            </div>
          </div>

          <dialog id="pick"></dialog>
          <script>
          (function(){
          var $=function(s,r){return (r||document).querySelector(s)};
          var stream=$('#stream'),inner=$('#inner'),q=$('#q'),runBtn=$('#run'),stopBtn=$('#stop');
          var sid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
          var ctrl=null,order=[],defW=[],picked=null;

          function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
          function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
          function fmt(n){n=n||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}
          function md(src){
            var parts=String(src).split('```'),out='';
            parts.forEach(function(p,i){
              if(i%2){
                var nl=p.indexOf('\n'),lang=nl>=0?p.slice(0,nl).trim():'',code=nl>=0?p.slice(nl+1):p;
                out+='<div class="code"><div class="codehead"><span>'+esc(lang||'code')+'</span><button type="button" class="copy">Sao chép</button></div><pre>'+esc(code.replace(/\n$/,''))+'</pre></div>';
              }else if(p.trim()){
                out+='<div class="p">'+esc(p.trim()).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')+'</div>';
              }
            });
            return out;
          }
          function colorOf(role){
            if(role==='W1')return 'var(--c-w1)';
            if(role==='W2')return 'var(--c-w2)';
            if(role==='W3')return 'var(--c-w3)';
            if(role==='Planner')return 'var(--c-plan)';
            if(role==='Tích hợp'||role==='Kiểm tra')return 'var(--c-int)';
            return 'var(--c-main)';
          }
          function keepScroll(){var nearEnd=stream.scrollHeight-stream.scrollTop-stream.clientHeight<160;if(nearEnd)stream.scrollTop=stream.scrollHeight}

          /* theme */
          (function(){
            var t=null;try{t=localStorage.getItem('xa-theme')}catch(e){}
            if(t)document.documentElement.setAttribute('data-theme',t);
            $('#theme').onclick=function(){
              var cur=document.documentElement.getAttribute('data-theme');
              if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
              var nx=cur==='dark'?'light':'dark';
              document.documentElement.setAttribute('data-theme',nx);
              try{localStorage.setItem('xa-theme',nx)}catch(e){}
            };
          })();

          /* side panel */
          var panel=$('#panel');
          $('#menu').onclick=function(){panel.classList.toggle('open')};
          document.querySelectorAll('.tabs button').forEach(function(b){
            b.onclick=function(){
              document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});
              ['models','keys','files'].forEach(function(n){$('#pane-'+n).hidden=(n!==b.dataset.tab)});
              if(b.dataset.tab==='files')loadFiles();
            };
          });
          function loadFiles(){
            fetch('/api/files').then(function(r){return r.json()}).then(function(r){$('#fileList').textContent=r.files||'(trống)'});
          }
          $('#loadFiles').onclick=loadFiles;
          var allModels=[];
          $('#loadModels').onclick=function(){
            var box=$('#modelList');box.innerHTML='<div class="empty">Đang tải…</div>';
            fetch('/api/models').then(function(r){return r.json()}).then(function(r){
              if(r.error){box.innerHTML='<div class="note">'+esc(r.error)+'</div>';return}
              allModels=r.data||r.models||(Array.isArray(r)?r:[]);
              $('#filter').hidden=false;renderModels('');
            }).catch(function(e){box.innerHTML='<div class="note">'+esc(e)+'</div>'});
          };
          $('#filter').oninput=function(e){renderModels(e.target.value)};
          function priceOf(m){
            var p=m.pricing;
            if(p&&typeof p==='object'){var k=Object.keys(p);if(k.length)return k.map(function(x){return x+': '+p[x]}).join(', ')}
            var ks=['input_price','output_price','prompt_price','completion_price','price'];
            return ks.filter(function(k){return m[k]!=null}).map(function(k){return k+': '+m[k]}).join(', ');
          }
          function renderModels(f){
            f=(f||'').toLowerCase();
            var list=allModels.filter(function(m){return String(m.id||m.name).toLowerCase().indexOf(f)>=0});
            $('#modelList').innerHTML='<div class="empty">'+list.length+'/'+allModels.length+' model</div>'+list.map(function(m){
              var id=m.id||m.name,pos=order.indexOf(id),pr=priceOf(m);
              return '<div class="row"><span class="id">'+esc(id)+'</span>'+(pos>=0?'<span class="badge" title="Thứ tự ưu tiên">#'+(pos+1)+'</span>':'')+'<span class="meta">'+esc(pr||'')+'</span></div>';
            }).join('');
          }

          /* stats */
          function refresh(){
            return fetch('/api/stats').then(function(r){return r.json()}).then(function(r){
              var s=r.stats;order=Array.isArray(r.model)?r.model:[r.model];defW=r.workers||[];
              $('#ws').textContent=r.workspace;$('#ws').title=r.workspace;
              $('#chips').innerHTML=
                '<span class="chip"><b>'+s.requests+'</b>request</span>'+
                (s.prompt?'<span class="chip" title="Phần token vào được API cache lại"><b>'+Math.round(100*(s.cached_prompt||0)/s.prompt)+'%</b>cache API</span>':'')+
                (s.saved_chars?'<span class="chip" title="Ước tính từ ký tự đã nén khỏi lịch sử"><b>~'+fmt(Math.round(s.saved_chars/3.5))+'</b>token đã nén</span>':'')+
                '<span class="chip opt"><b>'+fmt(s.prompt)+'</b>vào</span>'+
                '<span class="chip opt"><b>'+fmt(s.completion)+'</b>ra</span>';
              $('#dots').innerHTML=r.keys.map(function(k){return '<i class="'+(k.state==='ok'?'':(k.state.indexOf('tạm')===0?'wait':'bad'))+'" title="'+esc(k.key+' – '+k.state)+'"></i>'}).join('');
              $('#keyList').innerHTML=(r.keys.length?r.keys.map(function(k){return '<div class="row"><span class="id">'+esc(k.key)+'</span><span class="meta">'+esc(k.state)+'</span></div>'}).join(''):'<div class="empty">Chưa có key.</div>');
              $('#order').innerHTML=order.map(function(m,i){return '<div class="row"><span class="badge">#'+(i+1)+'</span><span class="id">'+esc(m)+'</span></div>'}).join('');
            }).catch(function(){});
          }

          /* agent stream */
          var ctx=null;
          function addMsg(target,role,model,text,cached){
            var m=el('div','msg');m.style.setProperty('--c',colorOf(role));
            var inLane=!!target.closest('.lane');
            m.innerHTML=(inLane?'':'<div class="who"><b>'+esc(role)+'</b>'+(model?'<span>'+esc(model)+'</span>':'')+(cached?'<span class="cache">cache</span>':'')+'</div>')+md(text);
            target.appendChild(m);return m;
          }
          function laneFor(n){
            if(!ctx.lanes){ctx.lanes=el('div','lanes');ctx.flow.appendChild(ctx.lanes);ctx.laneEls={}}
            if(!ctx.laneEls[n]){
              var role='W'+n,l=el('div','lane');l.style.setProperty('--c',colorOf(role));
              l.innerHTML='<div class="lh"><b>'+role+'</b><span class="m"></span><span class="st">đang chạy</span></div><div class="lb"></div>';
              ctx.lanes.appendChild(l);ctx.laneEls[n]=l;
            }
            return ctx.laneEls[n];
          }
          function finishLanes(){
            if(!ctx||!ctx.laneEls)return;
            Object.keys(ctx.laneEls).forEach(function(k){var l=ctx.laneEls[k];if(!l.classList.contains('done')){l.classList.add('done');$('.st',l).textContent='xong'}});
          }
          function targetFor(role){
            var m=/^W(\d)$/.exec(role);
            if(m){var l=laneFor(m[1]);return {box:$('.lb',l),lane:l}}
            finishLanes();return {box:ctx.flow,lane:null};
          }
          function handle(o){
            var parts=String(o.who||'Main').split('·'),role=parts[0],model=parts[1]||'';
            if(o.type==='text'){
              var t=targetFor(role);
              if(t.lane&&model)$('.m',t.lane).textContent=model;
              addMsg(t.box,role,model,o.text,o.cached);
            }else if(o.type==='tool'){
              var t2=targetFor(role),d=el('details','tool run');d.style.setProperty('--c',colorOf(role));
              d.innerHTML='<summary><span class="tn">'+esc(o.name)+'</span><span class="ta">'+esc(o.args)+'</span></summary><pre>Đang chạy…</pre>';
              t2.box.appendChild(d);ctx.tools[role]=d;
            }else if(o.type==='result'){
              var d2=ctx.tools[role];
              if(d2){d2.classList.remove('run');$('pre',d2).textContent=o.text}
            }else if(o.type==='chat'){
              var t3=targetFor(role),c3=el('div','msg');c3.style.setProperty('--c',colorOf(role));
              c3.innerHTML='<div class="who"><b>💬 '+esc(role)+' → '+esc(o.to)+'</b></div>'+md(o.text);t3.box.appendChild(c3);
            }else if(o.type==='error'){
              finishLanes();ctx.flow.appendChild(el('div','note','<b>Lỗi:</b> '+esc(o.text)));
            }else if(o.type==='done'){
              finishLanes();
            }
            keepScroll();
          }
          function setBusy(b){runBtn.hidden=b;stopBtn.hidden=!b;stopBtn.textContent='Dừng';q.disabled=b;if(!b)q.focus()}

          function doSend(text,workers){
            text=(text||'').trim();if(!text||ctrl)return;
            var hello=$('#hello');if(hello)hello.remove();
            var turn=el('div','turn');turn.appendChild(el('div','user',esc(text)));
            var flow=el('div','flow');turn.appendChild(flow);inner.appendChild(turn);
            ctx={flow:flow,lanes:null,laneEls:null,tools:{}};
            stream.scrollTop=stream.scrollHeight;
            q.value='';autosize();setBusy(true);
            ctrl=new AbortController();
            var mode=$('input[name=mode]:checked').value;
            fetch('/api/chat',{method:'POST',signal:ctrl.signal,body:JSON.stringify({sid:sid,message:text,mode:mode,workers:workers})}).then(function(r){
              var rd=r.body.getReader(),dc=new TextDecoder(),buf='';
              function pump(){
                return rd.read().then(function(x){
                  if(x.done)return;
                  buf+=dc.decode(x.value,{stream:true});var i;
                  while((i=buf.indexOf('\n'))>=0){
                    var line=buf.slice(0,i);buf=buf.slice(i+1);
                    if(line){try{handle(JSON.parse(line))}catch(e){}}
                  }
                  return pump();
                });
              }
              return pump();
            }).catch(function(e){
              if(e&&e.name==='AbortError')flow.appendChild(el('div','note','Đã dừng xem kết quả. Server có thể còn chạy nốt bước hiện tại.'));
              else flow.appendChild(el('div','note','<b>Mất kết nối:</b> '+esc(e)));
            }).then(function(){finishLanes();ctrl=null;setBusy(false);refresh()});
          }
          function pickWorkers(cb){
            var d=$('#pick');
            var sels=[0,1,2].map(function(i){
              var cur=(picked||defW)[i]||order[i%order.length];
              return '<label>Worker W'+(i+1)+'<select class="field" data-i="'+i+'">'+order.map(function(m){return '<option'+(m===cur?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select></label>';
            }).join('');
            d.innerHTML='<h4 style="margin:0 0 4px">Chọn 3 model chạy song song</h4>'+sels+
              '<div class="bar" style="margin-top:14px"><button class="btn" type="button" id="pkNo">Huỷ</button><span class="sp"></span><button class="btn" type="button" id="pkOk" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Chạy</button></div>';
            $('#pkNo').onclick=function(){d.close()};
            $('#pkOk').onclick=function(){
              picked=Array.prototype.map.call(d.querySelectorAll('select'),function(s){return s.value});
              d.close();cb(picked);
            };
            d.showModal();
          }
          function send(text){
            text=(text||'').trim();if(!text||ctrl)return;
            if($('input[name=mode]:checked').value==='swarm')return pickWorkers(function(w){doSend(text,w)});
            doSend(text,null);
          }
          $('#composer').onsubmit=function(e){e.preventDefault();send(q.value)};
          stopBtn.onclick=function(){
            fetch('/api/stop',{method:'POST',body:JSON.stringify({sid:sid})});
            stopBtn.textContent='Đang dừng…';
            setTimeout(function(){if(ctrl)ctrl.abort();stopBtn.textContent='Dừng'},8000);
          };
          q.addEventListener('keydown',function(e){
            if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(q.value)}
          });
          function autosize(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,200)+'px'}
          q.addEventListener('input',autosize);
          document.querySelectorAll('.starts button').forEach(function(b){b.onclick=function(){q.value=b.textContent;autosize();q.focus()}});
          $('#new').onclick=function(){
            if(ctrl)return;
            fetch('/api/reset',{method:'POST',body:JSON.stringify({sid:sid})}).then(function(){location.reload()});
          };
          document.addEventListener('click',function(e){
            var b=e.target.closest&&e.target.closest('.copy');
            if(!b)return;
            var pre=b.closest('.code').querySelector('pre');
            navigator.clipboard.writeText(pre.textContent).then(function(){b.textContent='Đã chép';setTimeout(function(){b.textContent='Sao chép'},1200)});
          });
          document.addEventListener('click',function(e){if(panel.classList.contains('open')&&!panel.contains(e.target)&&e.target.id!=='menu')panel.classList.remove('open')});

          refresh();
          })();
          </script>
          </body>
          </html>
          XAGENT_EOF_I
          cat > config.json <<'XAGENT_EOF_C'
          {
            "base_url": "https://api.xkiro.com/v1",
            "max_steps": 0,
            "temperature": 0,
            "allow_commands": true
          }
          XAGENT_EOF_C

      - name: Nhúng key vào exe
        shell: python
        run: |
          import os, re
          def pick(secret, default):
              raw = os.environ.get(secret, "").strip() or os.environ[default]
              return [k for k in re.split(r"[\s,]+", raw) if k]
          keys = pick("KEYS_SECRET", "KEYS_DEFAULT")
          zai = pick("ZAI_SECRET", "ZAI_DEFAULT")
          agnes = pick("AGNES_SECRET", "AGNES_DEFAULT")
          open("embedded_keys.py", "w").write(f"KEYS = {keys!r}\nZAI_KEYS = {zai!r}\nAGNES_KEYS = {agnes!r}\n")
          print(f"Nhúng {len(keys)} key xkiro, {len(zai)} key glm, {len(agnes)} key agnes")

      - name: Smoke test
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          import server as s
          assert len(s.POOL.keys) > 0, "không có key"
          assert len(s.EXTRA["glm-4.5-flash"]["pool"].keys) > 0, "không có key glm"
          assert len(s.EXTRA["agnes-2.5-flash"]["pool"].keys) > 0, "không có key agnes"
          try:
              s.t_read_file("../x"); raise SystemExit("sandbox FAIL")
          except s.Denied:
              print("sandbox OK,", len(s.POOL.keys), "key")

      - name: Build exe
        run: pyinstaller --onefile --name XAgent --hidden-import embedded_keys --add-data "index.html;." server.py

      - name: Package
        shell: bash
        run: |
          mkdir -p out/XAgent/workspace
          cp dist/XAgent.exe config.json out/XAgent/
          cd out && 7z a ../XAgent-windows.zip XAgent

      - uses: actions/upload-artifact@v4
        with:
          name: XAgent-windows
          path: XAgent-windows.zip

      - name: Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XAgent-windows.zip
          draft: true
