name: Build EXE and Release

on:
  workflow_dispatch:   # Bấm Run workflow trên tab Actions, nó sẽ hỏi token
    inputs:
      discord_token:
        description: "Nhap Discord token de build vao abc.exe"
        required: true

permissions:
  contents: write      # Cần quyền này để tạo Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install discord.py opencv-python pyautogui pywin32 aiohttp
          pip install pyinstaller

      - name: Inject Discord token into abc.py
        shell: pwsh
        env:
          INPUT_TOKEN: ${{ github.event.inputs.discord_token }}
        run: |
          $token = $env:INPUT_TOKEN
          if (-not $token) {
            Write-Error "Chua nhap token khi chay workflow!"
            exit 1
          }
          Write-Host "::add-mask::$token"
          $env:BUILD_TOKEN = $token

          # Tim dong TOKEN = "" trong abc.py, chi sua phan NAM GIUA 2 dau nhay
          $path = (Resolve-Path "abc.py").Path
          $content = [System.IO.File]::ReadAllText($path)
          $regex = [regex]'(?m)^(\s*TOKEN\s*=\s*)(["''])(.*?)\2'
          if (-not $regex.IsMatch($content)) {
            Write-Error 'Khong tim thay dong TOKEN = "" trong abc.py'
            exit 1
          }
          $new = $regex.Replace($content, {
            param($m)
            $m.Groups[1].Value + $m.Groups[2].Value + $env:BUILD_TOKEN + $m.Groups[2].Value
          }, 1)
          [System.IO.File]::WriteAllText($path, $new, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Da dien token vao abc.py"

      - name: Build abc.py to exe
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole abc.py

      - name: Find abc.exe
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "abc.exe" -File -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "Khong tim thay abc.exe sau khi build!"
            exit 1
          }
          Write-Host "Tim thay: $($exe.FullName)"
          # Dùng đường dẫn tương đối cho action release
          $rel = Resolve-Path -Relative $exe.FullName
          $rel = $rel -replace '^\.\\', '' -replace '\\', '/'
          "exe_path=$rel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact (để tải thử khi chạy tay)
        uses: actions/upload-artifact@v4
        with:
          name: abc-exe
          path: ${{ steps.find_exe.outputs.exe_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('build-{0}', github.run_number) }}
          name: ${{ format('Build {0}', github.run_number) }}
          files: ${{ steps.find_exe.outputs.exe_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
