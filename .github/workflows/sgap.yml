          """Lenh backup."""
          import discord
          from discord.ext import commands

          import core
          from core import cfg, human_size


          def flags(raw):
              out, dry, words = [], False, []
              for t in raw.split():
                  if t == "--dry":
                      dry = True
                  elif t.startswith("--"):
                      out.append(t[2:])
                  else:
                      words.append(t)
              return out, dry, " ".join(words)


          class BackupCog(commands.Cog):
              def __init__(self, bot):
                  self.bot = bot
                  self.e = bot.backups

              @commands.group(name="backup", aliases=["bk"], invoke_without_command=True)
              async def backup(self, ctx):
                  p = core.prefix()
                  await ctx.send(
                      "**BACKUP**\n`%sbackup create [--account --guilds --messages] [label]`\n"
                      "`%sbackup list|info|delete|verify|prune`\n"
                      "`%sbackup restore <ten|latest> [--dry]`\n"
                      "`%sbackup export <ten> html|csv|json [--merge]`\n"
                      "`%sbackup jsons <ten> per-channel|merge`\n"
                      "`%sbackup convert <ten> [--pretty]`\n"
                      "`%sbackup search <ten> <q>` · `%sbackup auto`\n"
                      "`%smsgbk [#k] [--json|--jsonl|--both] [--media]`\n"
                      "`%sguildbk [id]` · `%sclone <id> [--to=ID] [--dry]`"
                      % ((p,) * 10))

              @backup.command(name="create", aliases=["new"])
              async def create(self, ctx, *, raw: str = ""):
                  f, dry, label = flags(raw)
                  parts = f or cfg("backup.default_parts",
                                   ["account", "guilds", "messages"])
                  label = label or "manual"
                  m = await ctx.send("backup %s | %s" % (label, ", ".join(parts)))

                  async def prog(t):
                      try:
                          await m.edit(content="backup %s | %s" % (label, t))
                      except Exception:
                          pass

                  try:
                      s = await self.e.create(label=label, parts=parts, progress=prog)
                  except Exception as ex:
                      return await m.edit(content="LOI: %s" % ex)
                  await m.edit(content="**XONG** `%s` | %s\n```%s```"
                                       % (s.name, human_size(s.size()),
                                          s.manifest.get("counts", {})))

              @backup.command(name="list", aliases=["ls"])
              async def ls(self, ctx):
                  b = self.e.list()
                  if not b:
                      return await ctx.send("chua co backup")
                  await ctx.send(core.truncate("\n".join(
                      "`%d.` **%s** | %s" % (i, x["name"], x["size"])
                      for i, x in enumerate(b, 1))))

              @backup.command(name="info")
              async def info(self, ctx, name: str = "latest"):
                  try:
                      s = self.e.latest() if name == "latest" else self.e.open(name)
                  except FileNotFoundError as e:
                      return await ctx.send(str(e))
                  await ctx.send("```%s```" % s.summary())

