          class WebUI:
              def __init__(self, bot, host="127.0.0.1", port=8777):
                  self.bot = bot
                  self.host = host
                  self.port = int(port)
                  self.token = cfg("ui.token", "")
                  self.runner = None
                  self.site = None

              @web.middleware
              async def _auth(self, request, handler):
                  if request.path == "/":
                      return await handler(request)
                  if request.headers.get("X-Token") != self.token:
                      return web.json_response({"error": "bad token"}, status=401)
                  return await handler(request)

              async def _index(self, request):
                  return web.Response(
                      text=HTML.replace("const TOKEN=location.hash.slice(1)||'';",
                                        "const TOKEN='%s';" % self.token),
                      content_type="text/html")

              async def _status(self, request):
                  b = self.bot
                  try:
                      cog = b.get_cog("Quests")
                      quests = await cog.fetch() if cog else []
                  except Exception:
                      quests = []
                  prem = b.get_cog("Premium")
                  return web.json_response({
                      "user": str(b.user) if b.user else None,
                      "ready": b.is_ready(),
                      "guilds": len(b.guilds),
                      "friends": len(b.user.friends) if b.user else 0,
                      "messages": sum(x.get("counts", {}).get("messages", 0)
                                      for x in b.backups.list()),
                      "backups": len(b.backups.list()),
                      "calls": b.httpx.calls,
                      "limited": b.httpx.limited,
                      "uptime": core.fmt_dur(time.time() - getattr(b, "boot", time.time())),
                      "quests": len(quests),
                      "rpc": bool(prem and prem.rpc and prem.rpc.connected)})

              async def _config(self, request):
                  if request.query.get("raw"):
                      return web.json_response(
                          {"text": core.CONFIG_PATH.read_text(encoding="utf-8")})
                  return web.json_response(json.loads(json.dumps(core._cfg)))

              async def _config_set(self, request):
                  body = await request.json()
                  core.cfg_set(body["path"], body.get("value"))
                  core.cfg_save()
                  if body["path"] == "debug":
                      core.log.setLevel(10 if body.get("value") else 20)
                  return web.json_response({"ok": True})

              async def _config_save(self, request):
                  body = await request.json()
                  try:
                      parsed = json.loads(body["text"])
                  except Exception as e:
                      return web.json_response({"msg": "JSON loi: %s" % e})
                  core.CONFIG_PATH.write_text(json.dumps(parsed, indent=2, ensure_ascii=False),
                                              encoding="utf-8")
                  core.cfg_reload()
                  return web.json_response({"msg": "da luu config"})

              async def _logs(self, request):
                  p = core.LOG_DIR / "selfbot.log"
                  if not p.exists():
                      return web.json_response({"text": "(chua co log)"})
                  try:
                      with open(p, "r", encoding="utf-8", errors="replace") as f:
                          lines = f.readlines()[-400:]
                  except Exception:
                      lines = []
                  return web.json_response({"text": "".join(lines)})

              async def _backups(self, request):
                  return web.json_response(self.bot.backups.list())

              async def _backup_delete(self, request):
                  body = await request.json()
                  return web.json_response({"ok": self.bot.backups.delete(body["name"])})

              async def _backup_export(self, request):
                  body = await request.json()
                  s = (self.bot.backups.open(body["name"]) if body.get("name")
                       else self.bot.backups.latest())
                  self.bot.backups.exporter(s).export_all_html()
                  return web.json_response({"msg": "da export"})

              async def _quests(self, request):
                  import cogs.quests as qm
                  cog = self.bot.get_cog("Quests")
                  if not cog:
                      return web.json_response([])
                  out = []
                  for q in await cog.fetch():
                      c = q.get("config") or {}
                      u = q.get("user_status") or {}
                      task, tc = qm.parse_task(c)
                      out.append({"name": ((c.get("messages") or {}).get("quest_name")
                                           or (c.get("application") or {}).get("name")
                                           or q.get("id")),
                                  "task": task,
                                  "value": int(((u.get("progress") or {}).get(task or "") or {})
                                               .get("value", 0) or 0),
                                  "target": qm.target_of(tc),
                                  "done": bool(u.get("completed_at"))})
                  return web.json_response(out)

              async def _channels(self, request):
                  out = []
                  for g in self.bot.guilds[:60]:
                      for c in g.text_channels[:20]:
                          out.append({"id": str(c.id), "label": "%s / #%s" % (g.name, c.name)})
                  return web.json_response(out[:300])

              async def _console(self, request):
                  body = await request.json()
                  text = body["text"].strip()
                  if not text.startswith(core.prefix()):
                      text = core.prefix() + text
                  st, _ = await self.bot.httpx.post(
                      "/channels/%s/messages" % body["channel_id"], {"content": text})
                  return web.json_response({"msg": "status %s" % st})

              async def _action(self, request):
                  a = (await request.json()).get("action")
                  if a == "backup":
                      asyncio.create_task(self.bot.backups.create(label="ui"))
                      return web.json_response({"msg": "dang backup..."})
                  if a == "prune":
                      return web.json_response({"msg": "xoa %d backup cu"
                                                       % self.bot.backups.prune()})
                  if a == "quest":
                      cog = self.bot.get_cog("Quests")
                      if cog:
                          asyncio.create_task(cog.cmd_run_web())
                      return web.json_response({"msg": "dang chay quest"})
                  if a == "export":
                      s = self.bot.backups.latest()
                      self.bot.backups.exporter(s).export_all_html()
                      return web.json_response({"msg": "da export HTML"})
                  return web.json_response({"msg": "?"})

              def build(self):
                  app = web.Application(middlewares=[self._auth])
                  r = app.router
                  r.add_get("/", self._index)
                  r.add_get("/api/status", self._status)
                  r.add_get("/api/config", self._config)
                  r.add_post("/api/config", self._config_set)
                  r.add_post("/api/config/save", self._config_save)
                  r.add_get("/api/logs", self._logs)
                  r.add_get("/api/backups", self._backups)
                  r.add_post("/api/backup/delete", self._backup_delete)
                  r.add_post("/api/backup/export", self._backup_export)
                  r.add_get("/api/quests", self._quests)
                  r.add_get("/api/channels", self._channels)
                  r.add_post("/api/console", self._console)
                  r.add_post("/api/action", self._action)
                  return app

              async def start(self):
                  if not cfg("ui.enabled", True):
                      return None
                  self.runner = web.AppRunner(self.build(), access_log=None)
                  await self.runner.setup()
                  port = self.port
                  for _ in range(12):
                      try:
                          self.site = web.TCPSite(self.runner, self.host, port)
                          await self.site.start()
                          break
                      except OSError:
                          port += 1
                  url = "http://%s:%d/#%s" % (self.host, port, self.token)
                  log.info("UI: %s", url)
                  if cfg("ui.open_browser", True):
                      try:
                          webbrowser.open(url)
                      except Exception:
                          pass
                  return url

              async def stop(self):
                  if self.runner:
                      await self.runner.cleanup()
          EOF_WEBUI

          cat > backup/storage.py <<'EOF_STORAGE'
          """Backup store: manifest, atomic write, gzip, jsonl streaming."""
          from __future__ import annotations

          import gzip
          import json
          import os
          import shutil

          from core import BACKUP_DIR, human_size, now_iso


          class BackupStore:
              def __init__(self, name, *, root=None):
                  self.name = name
                  self.root = (root or BACKUP_DIR) / name
                  self.root.mkdir(parents=True, exist_ok=True)
                  self.manifest_path = self.root / "manifest.json"

              def p(self, rel):
                  path = self.root / rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  return path

              @property
              def manifest(self):
                  if self.manifest_path.exists():
                      try:
                          return json.loads(self.manifest_path.read_text("utf-8"))
                      except Exception:
                          pass
                  return {"name": self.name, "version": 4, "created_at": now_iso(),
                          "updated_at": now_iso(), "parts": {}, "counts": {}, "errors": []}

              def _save(self, m):
                  m["updated_at"] = now_iso()
                  self._atomic(self.manifest_path,
                               json.dumps(m, ensure_ascii=False, indent=1))

              def update(self, **kw):
                  m = self.manifest
                  m.update(kw)
                  self._save(m)

              def bump(self, key, n=1):
                  m = self.manifest
                  m["counts"][key] = m["counts"].get(key, 0) + n
                  self._save(m)

              def mark(self, part, status, **info):
                  m = self.manifest
                  m["parts"][part] = {"status": status, "at": now_iso(), **info}
                  self._save(m)

              def error(self, where, err):
                  m = self.manifest
                  m["errors"].append({"where": where, "error": str(err)[:500],
                                      "at": now_iso()})
                  if len(m["errors"]) > 1000:
                      m["errors"] = m["errors"][-1000:]
                  self._save(m)

              @staticmethod
              def _atomic(path, text):
                  tmp = path.with_name(path.name + ".tmp")
                  tmp.write_text(text, encoding="utf-8")
                  os.replace(tmp, path)

              def write_json(self, rel, data, *, compress=True):
                  raw = json.dumps(data, ensure_ascii=False, separators=(",", ":")).encode()
                  path = self.p(rel + (".gz" if compress else ""))
                  path.write_bytes(gzip.compress(raw, 6) if compress else raw)
                  return path

              def read_json(self, rel):
                  for cand in (rel, rel + ".gz"):
                      p = self.root / cand
                      if p.exists():
                          raw = p.read_bytes()
                          if raw[:2] == b"\x1f\x8b":
                              raw = gzip.decompress(raw)
                          return json.loads(raw)
                  raise FileNotFoundError(rel)

              def append_jsonl(self, rel, records, *, compress=True):
                  path = self.p(rel + (".jsonl.gz" if compress else ".jsonl"))
                  opener = gzip.open if compress else open
                  with opener(path, "at", encoding="utf-8") as f:
                      for r in records:
                          f.write(json.dumps(r, ensure_ascii=False,
                                             separators=(",", ":")) + "\n")
                  return path

              def read_jsonl(self, rel):
                  for cand in (rel + ".jsonl.gz", rel + ".jsonl"):
                      p = self.root / cand
                      if p.exists():
                          opener = gzip.open if p.suffix == ".gz" else open
                          with opener(p, "rt", encoding="utf-8") as f:
                              for line in f:
                                  line = line.strip()
                                  if line:
                                      yield json.loads(line)
                          return

              def has(self, rel):
                  return (self.root / rel).exists() or (self.root / (rel + ".gz")).exists()

              def files(self):
                  return [f for f in self.root.rglob("*") if f.is_file()]

              def size(self):
                  return sum(f.stat().st_size for f in self.files())

              def summary(self):
                  m = self.manifest
                  c = m.get("counts", {})
                  lines = ["%s | %s | %s" % (self.name, human_size(self.size()),
                                             m.get("created_at", "")[:19])]
                  for k in ("friends", "guilds", "channels", "roles", "messages",
                            "dms", "media"):
                      if c.get(k):
                          lines.append("  %s: %s" % (k, c[k]))
                  return "\n".join(lines)

              def finalize(self):
                  self.update(size_bytes=self.size(), file_count=len(self.files()),
                              done=True)

              def destroy(self):
                  shutil.rmtree(self.root, ignore_errors=True)


          def list_stores(root=None):
              root = root or BACKUP_DIR
              if not root.exists():
                  return []
              out = []
              for d in sorted(root.iterdir(), key=lambda x: x.stat().st_mtime, reverse=True):
                  if not d.is_dir():
                      continue
                  info = {"name": d.name, "size": human_size(sum(
                      f.stat().st_size for f in d.rglob("*") if f.is_file()))}
                  mp = d / "manifest.json"
                  if mp.exists():
                      try:
                          m = json.loads(mp.read_text("utf-8"))
                          info.update(label=m.get("label"), created=m.get("created_at"),
                                      counts=m.get("counts", {}), done=m.get("done", False))
                      except Exception:
                          pass
                  out.append(info)
              return out
