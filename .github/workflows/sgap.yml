          """Export HTML / CSV / JSON + search."""
          from __future__ import annotations

          import csv
          import html
          import json

          from core import now_iso
          from .storage import BackupStore

          HEAD = """<!doctype html><meta charset="utf-8"><title>{t}</title>
          <style>body{{margin:0;background:#1a1b1e;color:#dbdee1;font:15px/1.5 system-ui,sans-serif}}
