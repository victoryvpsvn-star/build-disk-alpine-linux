name: Build Venice Selfbot EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: onefile
        type: choice
        options: [onefile, onedir, both]
      python_version:
        description: "Python version"
        required: true
        default: "3.11"
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════
      # BƯỚC 1: GHI TOÀN BỘ SOURCE (bash thuần, chưa cần Python)
      # ═══════════════════════════════════════════════════════════════
      - name: Write all source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup cogs plugins assets

          cat > requirements.txt <<'EOF_REQ'
          discord.py-self>=2.0.0
          aiohttp>=3.9.0
          PyNaCl>=1.5.0
          EOF_REQ

          cat > requirements-build.txt <<'EOF_REQB'
          pyinstaller>=6.6.0
          pillow>=10.3.0
          EOF_REQB

          cat > core.py <<'EOF_CORE'
          """
          Venice Selfbot - core
          Config / Logging / SafeHTTP (anti-ban) / Utils / frozen-aware paths
          """
          from __future__ import annotations

          import asyncio
          import base64
          import json
          import logging
          import mimetypes
          import random
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Optional

          import aiohttp

          VERSION = "4.0.0"


          def is_frozen() -> bool:
              return bool(getattr(sys, "frozen", False))


          def app_dir() -> Path:
              if is_frozen():
                  return Path(sys.executable).resolve().parent
              return Path(__file__).resolve().parent


          APP_DIR = app_dir()
          DATA_DIR = APP_DIR / "data"
          BACKUP_DIR = DATA_DIR / "backups"
          LOG_DIR = DATA_DIR / "logs"
          PLUGIN_DIR = APP_DIR / "plugins"
          CONFIG_PATH = APP_DIR / "config.json"

          for _d in (DATA_DIR, BACKUP_DIR, LOG_DIR, PLUGIN_DIR):
              try:
                  _d.mkdir(parents=True, exist_ok=True)
              except Exception:
                  pass


          DEFAULTS: dict = {
              "token": "", "prefix": ".", "ghost": False, "debug": False,
              "ui": {"enabled": True, "host": "127.0.0.1", "port": 8777,
                     "token": "", "open_browser": True},
              "safety": {"jitter_min": 0.35, "jitter_max": 1.5, "max_concurrent": 2,
                         "max_retries": 5, "chunk_guilds": False},
              "quests": {"enabled": True, "auto_claim": True, "video_speed": 3.0,
                         "video_step": 5, "heartbeat_interval": 20, "enroll_location": 11},
              "nitro": {"enabled": True, "auto_redeem": True},
              "giveaway": {"enabled": True, "keywords": ["giveaway", "qua tang", "quà tặng", "🎉"],
                           "button_regex": "enter|join|participate|tham gia|🎉",
                           "delay_min": 1.5, "delay_max": 7.0},
              "autoresponder": {"enabled": True, "cooldown": 25, "rules": []},
              "afk": {"enabled": False, "reason": "AFK", "once_per_channel": True},
              "bump": {"enabled": True, "bot_ids": [302050872383242240],
                       "remind_after_minutes": 122},
              "snipe": {"cache": 60},
              "presence": {"enabled": True, "status": "online", "activities": []},
              "massops": {"dm_delay": 2.0, "friend_delay": 5.5,
                          "guild_delay": 2.5, "note_delay": 1.2},
              "voice": {"auto_join": [], "stay": True, "self_mute": True, "self_deaf": True},
              "premium": {
                  "rpc": {"enabled": False, "client_id": "", "rotate_seconds": 15,
                          "activities": []},
                  "translate": {"auto": False, "to": "vi"},
                  "logger": {"deleted": True, "edited": True, "ghostping": True,
                             "webhook": ""},
                  "autoreact": {"enabled": False, "rules": []},
                  "scheduler": {"jobs": []},
                  "autofriend": False,
                  "nickauto": {"enabled": False, "format": "{name} | venice"},
                  "forward": [],
                  "keywords": [],
              },
              "backup": {
                  "auto": True, "interval_minutes": 720, "keep": 10,
                  "default_parts": ["account", "guilds", "messages"],
                  "account": {"profile": True, "avatar": True, "banner": True,
                              "settings": True, "relationships": True, "notes": True,
                              "connections": True, "dms": True, "dm_limit": 0,
                              "gifts": True, "read_states": True,
                              "authorized_apps": True, "affinities": True},
                  "guilds": {"include_members": True, "include_bans": True,
                             "include_invites": True, "include_webhooks": True,
                             "include_emojis": True, "include_stickers": True,
                             "include_sounds": True, "include_events": True,
                             "include_automod": True, "include_threads": True,
                             "include_template": True, "include_widget": True,
                             "include_vanity": True, "include_onboarding": True,
                             "include_audit_log": False},
                  "messages": {"scope": ["guilds", "dms"], "limit_per_channel": 0,
                               "after": None, "include_threads": True,
                               "include_forum": True, "include_voice_text": True,
                               "skip_empty": True, "download_media": False,
                               "media_max_mb": 25, "format": "json",
                               "keep_jsonl": True, "json_style": "object",
                               "json_pretty": False, "json_meta": True},
                  "restore": {"delay": 3.0, "avatar_delay": 30.0},
              },
          }


          def _deep_merge(base: dict, over: dict) -> dict:
              out = dict(base)
              for k, v in (over or {}).items():
                  if isinstance(v, dict) and isinstance(out.get(k), dict):
                      out[k] = _deep_merge(out[k], v)
                  else:
                      out[k] = v
              return out


          def write_default_config() -> Path:
              CONFIG_PATH.write_text(json.dumps(DEFAULTS, indent=2, ensure_ascii=False),
                                     encoding="utf-8")
              return CONFIG_PATH


          def load_config() -> dict:
              if not CONFIG_PATH.exists():
                  write_default_config()
              try:
                  raw = json.loads(CONFIG_PATH.read_text(encoding="utf-8"))
              except Exception:
                  raw = {}
              return _deep_merge(DEFAULTS, raw)


          _cfg: dict = load_config()

          if not _cfg.get("ui", {}).get("token"):
              import secrets as _s
              _cfg.setdefault("ui", {})["token"] = _s.token_hex(16)
              try:
                  CONFIG_PATH.write_text(json.dumps(_cfg, indent=2, ensure_ascii=False),
                                         encoding="utf-8")
              except Exception:
                  pass


          def cfg(path: str, default: Any = None) -> Any:
              node: Any = _cfg
              for part in path.split("."):
                  if not isinstance(node, dict) or part not in node:
                      return default
                  node = node[part]
              return node


          def cfg_set(path: str, value: Any) -> None:
              parts = path.split(".")
              node = _cfg
              for p in parts[:-1]:
                  node = node.setdefault(p, {})
              node[parts[-1]] = value


          def cfg_save() -> None:
              try:
                  CONFIG_PATH.write_text(json.dumps(_cfg, indent=2, ensure_ascii=False),
                                         encoding="utf-8")
              except Exception:
                  pass


          def cfg_reload() -> None:
              global _cfg
              _cfg = load_config()


          def prefix() -> str:
              return cfg("prefix", ".")


          class _Color(logging.Formatter):
              C = {"DEBUG": "\033[90m", "INFO": "\033[36m", "WARNING": "\033[33m",
                   "ERROR": "\033[31m", "CRITICAL": "\033[41m"}
              R = "\033[0m"

              def format(self, record):
                  base = "%s[%-8s]%s %%(message)s" % (self.C.get(record.levelname, ""),
                                                      record.levelname, self.R)
                  return logging.Formatter(base, "%H:%M:%S").format(record)


          log = logging.getLogger("venice")
          log.setLevel(logging.DEBUG if cfg("debug") else logging.INFO)
          log.propagate = False

          if not log.handlers:
              _sh = logging.StreamHandler()
              _sh.setFormatter(_Color())
              log.addHandler(_sh)
              try:
                  _fh = logging.FileHandler(LOG_DIR / "selfbot.log", encoding="utf-8")
                  _fh.setFormatter(logging.Formatter(
                      "%(asctime)s [%(levelname)s] %(name)s: %(message)s"))
                  log.addHandler(_fh)
              except Exception:
                  pass

          for _n in ("discord", "discord.http", "discord.gateway", "aiohttp",
                     "aiohttp.access"):
              logging.getLogger(_n).setLevel(logging.WARNING)


          CLIENT_VERSION = "1.0.9175"
          CLIENT_BUILD = 350000
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) discord/1.0.9175 Chrome/128.0.6613.186 "
              "Electron/32.2.7 Safari/537.36")

          SUPER_PROPS = base64.b64encode(json.dumps({
              "os": "Windows", "browser": "Discord Client", "release_channel": "stable",
              "client_version": CLIENT_VERSION, "os_version": "10.0.22631",
              "os_arch": "x64", "app_arch": "x64", "system_locale": "en-US",
              "client_build_number": CLIENT_BUILD, "native_build_number": 55000,
              "client_event_source": None,
          }, separators=(",", ":")).encode()).decode()


          def jitter(lo=None, hi=None) -> float:
              a = lo if lo is not None else cfg("safety.jitter_min", 0.35)
              b = hi if hi is not None else cfg("safety.jitter_max", 1.5)
              return random.uniform(a, b)


          async def jsleep(lo=None, hi=None) -> None:
              await asyncio.sleep(jitter(lo, hi))


          class _Bucket:
              __slots__ = ("lock", "reset_at", "remaining")

              def __init__(self):
                  self.lock = asyncio.Lock()
                  self.reset_at = 0.0
                  self.remaining = 1


          class SafeHTTP:
              BASE = "https://discord.com/api/v9"

              def __init__(self, token: str):
                  self.token = token
                  self.session = None
                  self._sem = asyncio.Semaphore(cfg("safety.max_concurrent", 2))
                  self._buckets: dict = {}
                  self.calls = 0
                  self.limited = 0

              def _headers(self) -> dict:
                  return {"Authorization": self.token, "User-Agent": USER_AGENT,
                          "X-Super-Properties": SUPER_PROPS, "X-Discord-Locale": "en-US",
                          "X-Discord-Timezone": "Asia/Ho_Chi_Minh",
                          "X-Debug-Options": "bugReporterEnabled", "Accept": "*/*",
                          "Accept-Language": "en-US,en;q=0.9",
                          "Origin": "https://discord.com",
                          "Referer": "https://discord.com/channels/@me"}

              async def start(self):
                  if self.session is None or self.session.closed:
                      self.session = aiohttp.ClientSession(
                          headers=self._headers(),
                          timeout=aiohttp.ClientTimeout(total=45),
                          connector=aiohttp.TCPConnector(limit=16, ttl_dns_cache=300))

              async def close(self):
                  if self.session and not self.session.closed:
                      await self.session.close()

              @staticmethod
              def _absorb(resp, bucket):
                  try:
                      rem = resp.headers.get("X-RateLimit-Remaining")
                      rst = resp.headers.get("X-RateLimit-Reset-After")
                      if rem is not None:
                          bucket.remaining = int(rem)
                      if rst is not None:
                          bucket.reset_at = time.monotonic() + float(rst) + 0.05
                      elif rem == "0":
                          bucket.reset_at = time.monotonic() + 1.0
                  except Exception:
                      pass

              async def request(self, method, path, *, params=None, json_body=None,
                                data=None, retries=None):
                  await self.start()
                  url = self.BASE + path
                  key = method + " " + path.split("?")[0]
                  bucket = self._buckets.setdefault(key, _Bucket())
                  retries = cfg("safety.max_retries", 5) if retries is None else retries

                  for attempt in range(retries + 1):
                      async with self._sem:
                          async with bucket.lock:
                              wait = bucket.reset_at - time.monotonic()
                              if wait > 0:
                                  await asyncio.sleep(wait)
                              try:
                                  self.calls += 1
                                  async with self.session.request(
                                      method, url, params=params, json=json_body,
                                      data=data) as r:
                                      self._absorb(r, bucket)
                                      if r.status == 429:
                                          self.limited += 1
                                          try:
                                              j = await r.json(content_type=None)
                                              ra = float(j.get("retry_after", 1.0))
                                          except Exception:
                                              ra = float(r.headers.get("Retry-After", 1) or 1)
                                          ra += random.uniform(0.15, 0.7)
                                          bucket.reset_at = time.monotonic() + ra
                                          await asyncio.sleep(ra)
                                          continue
                                      if r.status in (500, 502, 503, 504):
                                          await asyncio.sleep((2 ** attempt)
                                                              + random.uniform(0, 1.2))
                                          continue
                                      if r.status in (204, 205):
                                          return r.status, None
                                      ct = r.headers.get("Content-Type", "")
                                      if "json" in ct:
                                          try:
                                              return r.status, await r.json(content_type=None)
                                          except Exception:
                                              return r.status, None
                                      return r.status, await r.read()
                              except (aiohttp.ClientError, asyncio.TimeoutError) as e:
                                  if attempt == retries:
                                      log.error("HTTP fail %s %s: %s", method, path, e)
                                      return 0, None
                                  await asyncio.sleep((2 ** attempt) + random.uniform(0, 1))
                  return 0, None

              async def get(self, p, **kw):
                  return await self.request("GET", p, **kw)

              async def post(self, p, b=None):
                  return await self.request("POST", p, json_body=b if b is not None else {})

              async def put(self, p, b=None):
                  return await self.request("PUT", p, json_body=b if b is not None else {})

              async def patch(self, p, b=None):
                  return await self.request("PATCH", p, json_body=b if b is not None else {})

              async def delete(self, p, b=None):
                  return await self.request("DELETE", p, json_body=b if b is not None else {})


          def now_iso() -> str:
              return datetime.now(timezone.utc).isoformat()


          def ts_name() -> str:
              return datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")


          def fmt_dur(seconds: float) -> str:
              seconds = int(seconds)
              h, m, s = seconds // 3600, (seconds % 3600) // 60, seconds % 60
              if h:
                  return "%dh%02dm" % (h, m)
              if m:
                  return "%dm%02ds" % (m, s)
              return "%ds" % s


          def human_size(n: float) -> str:
              for u in ("B", "KB", "MB", "GB", "TB"):
                  if n < 1024:
                      return "%.1f%s" % (n, u)
                  n /= 1024
              return "%.1fPB" % n


          def to_data_uri(raw: bytes, url_hint: str = "") -> str:
              mime = mimetypes.guess_type(url_hint)[0] or "image/png"
              if url_hint.endswith(".gif"):
                  mime = "image/gif"
              return "data:%s;base64,%s" % (mime, base64.b64encode(raw).decode())


          def truncate(text: str, n: int = 1900) -> str:
              text = text or ""
              return text if len(text) <= n else text[: n - 3] + "..."
          EOF_CORE

          cat > rpc.py <<'EOF_RPC'
          """Discord Rich Presence qua IPC local."""
          from __future__ import annotations

          import json
          import os
          import socket
          import struct
          import sys
          import threading
          import time
          import uuid

          OP_HANDSHAKE, OP_FRAME, OP_CLOSE, OP_PING, OP_PONG = 0, 1, 2, 3, 4
          IS_WIN = sys.platform == "win32"


          class _Pipe:
              def __init__(self, raw, is_socket):
                  self.raw = raw
                  self.is_socket = is_socket

              def write(self, data):
                  if self.is_socket:
                      self.raw.sendall(data)
                  else:
                      self.raw.write(data)

              def read(self, n):
                  buf = b""
                  while len(buf) < n:
                      chunk = (self.raw.recv(n - len(buf)) if self.is_socket
                               else self.raw.read(n - len(buf)))
                      if not chunk:
                          raise ConnectionError("pipe dong")
                      buf += chunk
                  return buf

              def close(self):
                  try:
                      self.raw.close()
                  except Exception:
                      pass


          def _candidates():
              if IS_WIN:
                  for i in range(10):
                      yield r"\\.\pipe\discord-ipc-%d" % i, False
                  return
              bases = [os.environ.get("XDG_RUNTIME_DIR"), os.environ.get("TMPDIR"),
                       "/tmp", os.path.expanduser("~/.discord")]
              subs = ["", "snap.discord", "app/com.discordapp.Discord",
                      "app/com.discordapp.DiscordCanary"]
              seen = set()
              for b in bases:
                  if not b:
                      continue
                  for s in subs:
                      for i in range(10):
                          p = (os.path.join(b, s, "discord-ipc-%d" % i) if s
                               else os.path.join(b, "discord-ipc-%d" % i))
                          if p not in seen:
                              seen.add(p)
                              yield p, True


          def _open(path, is_socket):
              if is_socket:
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.settimeout(10)
                  s.connect(path)
                  s.settimeout(None)
                  return _Pipe(s, True)
              return _Pipe(open(path, "r+b", buffering=0), False)


          class DiscordIPC:
              def __init__(self, client_id, on_ready=None):
                  self.client_id = str(client_id)
                  self.pipe = None
                  self.connected = False
                  self._lock = threading.RLock()
                  self._reader = None
                  self._stop = threading.Event()
                  self.last_error = ""
                  self.user = {}
                  self.on_ready = on_ready

              def _send(self, opcode, payload):
                  if not self.pipe:
                      raise ConnectionError("chua ket noi")
                  data = json.dumps(payload, separators=(",", ":")).encode()
                  with self._lock:
                      self.pipe.write(struct.pack("<II", opcode, len(data)) + data)

              def _recv(self):
                  if not self.pipe:
                      raise ConnectionError("chua ket noi")
                  op, ln = struct.unpack("<II", self.pipe.read(8))
                  body = self.pipe.read(ln) if ln else b"{}"
                  try:
                      return op, json.loads(body.decode())
                  except Exception:
                      return op, {}

              def connect(self, timeout=8.0):
                  deadline = time.time() + timeout
                  for path, is_sock in _candidates():
                      if self._stop.is_set():
                          return False
                      if not is_sock and not os.path.exists(path):
                          continue
                      try:
                          self.pipe = _open(path, is_sock)
                          self._send(OP_HANDSHAKE, {"v": 1, "client_id": self.client_id})
                          op, payload = self._recv()
                          if op == OP_FRAME and payload.get("evt") == "READY":
                              self.user = ((payload.get("data") or {}).get("user") or {})
                              self.connected = True
                              self._stop.clear()
                              self._reader = threading.Thread(target=self._read_loop,
                                                              daemon=True)
                              self._reader.start()
                              if self.on_ready:
                                  try:
                                      self.on_ready(self.user)
                                  except Exception:
                                      pass
                              return True
                          self.pipe.close()
                          self.pipe = None
                      except Exception as e:
                          self.last_error = str(e)
                          if self.pipe:
                              self.pipe.close()
                          self.pipe = None
                      if time.time() > deadline:
                          break
                  return False

              def _read_loop(self):
                  while not self._stop.is_set():
                      try:
                          op, payload = self._recv()
                      except Exception as e:
                          self.last_error = str(e)
                          break
                      if op == OP_PING:
                          try:
                              self._send(OP_PONG, payload)
                          except Exception:
                              break
                      elif op == OP_CLOSE:
                          break
                  self.connected = False

              def close(self):
                  self._stop.set()
                  try:
                      self._send(OP_CLOSE, {})
                  except Exception:
                      pass
                  if self.pipe:
                      self.pipe.close()
                  self.pipe = None
                  self.connected = False

              def set_activity(self, activity):
                  if not self.connected and not self.connect():
                      return False
                  try:
                      self._send(OP_FRAME, {"cmd": "SET_ACTIVITY",
                                            "args": {"pid": os.getpid(),
                                                     "activity": activity},
                                            "nonce": str(uuid.uuid4())})
                      return True
                  except Exception as e:
                      self.last_error = str(e)
                      self.connected = False
                      return False

              def clear_activity(self):
                  if not self.connected:
                      return False
                  try:
                      self._send(OP_FRAME, {"cmd": "SET_ACTIVITY",
                                            "args": {"pid": os.getpid()},
                                            "nonce": str(uuid.uuid4())})
                      return True
                  except Exception:
                      return False


          def build_activity(*, details="", state="", large_image="", large_text="",
                             small_image="", small_text="", buttons=None, start=None,
                             end=None, party_id="", party_size=None, activity_type=0,
                             url="", **_):
              act: dict = {"type": activity_type}
              if details:
                  act["details"] = str(details)[:128]
              if state:
                  act["state"] = str(state)[:128]
              if start or end:
                  ts = {}
                  if start:
                      ts["start"] = int(float(start) * 1000)
                  if end:
                      ts["end"] = int(float(end) * 1000)
                  act["timestamps"] = ts
              assets = {}
              for k, v in (("large_image", large_image), ("small_image", small_image)):
                  if v:
                      assets[k] = str(v)
              if large_text:
                  assets["large_text"] = str(large_text)[:128]
              if small_text:
                  assets["small_text"] = str(small_text)[:128]
              if assets:
                  act["assets"] = assets
              if party_id:
                  p = {"id": str(party_id)[:128]}
                  if party_size:
                      p["size"] = list(party_size)[:2]
                  act["party"] = p
              if buttons:
                  act["buttons"] = [{"label": str(b["label"])[:32], "url": str(b["url"])}
                                    for b in buttons[:2]]
              if url:
                  act["url"] = str(url)
              return act


          def presets(name):
              now = time.time()
              P = {
                  "coding": dict(details="Cay code", state="venice-selfbot",
                                 large_image="vscode", large_text="Visual Studio Code",
                                 small_image="github", small_text="GitHub", start=now),
                  "listening": dict(details="Dang nghe", state="lo-fi chill",
                                    large_image="spotify", large_text="Spotify", start=now),
                  "gaming": dict(details="Dang choi", state="Ranked", large_image="game",
                                 large_text="Discord", start=now),
                  "streaming": dict(details="Live stream", state="Come watch",
                                    large_image="twitch", large_text="Twitch", start=now,
                                    buttons=[{"label": "Twitch",
                                              "url": "https://twitch.tv"}]),
                  "quest": dict(details="Auto quest", state="cay quest Discord",
                                large_image="discord", large_text="Discord", start=now),
              }
              return dict(P.get(name, P["quest"]))
          EOF_RPC

          cat > webui.py <<'EOF_WEBUI'
          """Dashboard web localhost (aiohttp)."""
          from __future__ import annotations

          import asyncio
          import json
          import time
          import webbrowser

          from aiohttp import web

          import core
          from core import cfg, log

          HTML = r"""<!doctype html>
          <html lang="vi"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Venice Selfbot</title>
          <style>
