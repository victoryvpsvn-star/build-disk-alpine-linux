          """BackupEngine."""
          from __future__ import annotations

          import asyncio

          from core import BACKUP_DIR, cfg, log, ts_name
          from .account import AccountBackup
          from .export import Exporter
          from .guilds import GuildBackup
          from .messages import MessageArchiver
          from .storage import BackupStore, list_stores

          __all__ = ["BackupEngine", "BackupStore", "MessageArchiver", "Exporter",
                     "list_stores"]


          class BackupEngine:
              def __init__(self, bot):
                  self.bot = bot
                  self.h = bot.httpx
                  self._running = False

              def new_store(self, label="manual"):
                  return BackupStore("%s-%s" % (ts_name(), label))

              def open(self, name):
                  p = BACKUP_DIR / name
                  if not p.exists():
                      cands = [d for d in BACKUP_DIR.iterdir() if name in d.name]
                      if not cands:
                          raise FileNotFoundError("khong thay backup '%s'" % name)
                      p = sorted(cands)[-1]
                  return BackupStore(p.name)

              def latest(self):
                  lst = list_stores()
                  if not lst:
                      raise FileNotFoundError("chua co backup nao")
                  return self.open(lst[0]["name"])

              def list(self):
                  return list_stores()

              def delete(self, name):
                  try:
                      self.open(name).destroy()
                      return True
                  except Exception:
                      return False

              def prune(self):
                  n = 0
                  for b in self.list()[int(cfg("backup.keep", 10)):]:
                      if self.delete(b["name"]):
                          n += 1
                  return n

              async def create(self, *, label="manual", parts=None, progress=None):
                  parts = parts or cfg("backup.default_parts",
                                       ["account", "guilds", "messages"])
                  store = self.new_store(label)
                  store.update(label=label, parts_requested=parts)
                  await self._run(store, parts, progress)
                  store.finalize()
                  self.prune()
                  return store

              async def _run(self, store, parts, progress):
                  async def note(t):
                      log.info("backup: %s", t)
                      if progress:
                          r = progress(t)
                          if asyncio.iscoroutine(r):
                              await r

                  if "account" in parts:
                      await note("tai khoan")
                      await AccountBackup(self.bot, store).run(progress=progress)
                      store.mark("account", "done")
                  if "guilds" in parts:
                      await note("server")
                      await GuildBackup(self.bot, store).backup_all(progress=progress)
                      store.mark("guilds", "done")
                  if "messages" in parts:
                      await note("tin nhan")
                      ma = MessageArchiver(self.bot, store)
                      if "guilds" in cfg("backup.messages.scope", []):
                          st, mine = await self.h.get("/users/@me/guilds")
                          for g in (mine or []):
                              await ma.archive_guild(int(g["id"]), progress=progress)
                              await asyncio.sleep(0.8)
                      if "dms" in cfg("backup.messages.scope", []):
                          await ma.archive_dms(progress=progress)
                      store.mark("messages", "done")

              async def restore(self, store, *, parts=None, dry_run=False, progress=None):
                  parts = parts or ["account"]
                  res = {}
                  if any(p in parts for p in ("account", "friends", "profile", "notes",
                                              "blocked")):
                      res["account"] = await AccountBackup(self.bot, store).restore(
                          dry_run=dry_run, progress=progress,
                          parts=None if "account" in parts else parts)
                  return res

              def verify(self, store):
                  import gzip
                  import json as j
                  bad, ok = [], 0
                  for f in store.files():
                      try:
                          if f.name.endswith(".json.gz"):
                              j.loads(gzip.decompress(f.read_bytes()))
                          ok += 1
                      except Exception as e:
                          bad.append({"file": str(f.relative_to(store.root)), "error": str(e)})
                  return {"ok": ok, "bad": bad}

              def exporter(self, store):
                  return Exporter(store)

              async def auto_loop(self):
                  if self._running:
                      return
                  self._running = True
                  await asyncio.sleep(120)
                  while self._running:
                      if cfg("backup.auto", True):
                          try:
                              await self.create(label="auto")
                          except Exception as e:
                              log.exception("auto backup: %s", e)
                      await asyncio.sleep(int(cfg("backup.interval_minutes", 720)) * 60)
          EOF_BINIT

