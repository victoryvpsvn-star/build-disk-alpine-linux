                      return await ctx.send(str(e))
                  m = await ctx.send("restore %s..." % s.name)

                  async def prog(t):
                      try:
                          await m.edit(content="restore: " + t)
                      except Exception:
                          pass

                  r = await self.e.restore(s, parts=f or ["account"], dry_run=dry,
                                           progress=prog)
                  a = r.get("account", {})
                  await m.edit(content="**%s** ok %s skip %s fail %s"
                                       % ("DRY" if dry else "XONG", a.get("ok", 0),
                                          a.get("skip", 0), a.get("fail", 0)))

              @backup.command(name="export")
              async def export(self, ctx, name: str = "latest", fmt: str = "html", *, raw: str = ""):
                  f, _, _ = flags(raw)
                  try:
                      s = self.e.latest() if name == "latest" else self.e.open(name)
                  except FileNotFoundError as e:
                      return await ctx.send(str(e))
                  ex = self.e.exporter(s)
                  if fmt == "html":
                      n = len(ex.export_all_html())
                  elif fmt == "csv":
                      n = len([ex.to_csv(r) for sc in ("guilds", "dms") for r in ex.rels(sc)])
                  elif fmt == "json":
                      n = (len([ex.merge_json(scope=sc, pretty=True)
                                for sc in ("guilds", "dms")]) if "merge" in f
                           else len(ex.export_all_json(pretty=True)))
                  else:
                      return await ctx.send("fmt: html|csv|json")
                  await ctx.send("%d file -> data/backups/%s/export/" % (n, s.name))

              @backup.command(name="jsons")
              async def jsons(self, ctx, name: str = "latest", mode: str = "per-channel"):
                  try:
                      s = self.e.latest() if name == "latest" else self.e.open(name)
                  except FileNotFoundError as e:
                      return await ctx.send(str(e))
                  ex = self.e.exporter(s)
                  n = (len([ex.merge_json(scope=sc, pretty=True)
                            for sc in ("guilds", "dms")]) if mode == "merge"
                       else len(ex.export_all_json(pretty=True)))
                  await ctx.send("%d file JSON" % n)

              @backup.command(name="convert")
              async def convert(self, ctx, name: str = "latest", *, raw: str = ""):
                  f, _, _ = flags(raw)
                  if "pretty" in f:
                      core.cfg_set("backup.messages.json_pretty", True)
                  try:
                      s = self.e.latest() if name == "latest" else self.e.open(name)
                  except FileNotFoundError as e:
                      return await ctx.send(str(e))
                  from backup.messages import MessageArchiver
                  n = MessageArchiver(self.bot, s).convert_store(
                      delete_jsonl=("drop-jsonl" in f))
                  s.finalize()
                  await ctx.send("sinh %d file .json" % n)

              @backup.command(name="search")
              async def search(self, ctx, name: str = "latest", *, q: str = ""):
                  if not q:
                      return await ctx.send("dung: .backup search latest <q>")
                  try:
                      s = self.e.latest() if name == "latest" else self.e.open(name)
                  except FileNotFoundError as e:
                      return await ctx.send(str(e))
                  h = self.e.exporter(s).search(q, limit=25)
                  if not h:
                      return await ctx.send("khong thay")
                  await ctx.send(core.truncate("\n".join(
                      "`%s` **%s**: %s"
                      % (m.get("_chan"), (m.get("author") or {}).get("username"),
                         (m.get("content") or "")[:100]) for m in h[:20])))

              @commands.command(name="msgbk", aliases=["msgb"])
              async def msgbk(self, ctx, channel: discord.TextChannel = None, *, raw: str = ""):
                  f, _, _ = flags(raw)
                  fmt = ("both" if "both" in f else ("jsonl" if "jsonl" in f
                                                     else ("json" if "json" in f else None)))
                  if "pretty" in f:
                      core.cfg_set("backup.messages.json_pretty", True)
                  limit = int(cfg("backup.messages.limit_per_channel", 0))
                  for x in f:
                      if x.startswith("limit="):
                          limit = int(x.split("=")[1])
                  from backup.messages import MessageArchiver
                  store = self.e.new_store("msgbk")
                  ma = MessageArchiver(self.bot, store)
                  targets = [channel] if channel else list(ctx.guild.text_channels)
                  m = await ctx.send("archive %d kenh" % len(targets))
                  total = 0
                  for i, ch in enumerate(targets, 1):
                      try:
                          total += await ma.archive_channel(
                              ch.id, scope="guilds/%d" % ctx.guild.id, label=ch.name,
                              guild_id=str(ctx.guild.id), limit=limit,
                              download_media=("media" in f), fmt=fmt)
                          await m.edit(content="[%d/%d] #%s (tong %d)"
                                               % (i, len(targets), ch.name, total))
                      except Exception:
                          pass
                  store.finalize()
                  await m.edit(content="xong `%s` | %d tin | %s"
                                       % (store.name, total, human_size(store.size())))

              @commands.command(name="guildbk", aliases=["gbk"])
              async def guildbk(self, ctx, guild_id: str = ""):
                  from backup.guilds import GuildBackup
                  store = self.e.new_store("guild")
                  gb = GuildBackup(self.bot, store)
                  ids = [int(guild_id)] if guild_id else [g.id for g in self.bot.guilds]
                  m = await ctx.send("backup %d server" % len(ids))
                  for i, gid in enumerate(ids, 1):
                      g = self.bot.get_guild(gid)
                      await m.edit(content="[%d/%d] %s"
                                           % (i, len(ids), g.name if g else gid))
                      await gb.backup_guild(gid)
                  store.finalize()
                  await m.edit(content="`%s` | %s" % (store.name, human_size(store.size())))

              @commands.command(name="clone")
              async def clone(self, ctx, guild_id: str = "", *, raw: str = ""):
                  f, dry, name = flags(raw)
                  target = next((int(x.split("=")[1]) for x in f if x.startswith("to=")), None)
                  if not guild_id:
                      return await ctx.send("dung: .clone <id> [--to=ID] [--dry] [ten]")
                  from backup.guilds import GuildBackup
                  store = None
                  for b in self.e.list():
                      try:
                          s = self.e.open(b["name"])
                          if s.has("guilds/" + guild_id):
                              store = s
                              break
                      except Exception:
                          continue
                  if not store:
                      return await ctx.send("chua co backup guild do. `.guildbk %s`" % guild_id)
                  m = await ctx.send("clone...")

                  async def prog(t):
                      try:
                          await m.edit(content="clone: " + t)
                      except Exception:
                          pass

                  r = await GuildBackup(self.bot, store).clone_to(
                      int(guild_id), name=name, target_guild_id=target,
                      dry_run=dry, progress=prog)
                  await m.edit(content="`%s`" % r)


          async def setup(bot):
              await bot.add_cog(BackupCog(bot))
          EOF_CBK

          cat > run.py <<'EOF_RUN'
          """Venice Selfbot - entrypoint."""
          import asyncio
          import importlib
          import multiprocessing
          import time
          import traceback

          import discord
          from discord.ext import commands

          import core
          from core import cfg, log

          COGS = ["backup", "quests", "automation", "premium", "tools",
                  "social", "voice", "misc"]

          BANNER = r"""
           __     __         _            ____       _ _     _           _
           \ \   / /__ _ __ (_) ___ ___  / ___|  ___| | |__ | |__   ___ | |_
            \ \ / / _ \ '_ \| |/ __/ _ \ \___ \ / _ \ | '_ \| '_ \ / _ \| __|
             \ V /  __/ | | | | (_|  __/  ___) |  __/ | |_) | |_) | (_) | |_
              \_/ \___|_| |_|_|\___\___| |____/ \___|_|_.__/|_.__/ \___/ \__|
                                                     v%s | Venice.ai
          """ % core.VERSION


          class VeniceBot(commands.Bot):
              def __init__(self):
                  super().__init__(
                      command_prefix=core.prefix(), self_bot=True,
                      intents=discord.Intents.all(),
                      chunk_guilds_at_startup=cfg("safety.chunk_guilds", False),
                      fetch_offline_members=False, help_command=None,
                      case_insensitive=True,
                      activity=discord.Activity(type=discord.ActivityType.playing,
                                                name="Venice.ai"),
                      status=(discord.Status.invisible if cfg("ghost")
                              else discord.Status.online))
                  self.httpx = core.SafeHTTP(cfg("token"))
                  self.boot = time.time()
                  self.ui = None

              async def setup_hook(self):
                  import backup as bp
                  import webui
                  self.backups = bp.BackupEngine(self)
                  for name in COGS:
                      try:
                          mod = importlib.import_module("cogs." + name)
                          await mod.setup(self)
                      except Exception:
                          log.error("cog %s:\n%s", name, traceback.format_exc())
                  self.ui = webui.WebUI(self, cfg("ui.host", "127.0.0.1"),
                                        cfg("ui.port", 8777))
                  try:
                      await self.ui.start()
                  except Exception:
                      log.error("ui:\n%s", traceback.format_exc())
                  self.loop.create_task(self.backups.auto_loop())

              async def on_ready(self):
                  log.info("=" * 62)
                  log.info("Dang nhap: %s (%s)", self.user, self.user.id)
                  log.info("Guilds: %d | Friends: %d",
                           len(self.guilds), len(self.user.friends))
                  log.info("Prefix: %s | Data: %s", core.prefix(), core.DATA_DIR)
                  log.info("UI token: %s", cfg("ui.token"))
                  log.info("=" * 62)

              async def on_command_error(self, ctx, err):
                  if isinstance(err, commands.CommandNotFound):
                      return
                  try:
                      await ctx.send("`%s: %s`" % (type(err).__name__, err))
                  except Exception:
                      pass

              async def close(self):
                  if self.ui:
                      await self.ui.stop()
                  await self.httpx.close()
                  await super().close()


          def ensure_token() -> bool:
              t = cfg("token", "")
              if t and "DAN" not in t[:6]:
                  return True
              print("\n[!] Chua co token trong %s" % core.CONFIG_PATH)
              try:
                  tok = input("Dan token: ").strip()
              except EOFError:
                  tok = ""
              if not tok:
                  return False
              core.cfg_set("token", tok)
              core.cfg_save()
              return True


          async def main():
              print(BANNER)
              if not ensure_token():
                  return
              bot = VeniceBot()
              try:
                  await bot.start(cfg("token"), reconnect=True)
              finally:
                  await bot.close()


          if __name__ == "__main__":
              multiprocessing.freeze_support()
              try:
                  asyncio.run(main())
              except KeyboardInterrupt:
                  log.info("da dung")
          EOF_RUN

          cat > build.py <<'EOF_BUILD'
          """Icon + spec + PyInstaller + package."""
          import argparse
          import os
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          APP = "VeniceSelfbot"
          VERSION = "4.0.0"

          SPEC_HEAD = '''# -*- mode: python ; coding: utf-8 -*-
          from PyInstaller.utils.hooks import collect_all, collect_submodules

          datas, binaries, hiddenimports = [], [], []
          for pkg in ("discord", "aiohttp", "certifi", "nacl"):
              try:
                  d, b, h = collect_all(pkg)
                  datas += d
                  binaries += b
                  hiddenimports += h
              except Exception:
                  pass

          hiddenimports += collect_submodules("cogs")
          hiddenimports += collect_submodules("backup")
          hiddenimports += ["rpc", "webui", "aiosignal", "frozenlist", "multidict",
                            "yarl", "attrs", "async_timeout", "charset_normalizer",
                            "audioop", "sqlite3", "ssl", "_ssl", "_socket", "select",
                            "unicodedata", "aiohttp.web"]

          a = Analysis(["run.py"], pathex=[], binaries=binaries, datas=datas,
                       hiddenimports=hiddenimports, hookspath=[], hooksconfig={},
                       runtime_hooks=[],
                       excludes=["tkinter", "matplotlib", "numpy", "pandas", "scipy",
                                 "PyQt5", "PySide2"],
                       noarchive=False)
          pyz = PYZ(a.pure, a.zipped_data)
          '''

          SPEC_ONE = '''
          exe = EXE(pyz, a.scripts, a.binaries, a.zipfiles, a.datas, [],
                    name="APPNAME", debug=False, bootloader_ignore_signals=False,
                    strip=False, upx=True, console=True, icon="assets/icon.ico",
                    version="version_info.txt")
          '''

          SPEC_DIR = '''
          exe = EXE(pyz, a.scripts, [], exclude_binaries=True, name="APPNAME",
                    debug=False, bootloader_ignore_signals=False, strip=False, upx=True,
                    console=True, icon="assets/icon.ico", version="version_info.txt")
          coll = COLLECT(exe, a.binaries, a.zipfiles, a.datas, strip=False, upx=True,
                         name="APPNAME")
          '''

          README = """Venice Selfbot v%s
          =================

          1. Chay VeniceSelfbot.exe
          2. Lan dau se hoi token -> dan token Discord vao
             (F12 > Application > Local Storage > discord.com > key "token")
          3. Dashboard tu mo o http://127.0.0.1:8777
          4. Trong Discord go .help

          Thu muc data/ (backup, log) nam canh file exe.
          Dat exe o noi ghi duoc (tranh C:\\Program Files).
          """


          def make_icon():
              Path("assets").mkdir(exist_ok=True)
              try:
                  from PIL import Image, ImageDraw
              except ImportError:
                  return
              S = 256
              img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.ellipse((4, 4, S - 4, S - 4), fill=(88, 101, 242, 255))
              d.polygon([(72, 70), (108, 70), (128, 186), (148, 70), (184, 70),
                         (146, 204), (110, 204)], fill=(255, 255, 255, 255))
              img.save("assets/icon.ico",
                       sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64),
                              (128, 128), (256, 256)])


          def make_version():
              Path("version_info.txt").write_text(
                  "VSVersionInfo(\n"
                  "  ffi=FixedFileInfo(filevers=(4,0,0,0), prodvers=(4,0,0,0),\n"
                  "    mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)),\n"
                  "  kids=[StringFileInfo([StringTable('040904B0', [\n"
                  "    StringStruct('CompanyName','Venice'),\n"
                  "    StringStruct('FileDescription','Venice Selfbot'),\n"
                  "    StringStruct('FileVersion','" + VERSION + "'),\n"
                  "    StringStruct('ProductName','Venice Selfbot'),\n"
                  "    StringStruct('ProductVersion','" + VERSION + "')])]),\n"
                  "    VarFileInfo([VarStruct('Translation',[1033,1200])])])\n",
                  encoding="utf-8")


          def write_spec(mode):
              body = SPEC_HEAD + (SPEC_ONE if mode == "onefile" else SPEC_DIR)
              Path("venice.spec").write_text(body.replace("APPNAME", APP), encoding="utf-8")


          def build(mode):
              write_spec(mode)
              subprocess.run([sys.executable, "-m", "PyInstaller", "--clean",
                              "--noconfirm", "venice.spec"], check=True)


          def package(mode):
              dist = Path("dist")
              name = Path("%s-%s-windows-%s.zip" % (APP, VERSION, mode))
              with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED) as z:
                  t = dist / (APP + ".exe") if mode == "onefile" else dist / APP
                  if t.is_dir():
                      for f in t.rglob("*"):
                          if f.is_file():
                              z.write(f, f.relative_to(dist))
                  elif t.exists():
                      z.write(t, t.name)
                  z.writestr("README.txt", README % VERSION)
                  z.writestr("plugins/example.py",
                             'from discord.ext import commands\n\n\n'
                             'class Example(commands.Cog):\n'
                             '    @commands.command(name="hello")\n'
                             '    async def hello(self, ctx):\n'
                             '        await ctx.send("hello tu plugin")\n\n\n'
                             'async def setup(bot):\n'
                             '    await bot.add_cog(Example(bot))\n')
              return name


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--mode", default="onefile",
                              choices=["onefile", "onedir", "both"])
              args = ap.parse_args()
              os.chdir(ROOT)
              make_icon()
              make_version()
              for m in (["onefile", "onedir"] if args.mode == "both" else [args.mode]):
                  build(m)
                  package(m)


          if __name__ == "__main__":
              main()
          EOF_BUILD

          echo "[+] Da ghi xong toan bo source."
          test -f requirements.txt && echo "requirements.txt OK"
          ls -la

      # ═══════════════════════════════════════════════════════════════
      # BƯỚC 2: SETUP PYTHON (requirements.txt da ton tai)
      # ═══════════════════════════════════════════════════════════════
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Compile check
        run: python -m compileall -q core.py rpc.py webui.py run.py build.py backup cogs

      - name: Build EXE
        shell: bash
        run: python build.py --mode "${{ inputs.mode || 'onefile' }}"

      - name: Dump build log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== warnings ==="
          find build -name "warn-*.txt" -exec cat {} \; 2>/dev/null | head -120
          echo "=== dist ==="
          ls -la dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeniceSelfbot-windows-${{ inputs.mode || 'onefile' }}
          path: |
            VeniceSelfbot-*.zip
            dist/**
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Venice Selfbot ${{ github.ref_name }}
          generate_release_notes: true
          files: VeniceSelfbot-*.zip
