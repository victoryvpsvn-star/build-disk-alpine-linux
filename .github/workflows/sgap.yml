          """Archiver tin nhan - resumable, JSONL + JSON derived."""
          from __future__ import annotations

          import asyncio
          import json
          import re

          from core import cfg, jitter, now_iso
          from .storage import BackupStore

          BAD = re.compile(r"[^\w.\-]+")


          def safe(s, n=60):
              return BAD.sub("_", str(s))[:n] or "x"


          def slim(m):
              a = m.get("author") or {}
              return {"id": m.get("id"), "timestamp": m.get("timestamp"),
                      "edited_timestamp": m.get("edited_timestamp"),
                      "author": {k: a.get(k) for k in
                                 ("id", "username", "global_name", "avatar")}
                                | {"bot": a.get("bot", False)},
                      "content": m.get("content"), "type": m.get("type"),
                      "pinned": m.get("pinned"),
                      "reference_id": (m.get("referenced_message") or {}).get("id")
                                      if m.get("referenced_message")
                                      else (m.get("message_reference") or {}).get("message_id"),
                      "attachments": [{k: x.get(k) for k in
                                       ("url", "filename", "size", "content_type",
                                        "width", "height")}
                                      for x in (m.get("attachments") or [])],
                      "embeds": [{"title": e.get("title"),
                                  "description": e.get("description"),
                                  "url": e.get("url"),
                                  "image": (e.get("image") or {}).get("url")}
                                 for e in (m.get("embeds") or [])],
                      "stickers": [{"name": s.get("name"), "id": s.get("id")}
                                   for s in (m.get("stickers") or [])],
                      "reactions": [{"emoji": (r.get("emoji") or {}).get("name")
                                              or (r.get("emoji") or {}).get("id"),
                                     "count": r.get("count")}
                                    for r in (m.get("reactions") or [])],
                      "mentions": [u.get("id") for u in (m.get("mentions") or [])],
                      "components": m.get("components") or None,
                      "flags": m.get("flags")}


          class MessageArchiver:
              def __init__(self, bot, store: BackupStore):
                  self.bot = bot
                  self.h = bot.httpx
                  self.s = store
                  try:
                      self.progress = self.s.read_json("messages/_progress.json")
                  except FileNotFoundError:
                      self.progress = {}

              def _save(self):
                  self.s.write_json("messages/_progress.json", self.progress)

              def _meta(self, rel, label="", guild_id=None):
                  return {"channel_id": rel.rsplit("/", 1)[-1],
                          "channel_name": label or None, "guild_id": guild_id,
                          "kind": "dm" if "/dms/" in rel + "/" else "guild",
                          "exported_at": now_iso()}

              def jsonl_to_json(self, rel, *, meta=None, fmt=None):
                  style = cfg("backup.messages.json_style", "object")
                  pretty = bool(cfg("backup.messages.json_pretty", False))
                  msgs = list(self.s.read_jsonl(rel))
                  if not msgs and cfg("backup.messages.skip_empty", True):
                      return None
                  msgs.reverse()
                  out = self.s.p(rel + ".json")
                  ind, nl = (1, "\n") if pretty else (None, "")
                  sep = ",\n" if pretty else ","
                  with open(out, "w", encoding="utf-8") as f:
                      if style == "array" or not cfg("backup.messages.json_meta", True):
                          f.write("[" + nl)
                          for i, m in enumerate(msgs):
                              f.write((sep if i else "") + json.dumps(m, ensure_ascii=False,
                                                                       indent=ind))
                          f.write(nl + "]")
                      else:
                          m0 = dict(meta or self._meta(rel))
                          m0["message_count"] = len(msgs)
                          if msgs:
                              m0["oldest"] = msgs[0].get("timestamp")
                              m0["newest"] = msgs[-1].get("timestamp")
                          f.write("{" + nl + '"meta":' + nl
                                  + json.dumps(m0, ensure_ascii=False, indent=ind)
                                  + sep + nl + '"messages":[' + nl)
                          for i, m in enumerate(msgs):
                              f.write((sep if i else "") + json.dumps(m, ensure_ascii=False,
                                                                       indent=ind))
                          f.write(nl + "]" + nl + "}")
                  return out

              def finalize_channel(self, rel, *, fmt=None, meta=None):
                  fmt = fmt or cfg("backup.messages.format", "json")
                  if fmt not in ("json", "both"):
                      return None
                  p = self.jsonl_to_json(rel, meta=meta)
                  if fmt == "json" and not cfg("backup.messages.keep_jsonl", True):
                      for cand in (rel + ".jsonl.gz", rel + ".jsonl"):
                          q = self.s.root / cand
                          if q.exists():
                              q.unlink()
                  return p

              def convert_store(self, *, delete_jsonl=False) -> int:
                  n = 0
                  for scope in ("guilds", "dms"):
                      base = self.s.root / "messages" / scope
                      if not base.exists():
                          continue
                      for f in list(base.rglob("*.jsonl.gz")) + list(base.rglob("*.jsonl")):
                          rel = str(f.relative_to(self.s.root / "messages"))
                          for suf in (".jsonl.gz", ".jsonl"):
                              if rel.endswith(suf):
                                  rel = rel[: -len(suf)]
                                  break
                          self.jsonl_to_json("messages/" + rel)
                          n += 1
                          if delete_jsonl:
                              for suf in (".jsonl.gz", ".jsonl"):
                                  q = base / (rel + suf)
                                  if q.exists():
                                      q.unlink()
                  return n

              async def archive_channel(self, channel_id, *, scope, label="", guild_id=None,
                                        limit=0, after=None, download_media=False, fmt=None):
                  key = str(channel_id)
                  rel = "messages/%s/%s" % (scope, key)
                  cursor = self.progress.get(key, {}).get("oldest")
                  got, page = 0, 0
                  max_mb = float(cfg("backup.messages.media_max_mb", 25))
                  while True:
                      params = {"limit": 100}
                      if cursor:
                          params["before"] = cursor
                      if after:
                          params["after"] = after
                      st, batch = await self.h.get("/channels/%s/messages" % key, params=params)
                      if st != 200 or not batch:
                          break
                      self.s.append_jsonl(rel, [slim(m) for m in batch])
                      got += len(batch)
                      cursor = batch[-1]["id"]
                      if download_media:
                          await self._dl(batch, key, max_mb)
                      self.progress[key] = {"oldest": cursor, "scope": scope,
                                            "label": label, "guild_id": guild_id,
                                            "at": now_iso()}
                      if page % 5 == 0:
                          self._save()
                      page += 1
                      if limit and got >= limit:
                          break
                      if len(batch) < 100:
                          break
                      await asyncio.sleep(jitter(0.25, 0.7))
                  self._save()
                  self.s.bump("messages", got)
                  self.finalize_channel(rel, fmt=fmt,
                                        meta=self._meta(rel, label, guild_id))
                  return got

              async def _dl(self, batch, channel_id, max_mb):
                  for m in batch:
                      for att in m.get("attachments") or []:
                          if not att.get("url") or (att.get("size") or 0) > max_mb * 1024 * 1024:
                              continue
                          dest = self.s.p("media/%s/%s_%s" % (channel_id, m["id"],
                                                             safe(att.get("filename", "f"))))
                          if dest.exists():
                              continue
                          try:
                              async with self.h.session.get(att["url"]) as r:
                                  if r.status == 200:
                                      dest.write_bytes(await r.read())
                                      self.s.bump("media")
                          except Exception:
                              pass

              async def archive_guild(self, guild_id, *, progress=None, fmt=None):
                  gid = str(guild_id)
                  st, chans = await self.h.get("/guilds/%s/channels" % gid)
                  if st != 200:
                      return 0
                  todo = [c for c in chans if c.get("type") in (0, 5, 15, 2)]
                  total = 0
                  for c in todo:
                      try:
                          n = await self.archive_channel(
                              int(c["id"]), scope="guilds/" + gid, label=c.get("name", ""),
                              guild_id=gid,
                              limit=int(cfg("backup.messages.limit_per_channel", 0)),
                              after=cfg("backup.messages.after"),
                              download_media=cfg("backup.messages.download_media", False),
                              fmt=fmt)
                          total += n
                          if progress:
                              r = progress("#%s -> %s" % (c.get("name"), n))
                              if asyncio.iscoroutine(r):
                                  await r
                      except Exception as e:
                          self.s.error("archive:%s" % c["id"], str(e))
                  st, at = await self.h.get("/guilds/%s/threads/active" % gid)
                  for t in ((at or {}).get("threads", []) if st == 200 else []):
                      try:
                          total += await self.archive_channel(
                              int(t["id"]), scope="guilds/%s/threads" % gid,
                              label=t.get("name", ""), guild_id=gid, fmt=fmt)
                      except Exception:
                          pass
                  self.s.mark("messages:" + gid, "ok", messages=total)
                  return total

              async def archive_dms(self, *, progress=None, fmt=None):
                  st, chans = await self.h.get("/users/@me/channels")
                  if st != 200:
                      return 0
                  total = 0
                  for c in chans or []:
                      try:
                          label = c.get("name") or ", ".join(
                              u.get("username", "?") for u in (c.get("recipients") or []))
                          total += await self.archive_channel(
                              int(c["id"]), scope="dms", label=label,
                              limit=int(cfg("backup.account.dm_limit", 0)), fmt=fmt)
                      except Exception as e:
                          self.s.error("dm:%s" % c["id"], str(e))
                  self.s.mark("messages:dms", "ok", messages=total)
                  return total
          EOF_MESSAGES

