          input,select,textarea{background:var(--card2);border:1px solid var(--bd);color:var(--fg);
                                padding:8px 10px;border-radius:8px;font-size:13px;width:100%}
          textarea{font-family:ui-monospace,Consolas,monospace;min-height:340px}
          pre{background:#0b0d11;border:1px solid var(--bd);border-radius:10px;padding:12px;
              max-height:520px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;
              white-space:pre-wrap;word-break:break-word}
          table{width:100%;border-collapse:collapse;font-size:13px}
          th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
          th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
          .hide{display:none}
