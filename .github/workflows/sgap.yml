          """Auto quest."""
          import asyncio
          import json
          from datetime import datetime, timezone

          from discord.ext import commands, tasks

          import core
          from core import log

          VIDEO = {"WATCH_VIDEO", "WATCH_VIDEO_ON_MOBILE"}
          DESKTOP = {"PLAY_ON_DESKTOP", "STREAM_ON_DESKTOP"}
          ACTIVITY = {"PLAY_ACTIVITY", "ACHIEVEMENT_IN_ACTIVITY"}


          def parse_task(c):
              for k in ("task_config_v2", "task_config"):
                  raw = c.get(k)
                  if not raw:
                      continue
                  if isinstance(raw, str):
                      try:
                          raw = json.loads(raw)
                      except Exception:
                          continue
                  if not isinstance(raw, dict):
                      continue
                  t = raw.get("tasks")
                  if isinstance(t, dict) and t:
                      n = next(iter(t))
                      return n, (t[n] or {})
                  if raw.get("type"):
                      return raw["type"], raw
              return None, {}


          def target_of(tc):
              for k in ("target", "video_duration_seconds", "duration", "seconds"):
                  v = tc.get(k)
                  if isinstance(v, (int, float)) and v > 0:
                      return int(v)
              return 0


          class Quests(commands.Cog):
              def __init__(self, bot):
                  self.bot = bot
                  self.h = bot.httpx
                  self.loop.start()

              def cog_unload(self):
                  self.loop.cancel()

              async def fetch(self):
                  st, d = await self.h.get("/users/@me/quests")
                  return d.get("quests", []) if st == 200 and isinstance(d, dict) else []

              async def enroll(self, qid):
                  st, _ = await self.h.post("/quests/%s/enroll" % qid,
                                            {"location": core.cfg("quests.enroll_location", 11),
                                             "is_mobile": False})
                  return st in (200, 201, 204)

              async def claim(self, qid):
                  st, _ = await self.h.post("/quests/%s/claim-reward" % qid, {})
                  if st in (200, 201, 204):
                      log.info("CLAIM quest %s", qid)
                  return st in (200, 201, 204)

              async def run_video(self, qid, target, cur=0.0):
                  step = core.cfg("quests.video_step", 5)
                  speed = core.cfg("quests.video_speed", 3.0)
                  ts = max(0.0, cur)
                  while ts < target:
                      ts = min(target, ts + step * speed)
                      await self.h.post("/quests/%s/video-progress" % qid,
                                        {"timestamp": round(ts, 3)})
                      await asyncio.sleep(step + core.jitter(0.1, 0.9))
                  await self.h.post("/quests/%s/video-progress" % qid,
                                    {"timestamp": float(target)})

              async def run_desktop(self, qid, target):
                  iv = core.cfg("quests.heartbeat_interval", 20)
                  e = 0
                  while e < target:
                      await self.h.post("/quests/%s/heartbeat" % qid,
                                        {"stream_key": "call:0", "terminal": False})
                      await asyncio.sleep(iv + core.jitter(0.5, 2.0))
                      e += iv

              async def process(self, q):
                  qid = q.get("id")
                  conf = q.get("config") or {}
                  us = q.get("user_status") or {}
                  exp = conf.get("expires_at")
                  if exp:
                      try:
                          if datetime.fromisoformat(exp.replace("Z", "+00:00")) \
                                  < datetime.now(timezone.utc):
                              return
                      except Exception:
                          pass
                  task, tc = parse_task(conf)
                  if not task:
                      return
                  tgt = target_of(tc)
                  up = task.upper()
                  if not us:
                      if not await self.enroll(qid):
                          return
                      await core.jsleep()
                  if us.get("completed_at"):
                      if core.cfg("quests.auto_claim", True) and not us.get("claimed_at"):
                          await self.claim(qid)
                      return
                  prog = float(((us.get("progress") or {}).get(task) or {}).get("value", 0) or 0)
                  if up in VIDEO and not (tgt and prog >= tgt):
                      await self.run_video(qid, tgt or 900, prog)
                  elif up in DESKTOP and not (tgt and prog >= tgt):
                      await self.run_desktop(qid, tgt or 900)
                  elif up in ACTIVITY:
                      app = (conf.get("application") or {}).get("id")
                      iv = core.cfg("quests.heartbeat_interval", 20)
                      e = 0
                      while e < (tgt or 900):
                          body = {"stream_key": "call:0", "terminal": False}
                          if app:
                              body["application_id"] = app
                          await self.h.post("/quests/%s/heartbeat" % qid, body)
                          await asyncio.sleep(iv + core.jitter(0.5, 2.0))
                          e += iv
                  await core.jsleep()
                  st, d = await self.h.get("/quests/%s" % qid)
                  if st == 200 and isinstance(d, dict):
                      u = d.get("user_status") or {}
                      if u.get("completed_at") and core.cfg("quests.auto_claim", True) \
                              and not u.get("claimed_at"):
                          await self.claim(qid)

              @tasks.loop(seconds=60)
              async def loop(self):
                  if not core.cfg("quests.enabled", True):
                      return
                  try:
                      for q in await self.fetch():
                          u = q.get("user_status") or {}
                          if u.get("completed_at") and u.get("claimed_at"):
                              continue
                          await self.process(q)
                          await core.jsleep()
                  except Exception as e:
                      log.exception("quest: %s", e)

              @loop.before_loop
              async def _b(self):
                  await self.bot.wait_until_ready()
                  await asyncio.sleep(15)

              async def cmd_run_web(self):
                  for q in await self.fetch():
                      u = q.get("user_status") or {}
                      if not (u.get("completed_at") and u.get("claimed_at")):
                          await self.process(q)
                          await core.jsleep()

              @commands.command(name="quests", aliases=["q"])
              async def cmd_q(self, ctx):
                  qs = await self.fetch()
                  if not qs:
                      return await ctx.send("khong co quest")
                  lines = ["**QUESTS**"]
                  for q in qs[:15]:
