          .a{{width:38px;height:38px;border-radius:50%;background:#5865f2;color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 38px}}
          .c{{white-space:pre-wrap}}.t{{color:#949ba4;font-size:12px;margin-left:8px}}
          .e{{border-left:3px solid #5865f2;padding:6px 10px;margin-top:6px;background:#1e1f22}}
          .r{{color:#949ba4;font-size:12px}}</style>
          <header><b>{t}</b><input id=q placeholder="tim..."><span id=n style="color:#949ba4"></span></header>
          <div class=wrap id=l>"""
          TAIL = """</div><script>const q=document.getElementById('q'),L=document.getElementById('l'),N=document.getElementById('n');
          let it=[...L.querySelectorAll('.m')];function f(){const v=q.value.toLowerCase();let c=0;
          for(const e of it){const h=!v||e.dataset.s.includes(v);e.style.display=h?'':'none';if(h)c++}N.textContent=c}
          q.oninput=f;f();</script>"""


          class Exporter:
              def __init__(self, store: BackupStore):
                  self.s = store

              def rels(self, scope):
                  base = self.s.root / "messages" / scope
                  if not base.exists():
                      return []
                  out = []
                  for f in list(base.rglob("*.jsonl.gz")) + list(base.rglob("*.jsonl")):
                      rel = str(f.relative_to(self.s.root / "messages"))
                      for suf in (".jsonl.gz", ".jsonl"):
                          if rel.endswith(suf):
                              rel = rel[: -len(suf)]
                              break
                      if rel not in out:
                          out.append(rel)
                  return sorted(out)

              def to_html(self, rel):
                  msgs = list(self.s.read_jsonl("messages/" + rel))
                  msgs.reverse()
                  out = self.s.p("export/%s.html" % rel.replace("/", "_"))
                  parts = [HEAD.format(t=html.escape(rel.replace("/", " . ")))]
                  for m in msgs:
                      a = m.get("author") or {}
                      s = html.escape(((m.get("content") or "") + " "
                                       + str(a.get("username"))).lower())
                      parts.append('<div class="m" data-s="%s"><div class="a">%s</div><div>'
                                   '<div><b>%s</b><span class="t">%s</span></div>'
                                   '<div class="c">%s</div>'
                                   % (s, html.escape((a.get("username") or "?")[:1].upper()),
                                      html.escape(a.get("global_name") or a.get("username") or "?"),
                                      (m.get("timestamp") or "")[:19].replace("T", " "),
                                      html.escape(m.get("content") or "")))
                      for at in m.get("attachments") or []:
                          parts.append('<div><a href="%s" target=_blank>%s</a></div>'
                                       % (html.escape(at.get("url") or ""),
                                          html.escape(at.get("filename") or "f")))
                      for e in m.get("embeds") or []:
                          if e.get("title") or e.get("description"):
                              parts.append('<div class="e"><b>%s</b><br>%s</div>'
                                           % (html.escape(e.get("title") or ""),
                                              html.escape((e.get("description") or "")[:600])))
                      if m.get("reactions"):
                          parts.append('<div class="r">%s</div>' % " ".join(
                              "%s %s" % (html.escape(str(r.get("emoji"))), r.get("count"))
                              for r in m["reactions"]))
                      parts.append("</div></div>")
                  out.write_text("".join(parts) + TAIL, encoding="utf-8")
                  return out

              def export_all_html(self):
                  return [self.to_html(r) for sc in ("guilds", "dms") for r in self.rels(sc)]

              def to_json(self, rel, *, pretty=False, out_rel=None):
                  msgs = list(self.s.read_jsonl("messages/" + rel))
                  msgs.reverse()
                  out = self.s.p(out_rel or ("export/%s.json" % rel.replace("/", "_")))
                  ind, nl = (1, "\n") if pretty else (None, "")
                  sep = ",\n" if pretty else ","
                  meta = {"channel": rel, "message_count": len(msgs), "exported_at": now_iso()}
                  with open(out, "w", encoding="utf-8") as f:
                      f.write("{" + nl + '"meta":' + nl
                              + json.dumps(meta, ensure_ascii=False, indent=ind)
                              + sep + nl + '"messages":[' + nl)
                      for i, m in enumerate(msgs):
                          f.write((sep if i else "") + json.dumps(m, ensure_ascii=False,
                                                                   indent=ind))
                      f.write(nl + "]" + nl + "}")
                  return out

              def export_all_json(self, *, pretty=False):
                  return [self.to_json(r, pretty=pretty) for sc in ("guilds", "dms")
                          for r in self.rels(sc)]

              def merge_json(self, *, scope="guilds", pretty=False, out_rel=None):
                  out = self.s.p(out_rel or ("export/_ALL_%s.json" % scope))
                  ind, nl = (1, "\n") if pretty else (None, "")
                  sep = ",\n" if pretty else ","
                  rels = self.rels(scope)
                  with open(out, "w", encoding="utf-8") as f:
                      f.write("{" + nl + '"meta":' + nl
                              + json.dumps({"scope": scope, "channels": len(rels),
                                            "exported_at": now_iso()},
                                           ensure_ascii=False, indent=ind)
                              + sep + nl + '"channels":[' + nl)
                      for i, rel in enumerate(rels):
                          msgs = list(self.s.read_jsonl("messages/" + rel))
                          msgs.reverse()
                          f.write((sep if i else "") + json.dumps(
                              {"channel": rel, "messages": msgs},
                              ensure_ascii=False, indent=ind))
                      f.write(nl + "]" + nl + "}")
                  return out

              def to_csv(self, rel):
                  out = self.s.p("export/%s.csv" % rel.replace("/", "_"))
                  with open(out, "w", newline="", encoding="utf-8") as f:
                      w = csv.writer(f)
                      w.writerow(["id", "timestamp", "author", "content", "attachments"])
                      for m in self.s.read_jsonl("messages/" + rel):
                          w.writerow([m.get("id"), m.get("timestamp"),
                                      (m.get("author") or {}).get("username"), m.get("content"),
                                      " ".join(a.get("url", "")
                                               for a in (m.get("attachments") or []))])
                  return out

              def search(self, query, *, limit=200):
                  q = query.lower()
                  hits = []
                  for sc in ("guilds", "dms"):
                      for rel in self.rels(sc):
                          for m in self.s.read_jsonl("messages/" + rel):
                              if q in (m.get("content") or "").lower():
                                  m["_chan"] = rel
                                  hits.append(m)
                                  if len(hits) >= limit:
                                      return hits
                  return hits
          EOF_EXPORT

