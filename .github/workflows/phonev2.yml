name: Virtual Phone - Auto Build, Test, Release

# CHI CAN FILE NAY (da chua san phone.py ben trong). Dat vao .github/workflows/ la xong.
# Tu dong hoan toan:
#  - push / PR          : build exe -> test build+reuse (Android 9 Go, 12-15) -> test boot+root
#  - push len main      : them buoc tu dong dang phone.exe len GitHub Releases
#  - moi thu Hai 02:00  : test lai de phat hien Google doi image/emulator
#  - chay tay           : chi hoi noi luu (D:\phone / C:\phone) va ban Android
#  - phone.exe --engine mumu : dieu khien MuMuPlayer (CI chi test thong bao loi, khong chay duoc MuMu tren runner)

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      storage_path:
        description: 'Noi luu virtual phone (vd D:\phone hoac C:\phone)'
        required: true
        default: 'D:\phone'
      android_version:
        description: 'Ban Android muon test'
        type: choice
        options: ['all', '9go', '12', '13', '14', '15']
        default: 'all'

concurrency:
  group: virtual-phone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 1. build exe
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Tao phone.py (nam ngay trong workflow - khong can file nao khac)
        shell: bash
        run: |
          cat > phone.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          phone.py - Android ao 9 Go (500 MB RAM) + 12-15 (1 file duy nhat, dong goi duoc thanh phone.exe)

            phone.exe                 -> hoi noi luu / ban Android / (RAM, Disk, Core neu chua co) -> boot

            Da co may ao  -> boot vao dung luon, KHONG build lai, KHONG hoi lai RAM/Disk/Core
            Chua co       -> hoi RAM + Disk + Core -> tai image -> tao -> boot
            Mac dinh luu o D:\\phone (nhap C:\\phone neu muon), bat root (adb root) + toi uu

            Android 9 Go (--version 9go): Android 9 (API 28, x86 32-bit) cau hinh kieu may Go:
            RAM mac dinh 512 MB, man hinh 480x854, heap nho -> chay duoc tren may yeu.

            Engine MuMuPlayer (--engine mumu): dieu khien MuMuPlayer 12 (MuMuManager.exe) de tao/boot may,
            dat RAM/CPU/man hinh, tu cai APK. Muot hon emulator Google. Chua cai MuMu -> tu mo trang tai
            (hoac --mumu-installer <file|url>) va tu tiep tuc khi cai xong.

          Build exe:
            pip install pyinstaller
            pyinstaller --onefile --name phone phone.py
          """
          import argparse
          import ctypes
          import json
          import os
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import time
          import traceback
          import urllib.request
          import zipfile

          try:
              sys.stdout.reconfigure(errors="replace")
          except Exception:
              pass

          API = {"9go": 28, "12": 31, "13": 33, "14": 34, "15": 35}
          CMDLINE_URL = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"

          C = {"cyan": "36", "green": "32", "yellow": "33", "red": "31"}


          DEBUG = True      # mac dinh BAT debug. Them --quiet de tat
          LOGF = None
          T0 = time.time()
          _ANSI = re.compile(r"\x1b\[[0-9;]*m")
          _PROG = re.compile(r"(\d+)% (.*?)\s*$")


          def _ts():
              s = int(time.time() - T0)
              return f"[{s // 60:02d}:{s % 60:02d}] "


          def _log(line):
              if LOGF:
                  try:
                      LOGF.write(_ANSI.sub("", line) + "\n")
                      LOGF.flush()
                  except Exception:
                      pass


          def say(msg, color="cyan"):
              line = _ts() + msg
              print(f"\033[{C[color]}m{line}\033[0m", flush=True)
              _log(line)


          def dbg(msg):
              line = "  [dbg] " + _ts() + msg
              _log(line)
              if DEBUG:
                  print(f"\033[90m{line}\033[0m", flush=True)


          def open_log(path):
              global LOGF
              d = os.path.join(path, "logs")
              os.makedirs(d, exist_ok=True)
              LOGF = open(os.path.join(d, time.strftime("phone-%Y%m%d-%H%M%S.log")), "w", encoding="utf-8", errors="replace")
              return LOGF.name, d


          def run(cmd, env=None, shell=False, input=None, echo=True):
              """Chay lenh, in + ghi log toan bo output (loc bot dong tien do), tra ve exit code."""
              dbg("$ " + (cmd if isinstance(cmd, str) else " ".join(cmd)))
              t = time.time()
              p = subprocess.Popen(cmd, env=env, shell=shell, stdin=subprocess.PIPE if input else None,
                                   stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                   text=True, encoding="utf-8", errors="replace", bufsize=1)
              if input:
                  try:
                      p.stdin.write(input)
                      p.stdin.close()
                  except Exception:
                      pass
              last_act, last_pct = None, -100
              for raw in p.stdout:
                  line = raw.rstrip()
                  if not line.strip():
                      continue
                  m = _PROG.search(line) if line.lstrip().startswith("[") else None
                  if m:   # dong thanh tien do: chi hien moi 5%
                      pct, act = int(m.group(1)), re.sub(r"\.\.\. .*$", "...", m.group(2))[:40]
                      if act == last_act and pct < last_pct + 5 and pct < 100:
                          continue
                      last_act, last_pct = act, pct
                  _log(line)
                  if echo:
                      print(line, flush=True)
              p.wait()
              dbg(f"  -> exit {p.returncode} ({time.time() - t:.0f}s)")
              return p.returncode


          def env_dump(path):
              dbg(f"{platform.platform()} | python {platform.python_version()} | exe={getattr(sys, 'frozen', False)}")
              dbg("args: " + " ".join(sys.argv[1:]))
              try:
                  ram, cores = host_info()
                  dbg(f"may: RAM {ram} MB, {cores} core logic")
                  du = shutil.disk_usage(os.path.splitdrive(path)[0] + "\\")
                  dbg(f"o dia: trong {du.free / 2**30:.1f} GB / tong {du.total / 2**30:.1f} GB")
              except Exception as e:
                  dbg(f"khong doc duoc thong tin may: {e}")


          def ask(msg, default, auto):
              if auto:
                  return str(default)
              v = input(f"{msg} [{default}]: ").strip()
              return v if v else str(default)


          def host_info():
              class MS(ctypes.Structure):
                  _fields_ = [("dwLength", ctypes.c_ulong), ("dwMemoryLoad", ctypes.c_ulong),
                              ("ullTotalPhys", ctypes.c_ulonglong), ("ullAvailPhys", ctypes.c_ulonglong),
                              ("ullTotalPageFile", ctypes.c_ulonglong), ("ullAvailPageFile", ctypes.c_ulonglong),
                              ("ullTotalVirtual", ctypes.c_ulonglong), ("ullAvailVirtual", ctypes.c_ulonglong),
                              ("ullAvailExtendedVirtual", ctypes.c_ulonglong)]
              m = MS()
              m.dwLength = ctypes.sizeof(MS)
              ctypes.windll.kernel32.GlobalMemoryStatusEx(ctypes.byref(m))
              return int(m.ullTotalPhys / 1024 / 1024), os.cpu_count() or 2


          def set_ini(path, updates):
              data, order = {}, []
              with open(path, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.rstrip("\r\n")
                      if "=" in line and not line.lstrip().startswith("#"):
                          k, v = line.split("=", 1)
                          k = k.strip()
                          if k not in data:
                              order.append(k)
                          data[k] = v.strip()
              for k, v in updates.items():
                  if k not in data:
                      order.append(k)
                  data[k] = str(v)
              with open(path, "w", encoding="utf-8") as f:
                  for k in order:
                      f.write(f"{k}={data[k]}\n")


          def read_ini(path):
              d = {}
              with open(path, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      if "=" in line and not line.lstrip().startswith("#"):
                          k, v = line.split("=", 1)
                          d[k.strip()] = v.strip()
              return d


          def download(url, dest):
              dbg(f"GET {url}")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (phone.exe)"})
              t = time.time()
              with urllib.request.urlopen(req, timeout=120) as r, open(dest, "wb") as f:
                  total = int(r.headers.get("Content-Length") or 0)
                  got, nxt = 0, 10
                  while True:
                      b = r.read(1 << 20)
                      if not b:
                          break
                      f.write(b)
                      got += len(b)
                      el = max(time.time() - t, 0.1)
                      sp = got / el / 2**20
                      if total and got * 100 // total >= nxt:
                          eta = int((total - got) / max(got / el, 1))
                          say(f"  tai {got * 100 // total}% ({got >> 20}/{total >> 20} MB) {sp:.1f} MB/s, con ~{eta}s")
                          nxt += 10
              el = max(time.time() - t, 0.1)
              say(f"  xong {got >> 20} MB trong {el:.0f}s ({got / el / 2**20:.1f} MB/s)")


          # ----------------------------------------------------------------------------
          JDK_URL = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse"


          def ensure_java(path, env):
              """Tu tai JDK 17 portable vao <path>\\jdk - khong cai gi vao Windows."""
              jdk = os.path.join(path, "jdk")
              if not os.path.exists(os.path.join(jdk, "bin", "java.exe")):
                  say(f"Tai JDK 17 portable vao {jdk} (khong can cai gi vao may)...")
                  z, tmp = os.path.join(path, "jdk.zip"), os.path.join(path, "_jdk_tmp")
                  download(JDK_URL, z)
                  shutil.rmtree(tmp, ignore_errors=True)
                  with zipfile.ZipFile(z) as zf:
                      zf.extractall(tmp)
                  inner = os.path.join(tmp, os.listdir(tmp)[0])
                  shutil.rmtree(jdk, ignore_errors=True)
                  shutil.move(inner, jdk)
                  shutil.rmtree(tmp, ignore_errors=True)
                  os.remove(z)
              env["JAVA_HOME"] = jdk
              pk = next((k for k in env if k.lower() == "path"), "PATH")
              env[pk] = os.path.join(jdk, "bin") + os.pathsep + env.get(pk, "")


          def ensure_accel(emu, env):
              """Emulator can ao hoa CPU. Tu kiem tra, tu bat Windows Hypervisor Platform neu co quyen Admin."""
              r = subprocess.run([emu, "-accel-check"], capture_output=True, text=True, env=env)
              out = ((r.stdout or "") + (r.stderr or "")).lower()
              dbg("accel-check: " + out.strip().replace("\n", " | ")[:300])
              if r.returncode == 0 and "usable" in out:
                  return
              say("Chua bat ao hoa (Windows Hypervisor Platform). Dang thu bat...", "yellow")
              if ctypes.windll.shell32.IsUserAnAdmin():
                  subprocess.run(["dism", "/online", "/enable-feature", "/featurename:HypervisorPlatform", "/all", "/norestart"])
                  raise SystemExit("Da bat Windows Hypervisor Platform. KHOI DONG LAI may roi chay lai phone.exe (may ao van con nguyen).")
              raise SystemExit("Can quyen Admin de bat ao hoa 1 lan: chuot phai phone.exe -> Run as administrator. "
                               "(Neu van loi: bat Virtualization / SVM trong BIOS.)")


          _DT = {}


          def enable_ansi():
              """Bat mau ANSI tren console Windows (khong con hien ra ky tu la <-[33m)."""
              try:
                  k = ctypes.windll.kernel32
                  for std in (-11, -12):
                      h = k.GetStdHandle(std)
                      mode = ctypes.c_ulong()
                      if k.GetConsoleMode(h, ctypes.byref(mode)):
                          k.SetConsoleMode(h, mode.value | 4)
              except Exception:
                  pass



          def disk_type(path):
              """Tra ve 'SSD' / 'HDD' / '' (khong ro) cua o dia chua path."""
              try:
                  letter = os.path.splitdrive(path)[0].rstrip(":")
                  if not letter.isalpha():
                      return ""
                  if letter in _DT:
                      return _DT[letter]
                  r = subprocess.run(["powershell", "-NoProfile", "-Command",
                                      f"(Get-Partition -DriveLetter {letter} | Get-Disk | Get-PhysicalDisk).MediaType"],
                                     capture_output=True, text=True, timeout=25)
                  _DT[letter] = (r.stdout or "").strip()
                  return _DT[letter]
              except Exception:
                  return ""


          # ----------------------------------------------------------------------------
          # Engine MuMuPlayer: phone.exe dieu khien MuMuPlayer 12 qua MuMuManager.exe (can ban V4.0.0.3179 tro len)
          MUMU_URL = "https://www.mumuplayer.com/download/"
          MUMU_WAIT = 1200   # giay cho nguoi dung cai xong MuMuPlayer


          def find_mumu(hint=None):
              """Tim MuMuManager.exe / mumu-cli.exe (hint la thu muc cai hoac file exe)."""
              bases = [hint or "", os.environ.get("MUMU_PATH", "")]
              try:
                  import winreg
                  for root in (winreg.HKEY_LOCAL_MACHINE, winreg.HKEY_CURRENT_USER):
                      for sub in (r"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
                                  r"SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"):
                          try:
                              k = winreg.OpenKey(root, sub)
                          except OSError:
                              continue
                          for i in range(winreg.QueryInfoKey(k)[0]):
                              try:
                                  s = winreg.OpenKey(k, winreg.EnumKey(k, i))
                                  nm = winreg.QueryValueEx(s, "DisplayName")[0]
                                  if "mumu" in nm.lower():
                                      for val in ("InstallLocation", "DisplayIcon"):
                                          try:
                                              v = str(winreg.QueryValueEx(s, val)[0]).strip('"').split(",")[0]
                                              bases.append(v if os.path.isdir(v) else os.path.dirname(v))
                                          except OSError:
                                              pass
                              except OSError:
                                  continue
              except Exception:
                  pass
              for dl in "CDEFG":
                  for pf in ("Program Files", "Program Files (x86)", ""):
                      for nm in ("MuMuPlayer-12.0", "MuMuPlayerGlobal-12.0", "MuMuPlayer"):
                          bases.append(os.path.join(f"{dl}:\\", pf, "Netease", nm))
              for b in bases:
                  if not b:
                      continue
                  if os.path.isfile(b):
                      return b
                  for sd in ("", "shell", "nx_main"):
                      for exe in ("MuMuManager.exe", "mumu-cli.exe"):
                          q = os.path.join(b, sd, exe)
                          if os.path.isfile(q):
                              return q
              return shutil.which("MuMuManager.exe") or shutil.which("mumu-cli.exe")


          def ensure_mumu(a):
              """Co MuMuPlayer -> dung luon. Chua co -> chay bo cai (file/URL do ban chi) hoac mo trang tai chinh thuc, roi tu cho cai xong."""
              con = find_mumu(a.mumu_path)
              if con:
                  return con
              inst = a.mumu_installer
              if not inst and a.auto:
                  raise SystemExit("Khong tim thay MuMuPlayer (MuMuManager.exe). Cai MuMuPlayer 12 tai " + MUMU_URL +
                                   " hoac chi bo cai: --mumu-installer <file|url> ; da cai o cho khac: --mumu-path <thu muc>")
              if inst:
                  if inst.lower().startswith("http"):
                      dest = os.path.join(os.environ.get("TEMP", "."), "mumu-setup.exe")
                      say("Tai bo cai MuMuPlayer...")
                      download(inst, dest)
                      inst = dest
                  if not os.path.isfile(inst):
                      raise SystemExit(f"Khong thay bo cai MuMuPlayer: {inst}")
                  say("Chay bo cai MuMuPlayer: lam theo cua so cai dat, xong phone.exe tu tiep tuc.", "yellow")
                  subprocess.Popen([inst])
              else:
                  say(f"Chua co MuMuPlayer -> mo trang tai: {MUMU_URL}", "yellow")
                  say("Tai ve, chay file cai dat (Next -> Install). Xong phone.exe tu tiep tuc (cho toi da 20 phut)...", "yellow")
                  try:
                      import webbrowser
                      webbrowser.open(MUMU_URL)
                  except Exception:
                      pass
              t0 = time.time()
              while time.time() - t0 < MUMU_WAIT:
                  con = find_mumu(a.mumu_path)
                  if con:
                      time.sleep(5)
                      return con
                  time.sleep(5)
              raise SystemExit("Khong tim thay MuMuPlayer sau 20 phut. Cai xong roi chay lai, hoac chi duong dan: --mumu-path <thu muc>")


          def parse_info(out):
              """info tra JSON: 1 may -> {index:..}, nhieu may -> {'0': {...}, '1': {...}}. Tra ve {chi_so: dict}."""
              try:
                  d = json.loads(out[out.index("{"):out.rindex("}") + 1])
              except Exception:
                  return {}
              if "index" in d:
                  return {str(d["index"]): d}
              return {str(k): v for k, v in d.items() if isinstance(v, dict)}


          def run_mumu(a, path):
              con = ensure_mumu(a)
              say(f"MuMuPlayer: {con}", "green")

              def mm(*args, timeout=120):
                  try:
                      r = subprocess.run([con, *args], capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=timeout)
                  except subprocess.TimeoutExpired:
                      dbg(f"mumu {' '.join(args)} -> TIMEOUT {timeout}s")
                      return ""
                  out = ((r.stdout or "") + (r.stderr or "")).strip()
                  dbg(f"mumu {' '.join(args)} -> {out[:200]!r}")
                  return out

              def info(i="all"):
                  return parse_info(mm("info", "-v", str(i)))

              def setk(idx, k, v, warn=True):
                  mm("setting", "-v", str(idx), "-k", k, "-val", str(v))
                  got = mm("setting", "-v", str(idx), "-k", k)
                  if warn and str(v) not in got:
                      say(f"CANH BAO: khong xac nhan duoc {k}={v} (MuMu tra ve: {got[:80]!r}). Chinh trong Cai dat MuMuPlayer neu can.", "yellow")

              def apply(idx, ram=None, cores=None, size=False):
                  if ram or cores:
                      setk(idx, "performance_mode", "custom", warn=False)
                  if cores:
                      setk(idx, "performance_cpu.custom", max(1, min(16, cores)))
                  if ram:
                      setk(idx, "performance_mem.custom", f"{ram / 1024:.6f}")
                  if size:
                      setk(idx, "resolution_mode", "custom", warn=False)
                      setk(idx, "resolution_width.custom", 720)
                      setk(idx, "resolution_height.custom", 1280)
                      setk(idx, "resolution_dpi.custom", 240)
                  if not a.no_root:
                      setk(idx, "root_permission", "true", warn=False)

              idx_f = os.path.join(path, "mumu-index.txt")
              idx = None
              if os.path.exists(idx_f):
                  s = open(idx_f, encoding="utf-8").read().strip()
                  if s.isdigit() and s in info(s):
                      idx = int(s)
              if idx is not None:
                  say(f"[REUSE] Da co may MuMu index {idx} -> bo qua tao, boot luon.", "green")
                  if (a.ram or a.cores) and not info(idx).get(str(idx), {}).get("is_process_started"):
                      say("Cap nhat cau hinh may ao...")
                      apply(idx, a.ram, a.cores)
              else:
                  say("[BUILD] Chua co may MuMu cua phone.exe -> tao may moi.", "yellow")
                  host_ram, host_cores = host_info()
                  ram_def = max(2048, min(4096, round(host_ram * 0.35 / 256) * 256))
                  ram = a.ram or int(ask("RAM cho may ao (MB)", ram_def, a.auto))
                  cores = a.cores or int(ask("So core CPU", max(2, min(4, host_cores // 2)), a.auto))
                  before = set(info("all"))
                  mm("create")
                  new = sorted(set(info("all")) - before, key=int)
                  if not new:
                      raise SystemExit("Tao may MuMu that bai (can MuMuPlayer 12 ban V4.0.0.3179 tro len; xem log).")
                  idx = int(new[-1])
                  with open(idx_f, "w", encoding="utf-8") as fh:
                      fh.write(str(idx))
                  apply(idx, ram, cores, size=True)
                  say(f"Da tao xong may MuMu index {idx}. Config: RAM {ram}MB, Core {cores}, 720x1280", "green")

              if a.no_boot:
                  say(f"Xong (no-boot). Thu muc: {path}", "green")
                  return

              if not info(idx).get(str(idx), {}).get("is_process_started"):
                  mm("control", "-v", str(idx), "launch")
              say("Dang cho MuMuPlayer boot ...")
              t0 = time.time()
              while not info(idx).get(str(idx), {}).get("is_android_started"):
                  if time.time() - t0 > 300:
                      raise SystemExit("MuMuPlayer boot qua 5 phut. Mo MuMuPlayer bang tay xem loi (bat Virtualization/VT trong BIOS).")
                  time.sleep(3)
              say(f"MuMuPlayer da boot xong sau {int(time.time() - t0)}s.", "green")

              # cai APK trong <path>\\apks (moi file chi cai 1 lan)
              apk_dir = os.path.join(path, "apks")
              os.makedirs(apk_dir, exist_ok=True)
              done_f = os.path.join(apk_dir, ".installed")
              done = set(open(done_f, encoding="utf-8").read().split("\n")) if os.path.exists(done_f) else set()
              todo = [os.path.abspath(x) for x in (a.apk or [])]
              todo += [os.path.join(apk_dir, x) for x in sorted(os.listdir(apk_dir)) if x.lower().endswith((".apk", ".xapk", ".apks"))]
              for f in todo:
                  if f in done:
                      continue
                  say(f"Cai {os.path.basename(f)} ...")
                  out = mm("control", "-v", str(idx), "app", "install", "-apk", f, timeout=900)
                  bad = re.search(r"fail|error|not found|invalid", out, re.I)
                  say(out or "(khong co phan hoi)", "red" if bad else "green")
                  if not bad:
                      with open(done_f, "a", encoding="utf-8") as fh:
                          fh.write(f + "\n")

              say("San sang! Dang nhap Google roi cai Roblox (hoac dat file .apk vao thu muc apks).", "yellow")
              say(f"Lan sau chay lai: phone.exe --engine mumu --path {path}  (boot luon, khong tao lai)")


          # ----------------------------------------------------------------------------
          def main():
              global DEBUG
              ap = argparse.ArgumentParser(prog="phone")
              ap.add_argument("cmd", nargs="?", default="run", choices=["run"])
              ap.add_argument("--path")
              ap.add_argument("--version", choices=list(API), help="9go = Android 9 Go (500 MB RAM) | 12 | 13 | 14 | 15")
              ap.add_argument("--ram", type=int, help="MB")
              ap.add_argument("--disk", type=int, help="GB")
              ap.add_argument("--cores", type=int)
              ap.add_argument("--no-root", action="store_true")
              ap.add_argument("--no-boot", action="store_true")
              ap.add_argument("--headless", action="store_true")
              ap.add_argument("--quiet", action="store_true", help="tat debug (mac dinh debug BAT, log o <path>\\logs)")
              ap.add_argument("--gpu", default="host", help="host (mac dinh) | angle_indirect | swiftshader_indirect (CPU, cham)")
              ap.add_argument("--auto", action="store_true", help="khong hoi, dung mac dinh/tham so")
              ap.add_argument("--playstore", action="store_true", help="dung image co Google Play (cai Roblox...), khong root")
              ap.add_argument("--apk", action="append", help="file .apk tu cai sau khi boot (co the dung nhieu lan)")
              ap.add_argument("--engine", choices=["mumu", "google"], help="mumu = dieu khien MuMuPlayer (muot, tu mo trang cai neu chua co) | google = emulator Google (mac dinh khi --auto)")
              ap.add_argument("--mumu-path", help="thu muc cai MuMuPlayer (co MuMuManager.exe), vd C:\\Program Files\\Netease\\MuMuPlayer-12.0")
              ap.add_argument("--mumu-installer", help="file hoac URL bo cai MuMuPlayer: phone.exe chay no roi tu cho cai xong")
              a = ap.parse_args()
              DEBUG = not a.quiet

              if os.name != "nt":
                  raise SystemExit("Ban exe nay chay tren Windows.")
              enable_ansi()

              # ---- 1. noi luu ----
              path = (a.path or ask("Luu virtual phone o dau? (vd D:\\phone hoac C:\\phone)", "D:\\phone", a.auto)).rstrip("\\/")
              drive = os.path.splitdrive(path)[0] + "\\"
              if not os.path.exists(drive):
                  raise SystemExit(f"O dia {drive} khong ton tai. Chon duong dan khac (vd C:\\phone).")
              os.makedirs(path, exist_ok=True)
              logfile, logdir = open_log(path)
              say(f"DEBUG {'BAT' if DEBUG else 'TAT'} | log: {logfile}", "yellow")
              env_dump(path)
              if a.engine:
                  eng = a.engine
              elif a.auto:
                  eng = "google"
              else:
                  eng = ask("Engine: mumu = MuMuPlayer (muot hon, tu huong dan cai neu chua co) | google = emulator cua Google",
                            "mumu", False).strip().lower()
              if eng not in ("mumu", "google"):
                  raise SystemExit(f"Engine khong hop le: {eng} (chon mumu hoac google)")
              if eng == "mumu":
                  run_mumu(a, path)
                  return
              ver = a.version or ask("Chon Android (9go = Android 9 Go, 500 MB RAM, sieu nhe | 12 = nhe | 13 = can bang | 14, 15 = nang hon)", "13", a.auto)
              if ver not in API:
                  raise SystemExit(f"Version khong hop le: {ver} (chon 9go, 12, 13, 14 hoac 15)")
              go = ver == "9go"
              if ver in ("14", "15") and not a.auto:
                  try:
                      if host_info()[0] <= 8300:
                          say("Goi y: may <= 8 GB RAM, Android 14/15 rat nang -> Android 9go, 12 hoac 13 se muot hon nhieu.", "yellow")
                  except Exception:
                      pass
              api = API[ver]

              sdk, avd_home = os.path.join(path, "sdk"), os.path.join(path, "avd")
              base = f"phone-a{ver}"
              have_plain = os.path.exists(os.path.join(avd_home, f"{base}.avd", "config.ini"))
              have_play = os.path.exists(os.path.join(avd_home, f"{base}-play.avd", "config.ini"))
              play = a.playstore
              if not play and not have_plain and not a.auto:
                  play = ask("Cai Roblox/app tu Google Play? y = co Play Store (KHONG root) | n = root, khong Play Store",
                             "y", False).lower().startswith("y")
              elif not play and have_play and not have_plain:
                  play = True
              name = base + ("-play" if play else "")
              # google_apis = userdebug -> adb root duoc | google_apis_playstore = co Play Store, khong root
              # Android 9 Go dung image x86 (32-bit) cho tiet kiem RAM; cac ban con lai x86_64
              abi = "x86" if go else "x86_64"
              img = f"system-images;android-{api};{'google_apis_playstore' if play else 'google_apis'};{abi}"
              for d in (sdk, avd_home, os.path.join(path, ".android")):
                  os.makedirs(d, exist_ok=True)

              env = dict(os.environ, ANDROID_SDK_ROOT=sdk, ANDROID_HOME=sdk, ANDROID_AVD_HOME=avd_home,
                         ANDROID_USER_HOME=os.path.join(path, ".android"))
              sdkm = os.path.join(sdk, "cmdline-tools", "latest", "bin", "sdkmanager.bat")
              avdm = os.path.join(sdk, "cmdline-tools", "latest", "bin", "avdmanager.bat")
              adb_exe = os.path.join(sdk, "platform-tools", "adb.exe")
              emu = os.path.join(sdk, "emulator", "emulator.exe")
              cfg = os.path.join(avd_home, f"{name}.avd", "config.ini")

              def adb(*args, timeout=60):
                  try:
                      r = subprocess.run([adb_exe, *args], capture_output=True, text=True, errors="replace",
                                         timeout=timeout, env=env)
                  except subprocess.TimeoutExpired:
                      dbg(f"adb {' '.join(args)} -> TIMEOUT {timeout}s")
                      return ""
                  out = (r.stdout or "").strip()
                  if args[:3] != ("shell", "getprop", "sys.boot_completed"):
                      err = (r.stderr or "").strip()
                      dbg(f"adb {' '.join(args)} -> {out[:160]!r}" + (f" | err: {err[:160]!r}" if err else ""))
                  return out

              # ---- 2. da co -> reuse ----
              if os.path.exists(cfg) and os.path.exists(emu):
                  say(f"[REUSE] Da co '{name}' tai {avd_home} -> bo qua build, boot luon.", "green")
              else:
                  say(f"[BUILD] Chua co '{name}' -> bat dau tao.", "yellow")
                  host_ram, host_cores = host_info()
                  say(f"May ban: RAM {host_ram} MB, {host_cores} core logic.")
                  free_gb = shutil.disk_usage(drive).free / 2**30
                  max_disk = int(free_gb - 20)   # tru ~6 GB SDK/image se tai + ~13 GB emulator can them
                  if free_gb < 12:
                      say(f"CANH BAO: o {drive} chi con {free_gb:.1f} GB trong (can ~12 GB cho SDK + image + may ao).", "red")
                  if not a.auto:
                      t = disk_type(path)
                      if "HDD" in t.upper():
                          say(f"CANH BAO: o {drive} la HDD -> may ao se cham. Nen chon o SSD (vd C:\\phone).", "red")
                      elif t:
                          say(f"O luu tru: {t}")
                  if go:
                      ram_def = 512   # Android Go: ~500 MB RAM
                      min_ram = 384
                      say("Android 9 Go: RAM mac dinh 512 MB, man hinh 480x854 (kieu may Go gia re).", "yellow")
                  else:
                      ram_def = max(2048, min(4096, round(host_ram * 0.35 / 256) * 256))
                      min_ram = 1536
                  ram = a.ram or int(ask("RAM cho may ao (MB) - nen <= 40% RAM may", ram_def, a.auto))
                  disk = a.disk or int(ask(f"Dung luong o dia cho may ao (GB, toi da ~{max_disk}; 8-16 la du, cang lon boot dau cang lau)", min(8, max(2, max_disk)), a.auto))
                  cores = a.cores or int(ask("So core CPU - nen <= 1/2 core may", max(2, min(4, host_cores // 2)), a.auto))
                  if ram > host_ram * 0.5:
                      say(f"CANH BAO: cap {ram} MB tren may chi co {host_ram} MB -> Windows thieu RAM se rat lag. Nen <= {int(host_ram * 0.4)} MB.", "red")
                  if cores > max(2, host_cores - 2):
                      say(f"CANH BAO: cap {cores}/{host_cores} core -> may chu bi tranh CPU, de lag. Nen {max(2, host_cores // 2)} core.", "red")
                  if ram < min_ram or disk < 2 or cores < 1:
                      raise SystemExit(f"Toi thieu: RAM {min_ram} MB, Disk 2 GB, Core 1.")
                  if max_disk < 2:
                      raise SystemExit(f"O {drive} chi con {free_gb:.0f} GB trong, khong du (can it nhat ~22 GB). Chon o khac hoac giai phong dung luong.")
                  if disk > max_disk:
                      say(f"Disk {disk} GB qua lon: o {drive} chi con {free_gb:.0f} GB trong (emulator can them ~13 GB). "
                          f"Tu giam xuong {max_disk} GB.", "red")
                      disk = max_disk

                  ensure_java(path, env)

                  if not os.path.exists(sdkm):
                      say("Tai Android cmdline-tools...")
                      z, tmp = os.path.join(os.environ.get("TEMP", path), "cmdline-tools.zip"), os.path.join(sdk, "_tmp")
                      download(CMDLINE_URL, z)
                      shutil.rmtree(tmp, ignore_errors=True)
                      with zipfile.ZipFile(z) as zf:
                          zf.extractall(tmp)
                      os.makedirs(os.path.join(sdk, "cmdline-tools"), exist_ok=True)
                      shutil.rmtree(os.path.join(sdk, "cmdline-tools", "latest"), ignore_errors=True)
                      shutil.move(os.path.join(tmp, "cmdline-tools"), os.path.join(sdk, "cmdline-tools", "latest"))
                      shutil.rmtree(tmp, ignore_errors=True)
                      os.remove(z)

                  say("Chap nhan license + tai emulator, platform-tools, system image (vai GB, doi chut)...")
                  run(f'"{sdkm}" --sdk_root="{sdk}" --licenses', env=env, shell=True, input="y\n" * 40, echo=False)
                  vb = " --verbose" if DEBUG else ""
                  if run(f'"{sdkm}" --sdk_root="{sdk}"{vb} "platform-tools" "emulator" "{img}"', env=env, shell=True) != 0:
                      raise SystemExit(f"sdkmanager loi khi tai {img} (xem log o tren)")

                  say(f"Tao may ao {name} (Android {'9 Go' if go else ver} / API {api})...")
                  run(f'"{avdm}" create avd -n "{name}" -k "{img}" -d pixel_6 --force', env=env, shell=True, input="no\n")
                  if not os.path.exists(cfg):
                      raise SystemExit("Tao AVD that bai.")

                  # Android Go: man hinh nho 480x854 (hdpi), heap nho; cac ban khac 720x1600
                  lw, lh, ld = (480, 854, 240) if go else (720, 1600, 320)
                  set_ini(cfg, {
                      "hw.ramSize": ram, "hw.cpu.ncore": cores, "disk.dataPartition.size": f"{disk}G",
                      "vm.heapSize": 128 if go else 576, "hw.gpu.enabled": "yes", "hw.gpu.mode": "host",
                      "hw.keyboard": "yes", "hw.audioInput": "no",
                      "hw.lcd.width": lw, "hw.lcd.height": lh, "hw.lcd.density": ld,
                      "skin.name": f"{lw}x{lh}", "skin.path": "_no_skin",
                      "hw.sensors.proximity": "no", "hw.sensors.magnetic_field": "no", "hw.sensors.humidity": "no",
                      "hw.sensors.pressure": "no", "hw.sensors.temperature": "no",
                      "hw.camera.back": "none", "hw.camera.front": "none", "showDeviceFrame": "no",
                      "fastboot.forceColdBoot": "no", "fastboot.forceFastBoot": "yes",
                  })
                  if play:
                      set_ini(cfg, {"PlayStore.enabled": "true"})
                  say(f"Da tao xong. Config: RAM {ram}MB, Disk {disk}GB, Core {cores}", "green")

              if a.no_boot:
                  say(f"Xong (no-boot). Thu muc: {path}", "green")
                  return

              # ---- 3. boot ----
              ensure_accel(emu, env)
              upd = {}
              if a.ram:
                  upd["hw.ramSize"] = a.ram
              if a.cores:
                  upd["hw.cpu.ncore"] = a.cores
              if upd:
                  say(f"Cap nhat may ao: {upd}")
                  set_ini(cfg, upd)
              ini = read_ini(cfg)
              mm = re.match(r"(\d+)\s*([GM])", ini.get("disk.dataPartition.size", ""), re.I)
              if mm and not os.path.exists(os.path.join(avd_home, f"{name}.avd", "userdata-qemu.img")):
                  size_gb = int(mm.group(1)) / (1024 if mm.group(2).upper() == "M" else 1)
                  free_now = shutil.disk_usage(drive).free / 2**30
                  if size_gb + 14 > free_now:
                      new = max(2, min(int(free_now - 14), 24))
                      say(f"Disk may ao {size_gb:.0f} GB > cho trong ({free_now:.0f} GB, emulator can them ~13 GB) -> tu giam xuong {new} GB.", "red")
                      set_ini(cfg, {"disk.dataPartition.size": f"{new}G"})
                      ini = read_ini(cfg)
              args = [emu, "-avd", name, "-gpu", a.gpu, "-accel", "on", "-no-boot-anim",
                      "-memory", ini.get("hw.ramSize", "512" if go else "2048"), "-cores", ini.get("hw.cpu.ncore", "2")]
              if a.gpu in ("host", "angle_indirect", "auto"):
                  # Log cho thay Google "server flags" ep ForceSwiftshader -> render bang CPU -> lag. Tat co do.
                  args += ["-feature", "-ForceSwiftshader"]
              if a.headless:
                  args.append("-no-window")
              if DEBUG:
                  args.append("-verbose")
              elog = os.path.join(logdir, time.strftime("emulator-%Y%m%d-%H%M%S.log"))
              say(f"Khoi dong {name} ... (log emulator: {elog})")
              dbg("lenh: " + " ".join(args))
              flags = getattr(subprocess, "DETACHED_PROCESS", 0) | getattr(subprocess, "CREATE_NO_WINDOW", 0)
              with open(elog, "wb") as ef:
                  proc = subprocess.Popen(args, env=env, creationflags=flags, close_fds=True, stdout=ef, stderr=subprocess.STDOUT)
              subprocess.run([adb_exe, "start-server"], env=env, capture_output=True)

              def dump_fail():
                  try:
                      lines = open(elog, errors="replace").read().splitlines()
                  except Exception as ex:
                      lines = []
                      say(f"Khong doc duoc log emulator: {ex}", "red")
                  errs = [x for x in lines if re.search(r"FATAL|PANIC|ERROR|Not enough|failed|cannot", x, re.I)]
                  say("---- LOI CHINH trong log emulator ----", "red")
                  for x in errs[-8:] or lines[-8:]:
                      say(x.strip(), "red")
                  text = "\n".join(lines)
                  if "Not enough space" in text:
                      say("GOI Y: het cho trong o dia -> chay lai voi Disk nho hon (vd --disk 16) hoac chon o con nhieu cho trong.", "yellow")
                  if re.search(r"whpx|hax|hypervisor|vt-x|virtualization", text, re.I) and "FATAL" in text:
                      say("GOI Y: ao hoa CPU co van de -> bat Windows Hypervisor Platform / Virtualization trong BIOS.", "yellow")
                  say("---- 15 dong cuoi log emulator ----", "red")
                  tail = "\n".join(lines[-15:])
                  print(tail)
                  _log(tail)
                  if proc.poll() is None:
                      say("---- logcat (80 dong cuoi) ----", "red")
                      lc = adb("logcat", "-d", "-t", "80", timeout=30)
                      print(lc)
                      _log(lc)

              t0, lastp = time.time(), 0
              while adb("shell", "getprop", "sys.boot_completed") != "1":
                  el = time.time() - t0
                  if proc.poll() not in (None, 0):
                      dump_fail()
                      raise SystemExit(f"Emulator thoat som (ma {proc.returncode}). Xem log: {elog}")
                  if el > 600:
                      dump_fail()
                      raise SystemExit("Boot qua 10 phut. Kiem tra Windows Hypervisor Platform / BIOS. Xem log: " + elog)
                  if el - lastp >= 30:
                      lastp = el
                      dbg(f"dang cho boot... {int(el)}s")
                  time.sleep(3)
              say(f"Android da boot xong sau {int(time.time() - t0)}s.", "green")
              try:
                  mg = re.search(r"Graphics Adapter Android Emulator OpenGL ES Translator \(([^)]*)\)", open(elog, errors="replace").read())
                  if mg and "swiftshader" in mg.group(1).lower():
                      say("CANH BAO: dang render bang CPU (SwiftShader) -> rat lag. Cap nhat driver card do hoa (Intel/NVIDIA/AMD), "
                          "hoac thu: phone.exe --gpu angle_indirect", "red")
                  elif mg:
                      say(f"Render bang GPU: {mg.group(1)}", "green")
              except Exception:
                  pass

              # ---- 4. root ----
              if play:
                  say("Ban Play Store: khong root (Play Store va Roblox can may chua root).", "yellow")
              elif not a.no_root:
                  adb("root")
                  time.sleep(2)
                  adb("wait-for-device")
                  uid = adb("shell", "id")
                  say(f"ROOT OK: {uid}" if "uid=0" in uid else f"Root that bai: {uid}", "green" if "uid=0" in uid else "red")

              # ---- 4b. cai APK trong <path>\\apks (moi file chi cai 1 lan) + mo Roblox tren Play Store ----
              apk_dir = os.path.join(path, "apks")
              os.makedirs(apk_dir, exist_ok=True)
              done_f = os.path.join(apk_dir, ".installed")
              done = set(open(done_f, encoding="utf-8").read().split("\n")) if os.path.exists(done_f) else set()
              todo = [os.path.abspath(x) for x in (a.apk or [])]
              todo += [os.path.join(apk_dir, x) for x in sorted(os.listdir(apk_dir)) if x.lower().endswith(".apk")]
              for f in todo:
                  if f in done:
                      continue
                  say(f"Cai {os.path.basename(f)} ...")
                  out = adb("install", "-r", "-g", f, timeout=900)
                  say(out or "(khong co phan hoi)", "green" if "Success" in out else "red")
                  if "Success" in out:
                      with open(done_f, "a", encoding="utf-8") as fh:
                          fh.write(f + "\n")
              if play and "com.roblox.client" not in adb("shell", "pm", "list", "packages", "com.roblox.client"):
                  say("Mo Play Store -> Roblox: dang nhap Google roi bam Cai dat.", "yellow")
                  adb("shell", "am", "start", "-a", "android.intent.action.VIEW", "-d", "market://details?id=com.roblox.client")

              # ---- 5. toi uu ----
              for k in ("window_animation_scale", "transition_animation_scale", "animator_duration_scale"):
                  adb("shell", "settings", "put", "global", k, "0")
              adb("shell", "settings", "put", "global", "stay_on_while_plugged_in", "7")
              adb("shell", "settings", "put", "system", "screen_off_timeout", "1800000")
              adb("shell", "settings", "put", "global", "development_settings_enabled", "1")
              for pkg in ("com.google.android.youtube", "com.google.android.apps.maps", "com.google.android.apps.photos",
                          "com.google.android.apps.docs", "com.google.android.videos", "com.google.android.music",
                          "com.google.android.gm", "com.google.android.apps.youtube.music", "com.google.android.apps.tachyon",
                          "com.google.android.apps.messaging", "com.google.android.apps.wellbeing") if not play else ():
                  adb("shell", "pm", "disable-user", "--user", "0", pkg)   # tat app nen khong can (bo qua neu khong co)
              say(f"San sang! adb: {adb_exe}", "green")
              say("Meo: tat may ao bang nut X cua cua so emulator (dung kill) de luu snapshot -> lan sau boot nhanh.")
              say(f"Lan sau chay lai: phone.exe --path {path} --version {ver}{' --playstore' if play else ''}  (boot luon, khong build)")


          if __name__ == "__main__":
              rc = 0
              try:
                  main()
              except KeyboardInterrupt:
                  pass
              except SystemExit as e:
                  if e.code not in (None, 0):
                      say(f"LOI: {e.code}", "red")
                      rc = 1
              except Exception:
                  say("LOI KHONG MONG DOI:", "red")
                  tb = traceback.format_exc()
                  print(tb)
                  _log(tb)
                  rc = 1
              if LOGF:
                  say(f"Log chi tiet: {LOGF.name}")
              if getattr(sys, "frozen", False) and (len(sys.argv) == 1 or rc) and sys.stdin and sys.stdin.isatty():
                  input("\nNhan Enter de thoat...")
              sys.exit(rc)
          PYEOF

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai PyInstaller
        run: pip install pyinstaller

      - name: Kiem tra cu phap
        run: python -m py_compile phone.py

      - name: Build phone.exe
        run: pyinstaller --onefile --name phone phone.py

      - name: Smoke test exe
        shell: pwsh
        run: ./dist/phone.exe --help

      - name: Smoke test engine MuMu (runner khong co MuMuPlayer -> phai bao loi ro rang)
        shell: pwsh
        run: |
          $out = & ./dist/phone.exe --engine mumu --mumu-path C:\nope --auto --path "$env:RUNNER_TEMP\mumutest" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -eq 0) { Write-Host "Phai that bai khi khong co MuMuPlayer"; exit 1 }
          if ($out -notmatch "Khong tim thay MuMuPlayer") { Write-Host "Thieu thong bao 'Khong tim thay MuMuPlayer'"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: phone-exe
          path: dist/phone.exe
          if-no-files-found: error

  # ------------------------------------------------ 2. test build -> reuse (Windows)
  exe-test:
    needs: build-exe
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.android_version != 'all' && format('["{0}"]', inputs.android_version) || '["9go","12","13","14","15"]') }}
    env:
      STORE: ${{ inputs.storage_path || 'D:\phone' }}
      # Android 9 Go: 512 MB RAM + man hinh 480x854; cac ban khac 2048 MB + 720x1600
      TEST_RAM: ${{ matrix.version == '9go' && '512' || '2048' }}
      TEST_LCDW: ${{ matrix.version == '9go' && '480' || '720' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-exe

      - name: Lan 1 - phai BUILD
        shell: bash
        run: |
          ./phone.exe --path "$STORE" --version ${{ matrix.version }} --ram "$TEST_RAM" --disk 4 --cores 2 --auto --no-boot 2>&1 | tee run1.log
          grep -q '\[BUILD\]' run1.log || { echo 'Lan 1 phai la BUILD'; exit 1; }

      - name: Kiem tra luu dung noi + dung RAM/Core/Disk
        shell: bash
        run: |
          CFG="$(cygpath -u "$STORE")/avd/phone-a${{ matrix.version }}.avd/config.ini"
          test -f "$CFG" || { echo "Khong thay $CFG"; ls -R "$(cygpath -u "$STORE")" | head -50; exit 1; }
          grep -E 'hw.ramSize|hw.cpu.ncore|disk.dataPartition.size|hw.gpu.mode|hw.lcd' "$CFG"
          for p in "hw.ramSize=$TEST_RAM" 'hw.cpu.ncore=2' 'disk.dataPartition.size=4G' 'hw.gpu.mode=host' "hw.lcd.width=$TEST_LCDW"; do
            tr -d '\r' < "$CFG" | grep -qxF "$p" || { echo "Config sai: thieu $p"; exit 1; }
          done

      - name: Lan 2 - phai REUSE (khong build lai, khong hoi lai)
        shell: bash
        run: |
          ./phone.exe --path "$STORE" --version ${{ matrix.version }} --auto --no-boot 2>&1 | tee run2.log
          grep -q '\[REUSE\]' run2.log || { echo 'Lan 2 phai la REUSE'; exit 1; }
          ! grep -q '\[BUILD\]' run2.log || { echo 'Lan 2 khong duoc build lai'; exit 1; }

      - name: Ban Play Store (de cai Roblox) - chi Android 15
        if: matrix.version == '15'
        shell: bash
        run: |
          ./phone.exe --path "$STORE" --version 15 --playstore --ram 2048 --disk 4 --cores 2 --auto --no-boot 2>&1 | tee run3.log
          grep -q '\[BUILD\]' run3.log || { echo 'Ban Play Store phai duoc BUILD'; exit 1; }
          CFG="$(cygpath -u "$STORE")/avd/phone-a15-play.avd/config.ini"
          test -f "$CFG" || { echo "Khong thay $CFG"; exit 1; }
          SDKDIR="$(cygpath -u "$STORE")/sdk/system-images/android-35/google_apis_playstore/x86_64"
          test -d "$SDKDIR" || { echo "Khong thay image Play Store: $SDKDIR"; exit 1; }
          echo "--- dong lien quan Play Store trong config.ini ---"
          tr -d '\r' < "$CFG" | grep -i 'playstore\|tag.id\|image.sysdir' || true
          tr -d '\r' < "$CFG" | grep -qi '^PlayStore.enabled *= *true' || { echo 'PlayStore.enabled chua bat'; exit 1; }

      - name: Gom log + in 40 dong cuoi (de thay loi ngay trong job)
        if: always()
        shell: bash
        run: |
          mkdir -p logs-out
          cp "$(cygpath -u "$STORE")"/logs/*.log logs-out/ 2>/dev/null || echo "(khong co log trong $STORE/logs)"
          for f in logs-out/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (40 dong cuoi)"
            tail -n 40 "$f"
            echo "::endgroup::"
          done

      - name: Luu log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android-${{ matrix.version }}
          path: |
            run*.log
            logs-out/*.log

  # ------------------------------------------ 3. test boot + root that (Linux, KVM)
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 28 = Android 9 Go (x86 32-bit, 512 MB RAM) | 31-35 = Android 12-15 (x86_64, 2 GB RAM)
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.android_version != 'all' && format('[{0}]', fromJSON('{"9go":28,"12":31,"13":33,"14":34,"15":35}')[inputs.android_version]) || '[28,31,33,34,35]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Bat KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot + root + toi uu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.api == 28 && 'x86' || 'x86_64' }}
          profile: pixel_6
          ram-size: ${{ matrix.api == 28 && '512M' || '2048M' }}
          cores: 2
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell "id | grep -q uid=0"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell getprop ro.build.version.release

  # ----------------------------------------------- 4. tu dong phat hanh (chi main)
  release:
    needs: [build-exe, exe-test, boot-test]
    # Luon dang phone.exe moi nhat (ke ca khi test do) de ban tai ve dung - ban test do se danh dau Pre-release
    if: ${{ !cancelled() && needs.build-exe.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: phone-exe

      - name: Dang len GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Virtual Phone build ${{ github.run_number }}${{ (needs.exe-test.result != 'success' || needs.boot-test.result != 'success') && ' (test chua xanh)' || '' }}
          prerelease: ${{ needs.exe-test.result != 'success' || needs.boot-test.result != 'success' }}
          make_latest: ${{ needs.exe-test.result == 'success' && needs.boot-test.result == 'success' }}
          body: |
            phone.exe - Android ao 9 Go (500 MB RAM) + 12-15 (root hoac Play Store), tu tai Java + SDK vao thu muc ban chon.
            Chay `phone.exe`: lan dau hoi RAM/Disk/Core roi build, cac lan sau boot luon. Log o <noi luu>\logs.
            Android 9 Go: `phone.exe --version 9go` (RAM mac dinh 512 MB, man hinh 480x854).
            Engine MuMuPlayer (muot hon, tu huong dan cai neu chua co): `phone.exe --engine mumu`.

            Ket qua test: exe-test = ${{ needs.exe-test.result }}, boot-test = ${{ needs.boot-test.result }}
          files: phone.exe
