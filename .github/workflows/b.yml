# ═══════════════════════════════════════════════════════════════
#  NETCUT — Auto Build & Release (pure Go, không cần bash files)
#  Push tag v1.x.x → Test → Build exe/deb → Release
# ═══════════════════════════════════════════════════════════════

name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═══ 1) TEST — compile Go trên cả Ubuntu & Windows ═══
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug — xem repo có gì
        shell: bash
        run: ls -la

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Smoke test (help + version, không cần admin)
        shell: bash
        run: |
          go run . version
          go run . help

  # ═══ 2) BUILD WINDOWS — netcut.exe ═══
  build-windows:
    name: Build Windows (exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build netcut.exe
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/netcut.exe .

      - name: Test exe
        shell: bash
        env:
          NETCUT_NO_ELEVATE: '1'
        run: ./dist/netcut.exe version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # ═══ 3) BUILD LINUX — binary Go + .deb ═══
  build-linux:
    name: Build Linux (deb + binary)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build linux binary
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/netcut-linux-amd64 .

      - name: Build .deb
        run: |
          V="${{ steps.ver.outputs.version }}"
          DV="${V#v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          cat > pkg/DEBIAN/control <<EOF
          Package: netcut
          Version: $DV
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          Description: NetCut - Network Access Controller
           Quan ly thiet bi / cat mang LAN.
          EOF
          cp dist/netcut-linux-amd64 pkg/usr/local/bin/netcut
          chmod 755 pkg/usr/local/bin/netcut
          dpkg-deb --build --root-owner-group pkg "netcut_${DV}_amd64.deb"
          mv netcut_${DV}_amd64.deb dist/
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # ═══ 4) RELEASE — chỉ chạy khi push tag v* ═══
  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum netcut* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            ## 📦 NetCut ${{ github.ref_name }}

            ### 🪟 Windows
            Tải `netcut.exe` → double-click → bấm **Yes** khi UAC hỏi.
            ```powershell
            .\netcut.exe scan
            .\netcut.exe cut-ip 192.168.1.100 "ly do"
            .\netcut.exe restore-all
            ```

            ### 🐧 Debian 13
            ```bash
            sudo apt install ./netcut_*_amd64.deb
            # hoặc:
            sudo install netcut-linux-amd64 /usr/local/bin/netcut
            
