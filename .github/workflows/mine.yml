name: Build BlockCopy (Fabric 1.21.11)

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Discord bot token"
        required: true
        type: string
      channel_id:
        description: "Discord channel ID"
        required: true
        default: "1558356008328372305"
        type: string

permissions:
  contents: write

env:
  MC_VERSION: "1.21.11"
  YARN: "1.21.11+build.1"
  LOADER: "0.18.1"
  FABRIC_API: "0.139.4+1.21.11"
  LOOM: "1.14-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Che token trong log
        env:
          BOT_TOKEN: ${{ inputs.token }}
        run: echo "::add-mask::$BOT_TOKEN"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Tao project
        run: |
          mkdir -p src/main/resources src/client/java/com/example/blockcopy

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'blockcopy'
          EOF

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=$MC_VERSION
          yarn_mappings=$YARN
          loader_version=$LOADER
          fabric_version=$FABRIC_API
          loom_version=$LOOM
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }
          version = '1.0.0'
          group = 'com.example'
          base { archivesName = 'blockcopy' }
          repositories { mavenCentral() }
          loom {
              splitEnvironmentSourceSets()
              mods {
                  blockcopy {
                      sourceSet sourceSets.main
                      sourceSet sourceSets.client
                  }
              }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "blockcopy",
            "version": "${version}",
            "name": "BlockCopy",
            "description": "Chon vung block va gui qua Discord",
            "environment": "client",
            "entrypoints": { "client": ["com.example.blockcopy.BlockCopyClient"] },
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "~1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          EOF

          cat > src/client/java/com/example/blockcopy/DiscordSender.java <<'EOF'
          package com.example.blockcopy;

          import java.io.ByteArrayOutputStream;
          import java.net.URI;
          import java.net.http.*;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.*;
          import java.util.UUID;

          public class DiscordSender {
              static final String BOT_TOKEN  = "__BOT_TOKEN__";
              static final String CHANNEL_ID = "__CHANNEL_ID__";
              static final HttpClient HTTP = HttpClient.newHttpClient();

              public static void send(Path file, String message) throws Exception {
                  String boundary = "----bc" + UUID.randomUUID();
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  String json = "{\"content\":\"" + message.replace("\\", "\\\\").replace("\"", "\\\"") + "\"}";
                  out.write(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"payload_json\"\r\n"
                          + "Content-Type: application/json\r\n\r\n" + json + "\r\n").getBytes(StandardCharsets.UTF_8));
                  out.write(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"files[0]\"; filename=\""
                          + file.getFileName() + "\"\r\nContent-Type: application/gzip\r\n\r\n").getBytes(StandardCharsets.UTF_8));
                  out.write(Files.readAllBytes(file));
                  out.write(("\r\n--" + boundary + "--\r\n").getBytes(StandardCharsets.UTF_8));
                  HttpRequest req = HttpRequest.newBuilder()
                      .uri(URI.create("https://discord.com/api/v10/channels/" + CHANNEL_ID + "/messages"))
                      .header("Authorization", "Bot " + BOT_TOKEN)
                      .header("Content-Type", "multipart/form-data; boundary=" + boundary)
                      .POST(HttpRequest.BodyPublishers.ofByteArray(out.toByteArray()))
                      .build();
                  HttpResponse<String> res = HTTP.send(req, HttpResponse.BodyHandlers.ofString());
                  if (res.statusCode() >= 300)
                      throw new RuntimeException("Discord " + res.statusCode() + ": " + res.body());
              }
          }
          EOF

          cat > src/client/java/com/example/blockcopy/BlockCopyClient.java <<'EOF'
          package com.example.blockcopy;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientChunkEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.render.Camera;
          import net.minecraft.block.BlockState;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.world.chunk.WorldChunk;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.decoration.ArmorStandEntity;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.hit.*;
          import net.minecraft.util.math.*;
          import net.minecraft.world.RaycastContext;
          import org.lwjgl.glfw.GLFW;

          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import java.util.zip.GZIPOutputStream;

          public class BlockCopyClient implements ClientModInitializer {
              static KeyBinding keySend, keyFree;
              static BlockPos a, b;

              // ---- cache chunk: nho moi chunk tung tai, ke ca khi client da bo no ----
              static final LinkedHashMap<Long, WorldChunk> CACHE = new LinkedHashMap<>() {
                  @Override protected boolean removeEldestEntry(Map.Entry<Long, WorldChunk> e) { return size() > 4000; }
              };
              static ClientWorld cachedWorld;
              static long lastSendMs;

              static BlockState stateAt(ClientWorld w, BlockPos p) {
                  WorldChunk c = CACHE.get(ChunkPos.toLong(p.getX() >> 4, p.getZ() >> 4));
                  return c != null ? c.getBlockState(p) : w.getBlockState(p);
              }

              static int missingChunks(BlockBox box) {
                  int miss = 0;
                  for (int cx = box.getMinX() >> 4; cx <= box.getMaxX() >> 4; cx++)
                      for (int cz = box.getMinZ() >> 4; cz <= box.getMaxZ() >> 4; cz++)
                          if (!CACHE.containsKey(ChunkPos.toLong(cx, cz))) miss++;
                  return miss;
              }

              // vung can copy: lay X/Z tu A va B, con Y luon la TOAN BO chieu cao the gioi (day -> tran)
              static BlockBox area(ClientWorld w) {
                  BlockBox h = BlockBox.create(a, b);
                  int y0 = w.getBottomY(), y1 = w.getBottomY() + w.getHeight() - 1;
                  return new BlockBox(h.getMinX(), y0, h.getMinZ(), h.getMaxX(), y1, h.getMaxZ());
              }

              static void info(MinecraftClient mc) {
                  if (a == null || b == null) return;
                  BlockBox box = area(mc.world);
                  int total = ((box.getMaxX() >> 4) - (box.getMinX() >> 4) + 1) * ((box.getMaxZ() >> 4) - (box.getMinZ() >> 4) + 1);
                  msg(mc, "Hop " + box.getBlockCountX() + "x" + box.getBlockCountY() + "x" + box.getBlockCountZ()
                      + " | chunk chua tai: " + missingChunks(box) + "/" + total + " (chunk thieu hien do tren man hinh)");
              }

              // ================= ESP (ve len HUD bang phep chieu 3D -> 2D) =================
              static Vec3d pPos = Vec3d.ZERO, pF = Vec3d.ZERO, pR = Vec3d.ZERO, pU = Vec3d.ZERO;
              static double pScale;
              static int pW, pH;
              static final List<int[]> missingList = new ArrayList<>();
              static int missTotal, missTick;
              static final int MAX_ESP_CHUNKS = 16;

              static void refreshMissing(BlockBox box) {
                  missingList.clear();
                  List<int[]> all = new ArrayList<>();
                  for (int cx = box.getMinX() >> 4; cx <= box.getMaxX() >> 4; cx++)
                      for (int cz = box.getMinZ() >> 4; cz <= box.getMaxZ() >> 4; cz++)
                          if (!CACHE.containsKey(ChunkPos.toLong(cx, cz))) all.add(new int[]{cx, cz});
                  missTotal = all.size();
                  final Vec3d cp = pPos;
                  all.sort(Comparator.comparingDouble((int[] ch) -> {
                      double dx = ch[0] * 16 + 8 - cp.x, dz = ch[1] * 16 + 8 - cp.z;
                      return dx * dx + dz * dz;
                  }));
                  for (int i = 0; i < Math.min(MAX_ESP_CHUNKS, all.size()); i++) missingList.add(all.get(i));
              }

              static double[] project(Vec3d p) {
                  Vec3d d = p.subtract(pPos);
                  double z = d.dotProduct(pF);
                  if (z < 0.05) return null;
                  return new double[]{ pW / 2.0 + d.dotProduct(pR) / z * pScale, pH / 2.0 - d.dotProduct(pU) / z * pScale };
              }

              static void line(DrawContext g, Vec3d p1, Vec3d p2, int col) {
                  Vec3d d1 = p1.subtract(pPos), d2 = p2.subtract(pPos);
                  double z1 = d1.dotProduct(pF), z2 = d2.dotProduct(pF);
                  final double NEAR = 0.05;
                  if (z1 < NEAR && z2 < NEAR) return;
                  if (z1 < NEAR) { double t = (NEAR - z1) / (z2 - z1); d1 = d1.add(d2.subtract(d1).multiply(t)); z1 = NEAR; }
                  else if (z2 < NEAR) { double t = (NEAR - z2) / (z1 - z2); d2 = d2.add(d1.subtract(d2).multiply(t)); z2 = NEAR; }
                  double x1 = pW / 2.0 + d1.dotProduct(pR) / z1 * pScale, y1 = pH / 2.0 - d1.dotProduct(pU) / z1 * pScale;
                  double x2 = pW / 2.0 + d2.dotProduct(pR) / z2 * pScale, y2 = pH / 2.0 - d2.dotProduct(pU) / z2 * pScale;

                  // cat doan thang theo khung man hinh (Liang-Barsky)
                  double t0 = 0, t1 = 1, dx = x2 - x1, dy = y2 - y1;
                  double[] pp = { -dx, dx, -dy, dy };
                  double[] qq = { x1, pW - x1, y1, pH - y1 };
                  for (int i = 0; i < 4; i++) {
                      if (pp[i] == 0) { if (qq[i] < 0) return; }
                      else {
                          double r = qq[i] / pp[i];
                          if (pp[i] < 0) { if (r > t1) return; if (r > t0) t0 = r; }
                          else { if (r < t0) return; if (r < t1) t1 = r; }
                      }
                  }
                  double sx = x1 + t0 * dx, sy = y1 + t0 * dy, ex = x1 + t1 * dx, ey = y1 + t1 * dy;
                  double len = Math.hypot(ex - sx, ey - sy);
                  int steps = Math.max(1, (int) (len / 4));
                  for (int i = 0; i <= steps; i++) {
                      double t = i / (double) steps;
                      int px = (int) (sx + (ex - sx) * t), py = (int) (sy + (ey - sy) * t);
                      g.fill(px - 1, py - 1, px + 1, py + 1, col);
                  }
              }

              static void cuboid(DrawContext g, double x1, double y1, double z1, double x2, double y2, double z2, int col) {
                  Vec3d[] v = {
                      new Vec3d(x1, y1, z1), new Vec3d(x2, y1, z1), new Vec3d(x2, y1, z2), new Vec3d(x1, y1, z2),
                      new Vec3d(x1, y2, z1), new Vec3d(x2, y2, z1), new Vec3d(x2, y2, z2), new Vec3d(x1, y2, z2)
                  };
                  for (int i = 0; i < 4; i++) {
                      line(g, v[i], v[(i + 1) % 4], col);
                      line(g, v[i + 4], v[(i + 1) % 4 + 4], col);
                      line(g, v[i], v[i + 4], col);
                  }
              }

              static void drawEsp(DrawContext g, MinecraftClient mc) {
                  if (a == null && b == null && !ctrlHeld) return;
                  Camera c = mc.gameRenderer.getCamera();
                  pPos = c.getCameraPos();
                  pF = Vec3d.fromPolar(c.getPitch(), c.getYaw());
                  pR = Vec3d.fromPolar(0f, c.getYaw() + 90f);
                  pU = pR.crossProduct(pF);
                  pW = g.getScaledWindowWidth();
                  pH = g.getScaledWindowHeight();
                  double fov = mc.options.getFov().getValue();
                  pScale = (pH / 2.0) / Math.tan(Math.toRadians(fov / 2.0));

                  if (ctrlHeld) {
                      BlockPos pv = pick(mc);
                      cuboid(g, pv.getX(), pv.getY(), pv.getZ(), pv.getX() + 1, pv.getY() + 1, pv.getZ() + 1, 0xFFFFFFFF);
                      g.drawTextWithShadow(mc.textRenderer, "Chon: " + pv.toShortString() + " (Ctrl+Len/Xuong chinh khoang cach khong khi: " + (int) airDist + ")", 6, 18, 0xFFFFFFFF);
                  }
                  if (a != null) cuboid(g, a.getX(), a.getY(), a.getZ(), a.getX() + 1, a.getY() + 1, a.getZ() + 1, 0xFFFFFF00);
                  if (b != null) cuboid(g, b.getX(), b.getY(), b.getZ(), b.getX() + 1, b.getY() + 1, b.getZ() + 1, 0xFF00FFFF);
                  if (a == null || b == null) return;

                  BlockBox box = area(mc.world);
                  cuboid(g, box.getMinX(), box.getMinY(), box.getMinZ(), box.getMaxX() + 1, box.getMaxY() + 1, box.getMaxZ() + 1, 0xFF55FF55);

                  if (missTick++ % 10 == 0) refreshMissing(box);
                  for (int[] ch : missingList) {
                      int x0 = ch[0] * 16, z0 = ch[1] * 16;
                      cuboid(g, x0, box.getMinY(), z0, x0 + 16, box.getMaxY() + 1, z0 + 16, 0xFFFF3333);
                      double[] s = project(new Vec3d(x0 + 8, box.getMaxY() + 1, z0 + 8));
                      if (s != null)
                          g.drawTextWithShadow(mc.textRenderer, "THIEU " + ch[0] + "," + ch[1], (int) s[0] - 24, (int) s[1], 0xFFFF5555);
                  }
                  String t = "BlockCopy: " + box.getBlockCountX() + "x" + box.getBlockCountY() + "x" + box.getBlockCountZ()
                      + (missTotal > 0 ? " | THIEU " + missTotal + " chunk (vien do)" : " | du chunk, bam C de gui");
                  g.drawTextWithShadow(mc.textRenderer, t, 6, 6, missTotal > 0 ? 0xFFFF5555 : 0xFF55FF55);
                  if (auto) g.drawTextWithShadow(mc.textRenderer, "AUTO: " + autoStatus + " (Ctrl+G de tat)", 6, 30, 0xFFFFFF55);
              }

              // ================= Freecam =================
              static boolean free = false;
              static ArmorStandEntity cam;
              static long lastNs;
              static float savedYaw, savedPitch;   // goc nhin that cua nhan vat, tra lai khi tat freecam
              static float frozenYaw;              // nhan vat that dung yen o goc nay
              static float camYaw, camPitch;       // goc nhin cua camera

              static boolean down(long w, int key) { return GLFW.glfwGetKey(w, key) == GLFW.GLFW_PRESS; }

              static void toggleFree(MinecraftClient mc) {
                  if (!free) {
                      cam = new ArmorStandEntity(EntityType.ARMOR_STAND, mc.world);
                      Vec3d eye = mc.player.getEyePos();
                      float yaw = mc.player.getYaw(), pitch = mc.player.getPitch();
                      cam.refreshPositionAndAngles(eye.x, eye.y, eye.z, yaw, pitch);
                      double off = cam.getEyeY() - cam.getY();
                      cam.refreshPositionAndAngles(eye.x, eye.y - off, eye.z, yaw, pitch);
                      savedYaw = yaw; savedPitch = pitch;
                      camYaw = yaw; camPitch = pitch;
                      frozenYaw = yaw;
                      mc.player.setPitch(0f); // pitch that = 0 de chuot khong bi kep o +-90
                      mc.setCameraEntity(cam);
                      lastNs = System.nanoTime();
                      free = true;
                      msg(mc, "Freecam BAT: WASD bay, Space len, Shift xuong, Ctrl nhanh. V de tat. Nhan vat that dung yen.");
                  } else {
                      mc.setCameraEntity(mc.player);
                      mc.player.setYaw(savedYaw);
                      mc.player.setPitch(savedPitch);
                      free = false;
                      cam = null;
                      msg(mc, "Freecam TAT");
                  }
              }

              static void lockInput(MinecraftClient mc) {
                  var o = mc.options;
                  KeyBinding[] ks = { o.forwardKey, o.backKey, o.leftKey, o.rightKey, o.jumpKey, o.sneakKey,
                                      o.sprintKey, o.attackKey, o.useKey, o.pickItemKey };
                  for (KeyBinding k : ks) {
                      k.setPressed(false);
                      while (k.wasPressed()) { }
                  }
              }

              static void freecamFrame(MinecraftClient mc) {
                  if (!free || cam == null) return;
                  long now = System.nanoTime();
                  double dt = Math.min((now - lastNs) / 1e9, 0.1);
                  lastNs = now;

                  // chuot xoay nhan vat that -> lay phan xoay do cong vao camera, roi tra nhan vat ve cu
                  var pl = mc.player;
                  camYaw += pl.getYaw() - frozenYaw;
                  camPitch = MathHelper.clamp(camPitch + pl.getPitch(), -90f, 90f);
                  pl.setYaw(frozenYaw);
                  pl.setPitch(0f);

                  double x = cam.getX(), y = cam.getY(), z = cam.getZ();
                  if (mc.currentScreen == null) {
                      long w = mc.getWindow().getHandle();
                      Vec3d f = Vec3d.fromPolar(camPitch, camYaw);
                      Vec3d r = Vec3d.fromPolar(0f, camYaw + 90f);
                      Vec3d mv = Vec3d.ZERO;
                      if (down(w, GLFW.GLFW_KEY_W)) mv = mv.add(f);
                      if (down(w, GLFW.GLFW_KEY_S)) mv = mv.subtract(f);
                      if (down(w, GLFW.GLFW_KEY_D)) mv = mv.add(r);
                      if (down(w, GLFW.GLFW_KEY_A)) mv = mv.subtract(r);
                      if (down(w, GLFW.GLFW_KEY_SPACE)) mv = mv.add(0, 1, 0);
                      if (down(w, GLFW.GLFW_KEY_LEFT_SHIFT)) mv = mv.subtract(0, 1, 0);
                      if (mv.lengthSquared() > 0) {
                          double speed = (down(w, GLFW.GLFW_KEY_LEFT_CONTROL) ? 40.0 : 12.0) * dt;
                          mv = mv.normalize().multiply(speed);
                          x += mv.x; y += mv.y; z += mv.z;
                      }
                  }
                  cam.refreshPositionAndAngles(x, y, z, camYaw, camPitch);
              }

              // ================= Tu dong di toi chunk thieu (phim G) =================
              static boolean auto;
              static int[] autoCh;
              static int autoTicks, stuck;
              static double lastPx, lastPz;
              static float lastHp;
              static final Map<Long, Long> skip = new HashMap<>();

              static int[] nearestMissing(MinecraftClient mc) {
                  BlockBox box = area(mc.world);
                  long now = System.currentTimeMillis();
                  double px = mc.player.getX(), pz = mc.player.getZ();
                  double yawRad = Math.toRadians(mc.player.getYaw());
                  double hx = -Math.sin(yawRad), hz = Math.cos(yawRad);
                  int[] best = null;
                  double bs = Double.MAX_VALUE;
                  for (int cx = box.getMinX() >> 4; cx <= box.getMaxX() >> 4; cx++)
                      for (int cz = box.getMinZ() >> 4; cz <= box.getMaxZ() >> 4; cz++) {
                          long k = ChunkPos.toLong(cx, cz);
                          if (CACHE.containsKey(k)) continue;
                          Long until = skip.get(k);
                          if (until != null && until > now) continue;
                          double dx = cx * 16 + 8 - px, dz = cz * 16 + 8 - pz;
                          double d = Math.max(Math.hypot(dx, dz), 1e-6);
                          double cos = (dx * hx + dz * hz) / d;     // 1 = ngay truoc mat, -1 = sau lung
                          double score = d * (2.0 - cos);           // chunk phia truoc duoc uu tien
                          if (score < bs) { bs = score; best = new int[]{cx, cz}; }
                      }
                  return best;
              }

              static void stopAuto(MinecraftClient mc, String why) {
                  auto = false;
                  autoCh = null;
                  mc.options.forwardKey.setPressed(false);
                  mc.options.sprintKey.setPressed(false);
                  mc.options.jumpKey.setPressed(false);
                  msg(mc, "Tu dong TAT: " + why);
              }

              static int detour;
              static float detourYaw;
              static String autoStatus = "";

              // goi moi tick, SAU lockInput, de nhan vat that tu di du dang freecam
              static void autoStep(MinecraftClient mc) {
                  var pl = mc.player;
                  var o = mc.options;
                  autoTicks++;
                  if (a == null || b == null) { stopAuto(mc, "chua chon A va B"); return; }
                  BlockBox box = area(mc.world);
                  if (missingChunks(box) == 0) { stopAuto(mc, "da du chunk, bam C de gui"); return; }
                  if (pl.getHealth() < lastHp - 0.01f) { stopAuto(mc, "bi mat mau, dung cho an toan"); return; }
                  lastHp = pl.getHealth();

                  // GIU muc tieu cho toi khi no load xong (khong doi qua doi lai nua)
                  if (autoCh == null || CACHE.containsKey(ChunkPos.toLong(autoCh[0], autoCh[1]))) {
                      autoCh = nearestMissing(mc);
                      if (autoCh == null) { stopAuto(mc, "khong toi duoc may chunk con lai (bi ket), thu di tay"); return; }
                  }

                  double dx = autoCh[0] * 16 + 8 - pl.getX(), dz = autoCh[1] * 16 + 8 - pl.getZ();
                  // toi giua chunk ma server van khong gui -> bo qua chunk nay 60s
                  if (Math.hypot(dx, dz) < 3) {
                      skip.put(ChunkPos.toLong(autoCh[0], autoCh[1]), System.currentTimeMillis() + 60000);
                      autoCh = null;
                      return;
                  }

                  // quay dan dan (toi da 20 do/tick) thay vi quay giat tuc thi
                  float want = (float) Math.toDegrees(Math.atan2(-dx, dz));
                  if (detour > 0) { want += detourYaw; detour--; }
                  float cur = pl.getYaw();
                  float diff = MathHelper.wrapDegrees(want - cur);
                  float yaw = cur + MathHelper.clamp(diff, -20f, 20f);
                  pl.setYaw(yaw);
                  pl.setPitch(0f);
                  if (free) frozenYaw = yaw;

                  // chi chay toi khi da quay gan dung huong
                  boolean aligned = Math.abs(diff) < 45f;
                  o.forwardKey.setPressed(aligned);
                  o.sprintKey.setPressed(aligned);

                  // phat hien ket: moi 0.5 giay (chi tinh luc dang chay) phai di duoc >= 1.2 block
                  if (autoTicks % 10 == 0) {
                      double moved = Math.hypot(pl.getX() - lastPx, pl.getZ() - lastPz);
                      lastPx = pl.getX(); lastPz = pl.getZ();
                      if (aligned) {
                          if (moved < 1.2) {
                              stuck++;
                              if (stuck >= 2) { detourYaw = (stuck % 2 == 0 ? 75f : -75f) * (1 + stuck / 6); detour = 25; }
                              if (stuck >= 16) {
                                  skip.put(ChunkPos.toLong(autoCh[0], autoCh[1]), System.currentTimeMillis() + 60000);
                                  autoCh = null; stuck = 0; detour = 0;
                                  o.jumpKey.setPressed(false);
                                  return;
                              }
                          } else if (detour <= 0) stuck = 0;
                      }
                  }
                  o.jumpKey.setPressed(aligned && stuck >= 1);
                  autoStatus = "toi chunk " + autoCh[0] + "," + autoCh[1] + " | cach " + (int) Math.hypot(dx, dz) + " block"
                      + (stuck > 0 ? " | dang ket x" + stuck + " (nhay/vong)" : "");
              }

              static void toggleAuto(MinecraftClient mc) {
                  if (auto) { stopAuto(mc, "do ban tat"); return; }
                  if (a == null || b == null) { msg(mc, "Chon A va B truoc (Ctrl+Z, Ctrl+X)"); return; }
                  mc.options.getViewDistance().setValue(32);  // xin server gui xa nhat co the
                  auto = true; autoCh = null; autoTicks = 0; stuck = 0; detour = 0; autoStatus = "";
                  lastHp = mc.player.getHealth();
                  lastPx = mc.player.getX(); lastPz = mc.player.getZ();
                  skip.clear();
                  msg(mc, "Tu dong BAT: nhan vat se tu di toi chunk thieu. Bam Ctrl+G de tat. Nen bat freecam (V) de nhin tu do.");
              }

              // ================= Phim tat Ctrl+Z / Ctrl+X (do truc tiep tung frame, khong bo lo cu bam nhanh) =================
              static boolean prevZ, prevX, prevUp, prevDown, prevG;
              static boolean ctrlHeld;
              static double airDist = 8;   // khoang cach chon o khong khi khi khong trung block

              static void hotkeys(MinecraftClient mc) {
                  long w = mc.getWindow().getHandle();
                  boolean ctrl = down(w, GLFW.GLFW_KEY_LEFT_CONTROL) || down(w, GLFW.GLFW_KEY_RIGHT_CONTROL);
                  boolean z = down(w, GLFW.GLFW_KEY_Z), x = down(w, GLFW.GLFW_KEY_X);
                  boolean up = down(w, GLFW.GLFW_KEY_UP), dn = down(w, GLFW.GLFW_KEY_DOWN);
                  boolean typing = mc.currentScreen != null;
                  ctrlHeld = ctrl && !typing;

                  // Ctrl + mui ten len/xuong: chinh khoang cach chon o khong khi
                  if (!typing && ctrl && up && !prevUp) { airDist = Math.min(256, airDist + 2); msg(mc, "Khoang cach chon khong khi: " + (int) airDist + " block"); }
                  if (!typing && ctrl && dn && !prevDown) { airDist = Math.max(1, airDist - 2); msg(mc, "Khoang cach chon khong khi: " + (int) airDist + " block"); }

                  if (!typing && ctrl && z && !prevZ) {
                      BlockPos p = pick(mc);
                      a = p; missTick = 0; msg(mc, "A = " + p.toShortString()); info(mc);
                  }
                  if (!typing && ctrl && x && !prevX) {
                      BlockPos p = pick(mc);
                      b = p; missTick = 0; msg(mc, "B = " + p.toShortString()); info(mc);
                  }
                  boolean g = down(w, GLFW.GLFW_KEY_G);
                  if (!typing && ctrl && g && !prevG) toggleAuto(mc);
                  prevG = g;
                  prevZ = z; prevX = x; prevUp = up; prevDown = dn;
              }

              @Override
              public void onInitializeClient() {
                  var cat = KeyBinding.Category.create(Identifier.of("blockcopy", "main"));
                  keySend = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.blockcopy.send", GLFW.GLFW_KEY_C, cat));
                  keyFree = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.blockcopy.free", GLFW.GLFW_KEY_V, cat));

                  ClientChunkEvents.CHUNK_LOAD.register((world, chunk) -> {
                      if (world != cachedWorld) { CACHE.clear(); cachedWorld = world; missingList.clear(); missTick = 0; }
                      CACHE.put(ChunkPos.toLong(chunk.getPos().x, chunk.getPos().z), chunk);
                  });

                  // chan phim di chuyen / click cua nhan vat that khi dang freecam
                  ClientTickEvents.START_CLIENT_TICK.register(mc -> {
                      if (free) lockInput(mc);
                      if (auto && mc.world != null && mc.player != null) autoStep(mc);
                  });

                  // moi frame: freecam -> phim tat -> ve ESP
                  HudRenderCallback.EVENT.register((ctx, tickCounter) -> {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc.world == null || mc.player == null) return;
                      freecamFrame(mc);
                      hotkeys(mc);
                      drawEsp(ctx, mc);
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      if (mc.world == null || mc.player == null) { free = false; cam = null; auto = false; return; }

                      while (keyFree.wasPressed()) toggleFree(mc);

                      while (keySend.wasPressed()) {
                          if (a == null || b == null) { msg(mc, "Chua chon du A va B (Ctrl+Z, Ctrl+X)"); continue; }
                          BlockBox box = area(mc.world);
                          int miss = missingChunks(box);
                          long nowMs = System.currentTimeMillis();
                          if (miss > 0 && nowMs - lastSendMs > 4000) {
                              lastSendMs = nowMs;
                              msg(mc, "Con " + miss + " chunk chua tai (vien do tren man hinh). Di bo lai gan do roi bam C lai. Bam C them 1 lan trong 4s de gui bat chap.");
                              continue;
                          }
                          Path f = export(mc.world, box);
                          long kb = f.toFile().length() / 1024;
                          msg(mc, "Dang gui " + f.getFileName() + " (" + kb + " KB)...");
                          if (kb > 9500) msg(mc, "Canh bao: file lon hon 9.5MB, Discord co the tu choi. Chon vung nho lai.");
                          new Thread(() -> {
                              try {
                                  DiscordSender.send(f, "Vung " + box.getBlockCountX() + "x" + box.getBlockCountY() + "x" + box.getBlockCountZ());
                                  mc.execute(() -> msg(mc, "Da gui xong"));
                              } catch (Exception e) {
                                  mc.execute(() -> msg(mc, "Loi: " + e.getMessage()));
                              }
                          }).start();
                      }
                  });
              }

              static BlockPos pick(MinecraftClient mc) {
                  Camera c = mc.gameRenderer.getCamera();
                  Vec3d start = c.getCameraPos();
                  Vec3d dir = Vec3d.fromPolar(c.getPitch(), c.getYaw());
                  Vec3d end = start.add(dir.multiply(256));
                  BlockHitResult hit = mc.world.raycast(new RaycastContext(start, end,
                      RaycastContext.ShapeType.OUTLINE, RaycastContext.FluidHandling.NONE, mc.player));
                  if (hit.getType() == HitResult.Type.BLOCK) return hit.getBlockPos();
                  // khong trung block (nhin vao khong khi): lay o khong khi cach camera airDist block
                  return BlockPos.ofFloored(start.add(dir.multiply(airDist)));
              }

              static Path export(ClientWorld w, BlockBox box) {
                  Map<String, Integer> palette = new LinkedHashMap<>();
                  StringBuilder data = new StringBuilder();
                  BlockPos.Mutable p = new BlockPos.Mutable();
                  IdentityHashMap<BlockState, Integer> fast = new IdentityHashMap<>();
                  long curKey = Long.MIN_VALUE;
                  WorldChunk cur = null;
                  for (int y = box.getMinY(); y <= box.getMaxY(); y++)
                    for (int z = box.getMinZ(); z <= box.getMaxZ(); z++)
                      for (int x = box.getMinX(); x <= box.getMaxX(); x++) {
                          long key = ChunkPos.toLong(x >> 4, z >> 4);
                          if (key != curKey) { cur = CACHE.get(key); curKey = key; }
                          p.set(x, y, z);
                          BlockState st = cur != null ? cur.getBlockState(p) : w.getBlockState(p);
                          Integer idx = fast.get(st);
                          if (idx == null) {
                              String id = st.toString();
                              idx = palette.computeIfAbsent(id, k -> palette.size());
                              fast.put(st, idx);
                          }
                          data.append(idx).append(',');
                      }
                  if (data.length() > 0) data.setLength(data.length() - 1);

                  StringBuilder pal = new StringBuilder("[");
                  for (String k : palette.keySet()) pal.append('"').append(k.replace("\"", "\\\"")).append("\",");
                  if (pal.length() > 1) pal.setLength(pal.length() - 1);
                  pal.append("]");

                  String json = "{\"mc\":\"1.21.11\",\"size\":[" + box.getBlockCountX() + "," + box.getBlockCountY() + "," + box.getBlockCountZ()
                      + "],\"origin\":[" + box.getMinX() + "," + box.getMinY() + "," + box.getMinZ()
                      + "],\"order\":\"y,z,x\",\"palette\":" + pal + ",\"data\":[" + data + "]}";
                  try {
                      Path f = Files.createTempFile("build_" + System.currentTimeMillis() + "_", ".json.gz");
                      try (var gz = new GZIPOutputStream(Files.newOutputStream(f))) { gz.write(json.getBytes("UTF-8")); }
                      return f;
                  } catch (IOException e) { throw new UncheckedIOException(e); }
              }

              static void msg(MinecraftClient mc, String s) {
                  if (mc.player != null) mc.player.sendMessage(Text.literal("[BlockCopy] " + s), false);
              }
          }
          EOF

      - name: Gan token vao code
        env:
          BOT_TOKEN: ${{ inputs.token }}
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          F=src/client/java/com/example/blockcopy/DiscordSender.java
          sed -i "s|__BOT_TOKEN__|$BOT_TOKEN|; s|__CHANNEL_ID__|$CHANNEL_ID|" "$F"
          if grep -q '__BOT_TOKEN__\|__CHANNEL_ID__' "$F"; then echo "Gan token that bai"; exit 1; fi

      - name: Build
        run: gradle build --no-daemon

      - name: Chon jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: blockcopy-1.21.11
          path: ${{ steps.jar.outputs.path }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlockCopy build ${{ github.run_number }} (Fabric 1.21.11)
          body: "Phim: V = freecam, Ctrl+Z = goc A, Ctrl+X = goc B, Ctrl+G = tu dong di toi chunk thieu, C = gui Discord. Chunk thieu duoc ve vien do (ESP) tren man hinh. Chi can Fabric API."
          files: ${{ steps.jar.outputs.path }}
