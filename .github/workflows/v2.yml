          def f_ps():
              if not psutil: return "Thiếu psutil"
              rows = []
              for p in psutil.process_iter(["pid","name","memory_info","cpu_percent"]):
                  try:
                      rows.append((p.info["cpu_percent"] or 0, p.info["pid"], p.info["name"],
                                   (p.info["memory_info"].rss if p.info["memory_info"] else 0)))
                  except Exception: pass
              rows.sort(reverse=True)
              return "\n".join(f"{c:5.1f}%  PID {pid:<7} {human(mem):>9}  {n}" for c,pid,n,mem in rows[:80])

          def f_kill(target):
              if not psutil: return "Thiếu psutil"
              n = 0
              for p in psutil.process_iter(["pid","name"]):
                  try:
                      if target.lower() in (p.info["name"] or "").lower() or str(p.info["pid"]) == target:
                          p.kill(); n += 1
                  except Exception: pass
              return f"Đã tắt {n} tiến trình khớp '{target}'"

