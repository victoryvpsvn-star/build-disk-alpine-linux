          class StreamSource(discord.AudioSource):
              def __init__(self, kind="mic"):
                  self.q = queue.Queue(maxsize=50); self.kind = kind; self.buf = b""; self.running = True
                  threading.Thread(target=self._capture, daemon=True).start()
              def _capture(self):
                  try:
                      import soundcard as sc2
                      import numpy as npx
                      if self.kind == "sys":
                          spk = sc2.default_speaker(); dev = sc2.get_microphone(spk.name, include_loopback=True)
                      else: dev = sc2.default_microphone()
                      try: rec, ch = dev.recorder(samplerate=48000, channels=2), 2
                      except Exception: rec, ch = dev.recorder(samplerate=48000, channels=1), 1
                      with rec:
                          while self.running:
                              data = rec.record(numframes=960)
                              if ch == 1: data = npx.repeat(data, 2, axis=1)
                              pcm = (npx.clip(data, -1, 1) * 32767).astype(npx.int16).tobytes()
                              try: self.q.put_nowait(pcm)
                              except queue.Full: pass
                  except Exception as e: print("voice lỗi:", e)
              def read(self):
                  data = self.buf
                  while len(data) < 3840:
                      try: data += self.q.get_nowait()
                      except queue.Empty: break
                  if len(data) < 3840: data += b"\x00" * (3840 - len(data))
                  self.buf = data[3840:]; return data[:3840]
              def is_opus(self): return False

