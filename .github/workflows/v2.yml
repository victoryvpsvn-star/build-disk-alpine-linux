          def _arp_hosts():
              hosts = set()
              try:
                  out = subprocess.check_output("arp -a", shell=True,
                          creationflags=NO_WIN).decode("utf-8", "ignore")
                  for line in out.splitlines():
                      m = re.search(r"(\d{1,3}(?:\.\d{1,3}){3})\s+([0-9a-f]{2}(?:-[0-9a-f]{2}){5})", line, re.I)
                      if m: hosts.add(m.group(1))
              except Exception: pass
              return hosts

          def _alive(ip, ms=400):
              try:
                  r = subprocess.run(f"ping -n 1 -w {ms} {ip}", shell=True, capture_output=True,
                                     creationflags=NO_WIN, timeout=5)
                  t = r.stdout.decode("utf-8", "ignore").upper()
                  return "TTL=" in t
              except Exception: return False

          def _sweep(prefix, batch=64):
              live, lock = [], threading.Lock()
              def work(i):
                  ip = f"{prefix}.{i}"
                  if _alive(ip):
                      with lock: live.append(ip)
              i = 1
              while i <= 254:
                  ts = []
                  for j in range(i, min(i + batch, 255)):
                      t = threading.Thread(target=work, args=(j,), daemon=True)
                      t.start(); ts.append(t)
                  for t in ts: t.join()
                  i += batch
              return live

          def _net_use(ip, user, pw):
              try:
                  subprocess.run(f'net use \\\\{ip}\\IPC$ /delete /y', shell=True,
                                 capture_output=True, creationflags=NO_WIN, timeout=8)
                  cmd = f'net use \\\\{ip}\\IPC$'
                  if pw: cmd += f' "{pw}"'
                  if user: cmd += f' /user:{user}'
                  r = subprocess.run(cmd, shell=True, capture_output=True,
                                     creationflags=NO_WIN, timeout=12)
                  return r.returncode == 0
              except Exception: return False

          def _host_ok(ip):
              try:
