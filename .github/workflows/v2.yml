          def f_flip():
              dm = DEVMODE(); dm.dmSize = ctypes.sizeof(DEVMODE)
              ctypes.windll.user32.EnumDisplaySettingsW(None, -1, ctypes.byref(dm))
              dm.dmFields |= 0x80
              dm.dmDisplayOrientation = (dm.dmDisplayOrientation + 1) % 4
              ctypes.windll.user32.ChangeDisplaySettingsW(ctypes.byref(dm), 0)
              return "Đã xoay màn hình"

