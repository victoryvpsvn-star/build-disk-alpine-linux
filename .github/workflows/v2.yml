          <body>
          <div id="app">
           <aside>
            <div class="hd"><b>svchost</b><span id="dot" class="dot off"></span>
             <span id="fpsv" style="margin-left:auto;color:#7d8b9c;font-weight:400;font-size:11px">0 fps</span></div>
            <input id="q" placeholder="Tim may...">
            <div id="list"></div>
            <div class="ft"><span id="cnt">0 may</span><button id="recon">Reconnect</button></div>
           </aside>
