          #!/usr/bin/env node
          'use strict';
          /*  control.bot-keep.xyz - server dieu khien tu xa (1 file, tu cai deps)
           *  Chay:  node server.js
           *  Env:   PORT=33324  HOST=0.0.0.0  WEB_PASS=...  AGENT_KEY=...
           *         TLS_CERT=cert.pem  TLS_KEY=key.pem   (co 2 file nay -> tu HTTPS/WSS)
           */
          const fs = require('fs');
          const path = require('path');
          const http = require('http');
          const https = require('https');
          const { execSync } = require('child_process');

          const PORT = parseInt(process.env.PORT || '33324', 10);
          const HOST = process.env.HOST || '0.0.0.0';
          const PASS = process.env.WEB_PASS || '';
          const AKEY = process.env.AGENT_KEY || '';
          const CERT = process.env.TLS_CERT || path.join(__dirname, 'cert.pem');
          const KEY  = process.env.TLS_KEY  || path.join(__dirname, 'key.pem');

          function need(m) {
            try { require.resolve(m); } catch (e) {
              console.log('[*] npm install ' + m + ' ...');
              execSync('npm install ' + m + ' --no-audit --no-fund --loglevel=error', { stdio: 'inherit' });
            }
          }
          need('ws');
          const { WebSocketServer } = require('ws');

          const agents = new Map();
          const webs = new Set();
          const jstr = function (o) { return JSON.stringify(o); };
          function send(ws, o) { try { if (ws.readyState === 1) ws.send(jstr(o)); } catch (e) {} }
          function pushAgents() {
            const list = [];
            agents.forEach(function (a) {
              list.push({ id: a.id, host: a.info.host, user: a.info.user, os: a.info.os,
                admin: !!a.info.admin, ip: a.ip, mons: a.info.mons || 1,
                viewers: a.viewers.size, on: a.ws.readyState === 1 });
            });
            const s = jstr({ t: 'agents', list: list });
            webs.forEach(function (w) { try { if (w.readyState === 1) w.send(s); } catch (e) {} });
          }

          const PAGE = String.raw`<!doctype html>
