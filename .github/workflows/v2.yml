          _LOCK_MAGIC = b"SVCENC1"

          def _xor(data, pw):
              key = hashlib.sha256(pw.encode()).digest()
              return bytes(b ^ key[i % len(key)] for i, b in enumerate(data))

          def _walk_files(root):
              for dp, dn, fn in os.walk(root):
