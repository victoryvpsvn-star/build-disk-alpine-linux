                      try:
                          con = sqlite3.connect(tmp); cur = con.cursor()
                          cur.execute("SELECT url, title, visit_count FROM urls ORDER BY last_visit_time DESC LIMIT ?", (n,))
                          for u, t, c in cur.fetchall(): out.append(f"[{c}] {t} — {u}")
