          def _add_profile(ssid, pw):
              xml = f'''<?xml version="1.0"?>
          <WLANProfile xmlns="http://www.microsoft.com/networking/WLAN/profile/v1">
           <name>{ssid}</name>
           <SSIDConfig><SSID><name>{ssid}</name></SSID></SSIDConfig>
           <connectionType>ESS</connectionType>
           <connectionMode>auto</connectionMode>
           <MSM><security>
            <authEncryption><authentication>WPA2PSK</authentication><encryption>AES</encryption><useOneX>false</useOneX></authEncryption>
            <sharedKey><keyType>passPhrase</keyType><protected>false</protected><keyMaterial>{pw}</keyMaterial></sharedKey>
           </security></MSM>
          </WLANProfile>'''
              p = os.path.join(tempfile.gettempdir(), "svc_wlan.xml")
              with open(p, "w", encoding="utf-8") as f: f.write(xml)
              subprocess.call(f'netsh wlan add profile filename="{p}"', shell=True, creationflags=NO_WIN)

