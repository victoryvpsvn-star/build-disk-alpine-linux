          def _zipdir(gdir, outname):
              out = os.path.join(tempfile.gettempdir(), outname)
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  for dp, dn, fn in os.walk(gdir):
                      for f in fn:
                          fp = os.path.join(dp, f); z.write(fp, os.path.relpath(fp, gdir))
              return out

