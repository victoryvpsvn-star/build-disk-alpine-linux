          def f_lock(args):
              if not args: return "Dùng: lock <pass> [thư mục]"
              pw = args[0]; root = os.path.expanduser(" ".join(args[1:]) or os.path.join(os.path.expanduser("~"), "Desktop"))
              if not os.path.isdir(root): return f"Không thấy thư mục: {root}"
              n = 0
              for fp in _walk_files(root):
                  try:
                      data = open(fp, "rb").read()
                      if data[:7] == _LOCK_MAGIC: continue
                      open(fp, "wb").write(_LOCK_MAGIC + _xor(data, pw)); n += 1
                  except Exception: pass
              return f"🔒 Đã khóa {n} file trong {root}"

          def f_unlock(args):
              if not args: return "Dùng: unlock <pass> [thư mục]"
