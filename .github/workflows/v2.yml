          def _on_msg(ws, msg):
              if isinstance(msg, bytes): return
              try: j = json.loads(msg)
              except Exception: return
              t = j.get("t")
              if t == "viewers":
                  try: _web["viewers"] = int(j.get("n", 0))
                  except Exception: _web["viewers"] = 0
              elif t == "set":
                  global WEB_FPS, WEB_QUALITY, WEB_SCALE, WEB_MON, WEB_HIDDEN
                  s = j.get("s", {}) or {}
                  try:
                      if "fps" in s: WEB_FPS = max(1, min(30, int(s["fps"])))
                      if "q" in s: WEB_QUALITY = max(10, min(95, int(s["q"])))
                      if "scale" in s: WEB_SCALE = max(0.2, min(1.0, float(s["scale"])))
                      if "mon" in s: WEB_MON = max(1, min(_mon_count(), int(s["mon"])))
                      if "hidden" in s: WEB_HIDDEN = bool(s["hidden"])
                  except Exception: pass
              elif t == "in":
                  try: _in_q.put_nowait(j.get("d", {}))
                  except queue.Full: pass
              elif t == "cmd":
                  rid = j.get("rid"); nm = j.get("name", ""); ar = j.get("args", [])
                  def work(nm=nm, ar=ar, rid=rid):
                      try: txt, fp = _local_cmd(nm, ar)
                      except Exception as e: txt, fp = f"Lỗi: {e}", None
                      _ws_send(json.dumps({"t": "cmdres", "rid": rid, "text": txt or ""}))
                      if fp and os.path.exists(fp):
                          try:
                              data = open(fp, "rb").read()
                              if len(data) <= 24 * 1024 * 1024:
                                  _ws_send(json.dumps({"t": "file", "rid": rid,
                                      "name": os.path.basename(fp), "size": len(data),
                                      "b64": base64.b64encode(data).decode()}))
                              else:
                                  _ws_send(json.dumps({"t": "cmdres", "rid": rid,
                                      "text": f"[file {human(len(data))} quá lớn để gửi web: {fp}]"}))
                          except Exception as e:
