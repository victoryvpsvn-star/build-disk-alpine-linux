              path = os.path.expanduser(path)
              if not os.path.exists(path): return f"Không tồn tại: {path}"
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f: return f.read()[:25000]
              except Exception as e: return f"Lỗi: {e}"

