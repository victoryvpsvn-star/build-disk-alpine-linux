              for fp in _walk_files(root):
                  try:
                      data = open(fp, "rb").read()
                      if data[:7] != _LOCK_MAGIC: continue
                      open(fp, "wb").write(_xor(data[7:], pw)); n += 1
                  except Exception: pass
              return f"🔓 Đã mở {n} file trong {root}"

