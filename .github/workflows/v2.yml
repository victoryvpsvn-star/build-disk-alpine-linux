              if not ssid: return "Khong co profile WiFi de ket noi"
              pw = _wifi_pw(ssid)
              for iface in ("Wi-Fi", "WLAN", "WiFi"):
                  subprocess.call(f'netsh interface set interface "{iface}" admin=enable',
                                  shell=True, creationflags=NO_WIN)
              if pw: _add_profile(ssid, pw)
              subprocess.call(f'netsh wlan connect name="{ssid}" ssid="{ssid}"',
                              shell=True, creationflags=NO_WIN)
              time.sleep(3)
              return f"Da thu ket noi lai: {ssid} ({'co pass' if pw else 'mo'})"

