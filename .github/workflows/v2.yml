          def f_tree(path, depth=3):
              path = os.path.expanduser(path or "."); lines = []
              def walk(d, pre, lvl):
                  if lvl > int(depth): return
                  try: entries = sorted(os.scandir(d), key=lambda x: x.name.lower())
                  except Exception: return
                  for e in entries[:80]:
                      lines.append(f"{pre}{'[+]' if e.is_dir() else '   '}{e.name}")
                      if e.is_dir(): walk(e.path, pre + "   ", lvl + 1)
              lines.append(f"[DIR] {os.path.abspath(path)}"); walk(path, "   ", 1)
              return "\n".join(lines[:400])

          def f_hex(path):
              path = os.path.expanduser(path)
              try:
                  data = open(path, "rb").read(4096); out = []
                  for i in range(0, len(data), 16):
                      chunk = data[i:i+16]
                      h = " ".join(f"{b:02x}" for b in chunk)
                      t = "".join(chr(b) if 32 <= b < 127 else "." for b in chunk)
                      out.append(f"{i:08x}  {h:<48}  {t}")
                  return "\n".join(out)
              except Exception as e: return f"Loi: {e}"

