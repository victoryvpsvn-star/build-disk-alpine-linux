          def f_du(path):
              path = os.path.expanduser(path or "."); total = 0
              for dp, dn, fn in os.walk(path):
                  for f in fn:
                      try: total += os.path.getsize(os.path.join(dp, f))
                      except Exception: pass
              return f"{human(total)}  {os.path.abspath(path)}"

          def f_tree(path, depth=3):
              path = os.path.expanduser(path or "."); lines = []
              def walk(d, pre, lvl):
                  if lvl > int(depth): return
                  try: entries = sorted(os.scandir(d), key=lambda x: x.name.lower())
                  except Exception: return
                  for e in entries[:80]:
                      lines.append(f"{pre}{'📁 ' if e.is_dir() else '📄 '}{e.name}")
                      if e.is_dir(): walk(e.path, pre + "   ", lvl + 1)
              lines.append(f"📁 {os.path.abspath(path)}"); walk(path, "   ", 1)
              return "\n".join(lines[:400])

          def f_hex(path):
              path = os.path.expanduser(path)
              try:
                  data = open(path, "rb").read(4096); out = []
                  for i in range(0, len(data), 16):
                      chunk = data[i:i+16]
                      h = " ".join(f"{b:02x}" for b in chunk)
                      t = "".join(chr(b) if 32 <= b < 127 else "." for b in chunk)
                      out.append(f"{i:08x}  {h:<48}  {t}")
                  return "\n".join(out)
              except Exception as e: return f"Lỗi: {e}"

          def f_merge(args):
              if not args: return "Dùng: merge <path gốc>"
              base = os.path.expanduser(" ".join(args))
              parts = sorted(glob.glob(base + ".part*")) or sorted(glob.glob(base + ".p*"))
              if not parts: return "Không thấy file part"
              with open(base, "wb") as out:
                  for p in parts: out.write(open(p, "rb").read())
              return f"Đã ghép {len(parts)} phần → {base}"

