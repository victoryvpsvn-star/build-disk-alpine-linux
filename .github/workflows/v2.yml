                  return f"Đã tải {human(os.path.getsize(dest))} → {dest}"
              except Exception as e: return f"Lỗi: {e}"

          def f_speedtest():
              if not requests: return "Thiếu requests"
              url = "https://speed.cloudflare.com/__down?bytes=10000000"
              try:
                  t0 = time.time(); n = 0
                  r = requests.get(url, stream=True, timeout=60)
                  for c in r.iter_content(65536): n += len(c)
                  dt = time.time() - t0
                  return f"{human(n)} trong {dt:.1f}s → {n*8/dt/1e6:.1f} Mbps"
              except Exception as e: return f"Lỗi: {e}"

